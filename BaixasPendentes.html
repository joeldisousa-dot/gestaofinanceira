<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baixas Pendentes - Controle Financeiro</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f4f6f8;
    color:#333;
}

.container{
    max-width:1250px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

h2{
    margin:0;
    color:#c62828;
}

.subtitulo{
    margin:0 0 20px;
    color:#555;
}

.acoes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.btn{
    border:0;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:.2s;
}

.btn:hover{
    opacity:.9;
    transform:translateY(-1px);
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.btn-voltar{
    background:#546e7a;
    color:#fff;
}

.btn-atualizar{
    background:#1565c0;
    color:#fff;
}

.btn-baixar{
    background:#2e7d32;
    color:#fff;
    padding:7px 13px;
    font-size:13px;
}

.btn-baixar:hover{
    background:#1b5e20;
}

.mensagem{
    display:none;
    padding:12px 15px;
    margin-bottom:15px;
    border-radius:8px;
    font-weight:bold;
}

.mensagem.erro{
    display:block;
    background:#ffebee;
    color:#c62828;
}

.mensagem.sucesso{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.resumo{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.card-resumo{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.card-resumo .titulo{
    font-size:13px;
    color:#64748b;
}

.card-resumo .valor{
    display:block;
    margin-top:5px;
    text-align:center;
    font-size:20px;
    color:#c62828;
    font-weight:bold;
}

.area-tabela{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1050px;
}

th{
    background:#c62828;
    color:#fff;
    padding:12px;
    text-align:center;
    white-space:nowrap;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
    vertical-align:middle;
}

tbody tr:hover{
    background:#f8f9fa;
}

.valor{
    text-align:right !important;
    font-weight:bold;
    white-space:nowrap;
}

.loading{
    text-align:center;
    padding:30px;
    color:#64748b;
    font-weight:bold;
}

.vazio{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.erro-tabela{
    background:#ffebee;
    color:#c62828;
    font-weight:bold;
    text-align:center;
    padding:20px;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.badge-pendente{
    background:#fff3e0;
    color:#e65100;
}

.tipo{
    display:inline-block;
    min-width:130px;
    padding:7px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.tipo-receber{
    background:#e8f5e9;
    color:#2e7d32;
}

.tipo-pagar{
    background:#ffebee;
    color:#c62828;
}

.tipo-outro{
    background:#eceff1;
    color:#455a64;
}

.acoes-linha{
    white-space:nowrap;
}

.spinner{
    display:inline-block;
    width:22px;
    height:22px;
    border:3px solid #ddd;
    border-top-color:#c62828;
    border-radius:50%;
    animation:girar .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

.spinner-pequeno{
    display:inline-block;
    width:13px;
    height:13px;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    border-radius:50%;
    animation:girar .8s linear infinite;
    vertical-align:middle;
    margin-right:5px;
}

@keyframes girar{

    to{
        transform:rotate(360deg);
    }

}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .container{
        padding:15px;
    }

    .resumo{
        grid-template-columns:1fr;
    }

    .topo{
        align-items:flex-start;
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="topo">

        <h2>⚠️ Baixas Pendentes</h2>

        <button
            type="button"
            class="btn btn-voltar"
            onclick="voltarIndex()"
        >
            ← Voltar
        </button>

    </div>


    <h3 class="subtitulo">
        Todos os lançamentos pendentes
    </h3>


    <div class="acoes">

        <button
            type="button"
            id="btnAtualizar"
            class="btn btn-atualizar"
            onclick="carregar()"
        >
            🔄 Atualizar
        </button>

    </div>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <div class="resumo">

        <div class="card-resumo">

            <span class="titulo">
                Pendências
            </span>

            <span
                class="valor"
                id="totalPendentes"
            >
                0
            </span>

        </div>


        <div class="card-resumo">

            <span class="titulo">
                Contas a Receber
            </span>

            <span
                class="valor"
                id="totalReceber"
            >
                R$ 0,00
            </span>

        </div>


        <div class="card-resumo">

            <span class="titulo">
                Contas a Pagar
            </span>

            <span
                class="valor"
                id="totalPagar"
            >
                R$ 0,00
            </span>

        </div>

    </div>


    <div class="area-tabela">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Competência</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Vencimento</th>
                    <th>Baixado</th>
                    <th>Ação</th>

                </tr>

            </thead>


            <tbody id="lista">

                <tr>

                    <td
                        colspan="8"
                        class="loading"
                    >

                        <span class="spinner"></span>

                        Carregando baixas pendentes...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbwlkjtWnOcvglZS2Ft6ydraSh4-JbTXH6C7irb6O5hYPvxYxqN0tYWQs2Ybi6mVWThN/exec";


/*
 * Nome da ação usada pelo botão BAIXAR.
 *
 * Se no seu Apps Script a função tiver outro nome,
 * altere somente esta constante.
 */

const ACAO_BAIXAR =
"baixarLancamento";


let contadorCallback = 0;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        carregar();

    }
);


/* =====================================================
   CARREGAR TODAS AS PENDÊNCIAS
===================================================== */

async function carregar(){

    const corpo =
        document.getElementById("lista");

    const botao =
        document.getElementById("btnAtualizar");


    /*
     * Impede duas consultas simultâneas.
     */

    if(
        botao.disabled
    ){

        return;

    }


    botao.disabled = true;

    botao.textContent =
        "⏳ Carregando...";


    corpo.innerHTML = `
        <tr>
            <td colspan="8" class="loading">
                <span class="spinner"></span>
                Carregando baixas pendentes...
            </td>
        </tr>
    `;


    limparMensagem();


    zerarResumo();


    try{

        console.log(
            "Consultando todas as baixas pendentes..."
        );


        /*
         * IMPORTANTE:
         *
         * Não enviamos competência.
         *
         * A API recebe somente:
         *
         * action=listarBaixasPendentes
         *
         */

        const resposta =
            await chamarAPI(
                "listarBaixasPendentes",
                {}
            );


        console.log(
            "Resposta recebida:",
            resposta
        );


        if(
            !resposta
        ){

            throw new Error(
                "A API não retornou nenhuma resposta."
            );

        }


        if(
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta.erro ||
                resposta.mensagem ||
                "A API retornou um erro."
            );

        }


        const lista =
            obterLista(resposta);


        console.log(
            "Quantidade de pendências:",
            lista.length
        );


        mostrarLista(lista);

        atualizarResumo(lista);


        if(
            lista.length > 0
        ){

            mostrarMensagem(
                lista.length +
                " lançamento(s) pendente(s) encontrado(s).",
                "sucesso"
            );

        }


    }
    catch(erro){

        console.error(
            "Erro ao carregar:",
            erro
        );


        corpo.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="erro-tabela"
                >
                    ⚠ ${escapeHtml(
                        obterMensagemErro(erro)
                    )}
                </td>
            </tr>
        `;


        mostrarMensagem(
            obterMensagemErro(erro),
            "erro"
        );


        zerarResumo();

    }
    finally{

        botao.disabled = false;

        botao.textContent =
            "🔄 Atualizar";

    }

}


/* =====================================================
   JSONP
===================================================== */

function chamarAPI(
    acao,
    parametros
){

    parametros =
        parametros || {};


    return new Promise(
        function(resolve,reject){

            contadorCallback++;


            const callback =
                "controleFinanceiroCallback_" +
                Date.now() +
                "_" +
                contadorCallback;


            const script =
                document.createElement(
                    "script"
                );


            let finalizado = false;

            let timeout = null;


            function limpar(){

                if(timeout){

                    clearTimeout(
                        timeout
                    );

                    timeout = null;

                }


                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }


                try{

                    delete window[
                        callback
                    ];

                }
                catch(e){

                    window[
                        callback
                    ] = undefined;

                }

            }


            function finalizar(
                fn,
                valor
            ){

                if(finalizado){

                    return;

                }


                finalizado = true;

                limpar();

                fn(valor);

            }


            window[callback] =
                function(resposta){

                    console.log(
                        "JSONP recebido:",
                        resposta
                    );


                    finalizar(
                        resolve,
                        resposta
                    );

                };


            const params =
                new URLSearchParams();


            params.set(
                "action",
                acao
            );


            params.set(
                "callback",
                callback
            );


            Object.keys(
                parametros
            ).forEach(
                function(chave){

                    const valor =
                        parametros[chave];


                    if(
                        valor === null ||
                        valor === undefined ||
                        valor === ""
                    ){

                        return;

                    }


                    params.set(
                        chave,
                        String(valor)
                    );

                }
            );


            const separador =
                URL_API.indexOf("?") >= 0
                ? "&"
                : "?";


            const url =
                URL_API +
                separador +
                params.toString();


            console.log(
                "Chamando API:",
                url
            );


            script.async = true;

            script.src = url;


            script.onerror =
                function(){

                    finalizar(
                        reject,
                        new Error(
                            "Não foi possível conectar ao Google Apps Script."
                        )
                    );

                };


            timeout =
                setTimeout(
                    function(){

                        finalizar(
                            reject,
                            new Error(
                                "A API demorou mais de 20 segundos para responder."
                            )
                        );

                    },
                    20000
                );


            document.head.appendChild(
                script
            );

        }
    );

}


/* =====================================================
   OBTER LISTA
===================================================== */

function obterLista(resposta){

    if(
        Array.isArray(resposta)
    ){

        return resposta;

    }


    const propriedades = [

        "lista",
        "baixasPendentes",
        "baixas",
        "lancamentos",
        "dados",
        "resultado"

    ];


    for(
        let i = 0;
        i < propriedades.length;
        i++
    ){

        const propriedade =
            propriedades[i];


        if(
            resposta &&
            Array.isArray(
                resposta[
                    propriedade
                ]
            )
        ){

            return resposta[
                propriedade
            ];

        }

    }


    return [];

}


/* =====================================================
   MOSTRAR LISTA
===================================================== */

function mostrarLista(lista){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML = "";


    if(
        !Array.isArray(lista) ||
        lista.length === 0
    ){

        corpo.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="vazio"
                >
                    ✅ Nenhum lançamento pendente.
                </td>
            </tr>
        `;

        return;

    }


    /*
     * Ordenação:
     *
     * 1. Competência
     * 2. Vencimento
     */

    lista.sort(
        function(a,b){

            const compA =
                String(
                    a.competencia || ""
                );

            const compB =
                String(
                    b.competencia || ""
                );


            if(
                compA !== compB
            ){

                return compA.localeCompare(
                    compB
                );

            }


            const dataA =
                String(
                    a.vencimento || ""
                );

            const dataB =
                String(
                    b.vencimento || ""
                );


            return dataA.localeCompare(
                dataB
            );

        }
    );


    lista.forEach(
        function(item){

            const valor =
                converterNumero(
                    item.valor
                );


            const linha =
                document.createElement(
                    "tr"
                );


            const tipo =
                classificarTipo(
                    item.tipo
                );


            linha.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.id
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        item.competencia
                    )}
                </td>


                <td>

                    <span
                        class="tipo ${tipo.classe}"
                    >
                        ${tipo.icone}
                        ${escapeHtml(
                            tipo.nome
                        )}
                    </span>

                </td>


                <td>
                    ${escapeHtml(
                        item.descricao
                    )}
                </td>


                <td class="valor">

                    ${formatarMoeda(
                        valor
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        formatarData(
                            item.vencimento
                        )
                    )}

                </td>


                <td>

                    <span
                        class="badge badge-pendente"
                    >
                        ${escapeHtml(
                            item.baixado ||
                            "Não"
                        )}
                    </span>

                </td>


                <td class="acoes-linha">

                    <button
                        type="button"
                        class="btn btn-baixar"
                        onclick="baixarLancamento(this, '${escapeHtmlAttr(item.id)}')"
                    >
                        ✓ Baixar
                    </button>

                </td>

            `;


            corpo.appendChild(
                linha
            );

        }
    );

}


/* =====================================================
   CLASSIFICAR TIPO
===================================================== */

function classificarTipo(tipo){

    const texto =
        normalizarTexto(
            tipo
        );


    /*
     * CONTAS A RECEBER
     */

    if(
        texto.includes(
            "receber"
        )
    ){

        return {

            nome:
                "Contas a Receber",

            classe:
                "tipo-receber",

            icone:
                "🟢"

        };

    }


    /*
     * CONTAS A PAGAR
     */

    if(
        texto.includes(
            "pagar"
        )
    ){

        return {

            nome:
                "Contas a Pagar",

            classe:
                "tipo-pagar",

            icone:
                "🔴"

        };

    }


    /*
     * OUTROS TIPOS
     */

    return {

        nome:
            tipo ||
            "Não informado",

        classe:
            "tipo-outro",

        icone:
            "⚪"

    };

}


/* =====================================================
   BAIXAR LANÇAMENTO
===================================================== */

async function baixarLancamento(
    botao,
    id
){

    if(
        !id
    ){

        alert(
            "Não foi possível identificar o lançamento."
        );

        return;

    }


    const confirmou =
        confirm(
            "Deseja realmente baixar este lançamento?"
        );


    if(
        !confirmou
    ){

        return;

    }


    const textoOriginal =
        botao.innerHTML;


    botao.disabled = true;

    botao.innerHTML = `
        <span class="spinner-pequeno"></span>
        Baixando...
    `;


    try{

        console.log(
            "Baixando lançamento:",
            id
        );


        const resposta =
            await chamarAPI(
                ACAO_BAIXAR,
                {
                    id:id
                }
            );


        console.log(
            "Resposta da baixa:",
            resposta
        );


        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta &&
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                    ? (
                        resposta.erro ||
                        resposta.mensagem
                    )
                    : "Não foi possível baixar o lançamento."
            );

        }


        mostrarMensagem(
            "Lançamento baixado com sucesso.",
            "sucesso"
        );


        /*
         * Remove a linha imediatamente.
         */

        const linha =
            botao.closest("tr");


        if(linha){

            linha.remove();

        }


        /*
         * Atualiza os totais
         * sem precisar esperar a API
         * novamente.
         */

        atualizarResumoTabela();


        /*
         * Se não houver mais linhas,
         * mostra mensagem de vazio.
         */

        const corpo =
            document.getElementById(
                "lista"
            );


        if(
            corpo.children.length === 0
        ){

            corpo.innerHTML = `
                <tr>
                    <td
                        colspan="8"
                        class="vazio"
                    >
                        ✅ Nenhum lançamento pendente.
                    </td>
                </tr>
            `;

        }

    }
    catch(erro){

        console.error(
            "Erro ao baixar:",
            erro
        );


        mostrarMensagem(
            obterMensagemErro(erro),
            "erro"
        );


        botao.disabled = false;

        botao.innerHTML =
            textoOriginal;

    }

}


/* =====================================================
   ATUALIZAR RESUMO APÓS BAIXA
===================================================== */

function atualizarResumoTabela(){

    const linhas =
        document.querySelectorAll(
            "#lista tr"
        );


    let quantidade = 0;

    let receber = 0;

    let pagar = 0;


    linhas.forEach(
        function(linha){

            /*
             * Ignora a linha de vazio.
             */

            const celulas =
                linha.querySelectorAll(
                    "td"
                );


            if(
                celulas.length < 8
            ){

                return;

            }


            quantidade++;


            const tipo =
                normalizarTexto(
                    celulas[2].textContent
                );


            const valor =
                converterNumero(
                    celulas[4].textContent
                );


            if(
                tipo.includes(
                    "receber"
                )
            ){

                receber += valor;

            }


            else if(
                tipo.includes(
                    "pagar"
                )
            ){

                pagar += valor;

            }

        }
    );


    document.getElementById(
        "totalPendentes"
    ).textContent =
        quantidade;


    document.getElementById(
        "totalReceber"
    ).textContent =
        formatarMoeda(
            receber
        );


    document.getElementById(
        "totalPagar"
    ).textContent =
        formatarMoeda(
            pagar
        );

}


/* =====================================================
   RESUMO
===================================================== */

function atualizarResumo(lista){

    let receber = 0;

    let pagar = 0;


    lista.forEach(
        function(item){

            const valor =
                converterNumero(
                    item.valor
                );


            const tipo =
                normalizarTexto(
                    item.tipo
                );


            if(
                tipo.includes(
                    "receber"
                )
            ){

                receber += valor;

            }


            else if(
                tipo.includes(
                    "pagar"
                )
            ){

                pagar += valor;

            }

        }
    );


    document.getElementById(
        "totalPendentes"
    ).textContent =
        lista.length;


    document.getElementById(
        "totalReceber"
    ).textContent =
        formatarMoeda(
            receber
        );


    document.getElementById(
        "totalPagar"
    ).textContent =
        formatarMoeda(
            pagar
        );

}


/* =====================================================
   ZERAR RESUMO
===================================================== */

function zerarResumo(){

    document.getElementById(
        "totalPendentes"
    ).textContent =
        "0";


    document.getElementById(
        "totalReceber"
    ).textContent =
        "R$ 0,00";


    document.getElementById(
        "totalPagar"
    ).textContent =
        "R$ 0,00";

}


/* =====================================================
   CONVERTER NÚMERO
===================================================== */

function converterNumero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return isFinite(valor)
            ? valor
            : 0;

    }


    let texto =
        String(valor)
        .trim()
        .replace(
            /R\$/gi,
            ""
        )
        .replace(
            /\s/g,
            ""
        );


    /*
     * Formato brasileiro:
     * 1.234,56
     */

    if(
        texto.indexOf(",") >= 0
    ){

        texto =
            texto.replace(
                /\./g,
                ""
            );


        texto =
            texto.replace(
                ",",
                "."
            );

    }


    const numero =
        Number(
            texto
        );


    return isFinite(numero)
        ? numero
        : 0;

}


/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatarMoeda(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(data){

    if(
        !data
    ){

        return "";

    }


    const texto =
        String(data).trim();


    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        return texto;

    }


    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("-");


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return texto;

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizarTexto(valor){

    return String(
        valor ?? ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .trim()
    .toLowerCase();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPAR ATRIBUTO
===================================================== */

function escapeHtmlAttr(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        "&quot;"
    );

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tipo
){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " +
        (
            tipo ||
            "sucesso"
        );

}


function limparMensagem(){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        "";


    elemento.className =
        "mensagem";

}


/* =====================================================
   ERRO
===================================================== */

function obterMensagemErro(erro){

    if(
        erro &&
        erro.message
    ){

        return erro.message;

    }


    return String(
        erro ||
        "Erro desconhecido."
    );

}


/* =====================================================
   VOLTAR
===================================================== */

function voltarIndex(){

    window.location.href =
        "./index.html";

}
