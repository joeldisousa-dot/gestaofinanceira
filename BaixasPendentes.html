<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Baixas Pendentes</title>

<style>

*{
  box-sizing:border-box;
}

body{

  font-family:
    Arial,
    sans-serif;

  background:#f4f6f8;

  padding:20px;

  margin:0;

}

.container{

  background:white;

  padding:25px;

  border-radius:15px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.08);

}

.btn-voltar{

  background:#6c757d;

  color:white;

  border:none;

  padding:10px 18px;

  border-radius:8px;

  cursor:pointer;

  margin-bottom:15px;

  font-size:14px;

}

.btn-voltar:hover{

  background:#5a6268;

}

h2{

  color:#c62828;

}

.tabela-container{

  overflow-x:auto;

}

table{

  width:100%;

  border-collapse:collapse;

  min-width:800px;

}

th{

  background:#c62828;

  color:white;

  padding:10px;

}

td{

  padding:10px;

  border-bottom:
    1px solid #ddd;

  text-align:center;

}

.valor{

  text-align:right;

  font-weight:bold;

}

.mensagem{

  padding:15px;

  text-align:center;

}

.erro{

  color:#c62828;

  font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<button
  onclick="voltarIndex()"
  class="btn-voltar"
>
← Voltar
</button>

<h2>
⚠️ Baixas Pendentes
</h2>

<div class="tabela-container">

<table>

<thead>

<tr>

<th>ID</th>

<th>Competência</th>

<th>Tipo</th>

<th>Descrição</th>

<th>Valor</th>

<th>Vencimento</th>

<th>Baixado</th>

</tr>

</thead>

<tbody id="lista">

<tr>

<td
  colspan="7"
>
Carregando...
</td>

</tr>

</tbody>

</table>

</div>

</div>


<script>

/* =========================================================
   API
========================================================= */

const URL_API =
  "https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


/* =========================================================
   VOLTAR
========================================================= */

function voltar(){

  window.location.href =
    "./index.html";

}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
  action,
  params={}
){

  const url =
    new URL(URL_API);


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(function(chave){

      const valor =
        params[chave];


      if(
        valor !== undefined &&
        valor !== null
      ){

        url.searchParams.set(
          chave,
          valor
        );

      }

    });


  const resposta =
    await fetch(
      url.toString(),
      {
        method:"GET",
        redirect:"follow",
        cache:"no-store"
      }
    );


  if(!resposta.ok){

    throw new Error(
      "Erro HTTP " +
      resposta.status
    );

  }


  const texto =
    await resposta.text();


  let dados;


  try{

    dados =
      JSON.parse(texto);

  }
  catch(e){

    console.error(texto);

    throw new Error(
      "Resposta inválida da API."
    );

  }


  if(
    dados &&
    dados.sucesso === false
  ){

    throw new Error(
      dados.erro ||
      dados.mensagem ||
      "Erro na API."
    );

  }


  return dados;

}


/* =========================================================
   CARREGAR
========================================================= */

async function carregar(){

  const corpo =
    document.getElementById(
      "lista"
    );


  try{

    const lista =
      await apiRequest(
        "listarBaixasPendentes"
      );


    corpo.innerHTML =
      "";


    if(
      !lista ||
      lista.length === 0
    ){

      corpo.innerHTML = `

        <tr>

          <td colspan="7">

            Nenhum lançamento pendente.

          </td>

        </tr>

      `;

      return;

    }


    lista.forEach(function(item){

      corpo.innerHTML += `

        <tr>

          <td>
            ${escapar(item.id)}
          </td>

          <td>
            ${escapar(item.competencia)}
          </td>

          <td>
            ${escapar(item.tipo)}
          </td>

          <td>
            ${escapar(item.descricao)}
          </td>

          <td class="valor">

            ${formatarMoeda(item.valor)}

          </td>

          <td>
            ${escapar(item.vencimento)}
          </td>

          <td>
            ${escapar(item.baixado)}
          </td>

        </tr>

      `;

    });

  }
  catch(e){

    corpo.innerHTML = `

      <tr>

        <td
          colspan="7"
          class="erro"
        >

          Erro:
          ${escapar(e.message)}

        </td>

      </tr>

    `;

  }

}


/* =========================================================
   MOEDA
========================================================= */

function formatarMoeda(valor){

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escapar(valor){

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   INICIAR
========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  carregar
);

</script>

</body>

</html>
