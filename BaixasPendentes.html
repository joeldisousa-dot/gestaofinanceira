<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Baixas Pendentes - Controle Financeiro</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

body{

    margin:0;

    padding:20px;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:#f4f6f8;

    color:#333;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    max-width:1200px;

    margin:auto;

    background:#fff;

    padding:25px;

    border-radius:15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.10);

}


/* =====================================================
   TOPO
===================================================== */

.topo{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:20px;

    flex-wrap:wrap;

}


h2{

    margin:0;

    color:#c62828;

}


#tituloCompetencia{

    margin:0 0 20px;

    color:#555;

}


/* =====================================================
   AÇÕES
===================================================== */

.acoes{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:20px;

}


.btn{

    border:0;

    padding:10px 18px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;

    font-size:14px;

}


/* =====================================================
   BOTÃO VOLTAR
===================================================== */

.btn-voltar{

    background:#546e7a;

    color:#fff;

}


.btn-voltar:hover{

    background:#455a64;

}


/* =====================================================
   BOTÃO ATUALIZAR
===================================================== */

.btn-atualizar{

    background:#1565c0;

    color:#fff;

}


.btn-atualizar:hover{

    background:#0d47a1;

}


/* =====================================================
   MENSAGEM
===================================================== */

.mensagem{

    display:none;

    padding:12px 15px;

    margin-bottom:15px;

    border-radius:8px;

    font-weight:bold;

}


.mensagem.erro{

    display:block;

    background:#ffebee;

    color:#c62828;

}


.mensagem.sucesso{

    display:block;

    background:#e8f5e9;

    color:#2e7d32;

}


/* =====================================================
   RESUMO
===================================================== */

.resumo{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;

    margin-bottom:20px;

}


.card-resumo{

    background:#f8fafc;

    border:1px solid #e2e8f0;

    border-radius:10px;

    padding:15px;

    text-align:center;

}


.card-resumo .titulo{

    font-size:13px;

    color:#64748b;

}


.card-resumo .valor{

    display:block;

    margin-top:5px;

    text-align:center;

    font-size:20px;

    color:#c62828;

}


/* =====================================================
   TABELA
===================================================== */

.area-tabela{

    width:100%;

    overflow-x:auto;

}


table{

    width:100%;

    border-collapse:collapse;

    min-width:850px;

}


th{

    background:#c62828;

    color:#fff;

    padding:12px;

    text-align:center;

    white-space:nowrap;

}


td{

    padding:10px;

    border-bottom:1px solid #ddd;

    text-align:center;

}


tbody tr:hover{

    background:#f8f9fa;

}


.valor{

    text-align:right;

    font-weight:bold;

    white-space:nowrap;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:30px;

    color:#64748b;

    font-weight:bold;

}


/* =====================================================
   VAZIO
===================================================== */

.vazio{

    text-align:center;

    padding:30px;

    color:#64748b;

}


/* =====================================================
   ERRO
===================================================== */

.erro{

    background:#ffebee;

    color:#c62828;

    font-weight:bold;

    text-align:center;

    padding:20px;

}


/* =====================================================
   BADGE
===================================================== */

.badge{

    display:inline-block;

    padding:5px 10px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;

}


.badge-pendente{

    background:#fff3e0;

    color:#e65100;

}


/* =====================================================
   SPINNER
===================================================== */

.spinner{

    display:inline-block;

    width:22px;

    height:22px;

    border:3px solid #ddd;

    border-top-color:#c62828;

    border-radius:50%;

    animation:
        girar .8s linear infinite;

    vertical-align:middle;

    margin-right:8px;

}


@keyframes girar{

    to{

        transform:rotate(360deg);

    }

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px){

    body{

        padding:10px;

    }


    .container{

        padding:15px;

    }


    .resumo{

        grid-template-columns:1fr;

    }


    .topo{

        align-items:flex-start;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         TOPO
    ================================================= -->

    <div class="topo">

        <h2>
            ⚠️ Baixas Pendentes
        </h2>


        <button
            type="button"
            class="btn btn-voltar"
            onclick="voltarIndex()"
        >
            ← Voltar
        </button>

    </div>


    <!-- =================================================
         TÍTULO
    ================================================= -->

    <h3 id="tituloCompetencia">
        Todos os lançamentos pendentes
    </h3>


    <!-- =================================================
         AÇÕES
    ================================================= -->

    <div class="acoes">

        <button
            type="button"
            class="btn btn-atualizar"
            onclick="carregar()"
        >
            🔄 Atualizar
        </button>

    </div>


    <!-- =================================================
         MENSAGEM
    ================================================= -->

    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <!-- =================================================
         RESUMO
    ================================================= -->

    <div class="resumo">


        <div class="card-resumo">

            <span class="titulo">
                Pendências
            </span>


            <span
                class="valor"
                id="totalPendentes"
            >
                0
            </span>

        </div>



        <div class="card-resumo">

            <span class="titulo">
                Contas a Receber
            </span>


            <span
                class="valor"
                id="totalReceber"
            >
                R$ 0,00
            </span>

        </div>



        <div class="card-resumo">

            <span class="titulo">
                Contas a Pagar
            </span>


            <span
                class="valor"
                id="totalPagar"
            >
                R$ 0,00
            </span>

        </div>


    </div>


    <!-- =================================================
         TABELA
    ================================================= -->

    <div class="area-tabela">


        <table>


            <thead>

                <tr>

                    <th>ID</th>

                    <th>Competência</th>

                    <th>Tipo</th>

                    <th>Descrição</th>

                    <th>Valor</th>

                    <th>Vencimento</th>

                    <th>Baixado</th>

                </tr>

            </thead>



            <tbody id="lista">


                <tr>

                    <td
                        colspan="7"
                        class="loading"
                    >

                        <span class="spinner"></span>

                        Carregando baixas pendentes...

                    </td>

                </tr>


            </tbody>


        </table>


    </div>


</div>



<script>

/* =====================================================
   CONFIGURAÇÃO DA API
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbwlkjtWnOcvglZS2Ft6ydraSh4-JbTXH6C7irb6O5hYPvxYxqN0tYWQs2Ybi6mVWThN/exec";


let contadorCallback = 0;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        inicializar();

    }
);


/* =====================================================
   INICIALIZAR
===================================================== */

function inicializar(){

    atualizarTitulo();

    carregar();

}


/* =====================================================
   TÍTULO
===================================================== */

function atualizarTitulo(){

    const titulo =
        document.getElementById(
            "tituloCompetencia"
        );


    titulo.textContent =
        "Todos os lançamentos pendentes";

}


/* =====================================================
   CHAMAR API - JSONP
===================================================== */

function chamarAPI(
    acao,
    parametros
){

    parametros =
        parametros || {};


    return new Promise(
        function(resolve,reject){


            contadorCallback++;


            const callback =
                "controleFinanceiroCallback_" +
                Date.now() +
                "_" +
                contadorCallback;


            const script =
                document.createElement(
                    "script"
                );


            let finalizado = false;

            let timeout = null;


            /* -----------------------------------------
               LIMPAR
            ----------------------------------------- */

            function limpar(){

                if(timeout){

                    clearTimeout(
                        timeout
                    );

                    timeout = null;

                }


                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }


                try{

                    delete window[
                        callback
                    ];

                }
                catch(e){

                    window[
                        callback
                    ] = undefined;

                }

            }


            /* -----------------------------------------
               FINALIZAR
            ----------------------------------------- */

            function finalizar(
                fn,
                valor
            ){

                if(finalizado){

                    return;

                }


                finalizado = true;


                limpar();


                fn(valor);

            }


            /* -----------------------------------------
               CALLBACK
            ----------------------------------------- */

            window[callback] =
                function(resposta){

                    console.log(
                        "Resposta da API:",
                        resposta
                    );


                    if(!resposta){

                        finalizar(
                            reject,
                            new Error(
                                "A API retornou uma resposta vazia."
                            )
                        );

                        return;

                    }


                    finalizar(
                        resolve,
                        resposta
                    );

                };


            /* -----------------------------------------
               PARÂMETROS
            ----------------------------------------- */

            const params =
                new URLSearchParams();


            params.set(
                "action",
                acao
            );


            params.set(
                "callback",
                callback
            );


            Object.keys(
                parametros
            ).forEach(
                function(chave){

                    const valor =
                        parametros[chave];


                    if(
                        valor === null ||
                        valor === undefined ||
                        valor === ""
                    ){

                        return;

                    }


                    params.set(
                        chave,
                        String(valor)
                    );

                }
            );


            /* -----------------------------------------
               URL
            ----------------------------------------- */

            const separador =
                URL_API.indexOf("?") >= 0
                ? "&"
                : "?";


            const url =
                URL_API +
                separador +
                params.toString();


            console.log(
                "URL da API:",
                url
            );


            /* -----------------------------------------
               SCRIPT
            ----------------------------------------- */

            script.async = true;


            script.src = url;


            /* -----------------------------------------
               ERRO
            ----------------------------------------- */

            script.onerror =
                function(){

                    finalizar(
                        reject,
                        new Error(
                            "Não foi possível conectar ao Google Apps Script."
                        )
                    );

                };


            /* -----------------------------------------
               TIMEOUT
            ----------------------------------------- */

            timeout =
                setTimeout(
                    function(){

                        finalizar(
                            reject,
                            new Error(
                                "Tempo limite excedido ao conectar ao Google Apps Script."
                            )
                        );

                    },
                    20000
                );


            document.head.appendChild(
                script
            );


        }
    );

}


/* =====================================================
   CARREGAR TODAS AS BAIXAS PENDENTES
===================================================== */

async function carregar(){


    const corpo =
        document.getElementById(
            "lista"
        );


    atualizarTitulo();


    /* -----------------------------------------
       LOADING
    ----------------------------------------- */

    corpo.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="loading"
            >

                <span class="spinner"></span>

                Carregando baixas pendentes...

            </td>

        </tr>

    `;


    limparMensagem();


    try{


        console.log(
            "Consultando todas as competências..."
        );


        /*
         * IMPORTANTE:
         *
         * Nenhuma competência é enviada.
         *
         * A API deve retornar todas as
         * baixas pendentes.
         */

        const resposta =
            await chamarAPI(
                "listarBaixasPendentes",
                {}
            );


        console.log(
            "Resposta recebida:",
            resposta
        );


        /* -----------------------------------------
           VALIDAR RESPOSTA
        ----------------------------------------- */

        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            throw new Error(

                resposta &&
                (
                    resposta.erro ||
                    resposta.mensagem
                )

                ?

                (
                    resposta.erro ||
                    resposta.mensagem
                )

                :

                "A API não retornou uma resposta válida."

            );

        }


        /* -----------------------------------------
           OBTER LISTA
        ----------------------------------------- */

        const lista =
            obterLista(
                resposta
            );


        console.log(
            "Quantidade de pendências:",
            lista.length
        );


        /* -----------------------------------------
           MOSTRAR
        ----------------------------------------- */

        mostrarLista(
            lista
        );


        /* -----------------------------------------
           RESUMO
        ----------------------------------------- */

        atualizarResumo(
            lista
        );


    }
    catch(erro){


        console.error(
            "Erro ao carregar baixas pendentes:",
            erro
        );


        corpo.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="erro"
                >

                    ⚠ ${escapeHtml(
                        obterMensagemErro(
                            erro
                        )
                    )}

                </td>

            </tr>

        `;


        /* -----------------------------------------
           ZERAR RESUMO
        ----------------------------------------- */

        document.getElementById(
            "totalPendentes"
        ).textContent =
            "0";


        document.getElementById(
            "totalReceber"
        ).textContent =
            "R$ 0,00";


        document.getElementById(
            "totalPagar"
        ).textContent =
            "R$ 0,00";


    }

}


/* =====================================================
   OBTER LISTA
===================================================== */

function obterLista(
    resposta
){


    /* -----------------------------------------
       SE A RESPOSTA FOR ARRAY
    ----------------------------------------- */

    if(
        Array.isArray(
            resposta
        )
    ){

        return resposta;

    }


    /* -----------------------------------------
       PROPRIEDADES POSSÍVEIS
    ----------------------------------------- */

    const propriedades = [

        "lista",

        "baixasPendentes",

        "baixas",

        "lancamentos",

        "dados",

        "resultado"

    ];


    for(
        let i = 0;
        i < propriedades.length;
        i++
    ){


        const propriedade =
            propriedades[i];


        if(
            resposta &&
            Array.isArray(
                resposta[
                    propriedade
                ]
            )
        ){

            return resposta[
                propriedade
            ];

        }

    }


    return [];

}


/* =====================================================
   MOSTRAR LISTA
===================================================== */

function mostrarLista(
    lista
){


    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML = "";


    /* -----------------------------------------
       NENHUM REGISTRO
    ----------------------------------------- */

    if(
        !Array.isArray(lista) ||
        lista.length === 0
    ){


        corpo.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="vazio"
                >

                    ✅ Nenhum lançamento pendente.

                </td>

            </tr>

        `;


        return;

    }


    /* -----------------------------------------
       ORDENAR
       COMPETÊNCIA + VENCIMENTO
    ----------------------------------------- */

    lista.sort(
        function(a,b){


            const compA =
                String(
                    a.competencia || ""
                );


            const compB =
                String(
                    b.competencia || ""
                );


            if(
                compA !== compB
            ){

                return compA.localeCompare(
                    compB
                );

            }


            const dataA =
                String(
                    a.vencimento || ""
                );


            const dataB =
                String(
                    b.vencimento || ""
                );


            return dataA.localeCompare(
                dataB
            );

        }
    );


    /* -----------------------------------------
       CRIAR LINHAS
    ----------------------------------------- */

    lista.forEach(
        function(item){


            const valor =
                converterNumero(
                    item.valor
                );


            const linha =
                document.createElement(
                    "tr"
                );


            linha.innerHTML = `


                <td>

                    ${escapeHtml(
                        item.id
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        item.competencia
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        item.tipo
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        item.descricao
                    )}

                </td>


                <td class="valor">

                    ${formatarMoeda(
                        valor
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        formatarData(
                            item.vencimento
                        )
                    )}

                </td>


                <td>

                    <span
                        class="badge badge-pendente"
                    >

                        ${escapeHtml(
                            item.baixado ||
                            "Não"
                        )}

                    </span>

                </td>


            `;


            corpo.appendChild(
                linha
            );


        }
    );

}


/* =====================================================
   ATUALIZAR RESUMO
===================================================== */

function atualizarResumo(
    lista
){


    let receber = 0;

    let pagar = 0;


    lista.forEach(
        function(item){


            const valor =
                converterNumero(
                    item.valor
                );


            const tipo =
                normalizarTexto(
                    item.tipo
                );


            /* -----------------------------------------
               CONTAS A RECEBER
            ----------------------------------------- */

            if(
                tipo ===
                "contas a receber"
            ){

                receber += valor;

            }


            /* -----------------------------------------
               CONTAS A PAGAR
            ----------------------------------------- */

            else if(
                tipo ===
                "contas a pagar"
            ){

                pagar += valor;

            }


        }
    );


    document.getElementById(
        "totalPendentes"
    ).textContent =
        lista.length;


    document.getElementById(
        "totalReceber"
    ).textContent =
        formatarMoeda(
            receber
        );


    document.getElementById(
        "totalPagar"
    ).textContent =
        formatarMoeda(
            pagar
        );

}


/* =====================================================
   CONVERTER NÚMERO
===================================================== */

function converterNumero(
    valor
){


    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return isFinite(
            valor
        )

        ?

        valor

        :

        0;

    }


    let texto =
        String(
            valor
        )
        .trim()
        .replace(
            /R\$/gi,
            ""
        )
        .replace(
            /\s/g,
            ""
        );


    if(
        texto.indexOf(",") >= 0
    ){

        texto =
            texto.replace(
                /\./g,
                ""
            );


        texto =
            texto.replace(
                ",",
                "."
            );

    }


    const numero =
        Number(
            texto
        );


    return isFinite(
        numero
    )

    ?

    numero

    :

    0;

}


/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatarMoeda(
    valor
){


    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {

            style:"currency",

            currency:"BRL"

        }
    );

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
    data
){


    if(!data){

        return "";

    }


    const texto =
        String(
            data
        ).trim();


    /* -----------------------------------------
       DD/MM/AAAA
    ----------------------------------------- */

    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        return texto;

    }


    /* -----------------------------------------
       AAAA-MM-DD
    ----------------------------------------- */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){


        const partes =
            texto.split("-");


        return (

            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]

        );

    }


    return texto;

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizarTexto(
    valor
){


    return String(
        valor ?? ""
    )

    .normalize(
        "NFD"
    )

    .replace(
        /[\u0300-\u036f]/g,
        ""
    )

    .trim()

    .toLowerCase();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(
    valor
){


    return String(
        valor ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tipo
){


    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " +
        (
            tipo ||
            "sucesso"
        );

}


/* =====================================================
   LIMPAR MENSAGEM
===================================================== */

function limparMensagem(){


    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        "";


    elemento.className =
        "mensagem";

}


/* =====================================================
   MENSAGEM DE ERRO
===================================================== */

function obterMensagemErro(
    erro
){


    if(
        erro &&
        erro.message
    ){

        return erro.message;

    }


    return String(
        erro ||
        "Erro desconhecido."
    );

}


/* =====================================================
   VOLTAR PARA INDEX
===================================================== */

function voltarIndex(){


    window.location.href =
        "./index.html";

}

</script>


</body>

</html>
