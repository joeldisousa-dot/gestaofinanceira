<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Baixas Pendentes - Controle Financeiro</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f4f6f8;
    color:#333;
}

.container{
    width:100%;
    max-width:1200px;
    margin:0 auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

h2{
    margin:0;
    color:#c62828;
}

#tituloCompetencia{
    margin:0 0 20px;
    color:#555;
}

.btn-voltar{
    border:0;
    background:#546e7a;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-voltar:hover{
    background:#455a64;
}

.area-tabela{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

thead th{
    background:#c62828;
    color:#fff;
    padding:12px;
    text-align:center;
    white-space:nowrap;
}

tbody td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tbody tr:hover{
    background:#f8f9fa;
}

.valor{
    text-align:right !important;
    font-weight:bold;
    white-space:nowrap;
}

.loading{
    text-align:center;
    padding:30px;
    color:#64748b;
    font-weight:bold;
}

.vazio{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.erro{
    text-align:center;
    padding:20px;
    background:#ffebee;
    color:#c62828;
    font-weight:bold;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-pendente{
    background:#fff3e0;
    color:#e65100;
}

.mensagem{
    display:none;
    padding:12px 15px;
    margin-bottom:15px;
    border-radius:8px;
    font-weight:bold;
}

.mensagem.erro{
    display:block;
    background:#ffebee;
    color:#c62828;
}

.mensagem.sucesso{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.spinner{
    display:inline-block;
    width:22px;
    height:22px;
    border:3px solid #ddd;
    border-top-color:#c62828;
    border-radius:50%;
    animation:girar .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

@keyframes girar{

    to{
        transform:rotate(360deg);
    }

}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .container{
        padding:15px;
        border-radius:10px;
    }

    .topo{
        align-items:flex-start;
    }

    h2{
        font-size:20px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="topo">

        <h2>
            ⚠️ Baixas Pendentes
        </h2>

        <button
            type="button"
            class="btn-voltar"
            onclick="voltarIndex()"
        >
            ← Voltar
        </button>

    </div>

    <h3 id="tituloCompetencia">
        Carregando...
    </h3>

    <div
        id="mensagem"
        class="mensagem"
    ></div>

    <div class="area-tabela">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Competência</th>

                    <th>Tipo</th>

                    <th>Descrição</th>

                    <th>Valor</th>

                    <th>Vencimento</th>

                    <th>Baixado</th>

                </tr>

            </thead>

            <tbody id="lista">

                <tr>

                    <td
                        colspan="7"
                        class="loading"
                    >

                        <span class="spinner"></span>

                        Carregando baixas pendentes...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURAÇÃO DA API
========================================================= */

const URL_API =
"https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


/* =========================================================
   CONTROLE
========================================================= */

let contadorCallback = 0;


/* =========================================================
   PEGAR PARÂMETRO DA URL
========================================================= */

function obterParametroURL(nome){

    try{

        const parametros =
            new URLSearchParams(
                window.location.search
            );

        return (
            parametros.get(nome) || ""
        );

    }
    catch(erro){

        return "";

    }

}


/* =========================================================
   COMPETÊNCIA
========================================================= */

let competencia =
    obterParametroURL(
        "competencia"
    );


/* =========================================================
   CONVERTER COMPETÊNCIA
========================================================= */

function converterCompetencia(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }

    const texto =
        String(valor).trim();

    if(!texto){

        return "";

    }

    /* AAAA-MM */

    if(
        /^\d{4}-\d{2}$/.test(
            texto
        )
    ){

        return texto;

    }

    /* MM/AAAA */

    if(
        /^\d{1,2}\/\d{4}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("/");

        return (
            partes[1] +
            "-" +
            String(
                partes[0]
            ).padStart(
                2,
                "0"
            )
        );

    }

    /* DD/MM/AAAA */

    if(
        /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("/");

        return (
            partes[2] +
            "-" +
            String(
                partes[1]
            ).padStart(
                2,
                "0"
            )
        );

    }

    /* AAAA-MM-DD */

    if(
        /^\d{4}-\d{2}-\d{2}/.test(
            texto
        )
    ){

        return texto.substring(
            0,
            7
        );

    }

    return texto;

}


/* =========================================================
   TÍTULO
========================================================= */

function atualizarTitulo(){

    const elemento =
        document.getElementById(
            "tituloCompetencia"
        );

    const comp =
        converterCompetencia(
            competencia
        );

    if(comp){

        elemento.textContent =
            "Competência: " + comp;

    }
    else{

        elemento.textContent =
            "Todas as competências";

    }

}


/* =========================================================
   JSONP
========================================================= */

function chamarAPI(
    acao,
    parametros
){

    parametros =
        parametros || {};

    return new Promise(
        function(resolve,reject){

            contadorCallback++;

            const nomeCallback =
                "controleFinanceiroCallback_" +
                Date.now() +
                "_" +
                contadorCallback;

            const script =
                document.createElement(
                    "script"
                );

            let finalizado = false;

            let timeout = null;


            function limpar(){

                if(timeout !== null){

                    clearTimeout(
                        timeout
                    );

                    timeout = null;

                }

                if(
                    script &&
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }

                try{

                    delete window[
                        nomeCallback
                    ];

                }
                catch(e){

                    window[
                        nomeCallback
                    ] = undefined;

                }

            }


            function falhar(mensagem){

                if(finalizado){

                    return;

                }

                finalizado = true;

                limpar();

                reject(
                    new Error(
                        mensagem
                    )
                );

            }


            window[nomeCallback] =
                function(resposta){

                    if(finalizado){

                        return;

                    }

                    finalizado = true;

                    limpar();

                    console.log(
                        "Resposta da API:",
                        resposta
                    );

                    if(
                        resposta === null ||
                        resposta === undefined
                    ){

                        reject(
                            new Error(
                                "A API retornou uma resposta vazia."
                            )
                        );

                        return;

                    }

                    resolve(
                        resposta
                    );

                };


            const params =
                new URLSearchParams();


            /* =================================================
               PARÂMETROS OBRIGATÓRIOS
            ================================================= */

            params.set(
                "action",
                acao
            );

            params.set(
                "callback",
                nomeCallback
            );


            /* =================================================
               PARÂMETROS DA ROTINA
            ================================================= */

            Object.keys(
                parametros
            ).forEach(
                function(chave){

                    const valor =
                        parametros[chave];

                    if(
                        valor === null ||
                        valor === undefined ||
                        valor === ""
                    ){

                        return;

                    }

                    params.set(
                        chave,
                        String(valor)
                    );

                }
            );


            /* =================================================
               CACHE BUSTER
            ================================================= */

            params.set(
                "_",
                String(
                    Date.now()
                )
            );


            const url =
                URL_API +
                "?" +
                params.toString();


            console.log(
                "URL da API:",
                url
            );


            script.async = true;

            script.src =
                url;


            script.onerror =
                function(){

                    falhar(
                        "Não foi possível conectar ao Google Apps Script. " +
                        "Verifique se a URL da implantação está publicada como Web App e acessível para qualquer pessoa."
                    );

                };


            timeout =
                setTimeout(
                    function(){

                        falhar(
                            "Tempo limite excedido ao conectar ao Google Apps Script."
                        );

                    },
                    20000
                );


            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   CARREGAR
========================================================= */

async function carregar(){

    const corpo =
        document.getElementById(
            "lista"
        );

    mostrarCarregando();


    try{

        const parametros = {};


        const comp =
            converterCompetencia(
                competencia
            );


        if(comp){

            parametros.competencia =
                comp;

        }


        console.log(
            "================================="
        );

        console.log(
            "BAIXAS PENDENTES"
        );

        console.log(
            "Competência:",
            comp || "TODAS"
        );

        console.log(
            "API:",
            URL_API
        );


        const resposta =
            await chamarAPI(
                "listarBaixasPendentes",
                parametros
            );


        console.log(
            "Resposta completa:",
            resposta
        );


        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            let mensagem =
                "Erro retornado pelo Apps Script.";

            if(
                resposta &&
                resposta.erro
            ){

                mensagem =
                    resposta.erro;

            }
            else if(
                resposta &&
                resposta.mensagem
            ){

                mensagem =
                    resposta.mensagem;

            }

            throw new Error(
                mensagem
            );

        }


        const lista =
            obterLista(
                resposta
            );


        console.log(
            "Quantidade:",
            lista.length
        );


        mostrarLista(
            lista
        );


    }
    catch(erro){

        console.error(
            "ERRO BAIXAS PENDENTES:",
            erro
        );


        corpo.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="erro"
                >
                    ⚠ ${escapeHtml(
                        obterMensagemErro(
                            erro
                        )
                    )}
                </td>
            </tr>
        `;

    }

}


/* =========================================================
   CARREGANDO
========================================================= */

function mostrarCarregando(){

    const corpo =
        document.getElementById(
            "lista"
        );

    corpo.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="loading"
            >

                <span class="spinner"></span>

                Carregando baixas pendentes...

            </td>

        </tr>

    `;

}


/* =========================================================
   OBTER LISTA
========================================================= */

function obterLista(resposta){

    if(
        Array.isArray(
            resposta
        )
    ){

        return resposta;

    }

    const propriedades = [

        "lista",

        "baixas",

        "baixasPendentes",

        "lancamentos",

        "dados",

        "resultado"

    ];


    for(
        let i = 0;
        i < propriedades.length;
        i++
    ){

        const propriedade =
            propriedades[i];

        if(
            resposta &&
            Array.isArray(
                resposta[
                    propriedade
                ]
            )
        ){

            return resposta[
                propriedade
            ];

        }

    }


    return [];

}


/* =========================================================
   MOSTRAR LISTA
========================================================= */

function mostrarLista(lista){

    const corpo =
        document.getElementById(
            "lista"
        );

    corpo.innerHTML = "";


    if(
        !Array.isArray(lista) ||
        lista.length === 0
    ){

        corpo.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="vazio"
                >

                    ✅ Nenhum lançamento pendente.

                </td>

            </tr>

        `;

        return;

    }


    lista.forEach(
        function(item){

            const linha =
                document.createElement(
                    "tr"
                );


            const valor =
                converterNumero(
                    item.valor
                );


            linha.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.id
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.competencia
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.tipo
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.descricao
                    )}
                </td>

                <td class="valor">
                    ${formatarMoeda(
                        valor
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        formatarData(
                            item.vencimento
                        )
                    )}
                </td>

                <td>

                    <span
                        class="badge badge-pendente"
                    >
                        ${escapeHtml(
                            item.baixado ||
                            "Não"
                        )}
                    </span>

                </td>

            `;


            corpo.appendChild(
                linha
            );

        }
    );

}


/* =========================================================
   CONVERTER NÚMERO
========================================================= */

function converterNumero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }

    if(
        typeof valor === "number"
    ){

        return isFinite(valor)
            ? valor
            : 0;

    }


    let texto =
        String(valor)
        .trim();


    texto =
        texto.replace(
            /R\$/gi,
            ""
        );


    texto =
        texto.replace(
            /\s/g,
            ""
        );


    if(
        texto.indexOf(",") >= 0
    ){

        texto =
            texto.replace(
                /\./g,
                ""
            );

        texto =
            texto.replace(
                ",",
                "."
            );

    }


    const numero =
        Number(
            texto
        );


    return isFinite(numero)
        ? numero
        : 0;

}


/* =========================================================
   MOEDA
========================================================= */

function formatarMoeda(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =========================================================
   DATA
========================================================= */

function formatarData(data){

    if(
        !data
    ){

        return "";

    }


    const texto =
        String(data).trim();


    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        return texto;

    }


    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("-");


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return texto;

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(valor){

    return String(
        valor === null ||
        valor === undefined
            ? ""
            : valor
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ERRO
========================================================= */

function obterMensagemErro(erro){

    if(
        erro &&
        erro.message
    ){

        return erro.message;

    }


    return String(
        erro ||
        "Erro desconhecido."
    );

}


/* =========================================================
   VOLTAR
========================================================= */

function voltarIndex(){

    /*
     * O index está no GitHub Pages.
     */

    window.location.href =
        "./index.html";

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        console.log(
            "Baixas Pendentes inicializado."
        );

        console.log(
            "URL:",
            window.location.href
        );

        console.log(
            "Competência recebida:",
            competencia || "TODAS"
        );


        atualizarTitulo();

        carregar();

    }
);

</script>

</body>

</html>
