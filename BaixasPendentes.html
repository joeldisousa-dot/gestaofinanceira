<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


let contadorCallback = 0;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        inicializar();

    }
);


/* =====================================================
   INICIALIZAR
===================================================== */

function inicializar(){

    const competenciaURL =
        obterParametroURL("competencia");

    const filtro =
        document.getElementById(
            "competenciaFiltro"
        );


    /*
     * IMPORTANTE:
     *
     * Se a página vier sem competência,
     * NÃO enviaremos competência para a API.
     *
     * Assim serão carregados TODOS os meses.
     */

    if(
        competenciaURL &&
        converterCompetencia(
            competenciaURL
        )
    ){

        filtro.value =
            converterCompetencia(
                competenciaURL
            );

    }
    else{

        filtro.value = "";

    }


    carregar();

}


/* =====================================================
   PARÂMETRO URL
===================================================== */

function obterParametroURL(nome){

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    return parametros.get(nome) || "";

}


/* =====================================================
   CONVERTER COMPETÊNCIA
===================================================== */

function converterCompetencia(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }


    const texto =
        String(valor).trim();


    if(!texto){

        return "";

    }


    /*
     * AAAA-MM
     */

    if(
        /^\d{4}-\d{2}$/.test(
            texto
        )
    ){

        return texto;

    }


    /*
     * MM/AAAA
     */

    if(
        /^\d{1,2}\/\d{4}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("/");


        return (
            partes[1] +
            "-" +
            String(
                partes[0]
            ).padStart(
                2,
                "0"
            )
        );

    }


    /*
     * DD/MM/AAAA
     */

    if(
        /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("/");


        return (
            partes[2] +
            "-" +
            String(
                partes[1]
            ).padStart(
                2,
                "0"
            )
        );

    }


    /*
     * AAAA-MM-DD
     */

    if(
        /^\d{4}-\d{2}-\d{2}/.test(
            texto
        )
    ){

        return texto.substring(
            0,
            7
        );

    }


    return "";

}


/* =====================================================
   TÍTULO
===================================================== */

function atualizarTitulo(competencia){

    const titulo =
        document.getElementById(
            "tituloCompetencia"
        );


    if(competencia){

        titulo.textContent =
            "Competência: " +
            competencia;

    }
    else{

        titulo.textContent =
            "Todas as competências";

    }

}


/* =====================================================
   JSONP
===================================================== */

function chamarAPI(
    acao,
    parametros
){

    parametros =
        parametros || {};


    return new Promise(
        function(resolve,reject){

            contadorCallback++;


            const callback =
                "controleFinanceiroCallback_" +
                Date.now() +
                "_" +
                contadorCallback;


            const script =
                document.createElement(
                    "script"
                );


            let finalizado = false;

            let timeout = null;


            function limpar(){

                if(timeout){

                    clearTimeout(
                        timeout
                    );

                    timeout = null;

                }


                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }


                try{

                    delete window[
                        callback
                    ];

                }
                catch(e){

                    window[
                        callback
                    ] = undefined;

                }

            }


            function finalizar(
                fn,
                valor
            ){

                if(finalizado){

                    return;

                }


                finalizado = true;

                limpar();

                fn(valor);

            }


            window[callback] =
                function(resposta){

                    console.log(
                        "Resposta da API:",
                        resposta
                    );


                    if(
                        !resposta
                    ){

                        finalizar(
                            reject,
                            new Error(
                                "Resposta vazia do Google Apps Script."
                            )
                        );

                        return;

                    }


                    finalizar(
                        resolve,
                        resposta
                    );

                };


            const params =
                new URLSearchParams();


            params.set(
                "action",
                acao
            );


            params.set(
                "callback",
                callback
            );


            Object.keys(
                parametros
            ).forEach(
                function(chave){

                    const valor =
                        parametros[chave];


                    if(
                        valor === null ||
                        valor === undefined ||
                        valor === ""
                    ){

                        return;

                    }


                    params.set(
                        chave,
                        String(valor)
                    );

                }
            );


            const separador =
                URL_API.indexOf("?") >= 0
                ? "&"
                : "?";


            const url =
                URL_API +
                separador +
                params.toString();


            console.log(
                "URL da API:",
                url
            );


            script.async = true;

            script.src = url;


            script.onerror =
                function(){

                    finalizar(
                        reject,
                        new Error(
                            "Não foi possível carregar a resposta do Google Apps Script. Verifique a implantação da API."
                        )
                    );

                };


            timeout =
                setTimeout(
                    function(){

                        finalizar(
                            reject,
                            new Error(
                                "Tempo limite excedido ao conectar ao Google Apps Script."
                            )
                        );

                    },
                    20000
                );


            document.head.appendChild(
                script
            );

        }
    );

}


/* =====================================================
   CARREGAR
===================================================== */

async function carregar(){

    const corpo =
        document.getElementById(
            "lista"
        );


    const filtro =
        document.getElementById(
            "competenciaFiltro"
        );


    /*
     * Aqui está a principal correção.
     *
     * Se o campo estiver vazio,
     * parametros fica vazio.
     *
     * A API então retorna TODOS os meses.
     */

    const competencia =
        filtro.value
        ?
        converterCompetencia(
            filtro.value
        )
        :
        "";


    atualizarTitulo(
        competencia
    );


    corpo.innerHTML = `
        <tr>
            <td
                colspan="7"
                class="loading"
            >
                <span class="spinner"></span>
                Carregando baixas pendentes...
            </td>
        </tr>
    `;


    limparMensagem();


    try{

        const parametros = {};


        if(competencia){

            parametros.competencia =
                competencia;

        }


        console.log(
            "Filtro enviado para API:",
            competencia ||
            "TODAS AS COMPETÊNCIAS"
        );


        const resposta =
            await chamarAPI(
                "listarBaixasPendentes",
                parametros
            );


        console.log(
            "listarBaixasPendentes:",
            resposta
        );


        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta &&
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                ?
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                :
                "A API retornou um erro."
            );

        }


        const lista =
            obterLista(
                resposta
            );


        mostrarLista(
            lista
        );


        atualizarResumo(
            lista
        );


    }
    catch(erro){

        console.error(
            "Erro ao carregar baixas pendentes:",
            erro
        );


        corpo.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="erro"
                >
                    ⚠ ${escapeHtml(
                        obterMensagemErro(
                            erro
                        )
                    )}
                </td>
            </tr>
        `;


        document.getElementById(
            "totalPendentes"
        ).textContent = "0";


        document.getElementById(
            "totalReceber"
        ).textContent = "R$ 0,00";


        document.getElementById(
            "totalPagar"
        ).textContent = "R$ 0,00";

    }

}


/* =====================================================
   CARREGAR TODAS
===================================================== */

function carregarTodas(){

    const filtro =
        document.getElementById(
            "competenciaFiltro"
        );


    filtro.value = "";


    /*
     * Remove também a competência da URL.
     */

    atualizarTitulo(
        ""
    );


    carregar();

}


/* =====================================================
   OBTER LISTA
===================================================== */

function obterLista(resposta){

    if(
        Array.isArray(
            resposta
        )
    ){

        return resposta;

    }


    const propriedades = [
        "lista",
        "baixasPendentes",
        "baixas",
        "lancamentos",
        "dados",
        "resultado"
    ];


    for(
        let i = 0;
        i < propriedades.length;
        i++
    ){

        const propriedade =
            propriedades[i];


        if(
            resposta &&
            Array.isArray(
                resposta[
                    propriedade
                ]
            )
        ){

            return resposta[
                propriedade
            ];

        }

    }


    return [];

}


/* =====================================================
   MOSTRAR LISTA
===================================================== */

function mostrarLista(lista){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML = "";


    if(
        !Array.isArray(lista) ||
        lista.length === 0
    ){

        corpo.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="vazio"
                >
                    ✅ Nenhum lançamento pendente.
                </td>
            </tr>
        `;

        return;

    }


    /*
     * Ordena por competência e vencimento.
     */

    lista.sort(
        function(a,b){

            const compA =
                String(
                    a.competencia || ""
                );

            const compB =
                String(
                    b.competencia || ""
                );


            if(
                compA !== compB
            ){

                return compA.localeCompare(
                    compB
                );

            }


            const dataA =
                String(
                    a.vencimento || ""
                );

            const dataB =
                String(
                    b.vencimento || ""
                );


            return dataA.localeCompare(
                dataB
            );

        }
    );


    lista.forEach(
        function(item){

            const valor =
                converterNumero(
                    item.valor
                );


            const linha =
                document.createElement(
                    "tr"
                );


            linha.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.id
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.competencia
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.tipo
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.descricao
                    )}
                </td>

                <td class="valor">
                    ${formatarMoeda(
                        valor
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        formatarData(
                            item.vencimento
                        )
                    )}
                </td>

                <td>
                    <span
                        class="badge badge-pendente"
                    >
                        ${escapeHtml(
                            item.baixado ||
                            "Não"
                        )}
                    </span>
                </td>

            `;


            corpo.appendChild(
                linha
            );

        }
    );

}


/* =====================================================
   RESUMO
===================================================== */

function atualizarResumo(lista){

    let receber = 0;

    let pagar = 0;


    lista.forEach(
        function(item){

            const valor =
                converterNumero(
                    item.valor
                );


            if(
                normalizarTexto(
                    item.tipo
                ) ===
                "contas a receber"
            ){

                receber += valor;

            }


            else if(
                normalizarTexto(
                    item.tipo
                ) ===
                "contas a pagar"
            ){

                pagar += valor;

            }

        }
    );


    document.getElementById(
        "totalPendentes"
    ).textContent =
        lista.length;


    document.getElementById(
        "totalReceber"
    ).textContent =
        formatarMoeda(
            receber
        );


    document.getElementById(
        "totalPagar"
    ).textContent =
        formatarMoeda(
            pagar
        );

}


/* =====================================================
   CONVERTER NÚMERO
===================================================== */

function converterNumero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return isFinite(valor)
            ? valor
            : 0;

    }


    let texto =
        String(valor)
        .trim()
        .replace(
            /R\$/gi,
            ""
        )
        .replace(
            /\s/g,
            ""
        );


    if(
        texto.indexOf(",") >= 0
    ){

        texto =
            texto.replace(
                /\./g,
                ""
            );


        texto =
            texto.replace(
                ",",
                "."
            );

    }


    const numero =
        Number(
            texto
        );


    return isFinite(numero)
        ? numero
        : 0;

}


/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatarMoeda(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(data){

    if(!data){

        return "";

    }


    const texto =
        String(data).trim();


    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        return texto;

    }


    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("-");


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return texto;

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizarTexto(valor){

    return String(
        valor ?? ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .trim()
    .toLowerCase();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tipo
){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " +
        (
            tipo ||
            "sucesso"
        );

}


function limparMensagem(){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent = "";

    elemento.className =
        "mensagem";

}


/* =====================================================
   ERRO
===================================================== */

function obterMensagemErro(erro){

    if(
        erro &&
        erro.message
    ){

        return erro.message;

    }


    return String(
        erro ||
