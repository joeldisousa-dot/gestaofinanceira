<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Baixas Pendentes</title>


<style>

*{
  box-sizing:border-box;
}


body{

  font-family:
    Arial,
    sans-serif;

  background:#f4f6f8;

  padding:20px;

  margin:0;

  color:#333;

}


.container{

  max-width:1200px;

  margin:auto;

  background:white;

  padding:25px;

  border-radius:15px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.10);

}


.topo{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:20px;

}


h2{

  margin:0;

  color:#c62828;

}


.btn-voltar{

  background:#6c757d;

  color:white;

  border:none;

  padding:10px 18px;

  border-radius:8px;

  cursor:pointer;

  font-size:14px;

  font-weight:bold;

}


.btn-voltar:hover{

  background:#5a6268;

}


.area-tabela{

  width:100%;

  overflow-x:auto;

}


table{

  width:100%;

  border-collapse:collapse;

  min-width:850px;

}


th{

  background:#c62828;

  color:white;

  padding:12px;

  text-align:center;

}


td{

  padding:10px;

  border-bottom:
    1px solid #ddd;

  text-align:center;

}


tbody tr:hover{

  background:#f8f9fa;

}


.valor{

  text-align:right;

  font-weight:bold;

}


.loading{

  text-align:center;

  padding:30px;

  color:#64748b;

  font-weight:bold;

}


.mensagem{

  padding:15px;

  border-radius:8px;

  margin-bottom:20px;

}


.erro{

  background:#ffebee;

  color:#c62828;

  font-weight:bold;

}


.sucesso{

  background:#e8f5e9;

  color:#2e7d32;

}


.vazio{

  text-align:center;

  padding:30px;

  color:#64748b;

}


.badge{

  display:inline-block;

  padding:5px 10px;

  border-radius:20px;

  font-size:12px;

  font-weight:bold;

}


.badge-pendente{

  background:#fff3e0;

  color:#e65100;

}


@media(max-width:600px){

  body{

    padding:10px;

  }

  .container{

    padding:15px;

  }

  .topo{

    align-items:flex-start;

  }

}

</style>

</head>


<body>


<div class="container">


  <div class="topo">

    <h2>
      ⚠️ Baixas Pendentes
    </h2>


    <button
      onclick="voltarIndex()"
      class="btn-voltar"
    >

      ← Voltar

    </button>

  </div>


  <div
    id="mensagem"
    style="display:none"
  ></div>


  <div class="area-tabela">

    <table>

      <thead>

        <tr>

          <th>ID</th>

          <th>Competência</th>

          <th>Tipo</th>

          <th>Descrição</th>

          <th>Valor</th>

          <th>Vencimento</th>

          <th>Baixado</th>

        </tr>

      </thead>


      <tbody id="lista">

      </tbody>

    </table>

  </div>


</div>



<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  carregar
);


/* =====================================================
   VOLTAR PARA GITHUB
===================================================== */

function voltarIndex(){

  window.location.href =
    "index.html";

}


/* =====================================================
   API
===================================================== */

async function apiRequest(
  action,
  params={}
){

  const url =
    new URL(URL_API);


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(function(chave){

      const valor =
        params[chave];


      if(
        valor !== undefined &&
        valor !== null
      ){

        url.searchParams.set(
          chave,
          typeof valor === "object"
            ? JSON.stringify(valor)
            : valor
        );

      }

    });


  let resposta;


  try{

    resposta =
      await fetch(
        url.toString(),
        {
          method:"GET",
          redirect:"follow",
          cache:"no-store"
        }
      );

  }
  catch(e){

    throw new Error(
      "Não foi possível conectar ao Google Apps Script."
    );

  }


  if(!resposta.ok){

    throw new Error(
      "Erro HTTP " +
      resposta.status
    );

  }


  const texto =
    await resposta.text();


  console.log(
    "Resposta da API:",
    texto
  );


  let dados;


  try{

    dados =
      JSON.parse(texto);

  }
  catch(e){

    console.error(
      "Resposta inválida:",
      texto
    );

    throw new Error(
      "O servidor não retornou JSON válido."
    );

  }


  if(
    dados &&
    dados.sucesso === false
  ){

    throw new Error(
      dados.erro ||
      dados.mensagem ||
      "Erro retornado pelo servidor."
    );

  }


  return dados;

}


/* =====================================================
   NORMALIZAR LISTA
===================================================== */

function obterLista(
  resposta
){

  /*
    Aceita diferentes formatos
    retornados pelo Apps Script.
  */


  if(
    Array.isArray(resposta)
  ){

    return resposta;

  }


  if(
    resposta &&
    Array.isArray(resposta.dados)
  ){

    return resposta.dados;

  }


  if(
    resposta &&
    Array.isArray(resposta.lista)
  ){

    return resposta.lista;

  }


  if(
    resposta &&
    Array.isArray(resposta.resultado)
  ){

    return resposta.resultado;

  }


  if(
    resposta &&
    Array.isArray(resposta.baixas)
  ){

    return resposta.baixas;

  }


  if(
    resposta &&
    Array.isArray(resposta.baixasPendentes)
  ){

    return resposta.baixasPendentes;

  }


  return [];

}


/* =====================================================
   CARREGAR
===================================================== */

async function carregar(){

  const corpo =
    document.getElementById(
      "lista"
    );


  corpo.innerHTML =
    `
    <tr>
      <td
        colspan="7"
        class="loading"
      >
        ⏳ Carregando baixas pendentes...
      </td>
    </tr>
    `;


  try{

    const resposta =
      await apiRequest(
        "listarBaixasPendentes"
      );


    console.log(
      "Resposta baixas pendentes:",
      resposta
    );


    const lista =
      obterLista(
        resposta
      );


    console.log(
      "Lista normalizada:",
      lista
    );


    mostrarLista(
      lista
    );

  }
  catch(e){

    console.error(e);


    corpo.innerHTML =
      `
      <tr>

        <td
          colspan="7"
          class="erro"
        >

          Erro: ${escapeHtml(
            e.message
          )}

        </td>

      </tr>
      `;

  }

}


/* =====================================================
   MOSTRAR LISTA
===================================================== */

function mostrarLista(
  lista
){

  const corpo =
    document.getElementById(
      "lista"
    );


  corpo.innerHTML =
    "";


  if(
    !Array.isArray(lista) ||
    lista.length === 0
  ){

    corpo.innerHTML =
      `
      <tr>

        <td
          colspan="7"
          class="vazio"
        >

          ✅ Nenhum lançamento pendente.

        </td>

      </tr>
      `;

    return;

  }


  lista.forEach(
    function(item){

      const valor =
        Number(
          item.valor || 0
        );


      const linha =
        document.createElement(
          "tr"
        );


      linha.innerHTML =
        `

        <td>
          ${escapeHtml(
            item.id ?? ""
          )}
        </td>


        <td>
          ${escapeHtml(
            item.competencia ?? ""
          )}
        </td>


        <td>
          ${escapeHtml(
            item.tipo ?? ""
          )}
        </td>


        <td>
          ${escapeHtml(
            item.descricao ?? ""
          )}
        </td>


        <td class="valor">

          ${valor.toLocaleString(
            "pt-BR",
            {
              style:"currency",
              currency:"BRL"
            }
          )}

        </td>


        <td>
          ${escapeHtml(
            item.vencimento ?? ""
          )}
        </td>


        <td>

          <span
            class="badge badge-pendente"
          >

            ${escapeHtml(
              item.baixado ?? "Não"
            )}

          </span>

        </td>

        `;


      corpo.appendChild(
        linha
      );

    }
  );

}


/* =====================================================
   SEGURANÇA
===================================================== */

function escapeHtml(
  valor
){

  return String(
    valor
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

</script>


</body>

</html>
