<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baixas Pendentes - Controle Financeiro</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:"Segoe UI",Arial,sans-serif;background:#f4f6f8;color:#333}
.container{max-width:1400px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.10)}
.topo{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}
h2{margin:0;color:#c62828}.subtitulo{margin:0 0 20px;color:#555}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.btn{border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:bold;transition:.2s}
.btn:hover{opacity:.9;transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-voltar{background:#546e7a;color:#fff}.btn-atualizar{background:#1565c0;color:#fff}
.btn-baixar{background:#2e7d32;color:#fff;padding:7px 13px;font-size:13px}.btn-baixar:hover{background:#1b5e20}
.filtros{display:grid;grid-template-columns:minmax(250px,1fr);gap:12px;margin-bottom:20px;padding:15px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px}
.filtro-grupo{display:flex;flex-direction:column;gap:6px}.filtro-grupo label{font-size:13px;font-weight:bold;color:#475569}
.filtro-grupo select{width:100%;height:42px;padding:0 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#334155;font-family:inherit;font-size:14px;outline:none;cursor:pointer}
.filtro-grupo select:focus{border-color:#1565c0;box-shadow:0 0 0 3px rgba(21,101,192,.10)}
.info-filtro{font-size:12px;color:#64748b;margin-top:2px}
.mensagem{display:none;padding:12px 15px;margin-bottom:15px;border-radius:8px;font-weight:bold}
.mensagem.erro{display:block;background:#ffebee;color:#c62828}.mensagem.sucesso{display:block;background:#e8f5e9;color:#2e7d32}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.card-resumo{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:15px;text-align:center}
.card-resumo .titulo{font-size:13px;color:#64748b}.card-resumo .valor{display:block;margin-top:5px;text-align:center;font-size:20px;color:#c62828;font-weight:bold}
.area-tabela{width:100%;overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1200px}
th{background:#c62828;color:#fff;padding:12px;text-align:center;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #ddd;text-align:center;vertical-align:middle}tbody tr:hover{background:#f8f9fa}
.valor{text-align:right!important;font-weight:bold;white-space:nowrap}.loading{text-align:center;padding:30px;color:#64748b;font-weight:bold}
.vazio{text-align:center;padding:30px;color:#64748b}.erro-tabela{background:#ffebee;color:#c62828;font-weight:bold;text-align:center;padding:20px}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold;white-space:nowrap}
.badge-pendente{background:#fff3e0;color:#e65100}.tipo{display:inline-block;min-width:130px;padding:7px 10px;border-radius:20px;font-size:12px;font-weight:bold;white-space:nowrap}
.tipo-receber{background:#e8f5e9;color:#2e7d32}.tipo-pagar{background:#ffebee;color:#c62828}.tipo-outro{background:#eceff1;color:#455a64}
.acoes-linha{white-space:nowrap}.qrcode-celula{min-width:110px}
.qrcode-celula img{width:90px;height:90px;object-fit:contain;border:1px solid #e2e8f0;border-radius:8px;padding:4px;background:#fff;cursor:zoom-in}
.qrcode-sem-imagem{color:#94a3b8;font-size:12px}.spinner{display:inline-block;width:22px;height:22px;border:3px solid #ddd;border-top-color:#c62828;border-radius:50%;animation:girar .8s linear infinite;vertical-align:middle;margin-right:8px}
.spinner-pequeno{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:girar .8s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes girar{to{transform:rotate(360deg)}}
.modal-qr{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:20px}
.modal-qr.aberto{display:flex}.modal-qr img{max-width:min(90vw,600px);max-height:85vh;background:white;padding:10px;border-radius:10px}.modal-qr button{position:absolute;top:20px;right:25px;background:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:20px;cursor:pointer}
@media(max-width:700px){body{padding:10px}.container{padding:15px}.resumo{grid-template-columns:1fr}.topo{align-items:flex-start;flex-direction:column}.filtros{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <div class="topo">
    <h2>⚠️ Baixas Pendentes</h2>
    <button type="button" class="btn btn-voltar" onclick="voltarIndex()">← Voltar</button>
  </div>
  <h3 class="subtitulo">Todos os lançamentos pendentes</h3>
  <div class="acoes">
    <button type="button" id="btnAtualizar" class="btn btn-atualizar" onclick="carregar()">🔄 Atualizar</button>
  </div>
  <div class="filtros">
    <div class="filtro-grupo">
      <label for="filtroDescricao">🔎 Filtrar por descrição</label>
      <select id="filtroDescricao" onchange="aplicarFiltroDescricao()"><option value="">Todas as descrições</option></select>
      <div id="infoFiltro" class="info-filtro">Exibindo todos os lançamentos pendentes.</div>
    </div>
  </div>
  <div id="mensagem" class="mensagem"></div>
  <div class="resumo">
    <div class="card-resumo"><span class="titulo">Pendências</span><span class="valor" id="totalPendentes">0</span></div>
    <div class="card-resumo"><span class="titulo">Contas a Receber</span><span class="valor" id="totalReceber">R$ 0,00</span></div>
    <div class="card-resumo"><span class="titulo">Contas a Pagar</span><span class="valor" id="totalPagar">R$ 0,00</span></div>
  </div>
  <div class="area-tabela">
    <table>
      <thead><tr><th>ID</th><th>Competência</th><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Baixado</th><th>QR Code</th><th>Ação</th></tr></thead>
      <tbody id="lista"><tr><td colspan="9" class="loading"><span class="spinner"></span>Carregando baixas pendentes...</td></tr></tbody>
    </table>
  </div>
</div>
<div id="modalQr" class="modal-qr" onclick="fecharQr(event)"><button type="button" aria-label="Fechar" onclick="fecharQr(event)">✕</button><img id="imagemQrAmpliada" alt="QR Code ampliado"></div>
<script>
"use strict";
const URL_API="https://script.google.com/macros/s/AKfycbxyXfBbooxSug3QbCvbpOl1MFJpqP5AhJIqLMB166p2opvvZBUX0UfIviuObQ6_nEvc/exec";
const ACAO_BAIXAR="baixarLancamento";
let contadorCallback=0;
let listaPendentes=[];
document.addEventListener("DOMContentLoaded",carregar);

async function carregar(){
  const corpo=document.getElementById("lista"),botao=document.getElementById("btnAtualizar");
  if(botao.disabled)return;
  botao.disabled=true;botao.textContent="⏳ Carregando...";
  corpo.innerHTML='<tr><td colspan="9" class="loading"><span class="spinner"></span>Carregando baixas pendentes...</td></tr>';
  limparMensagem();zerarResumo();
  try{
    const resposta=await chamarAPI("listarBaixasPendentes",{});
    if(!resposta)throw new Error("A API não retornou nenhuma resposta.");
    if(resposta.sucesso!==true)throw new Error(resposta.erro||resposta.mensagem||"A API retornou um erro.");
    listaPendentes=obterLista(resposta);
    preencherFiltroDescricoes(listaPendentes);
    aplicarFiltroDescricao();
    if(listaPendentes.length)mostrarMensagem(listaPendentes.length+" lançamento(s) pendente(s) encontrado(s).","sucesso");
  }catch(erro){
    corpo.innerHTML='<tr><td colspan="9" class="erro-tabela">⚠ '+escapeHtml(obterMensagemErro(erro))+'</td></tr>';
    mostrarMensagem(obterMensagemErro(erro),"erro");listaPendentes=[];limparFiltroDescricao();zerarResumo();
  }finally{botao.disabled=false;botao.textContent="🔄 Atualizar";}
}

function preencherFiltroDescricoes(lista){
  const select=document.getElementById("filtroDescricao");
  const valorAnterior=select.value;
  select.innerHTML='<option value="">Todas as descrições</option>';
  const descricoes=new Map();
  lista.forEach(item=>{
    const descricao=String(item.descricao??"").trim();
    if(!descricao)return;
    const chave=normalizarTexto(descricao);
    if(!descricoes.has(chave))descricoes.set(chave,descricao);
  });
  [...descricoes.entries()].sort((a,b)=>a[1].localeCompare(b[1],"pt-BR",{sensitivity:"base"})).forEach(([chave,descricao])=>{
    const option=document.createElement("option");option.value=chave;option.textContent=descricao;select.appendChild(option);
  });
  if([...select.options].some(o=>o.value===valorAnterior))select.value=valorAnterior;
}

function aplicarFiltroDescricao(){
  const filtro=normalizarTexto(document.getElementById("filtroDescricao").value);
  const lista=filtro?listaPendentes.filter(item=>normalizarTexto(item.descricao)===filtro):listaPendentes.slice();
  atualizarInfoFiltro(lista.length,filtro);mostrarLista(lista);atualizarResumo(lista);
}
function atualizarInfoFiltro(quantidade,filtro){
  const elemento=document.getElementById("infoFiltro");
  if(!filtro){elemento.textContent="Exibindo todos os lançamentos pendentes.";return;}
  const select=document.getElementById("filtroDescricao");
  elemento.textContent=quantidade+" lançamento(s) encontrado(s) para: "+(select.options[select.selectedIndex]?.text||"");
}
function limparFiltroDescricao(){
  const select=document.getElementById("filtroDescricao");select.innerHTML='<option value="">Todas as descrições</option>';select.value="";
  atualizarInfoFiltro(0,"");
}

function chamarAPI(acao,parametros={}){
  return new Promise((resolve,reject)=>{
    const callback="controleFinanceiroCallback_"+Date.now()+"_"+(++contadorCallback);
    const script=document.createElement("script");let finalizado=false;let timeout;
    function limpar(){if(timeout)clearTimeout(timeout);if(script.parentNode)script.parentNode.removeChild(script);try{delete window[callback]}catch(e){window[callback]=undefined}}
    function finalizar(fn,valor){if(finalizado)return;finalizado=true;limpar();fn(valor)}
    window[callback]=resposta=>finalizar(resolve,resposta);
    const params=new URLSearchParams();params.set("action",acao);params.set("callback",callback);
    Object.keys(parametros||{}).forEach(chave=>{const valor=parametros[chave];if(valor!==null&&valor!==undefined&&valor!=="")params.set(chave,String(valor))});
    script.async=true;script.src=URL_API+(URL_API.includes("?")?"&":"?")+params.toString();
    script.onerror=()=>finalizar(reject,new Error("Não foi possível conectar ao Google Apps Script."));
    timeout=setTimeout(()=>finalizar(reject,new Error("A API demorou mais de 20 segundos para responder.")),20000);
    document.head.appendChild(script);
  });
}

function obterLista(resposta){
  if(Array.isArray(resposta))return resposta;
  for(const chave of ["lista","baixasPendentes","baixas","lancamentos","dados","resultado"]){
    if(resposta&&Array.isArray(resposta[chave]))return resposta[chave];
  }
  return [];
}

function mostrarLista(lista){
  const corpo=document.getElementById("lista");corpo.innerHTML="";
  if(!Array.isArray(lista)||!lista.length){
    corpo.innerHTML='<tr><td colspan="9" class="vazio">'+(listaPendentes.length?"🔎 Nenhum lançamento encontrado para a descrição selecionada.":"✅ Nenhum lançamento pendente.")+'</td></tr>';return;
  }
  const ordenada=lista.slice().sort((a,b)=>{
    const ordem=t=>{const n=normalizarTexto(t);return n.includes("receber")?1:n.includes("pagar")?2:3};
    return ordem(a.tipo)-ordem(b.tipo)||String(a.competencia||"").localeCompare(String(b.competencia||""))||String(a.vencimento||"").localeCompare(String(b.vencimento||""));
  });
  ordenada.forEach(item=>{
    const tr=document.createElement("tr"),tipo=classificarTipo(item.tipo),valor=converterNumero(item.valor);
    tr.innerHTML=`
      <td>${escapeHtml(item.id)}</td>
      <td>${escapeHtml(item.competencia)}</td>
      <td><span class="tipo ${tipo.classe}">${tipo.icone} ${escapeHtml(tipo.nome)}</span></td>
      <td>${escapeHtml(item.descricao)}</td>
      <td class="valor">${formatarMoeda(valor)}</td>
      <td>${escapeHtml(formatarData(item.vencimento))}</td>
      <td><span class="badge badge-pendente">${escapeHtml(item.baixado||"Não")}</span></td>
      <td class="qrcode-celula">${renderizarQrCode(item.qrcode||item.qrCode||item["QR Code"]||item.QR_CODE||"")}</td>
      <td class="acoes-linha"><button type="button" class="btn btn-baixar">✓ Baixar</button></td>`;
    tr.querySelector(".btn-baixar").addEventListener("click",function(){baixarLancamento(this,item.id)});
    const img=tr.querySelector(".qrcode-celula img");
    if(img)img.addEventListener("click",()=>abrirQr(img.src));
    corpo.appendChild(tr);
  });
}

function renderizarQrCode(valor){
  const qr=String(valor||"").trim();
  if(/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(qr)||/^https?:\/\//i.test(qr)){
    return '<img src="'+escapeHtmlAttr(qr)+'" alt="QR Code" loading="lazy">';
  }
  if(qr){
    return '<div class="qrcode-sem-imagem">Código Pix em texto</div>';
  }
  return '<span class="qrcode-sem-imagem">Sem QR Code</span>';
}
function abrirQr(src){document.getElementById("imagemQrAmpliada").src=src;document.getElementById("modalQr").classList.add("aberto")}
function fecharQr(event){if(event)event.stopPropagation();document.getElementById("modalQr").classList.remove("aberto");document.getElementById("imagemQrAmpliada").src=""}

function classificarTipo(tipo){
  const texto=normalizarTexto(tipo);
  if(texto.includes("receber"))return {nome:"Contas a Receber",classe:"tipo-receber",icone:"🟢"};
  if(texto.includes("pagar"))return {nome:"Contas a Pagar",classe:"tipo-pagar",icone:"🔴"};
  return {nome:tipo||"Não informado",classe:"tipo-outro",icone:"⚪"};
}

async function baixarLancamento(botao,id){
  if(!id){alert("Não foi possível identificar o lançamento.");return}
  if(!confirm("Deseja realmente baixar este lançamento?"))return;
  const original=botao.innerHTML;botao.disabled=true;botao.innerHTML='<span class="spinner-pequeno"></span>Baixando...';
  try{
    const resposta=await chamarAPI(ACAO_BAIXAR,{id:id});
    if(!resposta||resposta.sucesso!==true)throw new Error(resposta&&(resposta.erro||resposta.mensagem)||"Não foi possível baixar o lançamento.");
    mostrarMensagem("Lançamento baixado com sucesso.","sucesso");
    listaPendentes=listaPendentes.filter(item=>String(item.id)!==String(id));
    preencherFiltroDescricoes(listaPendentes);aplicarFiltroDescricao();
  }catch(erro){mostrarMensagem(obterMensagemErro(erro),"erro");botao.disabled=false;botao.innerHTML=original}
}

function atualizarResumo(lista){
  let receber=0,pagar=0;
  lista.forEach(item=>{const valor=converterNumero(item.valor),tipo=normalizarTexto(item.tipo);if(tipo.includes("receber"))receber+=valor;else if(tipo.includes("pagar"))pagar+=valor});
  document.getElementById("totalPendentes").textContent=lista.length;
  document.getElementById("totalReceber").textContent=formatarMoeda(receber);
  document.getElementById("totalPagar").textContent=formatarMoeda(pagar);
}
function zerarResumo(){document.getElementById("totalPendentes").textContent="0";document.getElementById("totalReceber").textContent="R$ 0,00";document.getElementById("totalPagar").textContent="R$ 0,00"}
function converterNumero(valor){
  if(valor===null||valor===undefined||valor==="")return 0;if(typeof valor==="number")return Number.isFinite(valor)?valor:0;
  let texto=String(valor).trim().replace(/R\$/gi,"").replace(/\s/g,"");
  if(texto.includes(","))texto=texto.replace(/\./g,"").replace(",",".");
  const n=Number(texto);return Number.isFinite(n)?n:0;
}
function formatarMoeda(valor){return Number(valor||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function formatarData(data){
  if(!data)return "";const texto=String(data).trim();
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(texto))return texto;
  if(/^\d{4}-\d{2}-\d{2}$/.test(texto)){const p=texto.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
  return texto;
}
function normalizarTexto(valor){return String(valor??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase()}
function escapeHtml(valor){return String(valor??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function escapeHtmlAttr(valor){return escapeHtml(valor).replace(/`/g,"&#096;")}
function mostrarMensagem(texto,tipo){const el=document.getElementById("mensagem");el.textContent=texto;el.className="mensagem "+(tipo||"sucesso")}
function limparMensagem(){const el=document.getElementById("mensagem");el.textContent="";el.className="mensagem"}
function obterMensagemErro(erro){return erro&&erro.message?erro.message:String(erro||"Erro desconhecido.")}
function voltarIndex(){window.location.href="./index.html"}
</script>
</body>
</html>
