<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baixas Pendentes - Controle Financeiro</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f4f6f8;
    color:#333;
}

.container{
    max-width:1200px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

h2{
    margin:0;
    color:#c62828;
}

#tituloCompetencia{
    margin:0 0 20px;
    color:#555;
}

.btn-voltar{
    border:0;
    background:#546e7a;
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-voltar:hover{
    background:#455a64;
}

.area-tabela{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#c62828;
    color:#fff;
    padding:12px;
    text-align:center;
    white-space:nowrap;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tbody tr:hover{
    background:#f8f9fa;
}

.valor{
    text-align:right;
    font-weight:bold;
    white-space:nowrap;
}

.loading{
    text-align:center;
    padding:30px;
    color:#64748b;
    font-weight:bold;
}

.vazio{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.erro{
    background:#ffebee;
    color:#c62828;
    font-weight:bold;
    text-align:center;
    padding:20px;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-pendente{
    background:#fff3e0;
    color:#e65100;
}

.mensagem{
    display:none;
    padding:12px 15px;
    margin-bottom:15px;
    border-radius:8px;
    font-weight:bold;
}

.mensagem.erro{
    display:block;
    background:#ffebee;
    color:#c62828;
}

.mensagem.sucesso{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.spinner{
    display:inline-block;
    width:22px;
    height:22px;
    border:3px solid #ddd;
    border-top-color:#c62828;
    border-radius:50%;
    animation:girar .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

@keyframes girar{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .container{
        padding:15px;
    }

    .topo{
        align-items:flex-start;
    }

}

</style>
</head>


<body>

<div class="container">

    <div class="topo">

        <h2>
            ⚠️ Baixas Pendentes
        </h2>

        <button
            type="button"
            class="btn-voltar"
            onclick="voltarIndex()"
        >
            ← Voltar
        </button>

    </div>


    <h3 id="tituloCompetencia">
        Carregando...
    </h3>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <div class="area-tabela">

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Competência</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Vencimento</th>
                    <th>Baixado</th>
                </tr>

            </thead>

            <tbody id="lista">

                <tr>
                    <td
                        colspan="7"
                        class="loading"
                    >
                        <span class="spinner"></span>
                        Carregando baixas pendentes...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO DA API
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


/* =====================================================
   CONTROLE DE CALLBACK
===================================================== */

let contadorCallback = 0;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        atualizarTitulo();

        carregar();

    }
);


/* =====================================================
   PEGAR PARÂMETRO DA URL
===================================================== */

function obterParametroURL(nome){

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    return parametros.get(nome) || "";

}


/* =====================================================
   COMPETÊNCIA
===================================================== */

let competencia =
    obterParametroURL(
        "competencia"
    );


/* =====================================================
   CONVERTER COMPETÊNCIA
===================================================== */

function converterCompetencia(valor){

    if(!valor){
        return "";
    }

    const texto =
        String(valor).trim();


    if(
        /^\d{4}-\d{2}$/.test(texto)
    ){
        return texto;
    }


    if(
        /^\d{2}\/\d{4}$/.test(texto)
    ){

        const partes =
            texto.split("/");

        return (
            partes[1] +
            "-" +
            partes[0]
        );

    }


    if(
        /^\d{4}-\d{2}-\d{2}/.test(texto)
    ){

        return texto.substring(
            0,
            7
        );

    }


    return texto;

}


/* =====================================================
   TÍTULO
===================================================== */

function atualizarTitulo(){

    const elemento =
        document.getElementById(
            "tituloCompetencia"
        );


    const comp =
        converterCompetencia(
            competencia
        );


    if(comp){

        elemento.textContent =
            "Competência: " + comp;

    }
    else{

        elemento.textContent =
            "Todas as competências";

    }

}


/* =====================================================
   API JSONP
===================================================== */

function chamarAPI(
    acao,
    parametros
){

    parametros =
        parametros || {};


    return new Promise(
        function(resolve,reject){

            contadorCallback++;


            const nomeCallback =
                "controleFinanceiroCallback_" +
                Date.now() +
                "_" +
                contadorCallback;


            const script =
                document.createElement(
                    "script"
                );


            let finalizado = false;


            let timeout;


            function limpar(){

                if(timeout){

                    clearTimeout(
                        timeout
                    );

                }


                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }


                try{

                    delete window[
                        nomeCallback
                    ];

                }
                catch(e){

                    window[
                        nomeCallback
                    ] = undefined;

                }

            }


            window[nomeCallback] =
                function(resposta){

                    if(finalizado){
                        return;
                    }


                    finalizado = true;


                    limpar();


                    console.log(
                        "Resposta Apps Script:",
                        resposta
                    );


                    if(
                        !resposta
                    ){

                        reject(
                            new Error(
                                "Resposta vazia do Google Apps Script."
                            )
                        );

                        return;

                    }


                    resolve(
                        resposta
                    );

                };


            const params =
                new URLSearchParams();


            /*
             * IMPORTANTE:
             *
             * O Apps Script recebe ACTION.
             */

            params.set(
                "action",
                acao
            );


            params.set(
                "callback",
                nomeCallback
            );


            Object.keys(
                parametros
            ).forEach(
                function(chave){

                    const valor =
                        parametros[chave];


                    if(
                        valor === undefined ||
                        valor === null
                    ){

                        return;

                    }


                    params.set(
                        chave,
                        String(valor)
                    );

                }
            );


            const separador =
                URL_API.indexOf("?") >= 0
                ? "&"
                : "?";


            const url =
                URL_API +
                separador +
                params.toString();


            console.log(
                "Chamando API:",
                url
            );


            script.src =
                url;


            script.onerror =
                function(){

                    if(finalizado){
                        return;
                    }


                    finalizado = true;


                    limpar();


                    reject(
                        new Error(
                            "Não foi possível conectar ao Google Apps Script."
                        )
                    );

                };


            timeout =
                setTimeout(
                    function(){

                        if(finalizado){
                            return;
                        }


                        finalizado = true;


                        limpar();


                        reject(
                            new Error(
                                "Tempo limite excedido ao conectar ao Google Apps Script."
                            )
                        );

                    },
                    15000
                );


            document.head.appendChild(
                script
            );

        }
    );

}


/* =====================================================
   CARREGAR BAIXAS PENDENTES
===================================================== */

async function carregar(){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML = `
        <tr>
            <td
                colspan="7"
                class="loading"
            >
                <span class="spinner"></span>
                Carregando baixas pendentes...
            </td>
        </tr>
    `;


    try{

        const parametros = {};


        /*
         * Se veio competência do index,
         * envia para o Apps Script.
         */

        if(competencia){

            parametros.competencia =
                converterCompetencia(
                    competencia
                );

        }


        console.log(
            "Competência enviada:",
            parametros.competencia || "TODAS"
        );


        const resposta =
            await chamarAPI(
                "listarBaixasPendentes",
                parametros
            );


        console.log(
            "Resposta listarBaixasPendentes:",
            resposta
        );


        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta &&
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                ?
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                :
                "Erro retornado pelo Apps Script."
            );

        }


        const lista =
            obterLista(
                resposta
            );


        mostrarLista(
            lista
        );


    }
    catch(erro){

        console.error(
            "Erro ao carregar baixas pendentes:",
            erro
        );


        corpo.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="erro"
                >
                    ⚠ Erro ao carregar baixas pendentes:
                    ${escapeHtml(
                        obterMensagemErro(erro)
                    )}
                </td>
            </tr>
        `;

    }

}


/* =====================================================
   OBTER LISTA
===================================================== */

function obterLista(resposta){

    if(
        Array.isArray(resposta)
    ){

        return resposta;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.lista
        )
    ){

        return resposta.lista;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.baixas
        )
    ){

        return resposta.baixas;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.baixasPendentes
        )
    ){

        return resposta.baixasPendentes;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.dados
        )
    ){

        return resposta.dados;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.resultado
        )
    ){

        return resposta.resultado;

    }


    return [];

}


/* =====================================================
   MOSTRAR LISTA
===================================================== */

function mostrarLista(lista){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML = "";


    if(
        !Array.isArray(lista) ||
        lista.length === 0
    ){

        corpo.innerHTML = `
            <tr>
                <td
                    colspan="7"
                    class="vazio"
                >
                    ✅ Nenhum lançamento pendente.
                </td>
            </tr>
        `;

        return;

    }


    lista.forEach(
        function(item){

            const valor =
                Number(
                    item.valor || 0
                );


            const linha =
                document.createElement(
                    "tr"
                );


            linha.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.id ?? ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.competencia ?? ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.tipo ?? ""
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        item.descricao ?? ""
                    )}
                </td>

                <td class="valor">
                    ${valor.toLocaleString(
                        "pt-BR",
                        {
                            style:"currency",
                            currency:"BRL"
                        }
                    )}
                </td>

                <td>
                    ${escapeHtml(
                        formatarData(
                            item.vencimento
                        )
                    )}
                </td>

                <td>

                    <span
                        class="badge badge-pendente"
                    >
                        ${escapeHtml(
                            item.baixado || "Não"
                        )}
                    </span>

                </td>

            `;


            corpo.appendChild(
                linha
            );

        }
    );

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(data){

    if(!data){
        return "";
    }


    const texto =
        String(data).trim();


    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        return texto;

    }


    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("-");


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return texto;

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ERRO
===================================================== */

function obterMensagemErro(erro){

    if(
        erro &&
        erro.message
    ){

        return erro.message;

    }


    return String(
        erro || "Erro desconhecido."
    );

}


/* =====================================================
   VOLTAR
===================================================== */

function voltarIndex(){

    window.location.href =
        "./index.html";

}

</script>

</body>
</html>
