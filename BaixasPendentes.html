table{

th{

}

/* =====================================================
   BADGE
===================================================== */

.badge{

}

/* =====================================================
   CARREGAMENTO
===================================================== */

.loading{
    padding:30px;

}

.spinner{
    display:inline-block;

    width:22px;

    height:22px;

    margin-right:8px;

    border:
        3px solid #ddd;

    border-top-color:#c62828;

    border-radius:50%;

    vertical-align:middle;

    animation:
        girar .8s linear infinite;
}

@keyframes girar{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   VAZIO
===================================================== */

.vazio{
    padding:35px;

    color:#64748b;

    text-align:center;

    font-weight:600;
}


/* =====================================================
   MENSAGEM
===================================================== */

.mensagem{
    display:none;

    margin-bottom:18px;

    padding:13px 15px;

    border-radius:8px;

    font-weight:600;
}

.mensagem.erro{
    display:block;

    background:#ffebee;

    color:#c62828;

    border:
        1px solid #ffcdd2;
}

.mensagem.sucesso{
    display:block;

    background:#e8f5e9;

    color:#2e7d32;

    border:
        1px solid #c8e6c9;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:600px){

    body{

    }

    .topo{

        flex-direction:column;
    }

    .btn-voltar{
        width:100%;
    }

    h2{
        font-size:23px;
    }

}

</style>

</div>

<script>

/* =====================================================
   CONFIGURAÇÃO DA API
===================================================== */

/*
 * ESTA É A MESMA API QUE ESTÁ FUNCIONANDO
 * NA ROTINA DE LANÇAMENTOS.
 */

const URL_API =
"https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


/* =====================================================
   CONTADOR JSONP
===================================================== */

let contadorCallback = 0;


/* =====================================================
   COMPETÊNCIA
===================================================== */

let competencia =
    obterParametroURL(
        "competencia"
    );


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        competencia =
            converterCompetencia(
                competencia
            );

        atualizarCompetencia();

        carregar();

    }
);


/* =====================================================
   PARÂMETRO DA URL
===================================================== */

function obterParametroURL(nome){

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    return (
        parametros.get(nome) || ""
    );

}


/* =====================================================
   CONVERTER COMPETÊNCIA
===================================================== */

function converterCompetencia(valor){

    if(!valor){

        return "";

    }


    const texto =
        String(valor).trim();


    /*
     * YYYY-MM
     */

    if(
        /^\d{4}-\d{2}$/.test(
            texto
        )
    ){

        return texto;

    }


    /*
     * MM/YYYY
     */

    if(
        /^\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("/");

        return (
            partes[1] +
            "-" +
            partes[0]
        );

    }


    /*
     * YYYY-MM-DD
     */

    if(
        /^\d{4}-\d{2}-\d{2}/.test(
            texto
        )
    ){

        return texto.substring(
            0,
            7
        );

    }


    return texto;

}


/* =====================================================
   EXIBIR COMPETÊNCIA
===================================================== */

function atualizarCompetencia(){

    const elemento =
        document.getElementById(
            "competenciaTexto"
        );


    if(!competencia){

        elemento.textContent =
            "Competência: Todas";

        return;

    }


    elemento.textContent =
        "Competência: " +
        competencia;

}


/* =====================================================
   API JSONP
===================================================== */

/*
 * IMPORTANTE:
 *
 * NÃO usamos fetch().
 *
 * O GitHub Pages chama o Apps Script
 * através de JSONP.
 *
 * Isso evita o problema de CORS.
 */

function chamarAPI(
    action,
    parametros
){

    parametros =
        parametros || {};


    return new Promise(
        function(resolve,reject){

            contadorCallback++;


            const nomeCallback =
                "baixasPendentesCallback_" +
                Date.now() +
                "_" +
                contadorCallback;


            const script =
                document.createElement(
                    "script"
                );


            let finalizado =
                false;


            let timeout;


            /* =========================================
               LIMPAR
            ========================================= */

            function limpar(){

                if(timeout){

                    clearTimeout(
                        timeout
                    );

                }


                if(
                    script &&
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }


                try{

                    delete window[
                        nomeCallback
                    ];

                }
                catch(e){

                    window[
                        nomeCallback
                    ] =
                        undefined;

                }

            }


            /* =========================================
               CALLBACK
            ========================================= */

            window[
                nomeCallback
            ] =
                function(resposta){

                    if(finalizado){

                        return;

                    }


                    finalizado =
                        true;


                    limpar();


                    console.log(
                        "Resposta Apps Script:",
                        resposta
                    );


                    if(!resposta){

                        reject(
                            new Error(
                                "O Apps Script retornou uma resposta vazia."
                            )
                        );

                        return;

                    }


                    if(
                        resposta.sucesso === false
                    ){

                        reject(
                            new Error(
                                resposta.erro ||
                                resposta.mensagem ||
                                "Erro retornado pelo Apps Script."
                            )
                        );

                        return;

                    }


                    resolve(
                        resposta
                    );

                };


            /* =========================================
               PARÂMETROS
            ========================================= */

            const params =
                new URLSearchParams();


            params.set(
                "action",
                action
            );


            params.set(
                "callback",
                nomeCallback
            );


            Object.keys(
                parametros
            ).forEach(
                function(chave){

                    const valor =
                        parametros[chave];


                    if(
                        valor === undefined ||
                        valor === null
                    ){

                        return;

                    }


                    params.set(
                        chave,
                        String(valor)
                    );

                }
            );


            /* =========================================
               URL
            ========================================= */

            const separador =
                URL_API.indexOf("?") >= 0
                    ? "&"
                    : "?";


            const url =
                URL_API +
                separador +
                params.toString();


            console.log(
                "Chamando API:",
                url
            );


            /* =========================================
               ERRO DO SCRIPT
            ========================================= */

            script.onerror =
                function(){

                    if(finalizado){

                        return;

                    }


                    finalizado =
                        true;


                    limpar();


                    reject(
                        new Error(
                            "Não foi possível conectar ao Google Apps Script."
                        )
                    );

                };


            /* =========================================
               TIMEOUT
            ========================================= */

            timeout =
                setTimeout(
                    function(){

                        if(finalizado){

                            return;

                        }


                        finalizado =
                            true;


                        limpar();


                        reject(
                            new Error(
                                "Tempo limite excedido ao conectar ao Google Apps Script."
                            )
                        );

                    },
                    20000
                );


            /* =========================================
               EXECUTAR
            ========================================= */

            script.src =
                url;


            document.head.appendChild(
                script
            );

        }
    );

}


/* =====================================================
   CARREGAR BAIXAS PENDENTES
===================================================== */

async function carregar(){

    mostrarCarregando();


    try{

        const parametros = {};


        /*
         * Se existe competência na URL,
         * envia para o Apps Script.
         */

        if(competencia){

            parametros.competencia =
                competencia;

        }


        console.log(
            "Listando baixas pendentes.",
            parametros
        );


        const resposta =
            await chamarAPI(
                "listarBaixasPendentes",
                parametros
            );


        console.log(
            "Resposta baixas pendentes:",
            resposta
        );


        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta &&
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                ?
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                :
                "Erro ao carregar baixas pendentes."
            );

        }


        const lista =
            obterLista(
                resposta
            );


        console.log(
            "Lista normalizada:",
            lista
        );


        mostrarLista(
            lista
        );


    }
    catch(erro){

        console.error(
            "Erro ao carregar baixas pendentes:",
            erro
        );


        mostrarErro(
            "Erro ao carregar baixas pendentes: " +
            obterMensagemErro(
                erro
            )
        );

    }

}


/* =====================================================
   MOSTRAR CARREGANDO
===================================================== */

function mostrarCarregando(){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="loading"
            >

                <span class="spinner"></span>

                Carregando baixas pendentes...

            </td>

        </tr>

    `;

}


/* =====================================================
   OBTER LISTA
===================================================== */

function obterLista(
    resposta
){

    if(
        Array.isArray(
            resposta
        )
    ){

        return resposta;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.lista
        )
    ){

        return resposta.lista;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.dados
        )
    ){

        return resposta.dados;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.resultado
        )
    ){

        return resposta.resultado;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.baixas
        )
    ){

        return resposta.baixas;

    }


    if(
        resposta &&
        Array.isArray(
            resposta.baixasPendentes
        )
    ){

        return resposta.baixasPendentes;

    }


    return [];

}


/* =====================================================
   MOSTRAR LISTA
===================================================== */

function mostrarLista(
    lista
){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML =
        "";


    if(
        !Array.isArray(lista) ||
        lista.length === 0
    ){

        corpo.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="vazio"
                >

                    ✅ Nenhum lançamento pendente
                    para esta competência.

                </td>

            </tr>

        `;

        return;

    }


    lista.forEach(
        function(item){

            const valor =
                normalizarValor(
                    item.valor
                );


            const linha =
                document.createElement(
                    "tr"
                );


            linha.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.id ?? ""
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        item.competencia ?? ""
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        item.tipo ?? ""
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        item.descricao ?? ""
                    )}
                </td>


                <td class="valor">

                    ${formatarMoeda(
                        valor
                    )}

                </td>


                <td>
                    ${escapeHtml(
                        formatarData(
                            item.vencimento
                        )
                    )}
                </td>


                <td>

                    <span
                        class="badge badge-pendente"
                    >

                        ${escapeHtml(
                            item.baixado ||
                            "Não"
                        )}

                    </span>

                </td>

            `;


            corpo.appendChild(
                linha
            );

        }
    );

}


/* =====================================================
   NORMALIZAR VALOR
===================================================== */

function normalizarValor(
    valor
){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return valor;

    }


    let texto =
        String(valor).trim();


    texto =
        texto.replace(
            /R\$\s?/g,
            ""
        );


    if(
        texto.includes(",")
    ){

        texto =
            texto.replace(
                /\./g,
                ""
            );


        texto =
            texto.replace(
                ",",
                "."
            );

    }


    const numero =
        parseFloat(
            texto
        );


    return isNaN(numero)
        ? 0
        : numero;

}


/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatarMoeda(
    valor
){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
    data
){

    if(!data){

        return "";

    }


    const texto =
        String(data).trim();


    /*
     * DD/MM/YYYY
     */

    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        return texto;

    }


    /*
     * YYYY-MM-DD
     */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("-");


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return texto;

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(
    valor
){

    return String(
        valor ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   MENSAGEM DE ERRO
===================================================== */

function mostrarErro(
    texto
){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.className =
        "mensagem erro";


    elemento.textContent =
        "⚠ " + texto;


    elemento.style.display =
        "block";


    window.scrollTo(
        {
            top:0,
            behavior:"smooth"
        }
    );

}


/* =====================================================
   MENSAGEM DE SUCESSO
===================================================== */

function mostrarSucesso(
    texto
){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.className =
        "mensagem sucesso";


    elemento.textContent =
        "✓ " + texto;


    elemento.style.display =
        "block";

}


/* =====================================================
   MENSAGEM DE ERRO
===================================================== */

function obterMensagemErro(
    erro
){

    if(
        erro &&
        erro.message
    ){

        return erro.message;

    }


    return String(
        erro ||
        "Erro desconhecido."
    );

}


/* =====================================================
   VOLTAR
===================================================== */

function voltarIndex(){

    /*
     * Volta para o index do GitHub.
     *
     * Mantém a competência selecionada.
     */

    const url =
        new URL(
            "index.html",
            window.location.href
        );


    if(competencia){

        url.searchParams.set(
            "competencia",
            competencia
        );

    }


    window.location.href =
        url.href;

}

</script>
