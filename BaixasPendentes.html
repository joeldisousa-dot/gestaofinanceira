<style>

*{

table{

th{

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbxyXfBbooxSug3QbCvbpOl1MFJpqP5AhJIqLMB166p2opvvZBUX0UfIviuObQ6_nEvc/exec";


const ACAO_BAIXAR =
"baixarLancamento";


let contadorCallback = 0;


/*
 * Guarda todos os lançamentos recebidos da API.
 *
 * O filtro trabalha em cima desta lista.
 */

let listaPendentes = [];


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        carregar();

    }
);


/* =====================================================
   CARREGAR TODAS AS PENDÊNCIAS
===================================================== */

async function carregar(){

    const corpo =
        document.getElementById("lista");

    const botao =
        document.getElementById("btnAtualizar");


    if(
        botao.disabled
    ){

        return;

    }


    botao.disabled = true;

    botao.textContent =
        "⏳ Carregando...";


    corpo.innerHTML = `
        <tr>
            <td colspan="8" class="loading">
                <span class="spinner"></span>
                Carregando baixas pendentes...
            </td>
        </tr>
    `;


    limparMensagem();

    zerarResumo();


    try{

        console.log(
            "Consultando todas as baixas pendentes..."
        );


        const resposta =
            await chamarAPI(
                "listarBaixasPendentes",
                {}
            );


        console.log(
            "Resposta recebida:",
            resposta
        );


        if(
            !resposta
        ){

            throw new Error(
                "A API não retornou nenhuma resposta."
            );

        }


        if(
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta.erro ||
                resposta.mensagem ||
                "A API retornou um erro."
            );

        }


        const lista =
            obterLista(resposta);


        console.log(
            "Quantidade de pendências:",
            lista.length
        );


        /*
         * Guarda a lista completa.
         */

        listaPendentes =
            Array.isArray(lista)
                ? lista
                : [];


        /*
         * Monta as opções do filtro.
         */

        preencherFiltroDescricoes(
            listaPendentes
        );


        /*
         * Exibe a lista completa.
         */

        aplicarFiltroDescricao();


        if(
            listaPendentes.length > 0
        ){

            mostrarMensagem(
                listaPendentes.length +
                " lançamento(s) pendente(s) encontrado(s).",
                "sucesso"
            );

        }


    }
    catch(erro){

        console.error(
            "Erro ao carregar:",
            erro
        );


        corpo.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="erro-tabela"
                >
                    ⚠ ${escapeHtml(
                        obterMensagemErro(erro)
                    )}
                </td>
            </tr>
        `;


        mostrarMensagem(
            obterMensagemErro(erro),
            "erro"
        );


        listaPendentes = [];

        limparFiltroDescricao();

        zerarResumo();

    }
    finally{

        botao.disabled = false;

        botao.textContent =
            "🔄 Atualizar";

    }

}


/* =====================================================
   PREENCHER FILTRO DE DESCRIÇÕES
===================================================== */

function preencherFiltroDescricoes(lista){

    const select =
        document.getElementById(
            "filtroDescricao"
        );


    /*
     * Limpa todas as opções anteriores.
     */

    select.innerHTML = `
        <option value="">
            Todas as descrições
        </option>
    `;


    /*
     * Array temporário para armazenar
     * as descrições únicas.
     */

    const descricoes = [];


    lista.forEach(
        function(item){

            const descricao =
                String(
                    item.descricao ?? ""
                ).trim();


            if(
                descricao === ""
            ){

                return;

            }


            /*
             * Evita duplicidades considerando
             * maiúsculas/minúsculas e acentos.
             */

            const chave =
                normalizarTexto(
                    descricao
                );


            const jaExiste =
                descricoes.some(
                    function(itemExistente){

                        return (
                            itemExistente.chave ===
                            chave
                        );

                    }
                );


            if(
                !jaExiste
            ){

                descricoes.push({

                    chave:chave,

                    descricao:descricao

                });

            }

        }
    );


    /*
     * Ordena alfabeticamente.
     */

    descricoes.sort(
        function(a,b){

            return a.descricao.localeCompare(
                b.descricao,
                "pt-BR",
                {
                    sensitivity:"base"
                }
            );

        }
    );


    /*
     * Cria as opções do SELECT.
     */

    descricoes.forEach(
        function(item){

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                item.chave;


            option.textContent =
                item.descricao;


            select.appendChild(
                option
            );

        }
    );


    console.log(
        "Descrições encontradas:",
        descricoes.length
    );

}


/* =====================================================
   APLICAR FILTRO POR DESCRIÇÃO
===================================================== */

function aplicarFiltroDescricao(){

    const select =
        document.getElementById(
            "filtroDescricao"
        );


    const filtro =
        normalizarTexto(
            select.value
        );


    let listaFiltrada;


    /*
     * Sem filtro:
     * mostra tudo.
     */

    if(
        filtro === ""
    ){

        listaFiltrada =
            listaPendentes.slice();

    }


    /*
     * Com filtro:
     * mostra somente a descrição selecionada.
     */

    else{

        listaFiltrada =
            listaPendentes.filter(
                function(item){

                    return (
                        normalizarTexto(
                            item.descricao
                        ) === filtro
                    );

                }
            );

    }


    /*
     * Atualiza informação abaixo do filtro.
     */

    atualizarInfoFiltro(
        listaFiltrada.length,
        filtro
    );


    /*
     * Renderiza a tabela filtrada.
     */

    mostrarLista(
        listaFiltrada
    );


    /*
     * Atualiza os totais somente
     * dos itens atualmente exibidos.
     */

    atualizarResumo(
        listaFiltrada
    );

}


/* =====================================================
   INFORMAÇÃO DO FILTRO
===================================================== */

function atualizarInfoFiltro(
    quantidade,
    filtro
){

    const elemento =
        document.getElementById(
            "infoFiltro"
        );


    if(
        !filtro
    ){

        elemento.textContent =
            "Exibindo todos os lançamentos pendentes.";

        return;

    }


    const select =
        document.getElementById(
            "filtroDescricao"
        );


    const textoDescricao =
        select.options[
            select.selectedIndex
        ]?.text || "";


    elemento.textContent =
        quantidade +
        " lançamento(s) encontrado(s) para: " +
        textoDescricao;

}


/* =====================================================
   LIMPAR FILTRO
===================================================== */

function limparFiltroDescricao(){

    const select =
        document.getElementById(
            "filtroDescricao"
        );


    select.innerHTML = `
        <option value="">
            Todas as descrições
        </option>
    `;


    select.value = "";


    atualizarInfoFiltro(
        0,
        ""
    );

}


/* =====================================================
   JSONP
===================================================== */

function chamarAPI(
    acao,
    parametros
){

    parametros =
        parametros || {};


    return new Promise(
        function(resolve,reject){

            contadorCallback++;


            const callback =
                "controleFinanceiroCallback_" +
                Date.now() +
                "_" +
                contadorCallback;


            const script =
                document.createElement(
                    "script"
                );


            let finalizado = false;

            let timeout = null;


            function limpar(){

                if(timeout){

                    clearTimeout(
                        timeout
                    );

                    timeout = null;

                }


                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }


                try{

                    delete window[
                        callback
                    ];

                }
                catch(e){

                    window[
                        callback
                    ] = undefined;

                }

            }


            function finalizar(
                fn,
                valor
            ){

                if(finalizado){

                    return;

                }


                finalizado = true;

                limpar();

                fn(valor);

            }


            window[callback] =
                function(resposta){

                    console.log(
                        "JSONP recebido:",
                        resposta
                    );


                    finalizar(
                        resolve,
                        resposta
                    );

                };


            const params =
                new URLSearchParams();


            params.set(
                "action",
                acao
            );


            params.set(
                "callback",
                callback
            );


            Object.keys(
                parametros
            ).forEach(
                function(chave){

                    const valor =
                        parametros[chave];


                    if(
                        valor === null ||
                        valor === undefined ||
                        valor === ""
                    ){

                        return;

                    }


                    params.set(
                        chave,
                        String(valor)
                    );

                }
            );


            const separador =
                URL_API.indexOf("?") >= 0
                ? "&"
                : "?";


            const url =
                URL_API +
                separador +
                params.toString();


            console.log(
                "Chamando API:",
                url
            );


            script.async = true;

            script.src = url;


            script.onerror =
                function(){

                    finalizar(
                        reject,
                        new Error(
                            "Não foi possível conectar ao Google Apps Script."
                        )
                    );

                };


            timeout =
                setTimeout(
                    function(){

                        finalizar(
                            reject,
                            new Error(
                                "A API demorou mais de 20 segundos para responder."
                            )
                        );

                    },
                    20000
                );


            document.head.appendChild(
                script
            );

        }
    );

}


/* =====================================================
   OBTER LISTA
===================================================== */

function obterLista(resposta){

    if(
        Array.isArray(resposta)
    ){

        return resposta;

    }


    const propriedades = [

        "lista",
        "baixasPendentes",
        "baixas",
        "lancamentos",
        "dados",
        "resultado"

    ];


    for(
        let i = 0;
        i < propriedades.length;
        i++
    ){

        const propriedade =
            propriedades[i];


        if(
            resposta &&
            Array.isArray(
                resposta[
                    propriedade
                ]
            )
        ){

            return resposta[
                propriedade
            ];

        }

    }


    return [];

}


/* =====================================================
   MOSTRAR LISTA
===================================================== */

function mostrarLista(lista){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML = "";


    if(
        !Array.isArray(lista) ||
        lista.length === 0
    ){

        corpo.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="vazio"
                >
                    ${
                        listaPendentes.length > 0
                        ? "🔎 Nenhum lançamento encontrado para a descrição selecionada."
                        : "✅ Nenhum lançamento pendente."
                    }
                </td>
            </tr>
        `;

        return;

    }


    /*
     * Faz uma cópia para não alterar
     * a ordem da lista original.
     */

    const listaOrdenada =
        lista.slice();


    /*
     * Ordenação:
     *
     * 1. Tipo
     * 2. Competência
     * 3. Vencimento
     */

    listaOrdenada.sort(
        function(a,b){

            const tipoA =
                normalizarTexto(
                    a.tipo
                );

            const tipoB =
                normalizarTexto(
                    b.tipo
                );


            function ordemTipo(tipo){

                if(
                    tipo.includes("receber")
                ){

                    return 1;

                }


                if(
                    tipo.includes("pagar")
                ){

                    return 2;

                }


                return 3;

            }


            const ordemA =
                ordemTipo(
                    tipoA
                );

            const ordemB =
                ordemTipo(
                    tipoB
                );


            if(
                ordemA !== ordemB
            ){

                return ordemA - ordemB;

            }


            const compA =
                String(
                    a.competencia || ""
                );

            const compB =
                String(
                    b.competencia || ""
                );


            if(
                compA !== compB
            ){

                return compA.localeCompare(
                    compB
                );

            }


            const dataA =
                String(
                    a.vencimento || ""
                );

            const dataB =
                String(
                    b.vencimento || ""
                );


            return dataA.localeCompare(
                dataB
            );

        }
    );


    listaOrdenada.forEach(
        function(item){

            const valor =
                converterNumero(
                    item.valor
                );


            const linha =
                document.createElement(
                    "tr"
                );


            const tipo =
                classificarTipo(
                    item.tipo
                );


            linha.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.id
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        item.competencia
                    )}
                </td>


                <td>

                    <span
                        class="tipo ${tipo.classe}"
                    >
                        ${tipo.icone}
                        ${escapeHtml(
                            tipo.nome
                        )}
                    </span>

                </td>


                <td>
                    ${escapeHtml(
                        item.descricao
                    )}
                </td>


                <td class="valor">

                    ${formatarMoeda(
                        valor
                    )}

                </td>


                <td>

                    ${escapeHtml(
                        formatarData(
                            item.vencimento
                        )
                    )}

                </td>


                <td>

                    <span
                        class="badge badge-pendente"
                    >
                        ${escapeHtml(
                            item.baixado ||
                            "Não"
                        )}
                    </span>

                </td>


                <td class="acoes-linha">

                    <button
                        type="button"
                        class="btn btn-baixar"
                        onclick="baixarLancamento(this, '${escapeHtmlAttr(item.id)}')"
                    >
                        ✓ Baixar
                    </button>

                </td>

            `;


            corpo.appendChild(
                linha
            );

        }
    );

}


/* =====================================================
   CLASSIFICAR TIPO
===================================================== */

function classificarTipo(tipo){

    const texto =
        normalizarTexto(
            tipo
        );


    if(
        texto.includes(
            "receber"
        )
    ){

        return {

            nome:
                "Contas a Receber",

            classe:
                "tipo-receber",

            icone:
                "🟢"

        };

    }


    if(
        texto.includes(
            "pagar"
        )
    ){

        return {

            nome:
                "Contas a Pagar",

            classe:
                "tipo-pagar",

            icone:
                "🔴"

        };

    }


    return {

        nome:
            tipo ||
            "Não informado",

        classe:
            "tipo-outro",

        icone:
            "⚪"

    };

}


/* =====================================================
   BAIXAR LANÇAMENTO
===================================================== */

async function baixarLancamento(
    botao,
    id
){

    if(
        !id
    ){

        alert(
            "Não foi possível identificar o lançamento."
        );

        return;

    }


    const confirmou =
        confirm(
            "Deseja realmente baixar este lançamento?"
        );


    if(
        !confirmou
    ){

        return;

    }


    const textoOriginal =
        botao.innerHTML;


    botao.disabled = true;

    botao.innerHTML = `
        <span class="spinner-pequeno"></span>
        Baixando...
    `;


    try{

        console.log(
            "Baixando lançamento:",
            id
        );


        const resposta =
            await chamarAPI(
                ACAO_BAIXAR,
                {
                    id:id
                }
            );


        console.log(
            "Resposta da baixa:",
            resposta
        );


        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta &&
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                    ? (
                        resposta.erro ||
                        resposta.mensagem
                    )
                    : "Não foi possível baixar o lançamento."
            );

        }


        mostrarMensagem(
            "Lançamento baixado com sucesso.",
            "sucesso"
        );


        /*
         * Remove também da lista original.
         */

        listaPendentes =
            listaPendentes.filter(
                function(item){

                    return String(
                        item.id
                    ) !== String(
                        id
                    );

                }
            );


        /*
         * Recria o filtro para refletir
         * os lançamentos restantes.
         */

        const filtroAtual =
            document.getElementById(
                "filtroDescricao"
            ).value;


        preencherFiltroDescricoes(
            listaPendentes
        );


        /*
         * Tenta manter o filtro selecionado.
         */

        const select =
            document.getElementById(
                "filtroDescricao"
            );


        const existe =
            Array.from(
                select.options
            ).some(
                function(option){

                    return option.value ===
                        filtroAtual;

                }
            );


        if(existe){

            select.value =
                filtroAtual;

        }
        else{

            select.value = "";

        }


        aplicarFiltroDescricao();

    }
    catch(erro){

        console.error(
            "Erro ao baixar:",
            erro
        );


        mostrarMensagem(
            obterMensagemErro(erro),
            "erro"
        );


        botao.disabled = false;

        botao.innerHTML =
            textoOriginal;

    }

}


/* =====================================================
   ATUALIZAR RESUMO APÓS BAIXA
===================================================== */

function atualizarResumoTabela(){

    const linhas =
        document.querySelectorAll(
            "#lista tr"
        );


    let quantidade = 0;

    let receber = 0;

    let pagar = 0;


    linhas.forEach(
        function(linha){

            const celulas =
                linha.querySelectorAll(
                    "td"
                );


            if(
                celulas.length < 8
            ){

                return;

            }


            quantidade++;


            const tipo =
                normalizarTexto(
                    celulas[2].textContent
                );


            const valor =
                converterNumero(
                    celulas[4].textContent
                );


            if(
                tipo.includes(
                    "receber"
                )
            ){

                receber += valor;

            }


            else if(
                tipo.includes(
                    "pagar"
                )
            ){

                pagar += valor;

            }

        }
    );


    document.getElementById(
        "totalPendentes"
    ).textContent =
        quantidade;


    document.getElementById(
        "totalReceber"
    ).textContent =
        formatarMoeda(
            receber
        );


    document.getElementById(
        "totalPagar"
    ).textContent =
        formatarMoeda(
            pagar
        );

}


/* =====================================================
   RESUMO
===================================================== */

function atualizarResumo(lista){

    let receber = 0;

    let pagar = 0;


    lista.forEach(
        function(item){

            const valor =
                converterNumero(
                    item.valor
                );


            const tipo =
                normalizarTexto(
                    item.tipo
                );


            if(
                tipo.includes(
                    "receber"
                )
            ){

                receber += valor;

            }


            else if(
                tipo.includes(
                    "pagar"
                )
            ){

                pagar += valor;

            }

        }
    );


    document.getElementById(
        "totalPendentes"
    ).textContent =
        lista.length;


    document.getElementById(
        "totalReceber"
    ).textContent =
        formatarMoeda(
            receber
        );


    document.getElementById(
        "totalPagar"
    ).textContent =
        formatarMoeda(
            pagar
        );

}


/* =====================================================
   ZERAR RESUMO
===================================================== */

function zerarResumo(){

    document.getElementById(
        "totalPendentes"
    ).textContent =
        "0";


    document.getElementById(
        "totalReceber"
    ).textContent =
        "R$ 0,00";


    document.getElementById(
        "totalPagar"
    ).textContent =
        "R$ 0,00";

}


/* =====================================================
   CONVERTER NÚMERO
===================================================== */

function converterNumero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return isFinite(valor)
            ? valor
            : 0;

    }


    let texto =
        String(valor)
        .trim()
        .replace(
            /R\$/gi,
            ""
        )
        .replace(
            /\s/g,
            ""
        );


    if(
        texto.indexOf(",") >= 0
    ){

        texto =
            texto.replace(
                /\./g,
                ""
            );


        texto =
            texto.replace(
                ",",
                "."
            );

    }


    const numero =
        Number(
            texto
        );


    return isFinite(numero)
        ? numero
        : 0;

}


/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatarMoeda(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(data){

    if(
        !data
    ){

        return "";

    }


    const texto =
        String(data).trim();


    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        return texto;

    }


    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("-");


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return texto;

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizarTexto(valor){

    return String(
        valor ?? ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .trim()
    .toLowerCase();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   ESCAPAR ATRIBUTO
===================================================== */

function escapeHtmlAttr(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /"/g,
        "&quot;"
    );

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tipo
){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " +
        (
            tipo ||
            "sucesso"
        );

}


function limparMensagem(){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        "";


    elemento.className =
        "mensagem";

}


/* =====================================================
   ERRO
===================================================== */

function obterMensagemErro(erro){

    if(
        erro &&
        erro.message
    ){

        return erro.message;

    }


    return String(
        erro ||
        "Erro desconhecido."
    );

}
