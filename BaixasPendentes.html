<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baixas Pendentes - Controle Financeiro</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f4f6f8;
    color:#333;
}

.container{
    max-width:1200px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

h2{
    margin:0;
    color:#c62828;
}

#tituloCompetencia{
    margin:0 0 20px;
    color:#555;
}

.acoes{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.btn{
    border:0;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-voltar{
    background:#546e7a;
    color:#fff;
}

.btn-voltar:hover{
    background:#455a64;
}

.btn-atualizar{
    background:#1565c0;
    color:#fff;
}

.btn-atualizar:hover{
    background:#0d47a1;
}

.area-tabela{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th{
    background:#c62828;
    color:#fff;
    padding:12px;
    text-align:center;
    white-space:nowrap;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tbody tr:hover{
    background:#f8f9fa;
}

.valor{
    text-align:right;
    font-weight:bold;
    white-space:nowrap;
}

.loading{
    text-align:center;
    padding:30px;
    color:#64748b;
    font-weight:bold;
}

.vazio{
    text-align:center;
    padding:30px;
    color:#64748b;
}

.erro{
    background:#ffebee;
    color:#c62828;
    font-weight:bold;
    text-align:center;
    padding:20px;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-pendente{
    background:#fff3e0;
    color:#e65100;
}

.mensagem{
    display:none;
    padding:12px 15px;
    margin-bottom:15px;
    border-radius:8px;
    font-weight:bold;
}

.mensagem.erro{
    display:block;
    background:#ffebee;
    color:#c62828;
}

.mensagem.sucesso{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.resumo{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
}

.card-resumo{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.card-resumo .titulo{
    font-size:13px;
    color:#64748b;
}

.card-resumo .valor{
    display:block;
    margin-top:5px;
    text-align:center;
    font-size:20px;
    color:#c62828;
}

.spinner{
    display:inline-block;
    width:22px;
    height:22px;
    border:3px solid #ddd;
    border-top-color:#c62828;
    border-radius:50%;
    animation:girar .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

@keyframes girar{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .container{
        padding:15px;
    }

    .resumo{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="topo">

        <h2>⚠️ Baixas Pendentes</h2>

        <button
            type="button"
            class="btn btn-voltar"
            onclick="voltarIndex()"
        >
            ← Voltar
        </button>

    </div>


    <h3 id="tituloCompetencia">
        Todas as competências
    </h3>


    <div class="acoes">

        <button
            type="button"
            class="btn btn-atualizar"
            onclick="carregar()"
        >
            🔄 Atualizar
        </button>

    </div>


    <div
        id="mensagem"
        class="mensagem"
    ></div>


    <div class="resumo">

        <div class="card-resumo">

            <span class="titulo">
                Pendências
            </span>

            <span
                class="valor"
                id="totalPendentes"
            >
                0
            </span>

        </div>


        <div class="card-resumo">

            <span class="titulo">
                Contas a Receber
            </span>

            <span
                class="valor"
                id="totalReceber"
            >
                R$ 0,00
            </span>

        </div>


        <div class="card-resumo">

            <span class="titulo">
                Contas a Pagar
            </span>

            <span
                class="valor"
                id="totalPagar"
            >
                R$ 0,00
            </span>

        </div>

    </div>


    <div class="area-tabela">

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Competência</th>
                    <th>Tipo</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Vencimento</th>
                    <th>Baixado</th>

                </tr>

            </thead>


            <tbody id="lista">

                <tr>

                    <td
                        colspan="7"
                        class="loading"
                    >

                        <span class="spinner"></span>

                        Carregando baixas pendentes...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbwlkjtWnOcvglZS2Ft6ydraSh4-JbTXH6C7irb6O5hYPvxYxqN0tYWQs2Ybi6mVWThN/exec";


let contadorCallback = 0;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        carregar();

    }
);


/* =====================================================
   CARREGAR BAIXAS PENDENTES
===================================================== */

async function carregar(){

    const corpo =
        document.getElementById("lista");

    const titulo =
        document.getElementById("tituloCompetencia");


    titulo.textContent =
        "Todas as competências";


    corpo.innerHTML = `
        <tr>
            <td colspan="7" class="loading">

                <span class="spinner"></span>

                Carregando baixas pendentes...

            </td>
        </tr>
    `;


    limparMensagem();


    /*
     * IMPORTANTE:
     *
     * NÃO enviamos competência.
     *
     * A API recebe somente:
     *
     * action=listarBaixasPendentes
     *
     * Portanto deve retornar todas
     * as baixas pendentes.
     */

    console.log(
        "Iniciando consulta de TODAS as baixas pendentes..."
    );


    try{

        const resposta =
            await chamarAPI(
                "listarBaixasPendentes",
                {}
            );


        console.log(
            "Resposta recebida:",
            resposta
        );


        if(
            !resposta
        ){

            throw new Error(
                "A API não retornou nenhuma resposta."
            );

        }


        if(
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta.erro ||
                resposta.mensagem ||
                "A API retornou um erro."
            );

        }


        const lista =
            obterLista(
                resposta
            );


        console.log(
            "Quantidade de pendências:",
            lista.length
        );


        mostrarLista(
            lista
        );


        atualizarResumo(
            lista
        );


    }
    catch(erro){

        console.error(
            "ERRO:",
            erro
        );


        corpo.innerHTML = `
            <tr>

                <td
                    colspan="7"
                    class="erro"
                >

                    ⚠️ ${escapeHtml(
                        obterMensagemErro(erro)
                    )}

                </td>

            </tr>
        `;


        atualizarResumo([]);


        mostrarMensagem(
            obterMensagemErro(erro),
            "erro"
        );

    }

}


/* =====================================================
   CHAMAR API - JSONP
===================================================== */

function chamarAPI(
    acao,
    parametros
){

    parametros =
        parametros || {};


    return new Promise(
        function(resolve,reject){

            contadorCallback++;


            const callback =
                "controleFinanceiroCallback_" +
                Date.now() +
                "_" +
                contadorCallback;


            const script =
                document.createElement(
                    "script"
                );


            let finalizado =
                false;


            let timeout =
                null;


            /*
             * LIMPAR
             */

            function limpar(){

                if(timeout){

                    clearTimeout(
                        timeout
                    );

                    timeout = null;

                }


                if(
                    script.parentNode
                ){

                    script.parentNode.removeChild(
                        script
                    );

                }


                try{

                    delete window[
                        callback
                    ];

                }
                catch(e){

                    window[
                        callback
                    ] = undefined;

                }

            }


            /*
             * FINALIZAR
             */

            function finalizar(
                funcao,
                valor
            ){

                if(
                    finalizado
                ){

                    return;

                }


                finalizado =
                    true;


                limpar();


                funcao(
                    valor
                );

            }


            /*
             * CALLBACK GLOBAL
             */

            window[
                callback
            ] =
                function(resposta){

                    console.log(
                        "JSONP recebido:",
                        resposta
                    );


                    finalizar(
                        resolve,
                        resposta
                    );

                };


            /*
             * MONTAR PARÂMETROS
             */

            const params =
                new URLSearchParams();


            params.set(
                "action",
                acao
            );


            params.set(
                "callback",
                callback
            );


            /*
             * Adiciona parâmetros extras,
             * se existirem.
             */

            Object.keys(
                parametros
            ).forEach(
                function(chave){

                    const valor =
                        parametros[chave];


                    if(
                        valor === null ||
                        valor === undefined ||
                        valor === ""
                    ){

                        return;

                    }


                    params.set(
                        chave,
                        String(valor)
                    );

                }
            );


            const separador =
                URL_API.indexOf("?") >= 0
                    ? "&"
                    : "?";


            const url =
                URL_API +
                separador +
                params.toString();


            console.log(
                "Chamando API:",
                url
            );


            /*
             * SCRIPT JSONP
             */

            script.async =
                true;


            script.src =
                url;


            /*
             * ERRO DE CARREGAMENTO
             */

            script.onerror =
                function(){

                    finalizar(
                        reject,
                        new Error(
                            "Não foi possível conectar ao Google Apps Script."
                        )
                    );

                };


            /*
             * TIMEOUT
             *
             * 60 segundos.
             */

            timeout =
                setTimeout(
                    function(){

                        finalizar(
                            reject,
                            new Error(
                                "A API demorou mais de 60 segundos para responder. Verifique o Apps Script."
                            )
                        );

                    },
                    60000
                );


            document.head.appendChild(
                script
            );

        }
    );

}


/* =====================================================
   OBTER LISTA DA RESPOSTA
===================================================== */

function obterLista(
    resposta
){

    /*
     * Caso a API retorne diretamente um array.
     */

    if(
        Array.isArray(
            resposta
        )
    ){

        return resposta;

    }


    /*
     * Possíveis nomes utilizados
     * pelo Apps Script.
     */

    const propriedades = [

        "lista",

        "baixasPendentes",

        "baixas",

        "lancamentos",

        "dados",

        "resultado"

    ];


    for(
        let i = 0;
        i < propriedades.length;
        i++
    ){

        const propriedade =
            propriedades[i];


        if(
            resposta &&
            Array.isArray(
                resposta[
                    propriedade
                ]
            )
        ){

            return resposta[
                propriedade
            ];

        }

    }


    /*
     * Se não encontrou array,
     * retorna vazio.
     */

    console.warn(
        "Nenhuma lista encontrada na resposta:",
        resposta
    );


    return [];

}


/* =====================================================
   MOSTRAR LISTA
===================================================== */

function mostrarLista(
    lista
){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML =
        "";


    if(
        !Array.isArray(lista) ||
        lista.length === 0
    ){

        corpo.innerHTML = `
            <tr>

                <td
                    colspan="7"
                    class="vazio"
                >

                    ✅ Nenhum lançamento pendente.

                </td>

            </tr>
        `;


        return;

    }


    /*
     * Faz uma cópia antes de ordenar.
     */

    const registros =
        [...lista];


    /*
     * Ordena por competência
     * e depois vencimento.
     */

    registros.sort(
        function(a,b){

            const compA =
                String(
                    a.competencia ?? ""
                );


            const compB =
                String(
                    b.competencia ?? ""
                );


            if(
                compA !== compB
            ){

                return compA.localeCompare(
                    compB
                );

            }


            const vencA =
                String(
                    a.vencimento ?? ""
                );


            const vencB =
                String(
                    b.vencimento ?? ""
                );


            return vencA.localeCompare(
                vencB
            );

        }
    );


    /*
     * Criar linhas.
     */

    registros.forEach(
        function(item){

            const valor =
                converterNumero(
                    item.valor
                );


            const linha =
                document.createElement(
                    "tr"
                );


            linha.innerHTML = `

                <td>
                    ${escapeHtml(
                        item.id
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        item.competencia
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        item.tipo
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        item.descricao
                    )}
                </td>


                <td class="valor">
                    ${formatarMoeda(
                        valor
                    )}
                </td>


                <td>
                    ${escapeHtml(
                        formatarData(
                            item.vencimento
                        )
                    )}
                </td>


                <td>

                    <span
                        class="badge badge-pendente"
                    >

                        ${escapeHtml(
                            item.baixado ||
                            "Não"
                        )}

                    </span>

                </td>

            `;


            corpo.appendChild(
                linha
            );

        }
    );

}


/* =====================================================
   RESUMO
===================================================== */

function atualizarResumo(
    lista
){

    let receber =
        0;


    let pagar =
        0;


    if(
        !Array.isArray(lista)
    ){

        lista =
            [];

    }


    lista.forEach(
        function(item){

            const valor =
                converterNumero(
                    item.valor
                );


            const tipo =
                normalizarTexto(
                    item.tipo
                );


            if(
                tipo ===
                "contas a receber"
            ){

                receber +=
                    valor;

            }


            else if(
                tipo ===
                "contas a pagar"
            ){

                pagar +=
                    valor;

            }

        }
    );


    document.getElementById(
        "totalPendentes"
    ).textContent =
        lista.length;


    document.getElementById(
        "totalReceber"
    ).textContent =
        formatarMoeda(
            receber
        );


    document.getElementById(
        "totalPagar"
    ).textContent =
        formatarMoeda(
            pagar
        );

}


/* =====================================================
   CONVERTER NÚMERO
===================================================== */

function converterNumero(
    valor
){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return isFinite(
            valor
        )
            ? valor
            : 0;

    }


    let texto =
        String(
            valor
        )
        .trim()
        .replace(
            /R\$/gi,
            ""
        )
        .replace(
            /\s/g,
            ""
        );


    if(
        texto.indexOf(",") >= 0
    ){

        texto =
            texto.replace(
                /\./g,
                ""
            );


        texto =
            texto.replace(
                ",",
                "."
            );

    }


    const numero =
        Number(
            texto
        );


    return isFinite(
        numero
    )
        ? numero
        : 0;

}


/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatarMoeda(
    valor
){

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
    data
){

    if(
        !data
    ){

        return "";

    }


    const texto =
        String(
            data
        ).trim();


    /*
     * DD/MM/AAAA
     */

    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        return texto;

    }


    /*
     * AAAA-MM-DD
     */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("-");


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return texto;

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizarTexto(
    valor
){

    return String(
        valor ?? ""
    )
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .trim()
    .toLowerCase();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(
    valor
){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tipo
){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " +
        (
            tipo ||
            "sucesso"
        );

}


function limparMensagem(){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.textContent =
        "";


    elemento.className =
        "mensagem";

}


/* =====================================================
   ERRO
===================================================== */

function obterMensagemErro(
    erro
){

    if(
        erro &&
        erro.message
    ){

        return erro.message;

    }


    return String(
        erro ||
        "Erro desconhecido."
    );

}


/* =====================================================
   VOLTAR
===================================================== */

function voltarIndex(){

    window.location.href =
        "./index.html";

}

</script>

</body>

</html>
