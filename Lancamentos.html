<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lançamentos - Controle Financeiro</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f4f6f8;
    padding:20px;
    color:#333;
}

.container{
    max-width:1500px;
    margin:0 auto;
    background:#fff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}


/* =====================================================
   TOPO
===================================================== */

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

h2{
    margin:0;
    color:#1976d2;
}

#tituloCompetencia{
    margin:0 0 20px 0;
    color:#555;
}


/* =====================================================
   BOTÕES
===================================================== */

button{
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    transition:.2s;
}

button:hover{
    opacity:.9;
    transform:translateY(-1px);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.voltar{
    background:#546e7a;
}

.baixar{
    background:#2e7d32;
}

.editar{
    background:#1565c0;
}

.excluir{
    background:#c62828;
}

.salvar{
    background:#2e7d32;
    width:100%;
    margin-top:10px;
}

.cancelar{
    background:#757575;
    width:100%;
    margin-top:8px;
}


/* =====================================================
   TABELA
===================================================== */

.tabela-container{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#1976d2;
    color:white;
    padding:10px;
    white-space:nowrap;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
    vertical-align:middle;
}

tbody tr:hover{
    background:#f7faff;
}

.receber{
    color:#2e7d32;
    font-weight:bold;
}

.pagar{
    color:#c62828;
    font-weight:bold;
}

.valor{
    font-weight:bold;
    text-align:right;
    white-space:nowrap;
}

.acoes{
    white-space:nowrap;
}

.acoes button{
    margin:2px;
    padding:7px 10px;
}

.vazio{
    text-align:center;
    padding:30px;
    color:#777;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    overflow:auto;
}

.modal-conteudo{
    background:white;
    width:90%;
    max-width:550px;
    margin:5% auto;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.modal-conteudo h2{
    margin-top:0;
    margin-bottom:20px;
}

.form-grupo{
    margin-bottom:15px;
}

.form-grupo label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    color:#444;
}

.form-grupo input,
.form-grupo select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    background:white;
}

.form-grupo input:focus,
.form-grupo select:focus{
    outline:none;
    border-color:#1976d2;
    box-shadow:0 0 0 2px rgba(25,118,210,.12);
}

.botoes-modal{
    margin-top:20px;
}


/* =====================================================
   CARREGAMENTO
===================================================== */

.carregando{
    text-align:center;
    padding:30px;
    color:#666;
}

.spinner{
    display:inline-block;
    width:25px;
    height:25px;
    border:3px solid #ddd;
    border-top-color:#1976d2;
    border-radius:50%;
    animation:girar .8s linear infinite;
    vertical-align:middle;
    margin-right:8px;
}

@keyframes girar{
    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   MENSAGEM
===================================================== */

.mensagem{
    display:none;
    padding:12px 15px;
    margin-bottom:15px;
    border-radius:8px;
    font-weight:bold;
}

.mensagem.sucesso{
    display:block;
    background:#e8f5e9;
    color:#2e7d32;
}

.mensagem.erro{
    display:block;
    background:#ffebee;
    color:#c62828;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:900px){

    body{
        padding:10px;
    }

    .container{
        padding:15px;
    }

    .modal-conteudo{
        margin:10% auto;
        padding:20px;
    }

}

</style>

</head>

<div class="container">


    <!-- ================================================
         TOPO
    ================================================= -->

    <div class="topo">

        <button

         MENSAGEM

    ================================================= -->

<!-- =====================================================
     MODAL EDITAR
===================================================== -->

<div
    id="modalEditar"
    class="modal"
    onclick="fecharModalFora(event)"
>


    <div
        class="modal-conteudo"
        onclick="event.stopPropagation()"
    >


        <h2>
            ✏️ Editar Lançamento
        </h2>


        <!-- ID -->

        <input

        <!-- COMPETÊNCIA -->

        <div class="form-grupo">

            <label for="editarCompetencia">

                Competência

            </label>

            <input
                type="month"

            >

        </div>


        <!-- TIPO -->

        <div class="form-grupo">

            <label for="editarTipo">

            </label>

            <select id="editarTipo">

                <option value="Contas a Receber">

                    Contas a Receber

                </option>

                <option value="Contas a Pagar">

                </option>

            </select>

        </div>


        <!-- DESCRIÇÃO -->

        <div class="form-grupo">

            <label for="editarDescricao">

            </label>

        <!-- VALOR -->

        <div class="form-grupo">

            <label for="editarValor">

            </label>

        <!-- VENCIMENTO -->

        <div class="form-grupo">

            <label for="editarVencimento">

            </label>

            <input
                type="date"
                id="editarVencimento"
            >

        <!-- BOTÕES -->

        <div class="botoes-modal">

            <button
                id="btnSalvar"

            <button
                id="btnCancelar"

                onclick="fecharModal()">

                Cancelar

            </button>

        </div>


    </div>

</div>



<script>

/* =====================================================
   CONFIGURAÇÃO DA API
===================================================== */

/*
 * URL DO SEU GOOGLE APPS SCRIPT
 */

const URL_API =
    "https://script.google.com/macros/s/AKfycbwsTRCPzDkf5qgxUb11oMynJ-gdXi2XgF-0ME6ASAto3zlGZi0qIDP9hAR4lKWwXwav/exec";

/* =====================================================
   URL DA PÁGINA INICIAL
===================================================== */

const URL_INICIO =
    "https://script.google.com/macros/s/AKfycbwT12x2vBm0PQZ9Cfn1btBZT3y5LplAY7ysMAAlPuAdJ7psZlJhTOwqKcWf7B6g82cI/exec";


/* =====================================================
   COMPETÊNCIA
===================================================== */

/*
 * No Google Apps Script você usava:
 *
 * <?= competencia ?>
 *
 * Isso NÃO funciona no GitHub.
 *
 * Agora a competência pode ser enviada pela URL:
 *
 * Lancamentos.html?competencia=2026-08
 *
 * ou:
 *
 * Lancamentos.html?competencia=08/2026
 *
 */

let competencia =
    obterParametroURL("competencia");


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        atualizarTitulo();

        carregar();

    }
);


/* =====================================================
   PEGAR PARÂMETRO DA URL
===================================================== */

function obterParametroURL(nome){

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    return (
        parametros.get(nome) || ""
    );

}


/* =====================================================
   ATUALIZAR TÍTULO
===================================================== */

function atualizarTitulo(){

    const elemento =
        document.getElementById(
            "tituloCompetencia"
        );


    if(!competencia){

        elemento.textContent =
            "Competência: Todas";

        return;

    }


    let comp =
        converterCompetenciaFrontend(
            competencia
        );


    elemento.textContent =
        "Competência: " +
        (
            comp || competencia
        );

}


/* =====================================================
   CONVERTER COMPETÊNCIA
===================================================== */

function converterCompetenciaFrontend(valor){

    if(!valor){

        return "";

    }


    const texto =
        String(valor).trim();


    /*
     * Já está no formato correto.
     */

    if(
        /^\d{4}-\d{2}$/.test(texto)
    ){

        return texto;

    }


    /*
     * Converte MM/YYYY
     * para YYYY-MM.
     */

    if(
        /^\d{2}\/\d{4}$/.test(texto)
    ){

        const partes =
            texto.split("/");


        return (
            partes[1] +
            "-" +
            partes[0]
        );

    }


    /*
     * Se vier uma data completa.
     */

    if(
        /^\d{4}-\d{2}-\d{2}/.test(texto)
    ){

        return texto.substring(
            0,
            7
        );

    }


    return texto;

}


/* =====================================================
   API JSONP
===================================================== */

/*
 * Como o HTML está no GitHub e a API está no
 * Google Apps Script, usamos JSONP.
 *
 * Isso evita o problema de CORS do navegador.
 */

let contadorCallback = 0;


function chamarAPI(
    acao,
    parametros = {}
){

    return new Promise(
        function(resolve, reject){

            contadorCallback++;


            const nomeCallback =
                "controleFinanceiroCallback_" +
                Date.now() +
                "_" +
                contadorCallback;


            const script =
                document.createElement(
                    "script"
                );


            let finalizado = false;


            /*
             * Função global temporária.
             */

            window[nomeCallback] =
                function(resposta){

                    if(finalizado){

                        return;

                    }


                    finalizado = true;


                    limpar();


                    resolve(
                        resposta
                    );

                };


            /*
             * Monta parâmetros.
             */

            const params =
                new URLSearchParams();


            params.set(
                "action",
                acao
            );


            params.set(
                "callback",
                nomeCallback
            );


            Object.keys(
                parametros
            ).forEach(
                function(chave){

                    const valor =
                        parametros[chave];


                    if(
                        valor !== undefined &&
                        valor !== null
                    ){

                        params.set(
                            chave,
                            valor
                        );

                    }

                }
            );


            /*
             * Timeout de segurança.
             */

            const timeout =
                setTimeout(
                    function(){

                        if(finalizado){

                            return;

                        }


                        finalizado = true;


                        limpar();


                        reject(
                            new Error(
                                "Tempo limite excedido ao conectar com a API."
                            )
                        );

                    },
                    20000
                );


            /*
             * Erro de carregamento do script.
             */

            script.onerror =
                function(){

                    if(finalizado){

                        return;

                    }


                    finalizado = true;


                    limpar();


                    reject(
                        new Error(
                            "Não foi possível conectar com o Google Apps Script."
                        )
                    );

                };


            /*
             * URL final.
             */

            script.src =
                URL_API +
                "?" +
                params.toString();


            document
                .body
                .appendChild(
                    script
                );


            /*
             * Limpeza.
             */

            function limpar(){

                clearTimeout(
                    timeout
                );


                if(script.parentNode){

                    script.parentNode.removeChild(
                        script
                    );

                }


                try{

                    delete window[
                        nomeCallback
                    ];

                }
                catch(e){

                    window[
                        nomeCallback
                    ] = undefined;

                }

            }

        }
    );

}


/* =====================================================
   CARREGAR LANÇAMENTOS
===================================================== */

async function carregar(){

    mostrarCarregando();


    try{

        const parametros = {};


        /*
         * A API aceita competência vazia.
         */

        if(competencia){

            parametros.competencia =
                converterCompetenciaFrontend(
                    competencia
                );

        }


        const resposta =
            await chamarAPI(
                "listarLancamentos",
                parametros
            );


        console.log(
            "Resposta da API:",
            resposta
        );


        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta &&
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                ?
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                :
                "Erro ao carregar lançamentos."
            );

        }


        const lista =
            Array.isArray(
                resposta.lista
            )
            ?
            resposta.lista
            :
            [];


        montarTabela(
            lista
        );


    }
    catch(erro){

        console.error(
            erro
        );


        mostrarErro(
            "Erro ao carregar lançamentos: " +
            obterMensagemErro(erro)
        );

    }

}


/* =====================================================
   MOSTRAR CARREGANDO
===================================================== */

function mostrarCarregando(){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML = `

        <tr>

            <td
                colspan="9"
                class="carregando">

                <span class="spinner"></span>

                Carregando lançamentos...

            </td>

        </tr>

    `;

}


/* =====================================================
   MONTAR TABELA
===================================================== */

function montarTabela(lista){

    const corpo =
        document.getElementById(
            "lista"
        );


    corpo.innerHTML = "";


    if(
        !lista ||
        lista.length === 0
    ){

        corpo.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="vazio">

                    Nenhum lançamento encontrado.

                </td>

            </tr>

        `;

        return;

    }


    lista.forEach(
        function(item){

            const classe =
                item.tipo ===
                "Contas a Receber"
                ?
                "receber"
                :
                "pagar";


            const linha =
                document.createElement(
                    "tr"
                );


            /*
             * Não usamos innerHTML com JSON.stringify
             * no onclick. O objeto fica armazenado
             * diretamente na função.
             */

            linha.innerHTML = `

                <td>
                    ${escaparHTML(item.id)}
                </td>

                <td>
                    ${escaparHTML(item.competencia || "")}
                </td>

                <td class="${classe}">
                    ${escaparHTML(item.tipo || "")}
                </td>

                <td>
                    ${escaparHTML(item.descricao || "")}
                </td>

                <td class="valor">
                    ${formatarValor(item.valor)}
                </td>

                <td>
                    ${escaparHTML(
                        formatarData(
                            item.vencimento
                        )
                    )}
                </td>

                <td>
                    ${escaparHTML(
                        item.baixado || ""
                    )}
                </td>

                <td>
                    ${escaparHTML(
                        formatarData(
                            item.dataBaixa
                        )
                    )}
                </td>

                <td class="acoes"></td>

            `;


            const acoes =
                linha.querySelector(
                    ".acoes"
                );


            /*
             * Botão editar
             */

            const btnEditar =
                document.createElement(
                    "button"
                );

            btnEditar.className =
                "editar";

            btnEditar.textContent =
                "✏️ Editar";

            btnEditar.onclick =
                function(){

                    abrirEditar(
                        item
                    );

                };


            /*
             * Botão baixar
             */

            const btnBaixar =
                document.createElement(
                    "button"
                );

            btnBaixar.className =
                "baixar";

            btnBaixar.textContent =
                "✔ Baixar";

            btnBaixar.onclick =
                function(){

                    baixar(
                        item.id
                    );

                };


            /*
             * Botão excluir
             */

            const btnExcluir =
                document.createElement(
                    "button"
                );

            btnExcluir.className =
                "excluir";

            btnExcluir.textContent =
                "🗑 Excluir";

            btnExcluir.onclick =
                function(){

                    excluir(
                        item.id
                    );

                };


            acoes.appendChild(
                btnEditar
            );

            acoes.appendChild(
                btnBaixar
            );

            acoes.appendChild(
                btnExcluir
            );


            corpo.appendChild(
                linha
            );

        }
    );

}


/* =====================================================
   ABRIR EDIÇÃO
===================================================== */

function abrirEditar(item){

    console.log(
        "Lançamento para edição:",
        item
    );


    document.getElementById(
        "editarId"
    ).value =
        item.id || "";


    document.getElementById(
        "editarCompetencia"
    ).value =
        converterCompetenciaFrontend(
            item.competencia || ""
        );


    document.getElementById(
        "editarTipo"
    ).value =
        item.tipo ||
        "Contas a Receber";


    document.getElementById(
        "editarDescricao"
    ).value =
        item.descricao || "";


    document.getElementById(
        "editarValor"
    ).value =
        normalizarValor(
            item.valor
        );


    document.getElementById(
        "editarVencimento"
    ).value =
        formatarDataInput(
            item.vencimento
        );


    document.getElementById(
        "modalEditar"
    ).style.display =
        "block";

}


/* =====================================================
   SALVAR EDIÇÃO
===================================================== */

async function salvarEdicao(){

    const id =
        document.getElementById(
            "editarId"
        ).value;


    const dados = {

        competencia:
            document.getElementById(
                "editarCompetencia"
            ).value.trim(),

        tipo:
            document.getElementById(
                "editarTipo"
            ).value,

        descricao:
            document.getElementById(
                "editarDescricao"
            ).value.trim(),

        valor:
            document.getElementById(
                "editarValor"
            ).value,

        vencimento:
            document.getElementById(
                "editarVencimento"
            ).value

    };


    /*
     * Validação ID
     */

    if(!id){

        mostrarErro(
            "ID do lançamento não informado."
        );

        return;

    }


    /*
     * Competência
     */

    dados.competencia =
        converterCompetenciaFrontend(
            dados.competencia
        );


    if(
        !/^\d{4}-\d{2}$/.test(
            dados.competencia
        )
    ){

        mostrarErro(
            "Informe uma competência válida."
        );

        return;

    }


    /*
     * Descrição
     */

    if(!dados.descricao){

        mostrarErro(
            "Informe a descrição do lançamento."
        );

        return;

    }


    /*
     * Valor
     */

    if(
        dados.valor === "" ||
        Number(dados.valor) < 0 ||
        !isFinite(
            Number(dados.valor)
        )
    ){

        mostrarErro(
            "Informe um valor válido."
        );

        return;

    }


    /*
     * Desabilitar botões
     */

    alterarEstadoModal(
        true
    );


    try{

        const resposta =
            await chamarAPI(
                "editarLancamento",
                {

                    id:
                        id,

                    competencia:
                        dados.competencia,

                    tipo:
                        dados.tipo,

                    descricao:
                        dados.descricao,

                    valor:
                        dados.valor,

                    vencimento:
                        dados.vencimento

                }
            );


        console.log(
            "Resposta edição:",
            resposta
        );


        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta &&
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                ?
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                :
                "Não foi possível alterar o lançamento."
            );

        }


        fecharModal();


        mostrarSucesso(
            resposta.mensagem ||
            "Lançamento alterado com sucesso."
        );


        /*
         * Atualiza tabela.
         */

        competencia =
            dados.competencia;


        atualizarTitulo();


        await carregar();

    }
    catch(erro){

        console.error(
            erro
        );


        mostrarErro(
            "Erro ao editar: " +
            obterMensagemErro(erro)
        );

    }
    finally{

        alterarEstadoModal(
            false
        );

    }

}


/* =====================================================
   ALTERAR ESTADO MODAL
===================================================== */

function alterarEstadoModal(

===================================================== */

async function baixar(id){

    if(
        !confirm(
            "Deseja baixar este lançamento?"
        )
    ){

        return;

    }


    console.log(
        "ID enviado para baixar:",
        id
    );


    try{

        const resposta =
            await chamarAPI(
                "baixarLancamento",
                {

                    id:
                        id

                }
            );


        console.log(
            "Resposta baixar:",
            resposta
        );


        if(
            !resposta ||
            resposta.sucesso !== true
        ){

            throw new Error(
                resposta &&
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                ?
                (
                    resposta.erro ||
                    resposta.mensagem
                )
                :
                "Lançamento não encontrado."
            );

        }


        mostrarSucesso(
            resposta.mensagem ||
            "Lançamento baixado com sucesso."
        );


        await carregar();

    }
    catch(erro){

        console.error(
            erro
        );


        mostrarErro(
            "Erro ao baixar: " +
            obterMensagemErro(erro)
        );

    }

}

/* =====================================================
   MOEDA
===================================================== */

function formatarValor(valor){

    const numero =
        Number(valor || 0);


    return numero.toLocaleString(
        "pt-BR",
        {

            style:"currency",

            currency:"BRL"

        }
    );

}


/* =====================================================
   NORMALIZAR VALOR
===================================================== */

function normalizarValor(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return "";

    }


    if(
        typeof valor === "number"
    ){

        return valor;

    }


    let texto =
        String(valor).trim();


    texto =
        texto.replace(
            /R\$\s?/g,
            ""
        );


    /*
     * Se tiver formato brasileiro:
     *
     * 1.234,56
     *
     * transforma em:
     *
     * 1234.56
     */

    if(
        texto.includes(",")
    ){

        texto =
            texto.replace(
                /\./g,
                ""
            );


        texto =
            texto.replace(
                ",",
                "."
            );

    }


    const numero =
        parseFloat(
            texto
        );


    return isNaN(numero)
        ?
        ""
        :
        numero;

}


/* =====================================================
   DATA PARA INPUT DATE
===================================================== */

function formatarDataInput(data){

    if(!data){

        return "";

    }


    const texto =
        String(data).trim();


    /*
     * YYYY-MM-DD
     */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){

        return texto;

    }


    /*
     * DD/MM/YYYY
     */

    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("/");


        return (
            partes[2] +
            "-" +
            partes[1] +
            "-" +
            partes[0]
        );

    }


    /*
     * Tenta Date.
     */

    const dataObj =
        new Date(data);


    if(
        isNaN(
            dataObj.getTime()
        )
    ){

        return "";

    }


    /*
     * Evita problemas de timezone
     * usando os componentes locais.
     */

    const ano =
        dataObj.getFullYear();


    const mes =
        String(
            dataObj.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dia =
        String(
            dataObj.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        ano +
        "-" +
        mes +
        "-" +
        dia
    );

}


/* =====================================================
   FORMATAR DATA PARA EXIBIÇÃO
===================================================== */

function formatarData(data){

    if(!data){

        return "";

    }


    const texto =
        String(data).trim();


    /*
     * DD/MM/YYYY
     */

    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(
            texto
        )
    ){

        return texto;

    }


    /*
     * YYYY-MM-DD
     */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            texto
        )
    ){

        const partes =
            texto.split("-");


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return texto;

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }


    return String(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   MENSAGEM DE SUCESSO
===================================================== */

function mostrarSucesso(texto){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.className =
        "mensagem sucesso";


    elemento.textContent =
        "✓ " + texto;


    setTimeout(
        function(){

            elemento.className =
                "mensagem";

        },
        4000
    );

}


/* =====================================================
   MENSAGEM DE ERRO
===================================================== */

function mostrarErro(texto){

    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.className =
        "mensagem erro";


    elemento.textContent =
        "⚠ " + texto;


    window.scrollTo(
        {
            top:0,
            behavior:"smooth"
        }
    );

}


/* =====================================================
   OBTER MENSAGEM DE ERRO
===================================================== */

function obterMensagemErro(erro){

    if(
        erro &&
        erro.message
    ){

        return erro.message;

    }


    return String(
        erro || "Erro desconhecido."
    );

}
