/* =====================================================
CONFIGURAÇÃO DA API
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbwsTRCPzDkf5qgxUb11oMynJ-gdXi2XgF-0ME6ASAto3zlGZi0qIDP9hAR4lKWwXwav/exec";

/* =====================================================
URL DA PÁGINA INICIAL
===================================================== */

const URL_INICIO =
"https://script.google.com/macros/s/AKfycbwT12x2vBm0PQZ9Cfn1btBZT3y5LplAY7ysMAAlPuAdJ7psZlJhTOwqKcWf7B6g82cI/exec";

/* =====================================================
COMPETÊNCIA
===================================================== */

let competencia =
obterParametroURL("competencia");

/* =====================================================
MODO DA PÁGINA
===================================================== */

const modo =
obterParametroURL("modo");

const parametroNovo =
obterParametroURL("novo");

/* =====================================================
INICIALIZAÇÃO
===================================================== */

document.addEventListener(
"DOMContentLoaded",
function(){

    /*
     * Se não recebeu competência,
     * usa a competência atual.
     */

    if(!competencia){

        competencia =
            competenciaAtual();

    }


    competencia =
        converterCompetenciaFrontend(
            competencia
        );


    atualizarTitulo();


    /*
     * Carrega os lançamentos.
     */

    carregar();


    /*
     * Se a página foi chamada com:
     *
     * modo=novo
     *
     * ou
     *
     * novo=1
     *
     * abre automaticamente o formulário.
     */

    if(
        modo === "novo" ||
        parametroNovo === "1"
    ){

        setTimeout(
            function(){

                abrirNovoLancamento();

            },
            300
        );

    }

}

);

/* =====================================================
COMPETÊNCIA ATUAL
===================================================== */

function competenciaAtual(){

const agora =
    new Date();


const ano =
    agora.getFullYear();


const mes =
    String(
        agora.getMonth() + 1
    ).padStart(
        2,
        "0"
    );


return (
    ano +
    "-" +
    mes
);

}

/* =====================================================
PEGAR PARÂMETRO DA URL
===================================================== */

function obterParametroURL(nome){

const parametros =
    new URLSearchParams(
        window.location.search
    );


return (
    parametros.get(nome) || ""
);

}

/* =====================================================
ATUALIZAR TÍTULO
===================================================== */

function atualizarTitulo(){

const elemento =
    document.getElementById(
        "tituloCompetencia"
    );


if(!competencia){

    elemento.textContent =
        "Competência: Todas";

    return;

}


const comp =
    converterCompetenciaFrontend(
        competencia
    );


elemento.textContent =
    "Competência: " +
    (
        comp || competencia
    );

}

/* =====================================================
CONVERTER COMPETÊNCIA
===================================================== */

function converterCompetenciaFrontend(valor){

if(!valor){

    return "";

}


const texto =
    String(valor).trim();


/*
 * YYYY-MM
 */

if(
    /^\d{4}-\d{2}$/.test(
        texto
    )
){

    return texto;

}


/*
 * MM/YYYY
 */

if(
    /^\d{2}\/\d{4}$/.test(
        texto
    )
){

    const partes =
        texto.split("/");


    return (
        partes[1] +
        "-" +
        partes[0]
    );

}


/*
 * YYYY-MM-DD
 */

if(
    /^\d{4}-\d{2}-\d{2}/.test(
        texto
    )
){

    return texto.substring(
        0,
        7
    );

}


return texto;

}

/* =====================================================
API JSONP
===================================================== */

let contadorCallback = 0;

function chamarAPI(
acao,
parametros = {}
){

return new Promise(
    function(resolve, reject){

        contadorCallback++;


        const nomeCallback =
            "controleFinanceiroCallback_" +
            Date.now() +
            "_" +
            contadorCallback;


        const script =
            document.createElement(
                "script"
            );


        let finalizado =
            false;


        window[nomeCallback] =
            function(resposta){

                if(finalizado){

                    return;

                }


                finalizado =
                    true;


                limpar();


                resolve(
                    resposta
                );

            };


        const params =
            new URLSearchParams();


        params.set(
            "action",
            acao
        );


        params.set(
            "callback",
            nomeCallback
        );


        Object.keys(
            parametros
        ).forEach(
            function(chave){

                const valor =
                    parametros[chave];


                if(
                    valor !== undefined &&
                    valor !== null
                ){

                    params.set(
                        chave,
                        valor
                    );

                }

            }
        );


        const timeout =
            setTimeout(
                function(){

                    if(finalizado){

                        return;

                    }


                    finalizado =
                        true;


                    limpar();


                    reject(
                        new Error(
                            "Tempo limite excedido ao conectar com a API."
                        )
                    );

                },
                20000
            );


        script.onerror =
            function(){

                if(finalizado){

                    return;

                }


                finalizado =
                    true;


                limpar();


                reject(
                    new Error(
                        "Não foi possível conectar com o Google Apps Script."
                    )
                );

            };


        script.src =
            URL_API +
            "?" +
            params.toString();


        document
            .body
            .appendChild(
                script
            );


        function limpar(){

            clearTimeout(
                timeout
            );


            if(script.parentNode){

                script.parentNode.removeChild(
                    script
                );

            }


            try{

                delete window[
                    nomeCallback
                ];

            }
            catch(e){

                window[
                    nomeCallback
                ] = undefined;

            }

        }

    }
);

}

/* =====================================================
CARREGAR LANÇAMENTOS
===================================================== */

async function carregar(){

mostrarCarregando();


try{

    const parametros = {};


    if(competencia){

        parametros.competencia =
            converterCompetenciaFrontend(
                competencia
            );

    }


    const resposta =
        await chamarAPI(
            "listarLancamentos",
            parametros
        );


    console.log(
        "Resposta da API:",
        resposta
    );


    if(
        !resposta ||
        resposta.sucesso !== true
    ){

        throw new Error(
            resposta &&
            (
                resposta.erro ||
                resposta.mensagem
            )
            ?
            (
                resposta.erro ||
                resposta.mensagem
            )
            :
            "Erro ao carregar lançamentos."
        );

    }


    const lista =
        Array.isArray(
            resposta.lista
        )
        ?
        resposta.lista
        :
        [];


    montarTabela(
        lista
    );


}
catch(erro){

    console.error(
        erro
    );


    mostrarErro(
        "Erro ao carregar lançamentos: " +
        obterMensagemErro(erro)
    );

}

}

/* =====================================================
MONTAR TABELA
===================================================== */

function montarTabela(lista){

const corpo =
    document.getElementById(
        "lista"
    );


corpo.innerHTML = "";


if(
    !lista ||
    lista.length === 0
){

    corpo.innerHTML = `

        <tr>

}


/*
 * =================================================
 * ORDENAÇÃO ALFABÉTICA PELO CAMPO TIPO
 * =================================================
 *
 * Ordem:
 *
 * Contas a Pagar
 * Contas a Receber
 *
 * A ordenação funciona também para outros
 * tipos que possam ser adicionados futuramente.
 */

lista.sort(
    function(a, b){

        const tipoA =
            String(
                a.tipo || ""
            )
            .trim();


        const tipoB =
            String(
                b.tipo || ""
            )
            .trim();


        return tipoA.localeCompare(
            tipoB,
            "pt-BR",
            {
                sensitivity:"base"
            }
        );

    }
);


/*
 * Monta as linhas.
 */

lista.forEach(
    function(item){

        const tipoNormalizado =
            String(
                item.tipo || ""
            )
            .trim()
            .toLowerCase();


        const classe =
            tipoNormalizado ===
            "contas a receber"
            ?
            "receber"
            :
            "pagar";

            document.createElement(
                "tr"

                )}
            </td>

            <td class="valor">

                    item.valor
                )}
            </td>

                ${escaparHTML(

            </td>

            </td>

            <td class="acoes"></td>

        `;


        const acoes =
            linha.querySelector(
                ".acoes"
            );


        /*
         * =================================================
         * BOTÃO EDITAR
         * =================================================
         */

        const btnEditar =
            document.createElement(
                "button"
            );

            "editar";


        btnEditar.textContent =
            "✏️ Editar";


        btnEditar.onclick =

                );

            };


        /*

         */

            );

        /*

        btnExcluir.className =

);

}

        ).value.trim(),

        document.getElementById(
            "editarTipo"
        ).value,

    descricao:
        document.getElementById(
            "editarDescricao"
        ).value.trim(),

    valor:
        document.getElementById(
            "editarValor"
        ).value,

    vencimento:
        document.getElementById(
            "editarVencimento"
        ).value

};


/*
 * =================================================
 * VALIDAÇÃO DA COMPETÊNCIA
 * =================================================
 */

dados.competencia =
    converterCompetenciaFrontend(
        dados.competencia
    );


if(
    !/^\d{4}-\d{2}$/.test(
        dados.competencia
    )
){

    mostrarErro(
        "Informe uma competência válida."
    );

    return;

}


/*
 * =================================================
 * VALIDAÇÃO DO TIPO
 * =================================================
 */

if(
    dados.tipo !==
    "Contas a Receber" &&
    dados.tipo !==
    "Contas a Pagar"
){

    mostrarErro(
        "Selecione um tipo válido."
    );

    return;

}


/*
 * =================================================
 * VALIDAÇÃO DA DESCRIÇÃO
 * =================================================
 */

if(!dados.descricao){

    mostrarErro(
        "Informe a descrição do lançamento."
    );

    document.getElementById(
        "editarDescricao"
    ).focus();

    return;

}


/*
 * =================================================
 * VALIDAÇÃO DO VALOR
 * =================================================
 */

if(
    dados.valor === "" ||
    Number(dados.valor) < 0 ||
    !isFinite(
        Number(dados.valor)
    )
){

    mostrarErro(
        "Informe um valor válido."
    );

    document.getElementById(
        "editarValor"
    ).focus();

    return;

}


/*
 * =================================================
 * DESABILITAR BOTÕES
 * =================================================
 */

alterarEstadoModal(
    true
);


try{

    let resposta;


    /*
     * =================================================
     * NOVO LANÇAMENTO
     * =================================================
     */

    if(!id){

        console.log(
            "Incluindo lançamento:",
            dados
        );


        resposta =
            await chamarAPI(
                "incluirLancamento",
                {

                    competencia:
                        dados.competencia,

                    tipo:
                        dados.tipo,

                    descricao:
                        dados.descricao,

                    valor:
                        dados.valor,

                    vencimento:
                        dados.vencimento

                }
            );

    }


    /*
     * =================================================
     * EDIÇÃO
     * =================================================
     */

    else{

        console.log(
            "Editando lançamento:",
            dados
        );


        resposta =
            await chamarAPI(
                "editarLancamento",
                {

                    id:
                        id,

                    competencia:
                        dados.competencia,

                    tipo:
                        dados.tipo,

                    descricao:
                        dados.descricao,

                    valor:
                        dados.valor,

                    vencimento:
                        dados.vencimento

                }
            );

    }


    console.log(
        "Resposta salvar:",
        resposta
    );


    /*
     * =================================================
     * VALIDAR RESPOSTA
     * =================================================
     */

    if(
        !resposta ||
        resposta.sucesso !== true
    ){

        throw new Error(
            resposta &&
            (
                resposta.erro ||
                resposta.mensagem
            )
            ?
            (
                resposta.erro ||
                resposta.mensagem
            )
            :
            (
                id
                ?
                "Não foi possível alterar o lançamento."
                :
                "Não foi possível incluir o lançamento."
            )
        );

    }


    /*
     * =================================================
     * FECHAR MODAL
     * =================================================
     */

    fecharModal();


    /*
     * =================================================
     * ATUALIZAR COMPETÊNCIA
     * =================================================
     */

    competencia =
        dados.competencia;


    atualizarTitulo();


    /*
     * =================================================
     * MENSAGEM
     * =================================================
     */

    mostrarSucesso(
        resposta.mensagem ||
        (
            id
            ?
            "Lançamento alterado com sucesso."
            :
            "Lançamento incluído com sucesso."
        )
    );


    /*
     * =================================================
     * ATUALIZAR TABELA
     * =================================================
     */

    await carregar();

}
catch(erro){

    console.error(
        erro
    );


    mostrarErro(
        (
            id
            ?
            "Erro ao editar: "
            :
            "Erro ao incluir: "
        ) +
        obterMensagemErro(erro)
    );

}
finally{

    alterarEstadoModal(
        false
    );

}

}

/* =====================================================
MOEDA
===================================================== */

function formatarValor(valor){

const numero =
    Number(valor || 0);

return numero.toLocaleString(
    "pt-BR",
    {

        style:"currency",

        currency:"BRL"

    }
);

}

/* =====================================================
NORMALIZAR VALOR
===================================================== */

function normalizarValor(valor){

if(
    valor === null ||
    valor === undefined ||
    valor === ""
){

    return "";

}

if(
    typeof valor === "number"
){

    return valor;

}

let texto =
    String(valor).trim();

texto =
    texto.replace(
        /R\$\s?/g,
        ""
    );

/*
 * Formato brasileiro:
 *
 * 1.234,56
 *
 * transforma em:
 *
 * 1234.56
 */

if(
    texto.includes(",")
){

    texto =
        texto.replace(
            /\./g,
            ""
        );

    texto =
        texto.replace(
            ",",
            "."
        );

}

const numero =
    parseFloat(
        texto
    );

return isNaN(numero)
    ?
    ""
    :
    numero;

}

/* =====================================================
DATA PARA INPUT DATE
===================================================== */

function formatarDataInput(data){

if(!data){

    return "";

}

const texto =
    String(data).trim();

/*
 * YYYY-MM-DD
 */

if(
    /^\d{4}-\d{2}-\d{2}$/.test(
        texto
    )
){

    return texto;

}

/*
 * DD/MM/YYYY
 */

if(
    /^\d{2}\/\d{2}\/\d{4}$/.test(
        texto
    )
){

    const partes =
        texto.split("/");

    return (
        partes[2] +
        "-" +
        partes[1] +
        "-" +
        partes[0]
    );

}

/*
 * Tenta Date.
 */

const dataObj =
    new Date(data);

if(
    isNaN(
        dataObj.getTime()
    )
){

    return "";

}

const ano =
    dataObj.getFullYear();

const mes =
    String(
        dataObj.getMonth() + 1
    ).padStart(
        2,
        "0"
    );

const dia =
    String(
        dataObj.getDate()
    ).padStart(
        2,
        "0"
    );

return (
    ano +
    "-" +
    mes +
    "-" +
    dia
);

}

/* =====================================================
FORMATAR DATA PARA EXIBIÇÃO
===================================================== */

function formatarData(data){

if(!data){

    return "";

}

const texto =
    String(data).trim();

/*
 * DD/MM/YYYY
 */

if(
    /^\d{2}\/\d{2}\/\d{4}$/.test(
        texto
    )
){

    return texto;

}

/*
 * YYYY-MM-DD
 */

if(
    /^\d{4}-\d{2}-\d{2}$/.test(
        texto
    )
){

    const partes =
        texto.split("-");

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}

return texto;

}

/* =====================================================
ESCAPAR HTML
===================================================== */

function escaparHTML(valor){

if(
    valor === null ||
    valor === undefined
){

    return "";

}

return String(valor)
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

function mostrarSucesso(texto){

elemento.textContent =

        elemento.className =

        elemento.style.display =

    },

);

}

MENSAGEM DE ERRO

const elemento =

elemento.className =

    }
);

}

/* =====================================================
OBTER MENSAGEM DE ERRO
===================================================== */

function obterMensagemErro(erro){

if(
    erro &&
    erro.message
){

    return erro.message;

}

return String(
    erro || "Erro desconhecido."
);

}
