<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Financeiro</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #f4f7fb 0%, #eef3f9 100%);
  color: #1f2937;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding: 30px 18px 40px;
}

.card {
  background: #ffffff;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
  border: 1px solid #e5eaf0;
}

/* =====================================================
   CABEÇALHO
   ===================================================== */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 28px;
}

.titulo {
  margin: 0;
  color: #17365d;
  font-size: 28px;
  font-weight: 700;
}

.subtitulo {
  margin-top: 7px;
  color: #64748b;
  font-size: 14px;
}

/* =====================================================
   STATUS
   ===================================================== */

.status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 13px;
  border-radius: 20px;
  background: #f1f5f9;
  color: #64748b;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #94a3b8;
}

.status.online {
  background: #ecfdf3;
  color: #166534;
}

.status.online::before {
  background: #22c55e;
}

.status.erro {
  background: #fef2f2;
  color: #991b1b;
}

.status.erro::before {
  background: #ef4444;
}

/* =====================================================
   COMPETÊNCIA
   ===================================================== */

.competencia-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 22px;
}

.competencia-label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  font-weight: 700;
  color: #475569;
}

.competencia-linha {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

#competencia {
  width: 210px;
  padding: 11px 13px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  background: #ffffff;
  color: #1e293b;
  font-size: 15px;
  outline: none;
}

#competencia:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
}

.btn-atualizar {
  border: 0;
  border-radius: 9px;
  padding: 11px 17px;
  background: #17365d;
  color: #ffffff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
}

.btn-atualizar:hover {
  background: #214c7d;
  transform: translateY(-1px);
}

/* =====================================================
   TÍTULOS
   ===================================================== */

.secao-titulo {
  margin: 25px 0 14px;
  color: #17365d;
  font-size: 18px;
  font-weight: 700;
}

/* =====================================================
   RESUMO
   ===================================================== */

.resumo {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 28px;
}

.resumo-card {
  min-height: 105px;
  padding: 17px;
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  background: #ffffff;
  box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
}

.resumo-label {
  color: #64748b;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 10px;
}

.resumo-valor {
  color: #17365d;
  font-size: 21px;
  font-weight: 700;
  word-break: break-word;
}

/* =====================================================
   MENU
   ===================================================== */

.menu {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.menu-item {
  width: 100%;
  min-height: 125px;
  border: 0;
  border-radius: 14px;
  padding: 20px 15px;
  background: #17365d;
  color: #ffffff;
  cursor: pointer;
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  transition:
    transform .18s ease,
    background .18s ease,
    box-shadow .18s ease;
}

.menu-item:hover {
  background: #214c7d;
  transform: translateY(-2px);
  box-shadow: 0 7px 18px rgba(23, 54, 93, 0.18);
}

.menu-item:active {
  transform: translateY(0);
}

.menu-item:disabled {
  opacity: .65;
  cursor: wait;
  transform: none;
}

.menu-icone {
  display: block;
  font-size: 31px;
  line-height: 1;
  margin-bottom: 12px;
}

.menu-descricao {
  display: block;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 400;
  opacity: .80;
}

/* =====================================================
   MENSAGEM
   ===================================================== */

.mensagem {
  display: none;
  margin-top: 20px;
  padding: 13px 15px;
  border-radius: 9px;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  color: #9a3412;
  font-size: 14px;
}

.mensagem.erro {
  background: #fef2f2;
  border-color: #fecaca;
  color: #991b1b;
}

.mensagem.sucesso {
  background: #f0fdf4;
  border-color: #bbf7d0;
  color: #166534;
}

/* =====================================================
   RODAPÉ
   ===================================================== */

.rodape {
  margin-top: 25px;
  padding-top: 17px;
  border-top: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  color: #94a3b8;
  font-size: 12px;
}

/* =====================================================
   RESPONSIVO
   ===================================================== */

@media (max-width: 850px) {

  .resumo {
    grid-template-columns: repeat(2, 1fr);
  }

  .menu {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 560px) {

  .container {
    padding: 15px 10px 25px;
  }

  .card {
    padding: 18px;
  }

  .header {
    align-items: flex-start;
    flex-direction: column;
  }

  .titulo {
    font-size: 24px;
  }

  .resumo {
    grid-template-columns: 1fr;
  }

  .menu {
    grid-template-columns: 1fr;
  }

  .menu-item {
    min-height: 105px;
  }

  .competencia-linha {
    align-items: stretch;
    flex-direction: column;
  }

  #competencia {
    width: 100%;
  }

  .btn-atualizar {
    width: 100%;
  }

  .rodape {
    flex-direction: column;
    align-items: flex-start;
  }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<!-- =====================================================
     CABEÇALHO
     ===================================================== -->

<div class="header">

<div>

<h1 class="titulo">
Controle Financeiro
</h1>

<div class="subtitulo">
Gestão de lançamentos e fluxo financeiro
</div>

</div>

<div
id="status"
class="status"
>
Conectando...
</div>

</div>

<!-- =====================================================
     COMPETÊNCIA
     ===================================================== -->

<div class="competencia-box">

<label
class="competencia-label"
for="competencia"

>

Competência </label>

<div class="competencia-linha">

<input
id="competencia"
type="month"
title="Selecione a competência"

>

<button
type="button"
class="btn-atualizar"
id="btnAtualizar"
onclick="carregarResumo()"

>

↻ Atualizar </button>

</div>

</div>

<!-- =====================================================
     RESUMO
     ===================================================== -->

<div class="secao-titulo">
Resumo da Competência
</div>

<div class="resumo">

<div class="resumo-card">

<div class="resumo-label">
SALDO INICIAL
</div>

<div
id="saldoInicial"
class="resumo-valor"
>
R$ 0,00
</div>

</div>

<div class="resumo-card">

<div class="resumo-label">
A RECEBER
</div>

<div
id="receber"
class="resumo-valor"
>
R$ 0,00
</div>

</div>

<div class="resumo-card">

<div class="resumo-label">
A PAGAR
</div>

<div
id="pagar"
class="resumo-valor"
>
R$ 0,00
</div>

</div>

<div class="resumo-card">

<div class="resumo-label">
SALDO BANCÁRIO
</div>

<div
id="saldoBanco"
class="resumo-valor"
>
R$ 0,00
</div>

</div>

</div>

<!-- =====================================================
     MENU
     ===================================================== -->

<div class="secao-titulo">
Rotinas
</div>

<div class="menu">

<button
type="button"
class="menu-item"
onclick="abrirPagina('lancamentos')"

>

<span class="menu-icone">
📋
</span>

Lançamentos

<span class="menu-descricao">
Incluir, editar, excluir e consultar
</span>

</button>

<button
type="button"
class="menu-item"
onclick="abrirPagina('pendentes')"

>

<span class="menu-icone">
⏳
</span>

Baixas Pendentes

<span class="menu-descricao">
Consultar lançamentos pendentes
</span>

</button>

<button
type="button"
class="menu-item"
onclick="abrirPagina('relatorio')"

>

<span class="menu-icone">
📊
</span>

Relatório Financeiro

<span class="menu-descricao">
Visualizar relatório da competência
</span>

</button>

<button
type="button"
class="menu-item"
onclick="abrirPagina('graficos')"

>

<span class="menu-icone">
📈
</span>

Gráficos

<span class="menu-descricao">
Análise visual dos dados financeiros
</span>

</button>

<button
type="button"
class="menu-item"
onclick="abrirPagina('atendimento')"

>

<span class="menu-icone">
👤
</span>

Atendimento

<span class="menu-descricao">
Pesquisa e registro de atendimento
</span>

</button>

<button
type="button"
class="menu-item"
onclick="abrirPagina('lancamentos')"

>

<span class="menu-icone">
➕
</span>

Novo Lançamento

<span class="menu-descricao">
Acessar a rotina de lançamentos
</span>

</button>

</div>

<!-- =====================================================
     MENSAGEM
     ===================================================== -->

<div
id="mensagem"
class="mensagem"
></div>

<!-- =====================================================
     RODAPÉ
     ===================================================== -->

<div class="rodape">

<span>
Controle Financeiro
</span>

<span>
GitHub Pages + Google Apps Script
</span>

</div>

</div>

</div>

<script>

/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */

const URL_API =
  'https://script.google.com/macros/s/AKfycbwsTRCPzDkf5qgxUb11oMynJ-gdXi2XgF-0ME6ASAto3zlGZi0qIDP9hAR4lKWwXwav/exec';


/* =========================================================
   ELEMENTOS
   ========================================================= */

const statusEl =
  document.getElementById('status');

const mensagemEl =
  document.getElementById('mensagem');

const competenciaEl =
  document.getElementById('competencia');

const btnAtualizar =
  document.getElementById('btnAtualizar');


/* =========================================================
   COMPETÊNCIA ATUAL
   ========================================================= */

function competenciaAtual() {

  const agora = new Date();

  const ano =
    agora.getFullYear();

  const mes =
    String(
      agora.getMonth() + 1
    ).padStart(2, '0');

  return ano + '-' + mes;

}


/* =========================================================
   DEFINIR COMPETÊNCIA
   ========================================================= */

competenciaEl.value =
  competenciaAtual();


/* =========================================================
   MOEDA
   ========================================================= */

function moeda(valor) {

  const numero =
    Number(valor || 0);

  return numero.toLocaleString(
    'pt-BR',
    {
      style: 'currency',
      currency: 'BRL'
    }
  );

}


/* =========================================================
   MENSAGEM
   ========================================================= */

function mostrarMensagem(
  texto,
  tipo
) {

  mensagemEl.textContent =
    texto || '';

  mensagemEl.className =
    'mensagem';

  if (tipo) {

    mensagemEl.classList.add(
      tipo
    );

  }

  mensagemEl.style.display =
    texto
      ? 'block'
      : 'none';

}


/* =========================================================
   VALIDAR COMPETÊNCIA
   ========================================================= */

function validarCompetencia(
  competencia
) {

  if (
    !/^\d{4}-\d{2}$/.test(
      competencia
    )
  ) {

    throw new Error(
      'Selecione uma competência válida.'
    );

  }

  const partes =
    competencia.split('-');

  const ano =
    Number(partes[0]);

  const mes =
    Number(partes[1]);

  if (
    ano < 1900 ||
    ano > 2100 ||
    mes < 1 ||
    mes > 12
  ) {

    throw new Error(
      'Competência inválida.'
    );

  }

}


/* =========================================================
   CHAMAR GOOGLE APPS SCRIPT
   =========================================================

   Comunicação por JSONP.

   O Apps Script deve retornar:

   callback({...});

   ========================================================= */

function chamarAPI(
  action,
  parametros
) {

  parametros =
    parametros || {};

  return new Promise(
    function(resolve, reject) {

      const callback =
        'cf_callback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );

      const script =
        document.createElement(
          'script'
        );

      let finalizado =
        false;

      const tempoLimite =
        setTimeout(
          function() {

            if (finalizado) {
              return;
            }

            finalizado = true;

            limpar();

            reject(
              new Error(
                'Tempo limite excedido ao conectar ao Google Apps Script.'
              )
            );

          },
          12000
        );


      window[callback] =
        function(resposta) {

          if (finalizado) {
            return;
          }

          finalizado = true;

          clearTimeout(
            tempoLimite
          );

          limpar();


          console.log(
            'Resposta Apps Script:',
            resposta
          );


          if (!resposta) {

            reject(
              new Error(
                'O Google Apps Script retornou uma resposta vazia.'
              )
            );

            return;

          }


          if (
            resposta.sucesso === false
          ) {

            reject(
              new Error(
                resposta.erro ||
                resposta.mensagem ||
                'Erro retornado pelo Google Apps Script.'
              )
            );

            return;

          }


          resolve(
            resposta
          );

        };


      function limpar() {

        try {

          if (
            script &&
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }

        } catch (erro) {

          console.warn(
            'Erro ao remover script:',
            erro
          );

        }


        try {

          delete window[callback];

        } catch (erro) {

          window[callback] =
            undefined;

        }

      }


      const query =
        new URLSearchParams();


      /*
       * PARÂMETROS PRINCIPAIS
       */

      query.set(
        'action',
        action
      );

      query.set(
        'callback',
        callback
      );


      /*
       * PARÂMETROS DA ROTINA
       */

      Object.keys(
        parametros
      ).forEach(
        function(chave) {

          const valor =
            parametros[chave];

          if (
            valor === undefined ||
            valor === null
          ) {

            return;

          }

          query.set(
            chave,
            String(valor)
          );

        }
      );


      /*
       * MONTA A URL
       */

      const url =
        URL_API +
        '?' +
        query.toString();


      console.log(
        'Chamando API:',
        url
      );


      /*
       * CONFIGURA SCRIPT JSONP
       */

      script.async =
        true;

      script.src =
        url;


      script.onerror =
        function() {

          if (finalizado) {
            return;
          }

          finalizado = true;

          clearTimeout(
            tempoLimite
          );

          limpar();

          reject(
            new Error(
              'O navegador não conseguiu carregar a resposta do Google Apps Script.'
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   TESTAR CONEXÃO
   ========================================================= */

async function testarConexao() {

  statusEl.textContent =
    'Conectando...';

  statusEl.className =
    'status';


  try {

    const resposta =
      await chamarAPI(
        'ping'
      );


    if (
      resposta &&
      resposta.sucesso === true
    ) {

      statusEl.textContent =
        'Sistema online';

      statusEl.className =
        'status online';

      return true;

    }


    throw new Error(
      'A API não respondeu corretamente.'
    );


  } catch (erro) {

    statusEl.textContent =
      'Erro na conexão';

    statusEl.className =
      'status erro';


    mostrarMensagem(
      erro.message,
      'erro'
    );


    console.error(
      'Erro na conexão:',
      erro
    );


    return false;

  }

}


/* =========================================================
   CARREGAR RESUMO
   ========================================================= */

async function carregarResumo() {

  const competencia =
    competenciaEl.value;


  try {

    validarCompetencia(
      competencia
    );

  } catch (erro) {

    mostrarMensagem(
      erro.message,
      'erro'
    );

    return;

  }


  btnAtualizar.disabled =
    true;

  btnAtualizar.textContent =
    'Carregando...';


  const cards =
    document.querySelectorAll(
      '.resumo-valor'
    );


  cards.forEach(
    function(card) {

      card.style.opacity =
        '0.45';

    }
  );


  try {

    const resposta =
      await chamarAPI(
        'obterResumo',
        {
          competencia:
            competencia
        }
      );


    document.getElementById(
      'saldoInicial'
    ).textContent =
      moeda(
        resposta.saldoInicial
      );


    document.getElementById(
      'receber'
    ).textContent =
      moeda(
        resposta.receber
      );


    document.getElementById(
      'pagar'
    ).textContent =
      moeda(
        resposta.pagar
      );


    document.getElementById(
      'saldoBanco'
    ).textContent =
      moeda(
        resposta.saldoBanco
      );


    mostrarMensagem(
      '',
      ''
    );


    /*
     * Se a consulta funcionar,
     * garante que o status continue online.
     */

    statusEl.textContent =
      'Sistema online';

    statusEl.className =
      'status online';


  } catch (erro) {

    mostrarMensagem(
      'Erro ao carregar o resumo: ' +
      erro.message,
      'erro'
    );


    console.error(
      'Erro ao carregar resumo:',
      erro
    );


  } finally {

    cards.forEach(
      function(card) {

        card.style.opacity =
          '1';

      }
    );


    btnAtualizar.disabled =
      false;

    btnAtualizar.textContent =
      '↻ Atualizar';

  }

}


/* =========================================================
   ABRIR ROTINAS DO GITHUB PAGES
   ========================================================= */

function abrirPagina(
  pagina
) {

  const competencia =
    competenciaEl.value ||
    competenciaAtual();


  try {

    validarCompetencia(
      competencia
    );

  } catch (erro) {

    mostrarMensagem(
      erro.message,
      'erro'
    );

    return;

  }


  /*
   * ARQUIVOS EXISTENTES NO GITHUB
   *
   * IMPORTANTE:
   * os nomes precisam ser exatamente iguais
   * aos nomes dos arquivos publicados.
   */

  const arquivos = {

    lancamentos:
      'Lancamentos.html',

    pendentes:
      'BaixasPendentes.html',

    relatorio:
      'Relatorio.html',

    graficos:
      'Graficos.html',

    atendimento:
      'Atendimento.html'

  };


  const arquivo =
    arquivos[pagina];


  if (!arquivo) {

    mostrarMensagem(
      'Rotina não encontrada: ' +
      pagina,
      'erro'
    );

    return;

  }


  /*
   * MONTA O ENDEREÇO A PARTIR
   * DO PRÓPRIO INDEX DO GITHUB.
   *
   * Exemplo:
   *
   * index.html
   * Lancamentos.html
   *
   * ficam no mesmo diretório.
   */

  const url =
    new URL(
      arquivo,
      window.location.href
    );


  /*
   * Envia a competência para
   * a página aberta.
   */

  url.searchParams.set(
    'competencia',
    competencia
  );


  console.log(
    'Abrindo rotina:',
    url.href
  );


  /*
   * NAVEGAÇÃO DIRETA NO GITHUB.
   *
   * NÃO passa pelo Apps Script.
   */

  window.location.href =
    url.href;

}


/* =========================================================
   ALTERAR COMPETÊNCIA
   ========================================================= */

competenciaEl.addEventListener(
  'change',
  function() {

    carregarResumo();

  }
);


/* =========================================================
   ENTER NO CAMPO
   ========================================================= */

competenciaEl.addEventListener(
  'keydown',
  function(evento) {

    if (
      evento.key === 'Enter'
    ) {

      carregarResumo();

    }

  }
);


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

async function iniciarSistema() {

  mostrarMensagem(
    '',
    ''
  );


  /*
   * Primeiro testa o ping.
   */

  const online =
    await testarConexao();


  /*
   * Se a API não responder,
   * não tenta carregar o resumo.
   */

  if (!online) {

    return;

  }


  /*
   * API online:
   * carrega o resumo.
   */

  await carregarResumo();

}


/* =========================================================
   INICIAR
   ========================================================= */

iniciarSistema();

</script>

</body>

</html>
