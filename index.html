<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle Financeiro</title>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(
        135deg,
        #f4f7fb 0%,
        #eef3f9 100%
    );
    color: #1f2937;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 18px 30px;
}

.card {
    background: #ffffff;
    border-radius: 16px;
    padding: 22px;
    box-shadow:
        0 8px 28px
        rgba(15, 23, 42, 0.08);
    border: 1px solid #e5eaf0;
}


/* =====================================================
   CABEÇALHO
===================================================== */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 18px;
}

.titulo {
    margin: 0;
    color: #17365d;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
}

.subtitulo {
    margin-top: 5px;
    color: #64748b;
    font-size: 13px;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 18px;
    background: #f1f5f9;
    color: #64748b;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.status::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #94a3b8;
}

.status.online {
    background: #ecfdf3;
    color: #166534;
}

.status.online::before {
    background: #22c55e;
}

.status.erro {
    background: #fef2f2;
    color: #991b1b;
}

.status.erro::before {
    background: #ef4444;
}


/* =====================================================
   COMPETÊNCIA
===================================================== */

.competencia-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    padding: 10px 12px;
    margin-bottom: 14px;
}

.competencia-label {
    display: block;
    margin-bottom: 4px;
    font-size: 12px;
    font-weight: 700;
    color: #475569;
}

.competencia-linha {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

#competencia {
    width: 180px;
    height: 34px;
    padding: 5px 9px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    background: #ffffff;
    color: #1e293b;
    font-size: 13px;
    line-height: 1.2;
    outline: none;
}

#competencia:focus {
    border-color: #2563eb;
    box-shadow:
        0 0 0 2px
        rgba(37, 99, 235, 0.10);
}


/* =====================================================
   BOTÃO ATUALIZAR
===================================================== */

.btn-atualizar {
    height: 34px;
    padding: 5px 10px;
    border: 0;
    border-radius: 7px;
    background: #17365d;
    color: #ffffff;
    font-size: 13px;
    line-height: 1.2;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: .2s;
}

.btn-atualizar:hover {
    background: #214c7d;
    transform: translateY(-1px);
}

.btn-atualizar:active {
    transform: translateY(0);
}


/* =====================================================
   TÍTULOS DAS SEÇÕES
===================================================== */

.secao-titulo {
    display: block;
    margin: 16px 0 7px;
    padding: 0;
    color: #17365d;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.2;
}


/* =====================================================
   RESUMO — SUPER COMPACTO
===================================================== */

.resumo {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;

    margin-bottom: 18px;
}


/*
 * IMPORTANTE:
 *
 * Não existe mais min-height.
 *
 * A altura será determinada somente
 * pelo conteúdo.
 */

.resumo-card {
    min-height: 0;
    height: auto;

    padding: 7px 9px;

    border: 1px solid #e5e7eb;
    border-radius: 8px;

    background: #ffffff;

    box-shadow:
        0 2px 6px
        rgba(15, 23, 42, 0.03);
}


.resumo-label {
    margin: 0 0 2px 0;

    color: #64748b;

    font-size: 10px;
    font-weight: 700;

    line-height: 1.15;
}


.resumo-valor {
    margin: 0;

    color: #17365d;

    font-size: 15px;
    font-weight: 700;

    line-height: 1.15;

    word-break: break-word;
}


/* =====================================================
   MENU
===================================================== */

.menu {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.menu-item {
    width: 100%;

    min-height: 105px;

    border: 0;
    border-radius: 12px;

    padding: 15px 12px;

    background: #17365d;
    color: #ffffff;

    cursor: pointer;

    text-align: center;

    font-size: 14px;
    font-weight: 700;

    transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
}

.menu-item:hover {
    background: #214c7d;

    transform:
        translateY(-2px);

    box-shadow:
        0 6px 15px
        rgba(23, 54, 93, 0.18);
}

.menu-item:active {
    transform:
        translateY(0);
}

.menu-item.novo {
    background: #15803d;
}

.menu-item.novo:hover {
    background: #166534;
}

.menu-icone {
    display: block;

    font-size: 28px;

    line-height: 1;

    margin-bottom: 9px;
}

.menu-descricao {
    display: block;

    margin-top: 5px;

    font-size: 10px;

    font-weight: 400;

    line-height: 1.25;

    opacity: .80;
}


/* =====================================================
   MENSAGEM
===================================================== */

.mensagem {
    display: none;

    margin-top: 15px;

    padding: 10px 12px;

    border-radius: 8px;

    background: #fff7ed;

    border: 1px solid #fed7aa;

    color: #9a3412;

    font-size: 13px;
}

.mensagem.erro {
    background: #fef2f2;

    border-color: #fecaca;

    color: #991b1b;
}

.mensagem.sucesso {
    background: #f0fdf4;

    border-color: #bbf7d0;

    color: #166534;
}


/* =====================================================
   RODAPÉ
===================================================== */

.rodape {
    margin-top: 18px;

    padding-top: 12px;

    border-top:
        1px solid #e5e7eb;

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 12px;

    color: #94a3b8;

    font-size: 11px;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 850px) {

    .resumo {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .menu {
        grid-template-columns:
            repeat(2, 1fr);
    }

}


@media (max-width: 560px) {

    .container {
        padding:
            10px 8px 20px;
    }

    .card {
        padding: 15px;
        border-radius: 13px;
    }

    .header {
        align-items:
            flex-start;

        flex-direction:
            column;

        gap: 8px;
    }

    .titulo {
        font-size: 23px;
    }

    .subtitulo {
        font-size: 12px;
    }

    .resumo {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 6px;
    }

    .resumo-card {
        padding: 6px 7px;
    }

    .resumo-label {
        font-size: 9px;
    }

    .resumo-valor {
        font-size: 14px;
    }

    .menu {
        grid-template-columns:
            1fr;
    }

    .menu-item {
        min-height: 90px;
    }

    .competencia-linha {
        align-items:
            center;

        flex-direction:
            row;
    }

    #competencia {
        width: 165px;
    }

    .btn-atualizar {
        width: auto;
    }

    .rodape {
        flex-direction:
            column;

        align-items:
            flex-start;
    }

}


/* =====================================================
   TELAS MUITO PEQUENAS
===================================================== */

@media (max-width: 380px) {

    .resumo {
        grid-template-columns:
            1fr;
    }

    .resumo-card {
        display: flex;

        align-items: center;

        justify-content:
            space-between;

        gap: 8px;
    }

    .resumo-label {
        margin: 0;
    }

    .resumo-valor {
        text-align: right;
    }

}

</style>

</head>


<body>

<div class="container">

<div class="card">


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<div class="header">

    <div>

        <h1 class="titulo">
            Controle Financeiro
        </h1>

        <div class="subtitulo">
            Gestão de lançamentos e fluxo financeiro
        </div>

    </div>


    <div
        id="status"
        class="status">

        Sistema

    </div>

</div>


<!-- =====================================================
     COMPETÊNCIA
===================================================== -->

<div class="competencia-box">

    <label
        class="competencia-label"
        for="competencia">

        Competência

    </label>


    <div class="competencia-linha">

        <input
            id="competencia"
            type="month"
            title="Selecione a competência"
        >


        <button
            type="button"
            class="btn-atualizar"
            onclick="carregarResumo()">

            ↻ Atualizar

        </button>

    </div>

</div>


<!-- =====================================================
     RESUMO
===================================================== -->

<div class="secao-titulo">

    Resumo da Competência

</div>


<div class="resumo">


    <!-- SALDO INICIAL -->

    <div class="resumo-card">

        <div class="resumo-label">

            SALDO INICIAL

        </div>

        <div
            id="saldoInicial"
            class="resumo-valor">

            R$ 0,00

        </div>

    </div>


    <!-- A RECEBER -->

    <div class="resumo-card">

        <div class="resumo-label">

            A RECEBER

        </div>

        <div
            id="receber"
            class="resumo-valor">

            R$ 0,00

        </div>

    </div>


    <!-- A PAGAR -->

    <div class="resumo-card">

        <div class="resumo-label">

            A PAGAR

        </div>

        <div
            id="pagar"
            class="resumo-valor">

            R$ 0,00

        </div>

    </div>


    <!-- SALDO BANCÁRIO -->

    <div class="resumo-card">

        <div class="resumo-label">

            SALDO BANCÁRIO

        </div>

        <div
            id="saldoBanco"
            class="resumo-valor">

            R$ 0,00

        </div>

    </div>

</div>


<!-- =====================================================
     MENU
===================================================== -->

<div class="secao-titulo">

    Rotinas

</div>


<div class="menu">


    <!-- LANÇAMENTOS -->

    <button
        type="button"
        class="menu-item"
        onclick="abrirPagina('lancamentos')">

        <span class="menu-icone">
            📋
        </span>

        Lançamentos

        <span class="menu-descricao">
            Consultar, editar e excluir lançamentos
        </span>

    </button>


    <!-- PENDENTES -->

    <button
        type="button"
        class="menu-item"
        onclick="abrirPagina('pendentes')">

        <span class="menu-icone">
            ⏳
        </span>

        Baixas Pendentes

        <span class="menu-descricao">
            Consultar lançamentos pendentes
        </span>

    </button>


    <!-- RELATÓRIO -->

    <button
        type="button"
        class="menu-item"
        onclick="abrirPagina('relatorio')">

        <span class="menu-icone">
            📊
        </span>

        Relatório Financeiro

        <span class="menu-descricao">
            Visualizar relatório da competência
        </span>

    </button>


    <!-- GRÁFICOS -->

    <button
        type="button"
        class="menu-item"
        onclick="abrirPagina('graficos')">

        <span class="menu-icone">
            📈
        </span>

        Gráficos

        <span class="menu-descricao">
            Análise visual dos dados financeiros
        </span>

    </button>


    <!-- ATENDIMENTO -->

    <button
        type="button"
        class="menu-item"
        onclick="abrirPagina('atendimento')">

        <span class="menu-icone">
            👤
        </span>

        Atendimento

        <span class="menu-descricao">
            Pesquisa e registro de atendimento
        </span>

    </button>


    <!-- NOVO LANÇAMENTO -->

    <button
        type="button"
        class="menu-item novo"
        onclick="abrirNovoLancamento()">

        <span class="menu-icone">
            ➕
        </span>

        Novo Lançamento

        <span class="menu-descricao">
            Cadastrar novo lançamento
        </span>

    </button>

</div>

<!-- =====================================================
     MENSAGEM
===================================================== -->

<div
    id="mensagem"
    class="mensagem">
</div>


<!-- =====================================================
     RODAPÉ
===================================================== -->

<div class="rodape">

    <span>
        Controle Financeiro
    </span>

    <span>
        GitHub Pages + Google Apps Script
    </span>

</div>


</div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const URL_API =
"https://script.google.com/macros/s/AKfycbwlkjtWnOcvglZS2Ft6ydraSh4-JbTXH6C7irb6O5hYPvxYxqN0tYWQs2Ybi6mVWThN/exec";


/* =========================================================
   ELEMENTOS
========================================================= */

const statusEl =
document.getElementById(
    'status'
);

const mensagemEl =
document.getElementById(
    'mensagem'
);

const competenciaEl =
document.getElementById(
    'competencia'
);


/* =========================================================
   COMPETÊNCIA ATUAL
========================================================= */

function competenciaAtual() {

    const agora =
        new Date();

    const ano =
        agora.getFullYear();

    const mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            '0'
        );

    return (
        ano +
        '-' +
        mes
    );

}


/* =========================================================
   DEFINIR COMPETÊNCIA
========================================================= */

competenciaEl.value =
    competenciaAtual();


/* =========================================================
   MOEDA
========================================================= */

function moeda(valor) {

    const numero =
        Number(
            valor || 0
        );

    return numero.toLocaleString(
        'pt-BR',
        {
            style:
                'currency',

            currency:
                'BRL'
        }
    );

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagem(
    texto,
    tipo
) {

    mensagemEl.textContent =
        texto || '';

    mensagemEl.className =
        'mensagem';


    if (tipo) {

        mensagemEl.classList.add(
            tipo
        );

    }


    mensagemEl.style.display =
        texto
            ? 'block'
            : 'none';

}


/* =========================================================
   VALIDAR COMPETÊNCIA
========================================================= */

function validarCompetencia(
    competencia
) {

    if (
        !/^\d{4}-\d{2}$/.test(
            competencia
        )
    ) {

        throw new Error(
            'Selecione uma competência válida.'
        );

    }


    const partes =
        competencia.split('-');


    const ano =
        Number(
            partes[0]
        );


    const mes =
        Number(
            partes[1]
        );


    if (
        ano < 1900 ||
        ano > 2100 ||
        mes < 1 ||
        mes > 12
    ) {

        throw new Error(
            'Competência inválida.'
        );

    }

}


/* =========================================================
   CHAMAR API
========================================================= */

function chamarAPI(
    action,
    parametros
) {

    parametros =
        parametros || {};


    return new Promise(
        function(resolve, reject) {

            const callback =
                'cfCallback_' +
                Date.now() +
                '_' +
                Math.floor(
                    Math.random() * 100000
                );


            const script =
                document.createElement(
                    'script'
                );


            let finalizado =
                false;


            function limpar() {

                if (
                    script &&
                    script.parentNode
                ) {

                    script.parentNode.removeChild(
                        script
                    );

                }


                try {

                    delete window[
                        callback
                    ];

                }
                catch (e) {

                    window[
                        callback
                    ] = undefined;

                }

            }


            const timeout =
                setTimeout(
                    function() {

                        if (
                            finalizado
                        ) {

                            return;

                        }


                        finalizado =
                            true;


                        limpar();


                        reject(
                            new Error(
                                'Tempo limite da API.'
                            )
                        );

                    },
                    10000
                );


            window[callback] =
                function(resposta) {

                    if (
                        finalizado
                    ) {

                        return;

                    }


                    finalizado =
                        true;


                    clearTimeout(
                        timeout
                    );


                    limpar();


                    if (!resposta) {

                        reject(
                            new Error(
                                'Resposta vazia do Apps Script.'
                            )
                        );

                        return;

                    }


                    if (
                        resposta.sucesso === false
                    ) {

                        reject(
                            new Error(
                                resposta.erro ||
                                resposta.mensagem ||
                                'Erro retornado pela API.'
                            )
                        );

                        return;

                    }


                    resolve(
                        resposta
                    );

                };


            const query =
                new URLSearchParams();


            query.set(
                'action',
                action
            );


            query.set(
                'callback',
                callback
            );


            Object.keys(
                parametros
            ).forEach(
                function(chave) {

                    const valor =
                        parametros[chave];


                    if (
                        valor === undefined ||
                        valor === null
                    ) {

                        return;

                    }


                    query.set(
                        chave,
                        String(valor)
                    );

                }
            );


            script.src =
                URL_API +
                '?' +
                query.toString();


            script.onerror =
                function() {

                    if (
                        finalizado
                    ) {

                        return;

                    }


                    finalizado =
                        true;


                    clearTimeout(
                        timeout
                    );


                    limpar();


                    reject(
                        new Error(
                            'Não foi possível conectar com o Google Apps Script.'
                        )
                    );

                };


            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   CARREGAR RESUMO
========================================================= */

async function carregarResumo() {

    const competencia =
        competenciaEl.value;


    try {

        validarCompetencia(
            competencia
        );

    }
    catch (erro) {

        mostrarMensagem(
            erro.message,
            'erro'
        );

        return;

    }


    const cards =
        document.querySelectorAll(
            '.resumo-valor'
        );


    cards.forEach(
        function(card) {

            card.style.opacity =
                '0.45';

        }
    );


    statusEl.textContent =
        'Atualizando...';

    statusEl.className =
        'status';


    try {

        const resposta =
            await chamarAPI(
                'obterResumo',
                {
                    competencia:
                        competencia
                }
            );


        /*
         * SALDO INICIAL
         */

        document.getElementById(
            'saldoInicial'
        ).textContent =
            moeda(
                resposta.saldoInicial
            );


        /*
         * A RECEBER
         */

        document.getElementById(
            'receber'
        ).textContent =
            moeda(
                resposta.receber
            );


        /*
         * A PAGAR
         */

        document.getElementById(
            'pagar'
        ).textContent =
            moeda(
                resposta.pagar
            );


        /*
         * SALDO BANCÁRIO
         */

        document.getElementById(
            'saldoBanco'
        ).textContent =
            moeda(
                resposta.saldoBanco
            );


        /*
         * STATUS
         */

        statusEl.textContent =
            'Sistema online';

        statusEl.className =
            'status online';


        mostrarMensagem(
            '',
            ''
        );

    }
    catch (erro) {

        statusEl.textContent =
            'API indisponível';

        statusEl.className =
            'status erro';


        mostrarMensagem(
            'Não foi possível atualizar o resumo. As rotinas continuam disponíveis.',
            'erro'
        );


        console.error(
            'Erro ao carregar resumo:',
            erro
        );

    }
    finally {

        cards.forEach(
            function(card) {

                card.style.opacity =
                    '1';

            }
        );

    }

}


/* =========================================================
   CONSTRUIR URL DA ROTINA
========================================================= */

function construirUrl(
    arquivo
) {

    const competencia =
        competenciaEl.value ||
        competenciaAtual();


    validarCompetencia(
        competencia
    );


    const url =
        new URL(
            arquivo,
            window.location.href
        );


    url.searchParams.set(
        'competencia',
        competencia
    );


    return url;

}


/* =========================================================
   ABRIR ROTINA NORMAL
========================================================= */

function abrirPagina(
    pagina
) {

    const arquivos = {

        lancamentos:
            'Lancamentos.html',

        pendentes:
            'BaixasPendentes.html',

        relatorio:
            'Relatorio.html',

        graficos:
            'Graficos.html',

        atendimento:
            'Atendimento.html'

    };


    const arquivo =
        arquivos[pagina];


    if (!arquivo) {

        mostrarMensagem(
            'Rotina não encontrada.',
            'erro'
        );

        return;

    }


    try {

        const url =
            construirUrl(
                arquivo
            );


        /*
         * Abre a rotina no modo lista.
         */

        url.searchParams.set(
            'modo',
            'lista'
        );


        window.location.assign(
            url.href
        );

    }
    catch (erro) {

        mostrarMensagem(
            erro.message,
            'erro'
        );

    }

}


/* =========================================================
   ABRIR NOVO LANÇAMENTO
========================================================= */

function abrirNovoLancamento() {

    try {

        const url =
            construirUrl(
                'Lancamentos.html'
            );


        /*
         * Abre diretamente no modo NOVO.
         */

        url.searchParams.set(
            'modo',
            'novo'
        );


        /*
         * Indicador adicional para
         * compatibilidade com Lancamentos.html.
         */

        url.searchParams.set(
            'novo',
            '1'
        );


        window.location.assign(
            url.href
        );

    }
    catch (erro) {

        mostrarMensagem(
            erro.message,
            'erro'
        );

    }

}


/* =========================================================
   ALTERAÇÃO DA COMPETÊNCIA
========================================================= */

competenciaEl.addEventListener(
    'change',
    function() {

        carregarResumo();

    }
);


/* =========================================================
   ENTER
========================================================= */

competenciaEl.addEventListener(
    'keydown',
    function(evento) {

        if (
            evento.key === 'Enter'
        ) {

            carregarResumo();

        }

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    function() {

        statusEl.textContent =
            'Sistema';

        statusEl.className =
            'status';


        /*
         * Carrega o resumo automaticamente.
         */

        carregarResumo();

    }
);

</script>
