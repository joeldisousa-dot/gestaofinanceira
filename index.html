<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Controle Financeiro</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f4f7fb 0%,
          #eef3f9 100%
        );

      color: #1f2937;
    }


    /* =====================================================
       CONTAINER
       ===================================================== */

    .container {

      width: 100%;

      max-width: 1100px;

      margin: 0 auto;

      padding:
        30px 18px 40px;
    }


    /* =====================================================
       CARD PRINCIPAL
       ===================================================== */

    .card {

      width: 100%;

      background: #ffffff;

      border:
        1px solid #e5eaf0;

      border-radius: 18px;

      padding: 28px;

      box-shadow:
        0 10px 35px rgba(
          15,
          23,
          42,
          0.08
        );
    }


    /* =====================================================
       CABEÇALHO
       ===================================================== */

    .header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 28px;
    }


    .titulo {

      margin: 0;

      color: #17365d;

      font-size: 28px;

      line-height: 1.2;

      font-weight: 700;
    }


    .subtitulo {

      margin-top: 7px;

      color: #64748b;

      font-size: 14px;
    }


    /* =====================================================
       STATUS
       ===================================================== */

    .status {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding:
        8px 13px;

      border-radius: 20px;

      background: #f1f5f9;

      color: #64748b;

      font-size: 13px;

      font-weight: 600;

      white-space: nowrap;
    }


    .status::before {

      content: "";

      width: 8px;

      height: 8px;

      flex: 0 0 8px;

      border-radius: 50%;

      background: #94a3b8;
    }


    .status.online {

      background: #ecfdf3;

      color: #166534;
    }


    .status.online::before {

      background: #22c55e;
    }


    .status.erro {

      background: #fef2f2;

      color: #991b1b;
    }


    .status.erro::before {

      background: #ef4444;
    }


    .status.carregando {

      background: #eff6ff;

      color: #1d4ed8;
    }


    .status.carregando::before {

      background: #3b82f6;
    }


    /* =====================================================
       COMPETÊNCIA
       ===================================================== */

    .competencia-box {

      background: #f8fafc;

      border:
        1px solid #e2e8f0;

      border-radius: 12px;

      padding:
        16px 18px;

      margin-bottom: 22px;
    }


    .competencia-label {

      display: block;

      margin-bottom: 8px;

      color: #475569;

      font-size: 13px;

      font-weight: 700;
    }


    .competencia-linha {

      display: flex;

      align-items: center;

      gap: 12px;

      flex-wrap: wrap;
    }


    #competencia {

      width: 210px;

      padding:
        11px 13px;

      border:
        1px solid #cbd5e1;

      border-radius: 9px;

      background: #ffffff;

      color: #1e293b;

      font-size: 15px;

      outline: none;
    }


    #competencia:focus {

      border-color: #2563eb;

      box-shadow:
        0 0 0 3px
        rgba(
          37,
          99,
          235,
          0.10
        );
    }


    .btn-atualizar {

      border: 0;

      border-radius: 9px;

      padding:
        11px 17px;

      background: #17365d;

      color: #ffffff;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      transition:
        .2s;
    }


    .btn-atualizar:hover {

      background: #214c7d;

      transform:
        translateY(-1px);
    }


    .btn-atualizar:disabled {

      opacity: .60;

      cursor: wait;

      transform: none;
    }


    /* =====================================================
       SEÇÃO
       ===================================================== */

    .secao-titulo {

      margin:
        25px 0 14px;

      color: #17365d;

      font-size: 18px;

      font-weight: 700;
    }


    /* =====================================================
       RESUMO
       ===================================================== */

    .resumo {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;

      margin-bottom: 28px;
    }


    .resumo-card {

      min-height: 105px;

      padding: 17px;

      border:
        1px solid #e5e7eb;

      border-radius: 13px;

      background: #ffffff;

      box-shadow:
        0 3px 12px
        rgba(
          15,
          23,
          42,
          0.04
        );

      transition:
        .2s;
    }


    .resumo-card:hover {

      transform:
        translateY(-1px);

      box-shadow:
        0 5px 16px
        rgba(
          15,
          23,
          42,
          0.07
        );
    }


    .resumo-label {

      color: #64748b;

      font-size: 12px;

      font-weight: 600;

      margin-bottom: 10px;
    }


    .resumo-valor {

      color: #17365d;

      font-size: 21px;

      font-weight: 700;

      word-break: break-word;
    }


    /* =====================================================
       MENU
       ===================================================== */

    .menu {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;
    }


    .menu-item {

      width: 100%;

      min-height: 125px;

      border: 0;

      border-radius: 14px;

      padding:
        20px 15px;

      background: #17365d;

      color: #ffffff;

      cursor: pointer;

      text-align: center;

      font-size: 15px;

      font-weight: 700;

      transition:
        transform .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }


    .menu-item:hover {

      background: #214c7d;

      transform:
        translateY(-2px);

      box-shadow:
        0 7px 18px
        rgba(
          23,
          54,
          93,
          0.18
        );
    }


    .menu-item:active {

      transform:
        translateY(0);
    }


    .menu-item:disabled {

      opacity: .60;

      cursor: wait;

      transform: none;

      box-shadow: none;
    }


    .menu-icone {

      display: block;

      font-size: 31px;

      line-height: 1;

      margin-bottom: 12px;
    }


    .menu-descricao {

      display: block;

      margin-top: 6px;

      font-size: 11px;

      font-weight: 400;

      opacity: .80;
    }


    /* =====================================================
       MENSAGEM
       ===================================================== */

    .mensagem {

      display: none;

      margin-top: 20px;

      padding:
        13px 15px;

      border-radius: 9px;

      background: #fff7ed;

      border:
        1px solid #fed7aa;

      color: #9a3412;

      font-size: 14px;

      line-height: 1.5;
    }


    .mensagem.erro {

      background: #fef2f2;

      border-color: #fecaca;

      color: #991b1b;
    }


    .mensagem.sucesso {

      background: #f0fdf4;

      border-color: #bbf7d0;

      color: #166534;
    }


    .mensagem.info {

      background: #eff6ff;

      border-color: #bfdbfe;

      color: #1e40af;
    }


    /* =====================================================
       RODAPÉ
       ===================================================== */

    .rodape {

      margin-top: 25px;

      padding-top: 17px;

      border-top:
        1px solid #e5e7eb;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      color: #94a3b8;

      font-size: 12px;
    }


    /* =====================================================
       RESPONSIVO
       ===================================================== */

    @media (max-width: 850px) {

      .resumo {

        grid-template-columns:
          repeat(2, 1fr);
      }


      .menu {

        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    @media (max-width: 560px) {

      .container {

        padding:
          15px 10px 25px;
      }


      .card {

        padding: 18px;
      }


      .header {

        align-items: flex-start;

        flex-direction: column;
      }


      .titulo {

        font-size: 24px;
      }


      .status {

        align-self: flex-start;
      }


      .resumo {

        grid-template-columns: 1fr;
      }


      .menu {

        grid-template-columns: 1fr;
      }


      .menu-item {

        min-height: 105px;
      }


      .competencia-linha {

        align-items: stretch;

        flex-direction: column;
      }


      #competencia {

        width: 100%;
      }


      .btn-atualizar {

        width: 100%;
      }


      .rodape {

        flex-direction: column;

        align-items: flex-start;
      }

    }

  </style>

<script>


/* =========================================================
   CONFIGURAÇÃO DA API
   =========================================================

   O INDEX ESTÁ NO GITHUB PAGES.

   A API ESTÁ NO GOOGLE APPS SCRIPT.

   NÃO ALTERE PARA A URL DO GITHUB.

   ========================================================= */

const URL_API =
  'https://script.google.com/macros/s/AKfycbwfSLxtEomSQ5rkt1NHF7VlOZS-KOKmBP9f08UJcuSprdm8ITVEAj3dSqww7QuzCxGx/exec';


/* =========================================================
   ELEMENTOS
   ========================================================= */

const statusEl =
  document.getElementById(
    'status'
  );


const mensagemEl =
  document.getElementById(
    'mensagem'
  );


const competenciaEl =
  document.getElementById(
    'competencia'
  );


const btnAtualizar =
  document.getElementById(
    'btnAtualizar'
  );


/* =========================================================
   COMPETÊNCIA ATUAL
   ========================================================= */

function competenciaAtual() {

  const agora =
    new Date();


  const ano =
    agora.getFullYear();


  const mes =
    String(
      agora.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  return (
    ano +
    '-' +
    mes
  );

}


/* =========================================================
   DEFINIR COMPETÊNCIA INICIAL
   ========================================================= */

competenciaEl.value =
  competenciaAtual();


/* =========================================================
   MOEDA
   ========================================================= */

function moeda(valor) {

  let numero =
    Number(valor);


  if (
    !Number.isFinite(numero)
  ) {

    numero = 0;

  }


  return numero.toLocaleString(
    'pt-BR',
    {
      style: 'currency',
      currency: 'BRL'
    }
  );

}


/* =========================================================
   MENSAGEM
   ========================================================= */

function mostrarMensagem(
  texto,
  tipo
) {

  mensagemEl.textContent =
    texto || '';


  mensagemEl.className =
    'mensagem';


  if (tipo) {

    mensagemEl.classList.add(
      tipo
    );

  }


  mensagemEl.style.display =
    texto
      ? 'block'
      : 'none';

}


/* =========================================================
   STATUS
   ========================================================= */

function alterarStatus(
  texto,
  tipo
) {

  statusEl.textContent =
    texto;


  statusEl.className =
    'status';


  if (tipo) {

    statusEl.classList.add(
      tipo
    );

  }

}


/* =========================================================
   VALIDAR COMPETÊNCIA
   ========================================================= */

function validarCompetenciaFront(
  competencia
) {

  if (
    !/^\d{4}-\d{2}$/.test(
      competencia
    )
  ) {

    throw new Error(
      'Competência inválida. Selecione uma competência no formato AAAA-MM.'
    );

  }


  const partes =
    competencia.split('-');


  const ano =
    Number(
      partes[0]
    );


  const mes =
    Number(
      partes[1]
    );


  if (
    ano < 1900 ||
    ano > 2100
  ) {

    throw new Error(
      'Ano da competência inválido.'
    );

  }


  if (
    mes < 1 ||
    mes > 12
  ) {

    throw new Error(
      'Mês da competência inválido.'
    );

  }


  return true;

}


/* =========================================================
   CHAMAR GOOGLE APPS SCRIPT
   =========================================================

   O Apps Script utiliza:

   parametros.action

   e não:

   parametros.acao

   Portanto o index envia exatamente:

   ?action=ping

   ?action=obterResumo

   etc.

   ========================================================= */

function chamarAPI(
  action,
  parametros = {}
) {

  return new Promise(
    function(resolve, reject) {


      /* ---------------------------------------------------
         VALIDAR URL
         --------------------------------------------------- */

      if (
        !URL_API ||
        !URL_API.includes(
          'script.google.com/macros/s/'
        ) ||
        !URL_API.endsWith(
          '/exec'
        )
      ) {

        reject(
          new Error(
            'URL do Google Apps Script inválida ou não configurada.'
          )
        );

        return;

      }


      /* ---------------------------------------------------
         CALLBACK JSONP
         --------------------------------------------------- */

      const callback =
        'controleFinanceiro_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 1000000
        );


      const script =
        document.createElement(
          'script'
        );


      let concluido =
        false;


      let timer =
        null;


      /* ---------------------------------------------------
         LIMPAR
         --------------------------------------------------- */

      function limpar() {

        if (timer) {

          clearTimeout(
            timer
          );

          timer = null;

        }


        try {

          delete window[
            callback
          ];

        } catch (erro) {

          window[
            callback
          ] = undefined;

        }


        if (
          script &&
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      /* ---------------------------------------------------
         FINALIZAR ERRO
         --------------------------------------------------- */

      function falhar(
        erro
      ) {

        if (concluido) {
          return;
        }


        concluido = true;

        limpar();

        reject(
          erro instanceof Error
            ? erro
            : new Error(
                String(erro)
              )
        );

      }


      /* ---------------------------------------------------
         CALLBACK
         --------------------------------------------------- */

      window[
        callback
      ] =
        function(resposta) {

          if (concluido) {
            return;
          }


          concluido = true;

          limpar();


          if (
            !resposta
          ) {

            reject(
              new Error(
                'O Google Apps Script retornou uma resposta vazia.'
              )
            );

            return;

          }


          if (
            resposta.sucesso === false
          ) {

            reject(
              new Error(
                resposta.erro ||
                resposta.mensagem ||
                'O Google Apps Script retornou um erro.'
              )
            );

            return;

          }


          resolve(
            resposta
          );

        };


      /* ---------------------------------------------------
         MONTAR QUERY STRING
         --------------------------------------------------- */

      const query =
        new URLSearchParams();


      /*
       * IMPORTANTE:
       * O servidor espera "action".
       */

      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callback
      );


      Object.keys(
        parametros || {}
      ).forEach(
        function(chave) {

          const valor =
            parametros[chave];


          if (
            valor === undefined ||
            valor === null
          ) {

            return;

          }


          if (
            typeof valor === 'object'
          ) {

            query.set(
              chave,
              JSON.stringify(
                valor
              )
            );

          } else {

            query.set(
              chave,
              String(
                valor
              )
            );

          }

        }
      );


      /* ---------------------------------------------------
         URL FINAL
         --------------------------------------------------- */

      const url =
        URL_API +
        '?' +
        query.toString();


      /* ---------------------------------------------------
         ERRO DO SCRIPT
         --------------------------------------------------- */

      script.onerror =
        function() {

          falhar(
            new Error(
              'Não foi possível conectar ao Google Apps Script.'
            )
          );

        };


      /* ---------------------------------------------------
         TIMEOUT
         --------------------------------------------------- */

      timer =
        setTimeout(
          function() {

            falhar(
              new Error(
                'Tempo limite excedido ao conectar ao Google Apps Script.'
              )
            );

          },
          20000
        );


      /* ---------------------------------------------------
         CARREGAR
         --------------------------------------------------- */

      script.src =
        url;


      script.async =
        true;


      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   TESTAR CONEXÃO
   ========================================================= */

async function testarConexao() {

  alterarStatus(
    'Conectando...',
    'carregando'
  );


  try {

    const resposta =
      await chamarAPI(
        'ping'
      );


    if (
      resposta &&
      resposta.sucesso === true
    ) {

      alterarStatus(
        'Sistema online',
        'online'
      );


      return true;

    }


    throw new Error(
      'A API não respondeu corretamente.'
    );


  } catch (erro) {

    alterarStatus(
      'Erro na conexão',
      'erro'
    );


    mostrarMensagem(
      'Falha ao conectar ao Google Apps Script: ' +
      erro.message,
      'erro'
    );


    return false;

  }

}


/* =========================================================
   CARREGAR RESUMO
   ========================================================= */

async function carregarResumo() {

  const competencia =
    competenciaEl.value;


  /* -------------------------------------------------------
     VALIDAR
     ------------------------------------------------------- */

  try {

    validarCompetenciaFront(
      competencia
    );

  } catch (erro) {

    mostrarMensagem(
      erro.message,
      'erro'
    );

    return;

  }


  /* -------------------------------------------------------
     BLOQUEAR BOTÃO
     ------------------------------------------------------- */

  btnAtualizar.disabled =
    true;


  btnAtualizar.textContent =
    '↻ Carregando...';


  const cards =
    document.querySelectorAll(
      '.resumo-valor'
    );


  cards.forEach(
    function(elemento) {

      elemento.style.opacity =
        '0.50';

    }
  );


  try {

    const resposta =
      await chamarAPI(
        'obterResumo',
        {
          competencia:
            competencia
        }
      );


    /* ---------------------------------------------------
       SALDO INICIAL
       --------------------------------------------------- */

    document.getElementById(
      'saldoInicial'
    ).textContent =
      moeda(
        resposta.saldoInicial
      );


    /* ---------------------------------------------------
       RECEBER
       --------------------------------------------------- */

    document.getElementById(
      'receber'
    ).textContent =
      moeda(
        resposta.receber
      );


    /* ---------------------------------------------------
       PAGAR
       --------------------------------------------------- */

    document.getElementById(
      'pagar'
    ).textContent =
      moeda(
        resposta.pagar
      );


    /* ---------------------------------------------------
       SALDO BANCÁRIO
       --------------------------------------------------- */

    document.getElementById(
      'saldoBanco'
    ).textContent =
      moeda(
        resposta.saldoBanco
      );


    /* ---------------------------------------------------
       STATUS
       --------------------------------------------------- */

    alterarStatus(
      'Sistema online',
      'online'
    );


    mostrarMensagem(
      'Resumo atualizado para a competência ' +
      competencia +
      '.',
      'sucesso'
    );


    /*
     * Remove a mensagem depois de alguns segundos.
     */

    setTimeout(
      function() {

        if (
          mensagemEl.classList.contains(
            'sucesso'
          )
        ) {

          mostrarMensagem(
            '',
            ''
          );

        }

      },
      3500
    );


  } catch (erro) {

    alterarStatus(
      'Erro na conexão',
      'erro'
    );


    mostrarMensagem(
      'Erro ao carregar o resumo: ' +
      erro.message,
      'erro'
    );


  } finally {

    cards.forEach(
      function(elemento) {

        elemento.style.opacity =
          '1';

      }
    );


    btnAtualizar.disabled =
      false;


    btnAtualizar.textContent =
      '↻ Atualizar';

  }

}


/* =========================================================
   ABRIR ROTINAS DO GITHUB PAGES
   =========================================================

   IMPORTANTE:

   As páginas NÃO são abertas pelo Google Apps Script.

   Elas ficam no mesmo repositório GitHub:

   /gestaofinanceira/

   ========================================================= */

function abrirPagina(
  pagina
) {

  const competencia =
    competenciaEl.value ||
    competenciaAtual();


  /* -------------------------------------------------------
     VALIDAR COMPETÊNCIA
     ------------------------------------------------------- */

  try {

    validarCompetenciaFront(
      competencia
    );

  } catch (erro) {

    mostrarMensagem(
      erro.message,
      'erro'
    );

    return;

  }


  /* -------------------------------------------------------
     MAPA DOS ARQUIVOS
     -------------------------------------------------------

     ESTES NOMES DEVEM SER EXATAMENTE IGUAIS
     AOS NOMES DOS ARQUIVOS DO GITHUB.

     ------------------------------------------------------- */

  const arquivos = {

    lancamentos:
      'Lancamentos.html',

    pendentes:
      'BaixasPendentes.html',

    relatorio:
      'Relatorio.html',

    graficos:
      'Graficos.html',

    atendimento:
      'Atendimento.html'

  };


  const arquivo =
    arquivos[pagina];


  if (!arquivo) {

    mostrarMensagem(
      'Rotina não encontrada: ' +
      pagina,
      'erro'
    );

    return;

  }


  /* -------------------------------------------------------
     PRESERVAR A COMPETÊNCIA
     ------------------------------------------------------- */

  const url =
    arquivo +
    '?competencia=' +
    encodeURIComponent(
      competencia
    );


  /* -------------------------------------------------------
     NAVEGAR NO GITHUB PAGES
     ------------------------------------------------------- */

  window.location.href =
    url;

}


/* =========================================================
   ALTERAR COMPETÊNCIA
   ========================================================= */

competenciaEl.addEventListener(
  'change',
  function() {

    carregarResumo();

  }
);


/* =========================================================
   ENTER NO CAMPO
   ========================================================= */

competenciaEl.addEventListener(
  'keydown',
  function(evento) {

    if (
      evento.key === 'Enter'
    ) {

      carregarResumo();

    }

  }
);


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

async function iniciarSistema() {

  mostrarMensagem(
    '',
    ''
  );


  const online =
    await testarConexao();


  if (!online) {

    return;

  }


  await carregarResumo();

}


/* =========================================================
   INICIAR
   ========================================================= */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    iniciarSistema();

  }
);

</script>
