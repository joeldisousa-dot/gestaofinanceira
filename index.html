<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#0f4c81">

<meta name="description"
      content="Controle Financeiro">

<title>Controle Financeiro</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    Inter,
    "Segoe UI",
    Arial,
    sans-serif;

  color:#1e293b;

  background:
    linear-gradient(
      135deg,
      #eef4f9 0%,
      #f8fafc 45%,
      #e9f0f7 100%
    );
}


/* =====================================================
   VARIÁVEIS
===================================================== */

:root{

  --azul:#0f4c81;
  --azul-2:#1976d2;
  --azul-claro:#e8f1fb;

  --verde:#087f5b;
  --verde-2:#12b886;

  --roxo:#6d28d9;
  --roxo-2:#9333ea;

  --laranja:#e65100;
  --laranja-2:#ff9800;

  --vermelho:#c62828;

  --texto:#1e293b;
  --texto-fraco:#64748b;

  --borda:#e2e8f0;

  --branco:#ffffff;

  --sombra:
    0 20px 50px rgba(15,23,42,.10);

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

  width:
    min(
      calc(100% - 30px),
      1180px
    );

  margin:30px auto;

  background:#fff;

  border-radius:24px;

  overflow:hidden;

  box-shadow:
    var(--sombra);

}


/* =====================================================
   CABEÇALHO
===================================================== */

.header{

  position:relative;

  padding:32px 36px;

  color:white;

  background:
    linear-gradient(
      135deg,
      #082f49 0%,
      #0f4c81 45%,
      #1976d2 100%
    );

  overflow:hidden;

}

.header::after{

  content:"";

  position:absolute;

  width:300px;
  height:300px;

  right:-100px;
  top:-130px;

  border-radius:50%;

  background:
    rgba(255,255,255,.08);

}

.header-content{

  position:relative;

  z-index:2;

}

.header h1{

  margin:0;

  font-size:
    clamp(
      25px,
      4vw,
      34px
    );

  font-weight:800;

  letter-spacing:-.6px;

}

.header p{

  margin:8px 0 0;

  color:
    rgba(255,255,255,.82);

  font-size:15px;

}


/* =====================================================
   CONTEÚDO
===================================================== */

.conteudo{

  padding:
    30px 36px 40px;

}


/* =====================================================
   TÍTULOS
===================================================== */

.titulo-secao{

  display:flex;

  align-items:center;

  gap:15px;

  margin:
    28px 0 20px;

}

.titulo-secao:first-child{
  margin-top:0;
}

.titulo-secao h2{

  margin:0;

  font-size:20px;

  color:#0f172a;

  white-space:nowrap;

}

.linha{

  flex:1;

  height:2px;

  background:
    linear-gradient(
      90deg,
      #1976d2,
      #dbeafe,
      transparent
    );

}


/* =====================================================
   RESUMO
===================================================== */

.resumo{

  display:grid;

  grid-template-columns:
    repeat(
      6,
      minmax(140px,1fr)
    );

  gap:15px;

}


.campo-resumo{

  position:relative;

  padding:18px;

  min-height:120px;

  display:flex;

  flex-direction:column;

  justify-content:center;

  border:
    1px solid var(--borda);

  border-radius:16px;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #f8fafc
    );

  box-shadow:
    0 5px 18px rgba(15,23,42,.05);

  transition:
    transform .2s ease,
    box-shadow .2s ease;

}

.campo-resumo:hover{

  transform:
    translateY(-3px);

  box-shadow:
    0 10px 25px rgba(15,23,42,.09);

}

.campo-resumo label{

  display:block;

  margin-bottom:9px;

  color:
    var(--texto-fraco);

  font-size:13px;

  font-weight:700;

}

.campo-resumo input{

  width:100%;

  border:none;

  outline:none;

  background:transparent;

  color:#0f172a;

  font-size:18px;

  font-weight:800;

}


/* =====================================================
   FORMULÁRIOS
===================================================== */

.formulario{

  display:grid;

  grid-template-columns:
    repeat(2,minmax(250px,1fr));

  gap:20px 28px;

  max-width:760px;

  margin:auto;

}

.campo{

  display:flex;

  flex-direction:column;

  gap:7px;

}

.campo label{

  color:#334155;

  font-size:14px;

  font-weight:700;

}

.campo input,
.campo select{

  width:100%;

  height:44px;

  padding:
    0 13px;

  border:
    1px solid #cbd5e1;

  border-radius:10px;

  background:#fff;

  color:#1e293b;

  font-size:15px;

  outline:none;

  transition:
    border-color .2s,
    box-shadow .2s;

}

.campo input:focus,
.campo select:focus{

  border-color:
    #1976d2;

  box-shadow:
    0 0 0 3px
    rgba(25,118,210,.12);

}

.full{

  grid-column:
    1 / -1;

}


/* =====================================================
   BOTÕES
===================================================== */

button{

  font-family:inherit;

}

.btn{

  border:none;

  min-height:52px;

  padding:
    0 22px;

  border-radius:13px;

  cursor:pointer;

  color:white;

  font-size:15px;

  font-weight:800;

  letter-spacing:.15px;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  box-shadow:
    0 6px 15px rgba(15,23,42,.16);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;

}

.btn:hover{

  transform:
    translateY(-2px);

  box-shadow:
    0 10px 22px rgba(15,23,42,.22);

  filter:
    brightness(1.05);

}

.btn:active{

  transform:
    translateY(0);

}

.btn:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;

}

.btnSaldo{

  width:100%;

  background:
    linear-gradient(
      135deg,
      var(--verde),
      var(--verde-2)
    );

}

.btnFechar{

  background:
    linear-gradient(
      135deg,
      var(--roxo),
      var(--roxo-2)
    );

}

.btnRelatorio{

  background:
    linear-gradient(
      135deg,
      var(--laranja),
      var(--laranja-2)
    );

}

.btnGravar{

  width:100%;

  background:
    linear-gradient(
      135deg,
      #0d47a1,
      #2196f3
    );

}


/* =====================================================
   AÇÕES
===================================================== */

.acoes{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(190px,1fr)
    );

  gap:13px;

  padding:5px 0;

}

.acoes .btn{

  width:100%;

}


/* =====================================================
   DIVISÓRIA
===================================================== */

hr{

  border:none;

  border-top:
    1px solid #e2e8f0;

  margin:
    32px 0;

}


/* =====================================================
   STATUS
===================================================== */

.status-bar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  margin-top:25px;

  padding:
    12px 16px;

  border-radius:12px;

  background:#f8fafc;

  border:
    1px solid var(--borda);

  color:
    var(--texto-fraco);

  font-size:13px;

}

.status-indicator{

  display:inline-flex;

  align-items:center;

  gap:7px;

}

.status-dot{

  width:9px;
  height:9px;

  border-radius:50%;

  background:#22c55e;

  box-shadow:
    0 0 0 4px
    rgba(34,197,94,.12);

}


/* =====================================================
   MODAL
===================================================== */

.modal{

  display:none;

  position:fixed;

  inset:0;

  z-index:3000;

  padding:20px;

  align-items:center;

  justify-content:center;

  background:
    rgba(15,23,42,.58);

  backdrop-filter:
    blur(4px);

}

.modal.aberto{

  display:flex;

}

.modal-card{

  width:
    min(
      100%,
      420px
    );

  background:white;

  border-radius:20px;

  padding:26px;

  box-shadow:
    0 25px 70px rgba(0,0,0,.28);

}

.modal-card h3{

  margin:
    0 0 20px;

  color:#0f172a;

  font-size:20px;

}

.modal-card label{

  display:block;

  margin-bottom:7px;

  font-size:14px;

  font-weight:700;

}

.modal-card input{

  width:100%;

  height:45px;

  padding:10px;

  border:
    1px solid #cbd5e1;

  border-radius:10px;

  font-size:16px;

  outline:none;

}

.modal-acoes{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:18px;

}


/* =====================================================
   LOADING
===================================================== */

#loading{

  display:none;

  position:fixed;

  inset:0;

  z-index:9999;

  align-items:center;

  justify-content:center;

  background:
    rgba(255,255,255,.72);

  backdrop-filter:
    blur(3px);

}

.loading-card{

  padding:25px 30px;

  background:white;

  border-radius:18px;

  box-shadow:
    0 20px 50px rgba(0,0,0,.18);

  text-align:center;

}

.spinner{

  width:42px;
  height:42px;

  margin:auto;

  border:
    4px solid #e2e8f0;

  border-top-color:
    #1976d2;

  border-radius:50%;

  animation:
    girar .8s linear infinite;

}

.loading-text{

  margin-top:12px;

  color:#475569;

  font-size:14px;

  font-weight:700;

}

@keyframes girar{

  to{
    transform:rotate(360deg);
  }

}


/* =====================================================
   MENSAGEM
===================================================== */

.mensagem{

  display:none;

  position:fixed;

  right:22px;

  top:22px;

  z-index:10000;

  max-width:
    min(
      400px,
      calc(100% - 44px)
    );

  padding:
    14px 18px;

  border-radius:12px;

  background:
    #15803d;

  color:white;

  font-size:14px;

  font-weight:700;

  box-shadow:
    0 12px 30px rgba(0,0,0,.2);

}

.mensagem.erro{

  background:
    #b91c1c;

}


/* =====================================================
   RODAPÉ
===================================================== */

.footer{

  margin-top:30px;

  padding-top:20px;

  border-top:
    1px solid #e2e8f0;

  text-align:center;

  color:#94a3b8;

  font-size:12px;

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:1000px){

  .resumo{

    grid-template-columns:
      repeat(3,1fr);

  }

}

@media(max-width:700px){

  .container{

    width:
      calc(100% - 16px);

    margin:8px auto;

    border-radius:18px;

  }

  .header{

    padding:25px 20px;

  }

  .conteudo{

    padding:
      22px 18px 30px;

  }

  .resumo{

    grid-template-columns:
      repeat(2,1fr);

  }

  .formulario{

    grid-template-columns:1fr;

  }

  .full{

    grid-column:1;

  }

  .titulo-secao h2{

    font-size:18px;

  }

  .status-bar{

    flex-direction:column;

    align-items:flex-start;

  }

}

@media(max-width:430px){

  .resumo{

    grid-template-columns:1fr;

  }

  .campo-resumo{

    min-height:100px;

  }

  .modal-acoes{

    grid-template-columns:1fr;

  }

}


/* =====================================================
   ACESSIBILIDADE
===================================================== */

button:focus-visible,
input:focus-visible,
select:focus-visible{

  outline:
    3px solid
    rgba(25,118,210,.28);

  outline-offset:2px;

}

</style>

</head>


<body>


<div class="container">


  <!-- =================================================
       CABEÇALHO
  ================================================== -->

  <header class="header">

    <div class="header-content">

      <h1>
        💰 Controle Financeiro
      </h1>

      <p>
        Gestão pessoal de contas, fluxo de caixa e resultados
      </p>

    </div>

  </header>


  <main class="conteudo">


    <!-- =================================================
         RESUMO
    ================================================== -->

    <div class="titulo-secao">

      <h2>
        📊 Resumo Financeiro
      </h2>

      <div class="linha"></div>

    </div>


    <section class="resumo">


      <div class="campo-resumo">

        <label>
          💰 Saldo Inicial
        </label>

        <input
          id="saldoInicialCard"
          readonly
          value="R$ 0,00">

      </div>


      <div class="campo-resumo">

        <label>
          📥 Contas a Receber
        </label>

        <input
          id="totalReceber"
          readonly
          value="R$ 0,00">

      </div>


      <div class="campo-resumo">

        <label>
          📤 Contas a Pagar
        </label>

        <input
          id="totalPagar"
          readonly
          value="R$ 0,00">

      </div>


      <div class="campo-resumo">

        <label>
          💵 Valor Pago
        </label>

        <input
          id="valorPago"
          readonly
          value="R$ 0,00">

      </div>


      <div class="campo-resumo">

        <label>
          💵 Valor Recebido
        </label>

        <input
          id="valorRecebido"
          readonly
          value="R$ 0,00">

      </div>


      <div class="campo-resumo">

        <label>

        </label>

        <input
          id="saldoBanco"
          readonly
          value="R$ 0,00">

    <!-- =================================================
         CONTROLE MENSAL
    ================================================== -->

    <div class="titulo-secao">

      <h2>
        ⚙️ Controle Mensal

    <section class="formulario">

        <label for="competencia">

        <input

    <!-- =================================================

<!-- =====================================================

<div

  id="mensagemSistema"
  class="mensagem"
  role="alert">
</div>


<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

/*
 * URL DA WEB APP DO GOOGLE APPS SCRIPT
 *
 * IMPORTANTE:
 * Use a URL /exec da implantação publicada.
 */

const URL_SISTEMA =
  "https://script.google.com/macros/s/AKfycbwT12x2vBm0PQZ9Cfn1btBZT3y5LplAY7ysMAAlPuAdJ7psZlJhTOwqKcWf7B6g82cI/exec";


/*
 * O GitHub Pages não possui google.script.run.
 *
 * A comunicação é feita através de JSONP.
 */

let contadorJSONP = 0;


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

window.addEventListener(
  "load",
  inicializar
);


function inicializar(){

  const hoje =
    new Date();

  const competencia =
    hoje.getFullYear() +
    "-" +
    String(
      hoje.getMonth() + 1
    ).padStart(2,"0");


  document
    .getElementById("competencia")
    .value =
    competencia;


  document
    .getElementById("competencia")
    .addEventListener(
      "change",
      carregar
    );


  carregarDescricoes();

  carregar();

}


/* =====================================================
   JSONP
===================================================== */

function chamarAPI(
  acao,
  parametros = {},
  timeout = 15000
){

  return new Promise(
    function(resolve,reject){

      const callback =
        "jsonpCallback_" +
        Date.now() +
        "_" +
        (++contadorJSONP);


      const script =
        document.createElement("script");


      let finalizado = false;


      const timer =
        setTimeout(
          function(){

            finalizar();

            reject(
              new Error(
                "Tempo limite excedido ao acessar o Google Apps Script."
              )
            );

          },
          timeout
        );


      function finalizar(){

        if(finalizado){
          return;
        }

        finalizado = true;

        clearTimeout(timer);

        try{
          delete window[callback];
        }catch(e){
          window[callback] =
            undefined;
        }

        if(script.parentNode){
          script.parentNode.removeChild(
            script
          );
        }

      }


      window[callback] =
        function(resposta){

          finalizar();

          if(
            resposta &&
            resposta.sucesso === false &&
            resposta.erro
          ){

            reject(
              new Error(
                resposta.erro
              )
            );

            return;

          }

          resolve(
            resposta
          );

        };


      script.onerror =
        function(){

          finalizar();

          reject(
            new Error(
              "Falha ao conectar ao Google Apps Script."
            )
          );

        };


      const query =
        new URLSearchParams();


      query.set(
        "action",
        acao
      );


      query.set(
        "callback",
        callback
      );


      Object.keys(parametros)
        .forEach(
          function(chave){

            const valor =
              parametros[chave];

            if(
              valor !== undefined &&
              valor !== null
            ){

              query.set(
                chave,
                String(valor)
              );

            }

          }
        );


      script.src =
        URL_SISTEMA +
        "?" +
        query.toString();


      document
        .head
        .appendChild(script);

    }
  );

}


/* =====================================================
   LOADING
===================================================== */

function mostrarLoading(
  valor,
  texto = "Processando..."
){

  const loading =
    document.getElementById(
      "loading"
    );

  const textoEl =
    document.querySelector(
      ".loading-text"
    );


  textoEl.textContent =
    texto;


  loading.style.display =
    valor
      ? "flex"
      : "none";

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
  texto,
  tipo = ""
){

  const elemento =
    document.getElementById(
      "mensagemSistema"
    );


  elemento.textContent =
    texto;


  elemento.className =
    "mensagem " +
    tipo;


  elemento.style.display =
    "block";


  setTimeout(
    function(){

      elemento.style.display =
        "none";

    },
    4000
  );

}


/* =====================================================
   STATUS
===================================================== */

function atualizarStatus(
  texto
){

  document
    .getElementById(
      "statusTexto"
    )
    .textContent =
    texto;


  document
    .getElementById(
      "ultimaAtualizacao"
    )
    .textContent =
    "Atualizado em " +
    new Date().toLocaleTimeString(
      "pt-BR"
    );

}


/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatar(valor){

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


/* =====================================================
   CARREGAR RESUMO
===================================================== */

async function carregar(){

  const competencia =
    document
      .getElementById(
        "competencia"
      )
      .value;


  if(!competencia){
    return;
  }


  mostrarLoading(
    true,
    "Carregando resumo..."
  );


  try{

    const r =
      await chamarAPI(
        "obterResumo",
        {
          competencia:
            competencia
        }
      );


    document
      .getElementById(
        "saldoInicialCard"
      )
      .value =
      formatar(
        r.saldoInicial
      );


    document
      .getElementById(
        "totalReceber"
      )
      .value =
      formatar(
        r.receber
      );


    document
      .getElementById(
        "totalPagar"
      )
      .value =
      formatar(
        r.pagar
      );


    document
      .getElementById(
        "valorPago"
      )
      .value =
      formatar(
        r.valorPago
      );


    document
      .getElementById(
        "valorRecebido"
      )
      .value =
      formatar(
        r.valorRecebido
      );


    document
      .getElementById(
        "saldoBanco"
      )
      .value =
      formatar(
        r.saldoBanco
      );


    atualizarStatus(
      "Sistema conectado"
    );

  }
  catch(e){

    atualizarStatus(
      "Erro de conexão"
    );


    mostrarMensagem(
      "Erro ao carregar o resumo: " +
      e.message,
      "erro"
    );

    console.error(e);

  }
  finally{

    mostrarLoading(false);

  }

}


/* =====================================================
   DESCRIÇÕES
===================================================== */

async function carregarDescricoes(){

  const campo =
    document.getElementById(
      "descricao"
    );


  try{

    const lista =
      await chamarAPI(
        "listarDescricoes"
      );


    campo.innerHTML =
      "";


    const primeira =
      document.createElement(
        "option"
      );


    primeira.value =
      "";

    primeira.textContent =
      "Selecione";


    campo.appendChild(
      primeira
    );


    if(
      Array.isArray(lista)
    ){

      lista.forEach(
        function(item){

          const option =
            document.createElement(
              "option"
            );


          option.value =
            item;


          option.textContent =
            item;


          campo.appendChild(
            option
          );

        }
      );

    }

  }
  catch(e){

    campo.innerHTML =
      '<option value="">Erro ao carregar</option>';


    console.error(
      e
    );

  }

}


/* =====================================================
   GRAVAR LANÇAMENTO
===================================================== */

async function gravar(){

  const competencia =
    document
      .getElementById(
        "competencia"
      )
      .value;


  const tipo =
    document
      .getElementById(
        "tipo"
      )
      .value;


  const descricao =
    document
      .getElementById(
        "descricao"
      )
      .value;


  const valor =
    document
      .getElementById(
        "valor"
      )
      .value;


  const vencimento =
    document
      .getElementById(
        "vencimento"
      )
      .value;


  if(!competencia){

    mostrarMensagem(
      "Selecione uma competência.",
      "erro"
    );

    return;

  }


  if(!descricao){

    mostrarMensagem(
      "Informe a descrição.",
      "erro"
    );

    return;

  }


  if(
    !valor ||
    Number(valor) < 0
  ){

    mostrarMensagem(
      "Informe um valor válido.",
      "erro"
    );

    return;

  }


  mostrarLoading(
    true,
    "Gravando lançamento..."
  );


  try{

    const res =
      await chamarAPI(
        "salvarLancamento",
        {
          competencia:
            competencia,

          tipo:
            tipo,

          descricao:
            descricao,

          valor:
            valor,

          vencimento:
            vencimento
        }
      );


    mostrarMensagem(
      res.mensagem ||
      "Lançamento salvo com sucesso."
    );


    document
      .getElementById(
        "valor"
      )
      .value =
      "";


    document
      .getElementById(
        "vencimento"
      )
      .value =
      "";


    await carregar();

  }
  catch(e){

    mostrarMensagem(
      e.message,
      "erro"
    );

  }
  finally{

    mostrarLoading(false);

  }

}


/* =====================================================
   SALDO INICIAL
===================================================== */

function abrirSaldo(){

  document
    .getElementById(
      "janelaSaldo"
    )
    .classList.add(
      "aberto"
    );


  document
    .getElementById(
      "novoSaldo"
    )
    .focus();

}


function fecharSaldo(){

  document
    .getElementById(
      "janelaSaldo"
    )
    .classList.remove(
      "aberto"
    );

}


function fecharModalFora(
  event
){

  if(
    event.target.id ===
    "janelaSaldo"
  ){

    fecharSaldo();

  }

}


async function salvarNovoSaldo(){

  const competencia =
    document
      .getElementById(
        "competencia"
      )
      .value;


  const valor =
    document
      .getElementById(
        "novoSaldo"
      )
      .value;


  if(!competencia){

    mostrarMensagem(
      "Selecione uma competência.",
      "erro"
    );

    return;

  }


  if(
    valor === "" ||
    isNaN(Number(valor))
  ){

    mostrarMensagem(
      "Informe um saldo válido.",
      "erro"
    );

    return;

  }


  mostrarLoading(
    true,
    "Salvando saldo inicial..."
  );


  try{

    await chamarAPI(
      "salvarSaldoInicial",
      {
        competencia:
          competencia,

        valor:
          valor
      }
    );


    fecharSaldo();


    document
      .getElementById(
        "novoSaldo"
      )
      .value =
      "";


    mostrarMensagem(
      "Saldo inicial salvo com sucesso."
    );


    await carregar();

  }
  catch(e){

    mostrarMensagem(
      e.message,
      "erro"
    );

  }
  finally{

    mostrarLoading(false);

  }

}


/* =====================================================
   FECHAR COMPETÊNCIA
===================================================== */

async function fecharMes(){

  const comp =
    document
      .getElementById(
        "competencia"
      )
      .value;


  if(!comp){

    mostrarMensagem(
      "Selecione uma competência.",
      "erro"
    );

    return;

  }


  const confirmado =
    confirm(
      "Confirma o fechamento da competência " +
      comp +
      "?"
    );


  if(!confirmado){
    return;
  }


  mostrarLoading(
    true,
    "Fechando competência..."
  );


  try{

    const res =
      await chamarAPI(
        "fecharMes",
        {
          competencia:
            comp
        }
      );


    mostrarMensagem(
      res
    );


    await carregar();

  }
  catch(e){

    mostrarMensagem(
      e.message,
      "erro"
    );

  }
  finally{

    mostrarLoading(false);

  }

}


/* =====================================================
   ABRIR PÁGINAS DO APPS SCRIPT
===================================================== */

function abrirPagina(
  pagina,
  parametros = {}
){

  const url =
    new URL(
      URL_SISTEMA
    );


  url.searchParams.set(
    "page",
    pagina
  );


  Object.keys(parametros)
    .forEach(
      function(chave){

        url.searchParams.set(
          chave,
          parametros[chave]
        );

      }
    );


  window.open(
    url.toString(),
    "_blank"
  );

}

document.addEventListener(

    if(
      event.key ===

      fecharSaldo();

    }

  }
