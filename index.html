<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const URL_API =
  "https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


/* =========================================================
   ELEMENTOS
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   PÁGINAS DO GITHUB
========================================================= */

const PAGINAS = {

  lancamentos:
    "Lancamentos.html",

  graficos:
    "Graficos.html",

  atendimento:
    "atendimento.html",

  baixasPendentes:
    "BaixasPendentes.html",

  relatorio:
    "Relatorio.html"

};


/* =========================================================
   ESTADO
========================================================= */

let carregando = false;


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  iniciar
);


async function iniciar(){

  const hoje =
    new Date();

  const competencia =
    hoje.getFullYear()
    +
    "-"
    +
    String(
      hoje.getMonth()+1
    ).padStart(2,"0");


  $("competencia").value =
    competencia;


  try{

    mostrarLoading(
      true,
      "Conectando ao sistema..."
    );


    await carregarDescricoes();

    await carregar();

  }
  catch(e){

    mostrarMensagem(
      e.message ||
      "Não foi possível conectar ao servidor.",
      "error"
    );

  }
  finally{

    mostrarLoading(false);

  }

}


/* =========================================================
   API GOOGLE APPS SCRIPT
========================================================= */

async function apiRequest(
  action,
  params={}
){

  const url =
    new URL(URL_API);


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(function(chave){

      const valor =
        params[chave];


      if(
        valor !== undefined &&
        valor !== null
      ){

        url.searchParams.set(
          chave,
          typeof valor === "object"
            ? JSON.stringify(valor)
            : valor
        );

      }

    });


  let resposta;


  try{

    resposta =
      await fetch(
        url.toString(),
        {
          method:"GET",
          redirect:"follow",
          cache:"no-store"
        }
      );

  }
  catch(e){

    throw new Error(
      "Falha ao conectar ao Google Apps Script."
    );

  }


  if(!resposta.ok){

    throw new Error(
      "Servidor retornou HTTP " +
      resposta.status
    );

  }


  const texto =
    await resposta.text();


  let dados;


  try{

    dados =
      JSON.parse(texto);

  }
  catch(e){

    console.error(
      "Resposta recebida:",
      texto
    );

    throw new Error(
      "O Google Apps Script não retornou um JSON válido."
    );

  }


  if(
    dados &&
    dados.sucesso === false
  ){

    throw new Error(
      dados.erro ||
      dados.mensagem ||
      "Erro retornado pelo servidor."
    );

  }


  return dados;

}


/* =========================================================
   CARREGAR RESUMO
========================================================= */

async function carregar(){

  const competencia =
    $("competencia").value;


  if(!competencia){

    return;

  }


  validarCompetenciaLocal(
    competencia
  );


  mostrarLoading(
    true,
    "Carregando resumo..."
  );


  try{

    const r =
      await apiRequest(
        "obterResumo",
        {
          competencia:
            competencia
        }
      );


    $("saldoInicialCard").textContent =
      formatar(r.saldoInicial);


    $("totalReceber").textContent =
      formatar(r.receber);


    $("totalPagar").textContent =
      formatar(r.pagar);


    $("valorPago").textContent =
      formatar(r.valorPago);


    $("valorRecebido").textContent =
      formatar(r.valorRecebido);


    $("saldoBanco").textContent =
      formatar(r.saldoBanco);

  }
  catch(e){

    mostrarMensagem(
      "Erro ao carregar o resumo: " +
      e.message,
      "error"
    );

  }
  finally{

    mostrarLoading(false);

  }

}


/* =========================================================
   COMPETÊNCIA
========================================================= */

$("competencia").addEventListener(
  "change",
  carregar
);


/* =========================================================
   MOEDA
========================================================= */

function formatar(valor){

  return Number(
    valor || 0
  ).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


/* =========================================================
   DESCRIÇÕES
========================================================= */

async function carregarDescricoes(){

  const campo =
    $("descricao");


  campo.innerHTML =
    "<option value=''>Carregando...</option>";


  try{

    const lista =
      await apiRequest(
        "listarDescricoes"
      );


    campo.innerHTML =
      "";


    if(
      !Array.isArray(lista) ||
      lista.length === 0
    ){

      campo.innerHTML =
        "<option value=''>Selecione</option>";

      return;

    }


    const primeira =
      document.createElement(
        "option"
      );

    primeira.value = "";

    primeira.textContent =
      "Selecione";

    campo.appendChild(
      primeira
    );


    lista.forEach(function(item){

      const option =
        document.createElement(
          "option"
        );

      option.value =
        item;

      option.textContent =
        item;

      campo.appendChild(
        option
      );

    });

  }
  catch(e){

    campo.innerHTML =
      "<option value=''>Erro ao carregar</option>";

    throw e;

  }

}


/* =========================================================
   GRAVAR
========================================================= */

async function gravar(){

  const dados = {

    competencia:
      $("competencia").value,

    tipo:
      $("tipo").value,

    descricao:
      $("descricao").value,

    valor:
      $("valor").value,

    vencimento:
      $("vencimento").value

  };


  if(!dados.competencia){

    mostrarMensagem(
      "Selecione uma competência.",
      "error"
    );

    return;

  }


  if(!dados.descricao){

    mostrarMensagem(
      "Informe a descrição.",
      "error"
    );

    return;

  }


  if(
    dados.valor === "" ||
    Number(dados.valor) < 0
  ){

    mostrarMensagem(
      "Informe um valor válido.",
      "error"
    );

    return;

  }


  mostrarLoading(
    true,
    "Salvando lançamento..."
  );


  try{

    const resposta =
      await apiRequest(
        "salvarLancamento",
        {
          dados:
            dados
        }
      );


    mostrarMensagem(
      resposta.mensagem ||
      "Lançamento salvo com sucesso.",
      "success"
    );


    $("valor").value =
      "";

    $("vencimento").value =
      "";


    await carregar();

  }
  catch(e){

    mostrarMensagem(
      e.message,
      "error"
    );

  }
  finally{

    mostrarLoading(false);

  }

}


/* =========================================================
   SALDO
========================================================= */

function abrirSaldo(){

  $("janelaSaldo")
    .classList.add(
      "show"
    );

  $("novoSaldo").focus();

}


function fecharSaldo(){

  $("janelaSaldo")
    .classList.remove(
      "show"
    );

}


function fecharModalFora(event){

  if(
    event.target ===
    $("janelaSaldo")
  ){

    fecharSaldo();

  }

}


async function salvarNovoSaldo(){

  const competencia =
    $("competencia").value;


  const valor =
    $("novoSaldo").value;


  if(!competencia){

    mostrarMensagem(
      "Selecione uma competência.",
      "error"
    );

    return;

  }


  if(
    valor === "" ||
    isNaN(Number(valor))
  ){

    mostrarMensagem(
      "Informe um valor válido.",
      "error"
    );

    return;

  }


  mostrarLoading(
    true,
    "Salvando saldo..."
  );


  try{

    const resposta =
      await apiRequest(
        "salvarSaldoInicial",
        {
          competencia:
            competencia,

          valor:
            valor
        }
      );


    mostrarMensagem(
      resposta.mensagem ||
      "Saldo inicial salvo com sucesso.",
      "success"
    );


    $("novoSaldo").value =
      "";


    fecharSaldo();


    await carregar();

  }
  catch(e){

    mostrarMensagem(
      e.message,
      "error"
    );

  }
  finally{

    mostrarLoading(false);

  }

}


/* =========================================================
   FECHAR MÊS
========================================================= */

async function fecharMes(){

  const competencia =
    $("competencia").value;


  if(!competencia){

    mostrarMensagem(
      "Selecione uma competência.",
      "error"
    );

    return;

  }


  const confirmar =
    confirm(
      "Confirma o fechamento da competência " +
      competencia +
      "?\n\n" +
      "O saldo final será utilizado como saldo inicial da próxima competência."
    );


  if(!confirmar){

    return;

  }


  mostrarLoading(
    true,
    "Fechando competência..."
  );


  try{

    const resposta =
      await apiRequest(
        "fecharMes",
        {
          competencia:
            competencia
        }
      );


    mostrarMensagem(
      resposta.mensagem ||
      resposta,
      "success"
    );


    await carregar();

  }
  catch(e){

    mostrarMensagem(
      e.message,
      "error"
    );

  }
  finally{

    mostrarLoading(false);

  }

}


/* =========================================================
   NAVEGAÇÃO GITHUB
========================================================= */

function abrirPagina(
  pagina,
  params={}
){

  let url =
    pagina;


  const query =
    new URLSearchParams();


  Object.keys(params)
    .forEach(function(chave){

      const valor =
        params[chave];


      if(
        valor !== undefined &&
        valor !== null &&
        valor !== ""
      ){

        query.set(
          chave,
          valor
        );

      }

    });


  const queryString =
    query.toString();


  if(queryString){

    url +=
      "?" +
      queryString;

  }


  window.location.href =
    url;

}


/* =========================================================
   LANÇAMENTOS
========================================================= */

function abrirLancamentos(){

  const competencia =
    $("competencia").value;


  if(!competencia){

    mostrarMensagem(
      "Selecione uma competência.",
      "error"
    );

    return;

  }


  abrirPagina(
    PAGINAS.lancamentos,
    {
      competencia:
        competencia
    }
  );

}


/* =========================================================
   RELATÓRIO
========================================================= */

function gerarRelatorio(){

  const competencia =
    $("competencia").value;


  if(!competencia){

    mostrarMensagem(
      "Selecione uma competência.",
      "error"
    );

    return;

  }


  abrirPagina(
    PAGINAS.relatorio,
    {
      competencia:
        competencia
    }
  );

}


/* =========================================================
   GRÁFICOS
========================================================= */

function abrirGraficos(){

  const competencia =
    $("competencia").value;


  if(!competencia){

    mostrarMensagem(
      "Selecione uma competência.",
      "error"
    );

    return;

  }


  const ano =
    competencia.substring(
      0,
      4
    );


  abrirPagina(
    PAGINAS.graficos,
    {
      ano:
        ano
    }
  );

}


/* =========================================================
   ATENDIMENTO
========================================================= */

function abrirAtendimento(){

  abrirPagina(
    PAGINAS.atendimento
  );

}


/* =========================================================
   BAIXAS PENDENTES
========================================================= */

function abrirBaixasPendentes(){

  abrirPagina(
    PAGINAS.baixasPendentes
  );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function mostrarMensagem(
  texto,
  tipo="success"
){

  const elemento =
    $("mensagemSistema");


  elemento.textContent =
    texto;


  elemento.className =
    "toast show " +
    tipo;


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function(){

        elemento.classList.remove(
          "show"
        );

      },
      4500
    );

}


/* =========================================================
   LOADING
========================================================= */

function mostrarLoading(
  mostrar,
  texto="Processando..."
){

  const elemento =
    $("loading");


  if(mostrar){

    $("loadingText")
      .textContent =
      texto;

    elemento.classList.add(
      "show"
    );

  }
  else{

    elemento.classList.remove(
      "show"
    );

  }

}


/* =========================================================
   VALIDAÇÃO
========================================================= */

function validarCompetenciaLocal(
  competencia
){

  if(
    !/^\d{4}-\d{2}$/.test(
      competencia
    )
  ){

    throw new Error(
      "Competência inválida."
    );

  }


  const ano =
    Number(
      competencia.substring(
        0,
        4
      )
    );


  const mes =
    Number(
      competencia.substring(
        5,
        7
      )
    );


  if(
    ano < 1900 ||
    ano > 3000 ||
    mes < 1 ||
    mes > 12
  ){

    throw new Error(
      "Competência inválida."
    );

  }

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      fecharSaldo();

    }

  }
);


/* =========================================================
   ENTER
========================================================= */

$("novoSaldo")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        salvarNovoSaldo();

      }

    }
  );

</script>
