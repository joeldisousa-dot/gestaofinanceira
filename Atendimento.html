<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<base target="_top">

<title>Atendimento</title>

<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:linear-gradient(135deg,#e8eef5,#ffffff);
    color:#263238;
}

/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:1400px;
    margin:0 auto;
    padding:20px;
}

/* =========================================================
   CABEÇALHO
========================================================= */

.header{
    background:#ffffff;
    border-radius:16px;
    padding:20px 24px;
    margin-bottom:18px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.header-icon{
    width:48px;
    height:48px;
    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#1976d2;
    color:#ffffff;

    font-size:24px;
}

.header h1{
    margin:0;
    font-size:24px;
    font-weight:700;
}

.header p{
    margin:4px 0 0;
    color:#78909c;
    font-size:14px;
}

/* =========================================================
   BOTÕES
========================================================= */

button{
    border:0;
    cursor:pointer;
    font-family:inherit;
}

.btn{
    min-height:42px;
    padding:0 18px;

    border-radius:9px;

    font-size:14px;
    font-weight:600;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-1px);
}

.btn-primary{
    background:#1976d2;
    color:#ffffff;
}

.btn-primary:hover{
    background:#1565c0;
}

.btn-secondary{
    background:#eceff1;
    color:#37474f;
}

.btn-secondary:hover{
    background:#dfe4e7;
}

.btn-danger{
    background:#d32f2f;
    color:#ffffff;
}

/* =========================================================
   ÁREA DE PESQUISA
========================================================= */

.search-card{
    background:#ffffff;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;

    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.search-title{
    margin:0 0 14px;

    font-size:17px;
    font-weight:700;
}

.search-area{
    display:flex;
    gap:10px;
    align-items:center;
}

.search-input{
    flex:1;

    height:46px;

    padding:0 15px;

    border:1px solid #cfd8dc;
    border-radius:9px;

    font-size:15px;
    outline:none;

    transition:.2s;
}

.search-input:focus{
    border-color:#1976d2;
    box-shadow:0 0 0 3px rgba(25,118,210,.10);
}

.search-help{
    margin-top:10px;

    font-size:12px;
    color:#78909c;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    display:none;

    background:#ffffff;

    border-radius:12px;

    padding:12px 16px;

    margin-bottom:15px;

    font-size:14px;
}

.status.show{
    display:block;
}

.status.loading{
    color:#1565c0;
    background:#e3f2fd;
}

.status.success{
    color:#2e7d32;
    background:#e8f5e9;
}

.status.error{
    color:#c62828;
    background:#ffebee;
}

/* =========================================================
   RESULTADOS
========================================================= */

.result-card{
    background:#ffffff;

    border-radius:16px;

    box-shadow:0 4px 18px rgba(0,0,0,.08);

    overflow:hidden;
}

.result-header{
    padding:18px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #eceff1;
}

.result-title{
    margin:0;

    font-size:17px;
    font-weight:700;
}

.result-count{
    background:#e3f2fd;
    color:#1565c0;

    padding:6px 11px;

    border-radius:20px;

    font-size:12px;
    font-weight:700;
}

/* =========================================================
   TABELA
========================================================= */

.table-container{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

thead{
    background:#f5f7f9;
}

th{
    padding:13px 14px;

    text-align:left;

    font-size:12px;
    font-weight:700;

    color:#546e7a;

    border-bottom:1px solid #e0e0e0;

    white-space:nowrap;
}

td{
    padding:13px 14px;

    font-size:13px;

    border-bottom:1px solid #eceff1;

    vertical-align:middle;
}

tbody tr{
    transition:.15s;
}

tbody tr:hover{
    background:#f8fafc;
}

/* =========================================================
   CÉLULAS
========================================================= */

.col-id{
    width:90px;
    color:#78909c;
    white-space:nowrap;
}

.col-data{
    width:120px;
    white-space:nowrap;
}

.col-acoes{
    width:100px;
    text-align:center;
}

.descricao{
    font-weight:600;
    color:#263238;
}

.valor{
    font-weight:700;
    white-space:nowrap;
}

/* =========================================================
   BADGES
========================================================= */

.badge{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-height:25px;

    padding:4px 9px;

    border-radius:20px;

    font-size:11px;
    font-weight:700;

    white-space:nowrap;
}

.badge-success{
    background:#e8f5e9;
    color:#2e7d32;
}

.badge-warning{
    background:#fff8e1;
    color:#ef6c00;
}

.badge-info{
    background:#e3f2fd;
    color:#1565c0;
}

.badge-neutral{
    background:#eceff1;
    color:#546e7a;
}

/* =========================================================
   BOTÃO DETALHES
========================================================= */

.btn-view{
    min-height:32px;

    padding:0 10px;

    border-radius:7px;

    background:#eceff1;

    color:#37474f;

    font-size:12px;
    font-weight:600;
}

.btn-view:hover{
    background:#dfe4e7;
}

/* =========================================================
   ESTADO VAZIO
========================================================= */

.empty{
    padding:55px 20px;

    text-align:center;
}

.empty-icon{
    font-size:42px;

    margin-bottom:10px;
}

.empty-title{
    font-size:17px;
    font-weight:700;

    color:#455a64;
}

.empty-text{
    margin-top:6px;

    font-size:13px;

    color:#90a4ae;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    display:none;

    position:fixed;

    inset:0;

    z-index:1000;

    background:rgba(0,0,0,.45);

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:700px;
    max-height:90vh;

    background:#ffffff;

    border-radius:16px;

    box-shadow:0 15px 50px rgba(0,0,0,.25);

    overflow:hidden;

    animation:modalEntrada .18s ease;
}

@keyframes modalEntrada{

    from{
        opacity:0;
        transform:translateY(10px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.modal-header{
    padding:18px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid #eceff1;
}

.modal-title{
    margin:0;

    font-size:18px;
    font-weight:700;
}

.modal-close{
    width:34px;
    height:34px;

    border-radius:8px;

    background:#eceff1;

    color:#455a64;

    font-size:20px;
}

.modal-close:hover{
    background:#dfe4e7;
}

.modal-body{
    padding:20px;

    overflow:auto;

    max-height:calc(90vh - 75px);
}

/* =========================================================
   DETALHES
========================================================= */

.detail-grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:14px;
}

.detail-item{
    padding:13px;

    background:#f8fafc;

    border-radius:9px;

    border:1px solid #eceff1;
}

.detail-label{
    display:block;

    margin-bottom:5px;

    font-size:11px;

    color:#78909c;

    font-weight:700;

    text-transform:uppercase;
}

.detail-value{
    display:block;

    font-size:14px;

    color:#263238;

    word-break:break-word;
}

/* =========================================================
   LOADING
========================================================= */

.loading-overlay{
    position:fixed;

    inset:0;

    z-index:2000;

    background:rgba(255,255,255,.75);

    display:none;

    align-items:center;
    justify-content:center;
}

.loading-overlay.show{
    display:flex;
}

.loading-box{
    background:#ffffff;

    border-radius:14px;

    padding:25px 35px;

    box-shadow:0 8px 30px rgba(0,0,0,.15);

    text-align:center;
}

.spinner{
    width:34px;
    height:34px;

    margin:0 auto 12px;

    border:4px solid #e3f2fd;

    border-top-color:#1976d2;

    border-radius:50%;

    animation:girar .8s linear infinite;
}

@keyframes girar{

    to{
        transform:rotate(360deg);
    }

}

.loading-text{
    font-size:13px;
    color:#546e7a;
}

/* =========================================================
   RODAPÉ
========================================================= */

.footer{
    padding:18px 5px;

    text-align:center;

    color:#90a4ae;

    font-size:11px;
}

/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:800px){

    .container{
        padding:12px;
    }

    .header{
        padding:16px;

        flex-direction:column;
        align-items:stretch;
    }

    .header-left{
        width:100%;
    }

    .search-area{
        flex-direction:column;
    }

    .search-input,
    .search-area .btn{
        width:100%;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .header h1{
        font-size:20px;
    }

    .header p{
        font-size:12px;
    }

    .result-header{
        padding:15px;
    }

}

</style>

</head>


<body>

<div class="container">

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="header">

        <div class="header-left">

            <div class="header-icon">
                👥
            </div>

            <div>

                <h1>
                    Atendimento
                </h1>

                <p>
                    Pesquisa e consulta de atendimentos
                </p>

            </div>

        </div>

        <button
            class="btn btn-secondary"
            onclick="voltar()">

            ← Voltar

        </button>

    </header>


    <!-- =====================================================
         PESQUISA
    ====================================================== -->

    <section class="search-card">

        <h2 class="search-title">
            Pesquisar atendimento
        </h2>

        <div class="search-area">

            <input
                type="text"
                id="campoPesquisa"
                class="search-input"
                autocomplete="off"
                placeholder="Digite nome, código, CPF, CNPJ ou outra informação...">

            <button
                class="btn btn-primary"
                id="btnPesquisar"
                onclick="pesquisar()">

                🔎 Pesquisar

            </button>

            <button
                class="btn btn-secondary"
                onclick="limparPesquisa()">

                Limpar

            </button>

        </div>

        <div class="search-help">

            Informe um termo para localizar os registros de atendimento.

        </div>

    </section>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="status"
        class="status">
    </div>


    <!-- =====================================================
         RESULTADOS
    ====================================================== -->

    <section class="result-card">

        <div class="result-header">

            <h2 class="result-title">
                Resultados
            </h2>

            <span
                id="contador"
                class="result-count">

                0 registros

            </span>

        </div>


        <div
            id="resultado">

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <div class="empty-title">
                    Nenhuma pesquisa realizada
                </div>

                <div class="empty-text">
                    Digite um termo acima para iniciar a pesquisa.
                </div>

            </div>

        </div>

    </section>


    <footer class="footer">

        Controle Financeiro • Atendimento

    </footer>

</div>


<!-- =========================================================
     MODAL DE DETALHES
========================================================== -->

<div
    id="modal"
    class="modal"
    onclick="fecharModalFora(event)">

    <div class="modal-content">

        <div class="modal-header">

            <h2
                id="modalTitulo"
                class="modal-title">

                Detalhes

            </h2>

            <button
                class="modal-close"
                onclick="fecharModal()">

                ×

            </button>

        </div>

        <div
            id="modalBody"
            class="modal-body">
        </div>

    </div>

</div>


<!-- =========================================================
     LOADING
========================================================== -->

<div
    id="loading"
    class="loading-overlay">

    <div class="loading-box">

        <div class="spinner"></div>

        <div class="loading-text">
            Pesquisando...
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const API_URL =
    "https://script.google.com/macros/s/AKfycbyaMJlpmVPnTqvCTosvINN4tNEHZygapcHtjhb03s0Ak_a2BOrX79knXWvKgWdyi4Us/exec";


let resultadosAtuais = [];

let requisicaoAtual = 0;


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener("DOMContentLoaded", function(){

    const campo =
        document.getElementById("campoPesquisa");

    if(campo){

        campo.addEventListener("keydown", function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                pesquisar();

            }

        });

        campo.focus();

    }

});


/* =========================================================
   PESQUISA
========================================================= */

function pesquisar(){

    const campo =
        document.getElementById("campoPesquisa");

    const termo =
        campo.value.trim();

    if(!termo){

        mostrarStatus(
            "Digite um termo para realizar a pesquisa.",
            "error"
        );

        campo.focus();

        return;

    }

    const numeroRequisicao =
        ++requisicaoAtual;

    mostrarLoading(true);

    mostrarStatus(
        "Pesquisando atendimento...",
        "loading"
    );

    document.getElementById("btnPesquisar").disabled = true;


    chamarAPI(
        "pesquisarAtendimento",
        {
            termo: termo
        }
    )

    .then(function(resposta){

        if(numeroRequisicao !== requisicaoAtual){
            return;
        }

        processarResposta(resposta);

    })

    .catch(function(erro){

        if(numeroRequisicao !== requisicaoAtual){
            return;
        }

        console.error(erro);

        resultadosAtuais = [];

        renderizarResultados([]);

        mostrarStatus(
            "Não foi possível realizar a pesquisa.",
            "error"
        );

    })

    .finally(function(){

        if(numeroRequisicao === requisicaoAtual){

            mostrarLoading(false);

            document.getElementById(
                "btnPesquisar"
            ).disabled = false;

        }

    });

}


/* =========================================================
   PROCESSAR RESPOSTA
========================================================= */

function processarResposta(resposta){

    if(!resposta){

        renderizarResultados([]);

        mostrarStatus(
            "Nenhum dado foi retornado.",
            "error"
        );

        return;

    }


    if(resposta.sucesso === false){

        renderizarResultados([]);

        mostrarStatus(
            resposta.mensagem ||
            "Ocorreu um erro na pesquisa.",
            "error"
        );

        return;

    }


    let dados = [];


    if(Array.isArray(resposta)){
        dados = resposta;
    }

    else if(Array.isArray(resposta.dados)){
        dados = resposta.dados;
    }

    else if(Array.isArray(resposta.lista)){
        dados = resposta.lista;
    }

    else if(Array.isArray(resposta.resultados)){
        dados = resposta.resultados;
    }

    else if(Array.isArray(resposta.atendimentos)){
        dados = resposta.atendimentos;
    }


    resultadosAtuais = dados;

    renderizarResultados(dados);


    if(dados.length){

        mostrarStatus(
            dados.length +
            " registro(s) encontrado(s).",
            "success"
        );

    }else{

        mostrarStatus(
            "Nenhum registro encontrado.",
            "error"
        );

    }

}


/* =========================================================
   RENDERIZAR RESULTADOS
========================================================= */

function renderizarResultados(dados){

    const container =
        document.getElementById("resultado");

    const contador =
        document.getElementById("contador");


    contador.textContent =
        dados.length +
        (dados.length === 1
            ? " registro"
            : " registros");


    if(!dados.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📭
                </div>

                <div class="empty-title">
                    Nenhum resultado encontrado
                </div>

                <div class="empty-text">
                    Tente utilizar outro termo de pesquisa.
                </div>

            </div>

        `;

        return;

    }


    /*
     * Descobre automaticamente as colunas
     * retornadas pelo Código.gs.
     */

    const colunas =
        obterColunas(dados);


    let html = `

        <div class="table-container">

            <table>

                <thead>

                    <tr>
    `;


    colunas.forEach(function(coluna){

        html += `

            <th>
                ${escaparHTML(formatarCabecalho(coluna))}
            </th>

        `;

    });


    html += `

                        <th class="col-acoes">
                            Ações
                        </th>

                    </tr>

                </thead>

                <tbody>

    `;


    dados.forEach(function(item,index){

        html += "<tr>";


        colunas.forEach(function(coluna){

            html += "<td>";

            html += formatarValorTabela(
                item[coluna],
                coluna
            );

            html += "</td>";

        });


        html += `

            <td class="col-acoes">

                <button
                    class="btn-view"
                    onclick="abrirDetalhes(${index})">

                    Ver

                </button>

            </td>

        `;


        html += "</tr>";

    });


    html += `

                </tbody>

            </table>

        </div>

    `;


    container.innerHTML = html;

}


/* =========================================================
   OBTER COLUNAS
========================================================= */

function obterColunas(dados){

    const mapa = {};
    const resultado = [];


    dados.forEach(function(item){

        if(!item || typeof item !== "object"){
            return;
        }


        Object.keys(item).forEach(function(chave){

            if(
                chave === "success" ||
                chave === "sucesso"
            ){

                return;

            }


            if(!mapa[chave]){

                mapa[chave] = true;

                resultado.push(chave);

            }

        });

    });


    return resultado;

}


/* =========================================================
   FORMATAR CABEÇALHO
========================================================= */

function formatarCabecalho(nome){

    if(!nome){
        return "";
    }


    const mapa = {

        id: "ID",

        nome: "Nome",

        cpf: "CPF",

        cnpj: "CNPJ",

        telefone: "Telefone",

        celular: "Celular",

        email: "E-mail",

        data: "Data",

        dataatendimento: "Data do Atendimento",

        competencia: "Competência",

        descricao: "Descrição",

        assunto: "Assunto",

        observacao: "Observação",

        observacoes: "Observações",

        status: "Status"

    };


    const chave =
        String(nome)
        .toLowerCase()
        .replace(/\s+/g,"")
        .replace(/_/g,"");


    if(mapa[chave]){
        return mapa[chave];
    }


    return String(nome)
        .replace(/_/g," ")
        .replace(/\b\w/g,function(letra){
            return letra.toUpperCase();
        });

}


/* =========================================================
   FORMATAR VALOR DA TABELA
========================================================= */

function formatarValorTabela(valor,chave){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return `
            <span class="badge badge-neutral">
                —
            </span>
        `;

    }


    const nome =
        String(chave)
        .toLowerCase()
        .replace(/\s+/g,"")
        .replace(/_/g,"");


    /* ---------------------------------------------
       STATUS
    --------------------------------------------- */

    if(nome === "status"){

        const texto =
            String(valor);

        const normalizado =
            normalizarTexto(texto);


        let classe =
            "badge-neutral";


        if(
            normalizado.includes("conclu") ||
            normalizado.includes("resol") ||
            normalizado.includes("final")
        ){

            classe =
                "badge-success";

        }

        else if(
            normalizado.includes("pend") ||
            normalizado.includes("aguard")
        ){

            classe =
                "badge-warning";

        }

        else if(
            normalizado.includes("andamento")
        ){

            classe =
                "badge-info";

        }


        return `

            <span class="badge ${classe}">
                ${escaparHTML(texto)}
            </span>

        `;

    }


    /* ---------------------------------------------
       VALORES MONETÁRIOS
    --------------------------------------------- */

    if(
        nome.includes("valor") ||
        nome.includes("preco") ||
        nome.includes("preço")
    ){

        const numero =
            converterNumero(valor);


        if(numero !== null){

            return `

                <span class="valor">
                    ${formatarMoeda(numero)}
                </span>

            `;

        }

    }


    /* ---------------------------------------------
       DATAS
    --------------------------------------------- */

    if(
        nome.includes("data") ||
        nome.includes("vencimento")
    ){

        const data =
            converterData(valor);


        if(data){

            return `
                <span class="col-data">
                    ${formatarData(data)}
                </span>
            `;

        }

    }


    return escaparHTML(String(valor));

}


/* =========================================================
   ABRIR DETALHES
========================================================= */

function abrirDetalhes(index){

    const item =
        resultadosAtuais[index];


    if(!item){
        return;
    }


    const modal =
        document.getElementById("modal");

    const titulo =
        document.getElementById("modalTitulo");

    const body =
        document.getElementById("modalBody");


    titulo.textContent =
        obterTituloDetalhe(item);


    const colunas =
        Object.keys(item);


    let html = `

        <div class="detail-grid">

    `;


    colunas.forEach(function(chave){

        if(
            chave === "success" ||
            chave === "sucesso"
        ){

            return;

        }


        const valor =
            item[chave];


        html += `

            <div class="detail-item">

                <span class="detail-label">

                    ${escaparHTML(
                        formatarCabecalho(chave)
                    )}

                </span>

                <span class="detail-value">

                    ${formatarValorDetalhe(valor,chave)}

                </span>

            </div>

        `;

    });


    html += `

        </div>

    `;


    body.innerHTML = html;

    modal.classList.add("show");

}


/* =========================================================
   TÍTULO DO DETALHE
========================================================= */

function obterTituloDetalhe(item){

    const camposNome = [
        "nome",
        "Nome",
        "cliente",
        "Cliente",
        "razao_social",
        "Razao Social"
    ];


    for(let i=0;i<camposNome.length;i++){

        const chave =
            camposNome[i];


        if(
            item[chave] !== undefined &&
            item[chave] !== null &&
            String(item[chave]).trim()
        ){

            return String(item[chave]);

        }

    }


    return "Detalhes do atendimento";

}


/* =========================================================
   FORMATAR VALOR DO DETALHE
========================================================= */

function formatarValorDetalhe(valor,chave){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return "—";

    }


    const nome =
        String(chave)
        .toLowerCase()
        .replace(/\s+/g,"")
        .replace(/_/g,"");


    if(
        nome.includes("data") ||
        nome.includes("vencimento")
    ){

        const data =
            converterData(valor);


        if(data){
            return escaparHTML(
                formatarData(data)
            );
        }

    }


    if(
        nome.includes("valor") ||
        nome.includes("preco") ||
        nome.includes("preço")
    ){

        const numero =
            converterNumero(valor);


        if(numero !== null){

            return escaparHTML(
                formatarMoeda(numero)
            );

        }

    }


    return escaparHTML(String(valor));

}

/* =========================================================
   CHAMADA DA API JSONP
========================================================= */

function chamarAPI(acao,parametros){

    return new Promise(function(resolve,reject){

        const callback =
            "callbackAtendimento_" +
            Date.now() +
            "_" +
            Math.floor(Math.random()*100000);


        const script =
            document.createElement("script");


        const timeout =
            setTimeout(function(){

                limpar();

                reject(
                    new Error(
                        "Tempo limite excedido."
                    )
                );

            },20000);


        function limpar(){

            clearTimeout(timeout);

            if(script.parentNode){

                script.parentNode.removeChild(script);

            }

            try{

                delete window[callback];

            }catch(e){

                window[callback] =
                    undefined;

            }

        }


        window[callback] =
            function(dados){

                limpar();

                resolve(dados);

            };


        const params =
            Object.assign(
                {},
                parametros || {}
            );


        params.action =
            acao;

        params.callback =
            callback;


        const query =
            Object.keys(params)

            .map(function(chave){

                return encodeURIComponent(chave) +
                    "=" +
                    encodeURIComponent(
                        params[chave] === null ||
                        params[chave] === undefined
                            ? ""
                            : params[chave]
                    );

            })

            .join("&");


        script.src =
            API_URL +
            "?" +
            query;


        script.async = true;


        script.onerror =
            function(){

                limpar();

                reject(
                    new Error(
                        "Erro ao acessar a API."
                    )
                );

            };


        document
            .head
            .appendChild(script);

    });

}

/* =========================================================
   CONVERTER NÚMERO
========================================================= */

function converterNumero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return null;

    }


    if(typeof valor === "number"){

        return Number.isFinite(valor)
            ? valor
            : null;

    }


    let texto =
        String(valor)
        .trim();


    if(!texto){
        return null;
    }


    texto =
        texto.replace(/[R$\s]/g,"");


    if(
        texto.includes(",") &&
        texto.includes(".")
    ){

        texto =
            texto.replace(/\./g,"")
                 .replace(",", ".");

    }

    else if(texto.includes(",")){

        texto =
            texto.replace(",", ".");

    }


    const numero =
        Number(texto);


    return Number.isFinite(numero)
        ? numero
        : null;

}


/* =========================================================
   MOEDA
========================================================= */

function formatarMoeda(valor){

    const numero =
        converterNumero(valor);


    if(numero === null){
        return "R$ 0,00";
    }


    return numero.toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =========================================================
   DATA
========================================================= */

function converterData(valor){

    if(!valor){
        return null;
    }


    if(valor instanceof Date){

        if(!isNaN(valor.getTime())){
            return valor;
        }

    }


    const texto =
        String(valor).trim();


    let match;


    match =
        texto.match(
            /^(\d{2})\/(\d{2})\/(\d{4})$/
        );


    if(match){

        const data =
            new Date(
                Number(match[3]),
                Number(match[2])-1,
                Number(match[1])
            );


        if(!isNaN(data.getTime())){
            return data;
        }

    }


    match =
        texto.match(
            /^(\d{4})-(\d{2})-(\d{2})$/
        );


    if(match){

        const data =
            new Date(
                Number(match[1]),
                Number(match[2])-1,
                Number(match[3])
            );


        if(!isNaN(data.getTime())){
            return data;
        }

    }


    const data =
        new Date(texto);


    if(!isNaN(data.getTime())){
        return data;
    }


    return null;

}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarData(data){

    if(!data){
        return "";
    }


    const dia =
        String(data.getDate())
        .padStart(2,"0");


    const mes =
        String(data.getMonth()+1)
        .padStart(2,"0");


    const ano =
        data.getFullYear();


    return dia +
        "/" +
        mes +
        "/" +
        ano;

}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizarTexto(texto){

    return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
