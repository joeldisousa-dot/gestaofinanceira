<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>Atendimento - Controle Financeiro</title>

<style>

/* =========================================================
   CONFIGURAÇÃO GERAL
========================================================= */

*{
  box-sizing:border-box;
}

body{

  margin:0;

  padding:20px;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #e8eef5,
      #ffffff
    );

  color:#333;

}

.container{

  max-width:1100px;

  margin:auto;

  background:#fff;

  padding:25px;

  border-radius:18px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.15);

}


/* =========================================================
   TOPO
========================================================= */

.topo{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:25px;

}

.topo h1{

  margin:0;

  color:#0d47a1;

  font-size:28px;

}

.btn-voltar{

  border:none;

  padding:12px 24px;

  border-radius:10px;

  background:
    linear-gradient(
      135deg,
      #455a64,
      #78909c
    );

  color:#fff;

  font-weight:bold;

  font-size:15px;

  cursor:pointer;

  transition:.2s;

}

.btn-voltar:hover{

  transform:translateY(-2px);

  filter:brightness(1.08);

}


/* =========================================================
   PESQUISA
========================================================= */

.pesquisa{

  background:#f5f7fa;

  border:1px solid #e0e6ed;

  border-radius:14px;

  padding:20px;

  margin-bottom:20px;

}

.pesquisa h2{

  margin:
    0 0 15px 0;

  color:#1976d2;

  font-size:19px;

}

.linha-pesquisa{

  display:grid;

  grid-template-columns:
    1fr auto;

  gap:12px;

}

input{

  width:100%;

  height:46px;

  padding:
    0 14px;

  border:
    1px solid #cbd5e1;

  border-radius:9px;

  font-size:15px;

  outline:none;

}

input:focus{

  border-color:#1976d2;

  box-shadow:
    0 0 0 3px
    rgba(25,118,210,.12);

}

.btn-pesquisar{

  height:46px;

  padding:
    0 25px;

  border:none;

  border-radius:9px;

  background:
    linear-gradient(
      135deg,
      #1976d2,
      #2196f3
    );

  color:#fff;

  font-size:15px;

  font-weight:bold;

  cursor:pointer;

  transition:.2s;

}

.btn-pesquisar:hover{

  filter:brightness(1.08);

  transform:translateY(-2px);

}

.btn-pesquisar:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;

}


/* =========================================================
   MENSAGENS
========================================================= */

.mensagem{

  display:none;

  margin:
    15px 0;

  padding:13px;

  border-radius:8px;

}

.mensagem.info{

  display:block;

  background:#e3f2fd;

  color:#1565c0;

}

.mensagem.erro{

  display:block;

  background:#ffebee;

  color:#c62828;

  border-left:
    5px solid #c62828;

  font-weight:bold;

}

.mensagem.sucesso{

  display:block;

  background:#e8f5e9;

  color:#2e7d32;

}


/* =========================================================
   ÁREA DE RESULTADO
========================================================= */

.resultado{

  margin-top:20px;

}


/* =========================================================
   TABELA
========================================================= */

.tabela-container{

  width:100%;

  overflow-x:auto;

  border:
    1px solid #e1e5ea;

  border-radius:12px;

}

table{

  width:100%;

  border-collapse:collapse;

  margin:0;

  font-size:14px;

  min-width:650px;

}

thead th{

  background:
    linear-gradient(
      135deg,
      #0d47a1,
      #1976d2
    );

  color:white;

  padding:13px 12px;

  text-align:left;

  font-weight:bold;

  position:sticky;

  top:0;

}

thead th:first-child{

  width:90px;

  text-align:center;

}

thead th:nth-child(2){

  width:40%;

}

thead th:nth-child(3){

  width:auto;

}

tbody td{

  padding:13px 12px;

  border-bottom:
    1px solid #e5e7eb;

  vertical-align:top;

  line-height:1.5;

}

tbody tr:nth-child(even){

  background:#f8f9fc;

}

tbody tr:hover{

  background:#eef5ff;

}

td.id{

  text-align:center;

  font-weight:bold;

  color:#0d47a1;

  white-space:nowrap;

}

td.problema{

  font-weight:600;

  color:#37474f;

}

td.solucao{

  color:#455a64;

  white-space:pre-line;

}


/* =========================================================
   ESTADO SEM RESULTADO
========================================================= */

.nenhum{

  text-align:center;

  padding:35px 20px;

  color:#777;

  background:#fafafa;

  border:
    1px solid #e5e7eb;

  border-radius:12px;

}

.carregando{

  text-align:center;

  padding:35px;

  color:#64748b;

  font-style:italic;

}


/* =========================================================
   RODAPÉ
========================================================= */

.rodape{

  margin-top:25px;

  text-align:center;

  color:#777;

  font-size:12px;

}


/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:700px){

  body{

    padding:10px;

  }

  .container{

    padding:15px;

    border-radius:12px;

  }

  .topo{

    flex-direction:column;

    align-items:stretch;

  }

  .topo h1{

    font-size:23px;

  }

  .btn-voltar{

    width:100%;

  }

  .linha-pesquisa{

    grid-template-columns:1fr;

  }

  .btn-pesquisar{

    width:100%;

  }

  table{

    font-size:13px;

  }

  thead th,
  tbody td{

    padding:10px 8px;

  }

}


/* =========================================================
   IMPRESSÃO
========================================================= */

@media print{

  body{

    background:white;

    padding:0;

  }

  .container{

    max-width:none;

    padding:10px;

    box-shadow:none;

  }

  .topo,
  .pesquisa,
  .mensagem,
  .rodape{

    display:none !important;

  }

  table{

    font-size:11px;

    min-width:0;

  }

  thead th{

    position:static;

  }

}

</style>

</head>

<body>

<div class="container">

  <!-- =====================================================
       TOPO
  ====================================================== -->

  <div class="topo">


<h1>
  🔎 Atendimento
</h1>

<button
  class="btn-voltar"
  onclick="voltar()">

  ⬅ Voltar

</button>


  </div>

  <!-- =====================================================
       PESQUISA
  ====================================================== -->

  <div class="pesquisa">


<h2>
  Pesquisar atendimento
</h2>

<div class="linha-pesquisa">

  <input
    id="campoPesquisa"
    type="text"
    placeholder="Digite o problema ou palavra-chave..."
    autocomplete="off">

  <button
    id="btnPesquisar"
    class="btn-pesquisar"
    onclick="pesquisar()">

    🔎 Pesquisar

  </button>

</div>


  </div>

  <!-- =====================================================
       MENSAGEM
  ====================================================== -->

  <div
    id="mensagem"
    class="mensagem">
  </div>

  <!-- =====================================================
       RESULTADO
  ====================================================== -->

  <div
    id="resultado"
    class="resultado">


<div class="nenhum">

  Digite um problema ou palavra-chave
  para realizar a pesquisa.

</div>


  </div>

  <div class="rodape">


Base de conhecimento da aba Atendimento

<br>

Controle Financeiro Pessoal


  </div>

</div>

<script>

/* =========================================================
   CONFIGURAÇÃO DA API
========================================================= */

const URL_API =
"https://script.google.com/macros/s/AKfycbw-Fry_UM89-p0FjPEoDNdfdTSNdz56sYzUA8VJIpD9_862l5dPSNmkWOGLXyZiqnRn/exec";


/* =========================================================
   URL DO INDEX NO GITHUB
========================================================= */

const URL_INDEX =
"https://joeldisousa-dot.github.io/gestaofinanceira/";


/* =========================================================
   CONTROLE JSONP
========================================================= */

let contadorJSONP = 0;


/* =========================================================
   CHAMAR GOOGLE APPS SCRIPT
========================================================= */

function chamarAPI(
  acao,
  parametros
){

  return new Promise(
    function(resolve,reject){

      const callback =
        "callbackAtendimento_" +
        Date.now() +
        "_" +
        (++contadorJSONP);


      const script =
        document.createElement(
          "script"
        );


      const dados =
        Object.assign(
          {},
          parametros || {}
        );


      dados.action =
        acao;

      dados.callback =
        callback;


      const query =
        Object.keys(dados)
          .map(
            function(chave){

              const valor =
                dados[chave];


              return (
                encodeURIComponent(chave) +
                "=" +
                encodeURIComponent(
                  valor === undefined ||
                  valor === null
                    ? ""
                    : String(valor)
                )
              );

            }
          )
          .join("&");


      const separador =
        URL_API.indexOf("?") >= 0
          ? "&"
          : "?";


      const url =
        URL_API +
        separador +
        query;


      let finalizado =
        false;


      const timeout =
        setTimeout(
          function(){

            if(finalizado){

              return;

            }


            finalizado =
              true;


            cleanup();


            reject(
              new Error(
                "Tempo limite excedido ao consultar a API."
              )
            );

          },
          30000
        );


      window[callback] =
        function(resposta){

          if(finalizado){

            return;

          }


          finalizado =
            true;


          clearTimeout(
            timeout
          );


          cleanup();


          resolve(
            resposta
          );

        };


      script.onerror =
        function(){

          if(finalizado){

            return;

          }


          finalizado =
            true;


          clearTimeout(
            timeout
          );


          cleanup();


          reject(
            new Error(
              "Não foi possível conectar ao Google Apps Script."
            )
          );

        };


      script.src =
        url;


      document.body.appendChild(
        script
      );


      function cleanup(){

        delete window[
          callback
        ];


        if(
          script.parentNode
        ){

          script.parentNode.removeChild(
            script
          );

        }

      }

    }
  );

}


/* =========================================================
   PESQUISAR
========================================================= */

async function pesquisar(){

  const campo =
    document.getElementById(
      "campoPesquisa"
    );


  const botao =
    document.getElementById(
      "btnPesquisar"
    );


  const resultado =
    document.getElementById(
      "resultado"
    );


  const texto =
    String(
      campo.value || ""
    ).trim();


  if(!texto){

    mostrarErro(
      "Digite o problema ou uma palavra-chave para pesquisar."
    );


    campo.focus();


    return;

  }


  botao.disabled =
    true;


  mostrarMensagem(
    "Pesquisando na aba Atendimento...",
    "info"
  );


  resultado.innerHTML =
    `
      <div class="carregando">
        🔎 Pesquisando informações...
      </div>
    `;


  try{

    const resposta =
      await chamarAPI(
        "pesquisarAtendimento",
        {
          texto:texto
        }
      );


    console.log(
      "Resposta da API Atendimento:",
      resposta
    );


    if(!resposta){

      throw new Error(
        "A API não retornou resposta."
      );

    }


    if(
      resposta.sucesso === false
    ){

      throw new Error(
        resposta.erro ||
        resposta.mensagem ||
        "Erro retornado pelo Google Apps Script."
      );

    }


    const lista =
      obterListaResposta(
        resposta
      );


    if(
      lista.length === 0
    ){

      resultado.innerHTML =
        `
          <div class="nenhum">

            Nenhum atendimento encontrado
            para:

            <strong>
              ${escaparHTML(texto)}
            </strong>

          </div>
        `;


      mostrarMensagem(
        "Nenhum registro encontrado.",
        "info"
      );


      return;

    }


    montarTabela(
      lista
    );


    mostrarMensagem(
      lista.length +
      (
        lista.length === 1
          ? " atendimento encontrado."
          : " atendimentos encontrados."
      ),
      "sucesso"
    );

  }
  catch(erro){

    console.error(
      "Erro ao pesquisar Atendimento:",
      erro
    );


    resultado.innerHTML =
      `
        <div class="mensagem erro"
             style="display:block">

          ❌ Erro ao pesquisar:

          <br>

          ${escaparHTML(
            erro.message
          )}

        </div>
      `;


    mostrarErro(
      erro.message
    );

  }
  finally{

    botao.disabled =
      false;

  }

}


/* =========================================================
   OBTER LISTA DA RESPOSTA
========================================================= */

function obterListaResposta(
  resposta
){

  if(
    Array.isArray(
      resposta
    )
  ){

    return resposta;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.lista
    )
  ){

    return resposta.lista;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.dados
    )
  ){

    return resposta.dados;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.resultado
    )
  ){

    return resposta.resultado;

  }


  if(
    resposta &&
    resposta.dados &&
    typeof resposta.dados === "object"
  ){

    if(
      Array.isArray(
        resposta.dados.lista
      )
    ){

      return resposta.dados.lista;

    }

  }


  /*
     Caso seja retornado apenas um registro.
  */

  if(
    resposta &&
    typeof resposta === "object" &&
    (
      resposta.id !== undefined ||
      resposta.ID !== undefined ||
      resposta.problema !== undefined ||
      resposta.Problema !== undefined ||
      resposta.solucao !== undefined ||
      resposta.Solução !== undefined
    )
  ){

    return [
      resposta
    ];

  }


  return [];

}


/* =========================================================
   MONTAR TABELA
========================================================= */

function montarTabela(
  lista
){

  const resultado =
    document.getElementById(
      "resultado"
    );


  let html =

    `
      <div class="tabela-container">

        <table>

          <thead>

            <tr>

              <th>
                ID
              </th>

              <th>
                Problema
              </th>

              <th>
                Solução
              </th>

            </tr>

          </thead>

          <tbody>
    `;


  lista.forEach(
    function(item){

      const id =
        obterCampo(
          item,
          [
            "id",
            "ID",
            "Id"
          ]
        );


      const problema =
        obterCampo(
          item,
          [
            "problema",
            "Problema",
            "PROBLEMA"
          ]
        );


      const solucao =
        obterCampo(
          item,
          [
            "solucao",
            "Solução",
            "solução",
            "Solucao",
            "SOLUCAO",
            "SOLUÇÃO"
          ]
        );


      html +=

        `
          <tr>

            <td class="id">

              ${escaparHTML(
                id || "-"
              )}

            </td>

            <td class="problema">

              ${escaparHTML(
                problema || "-"
              )}

            </td>

            <td class="solucao">

              ${escaparHTML(
                solucao || "-"
              )}

            </td>

          </tr>
        `;

    }
  );


  html +=

    `
          </tbody>

        </table>

      </div>
    `;


  resultado.innerHTML =
    html;

}


/* =========================================================
   OBTER CAMPO
========================================================= */

function obterCampo(
  objeto,
  campos
){

  if(
    !objeto
  ){

    return "";

  }


  for(
    let i = 0;
    i < campos.length;
    i++
  ){

    const nome =
      campos[i];


    if(
      Object.prototype.hasOwnProperty.call(
        objeto,
        nome
      )
    ){

      const valor =
        objeto[nome];


      if(
        valor !== undefined &&
        valor !== null &&
        String(valor).trim() !== ""
      ){

        return String(
          valor
        ).trim();

      }

    }

  }


  /*
     Compatibilidade adicional:
     procura ignorando maiúsculas/minúsculas
     e acentos.
  */

  const desejados =
    campos.map(
      function(campo){

        return normalizarTexto(
          campo
        );

      }
    );


  const chaves =
    Object.keys(
      objeto
    );


  for(
    let i = 0;
    i < chaves.length;
    i++
  ){

    const chave =
      chaves[i];


    const normalizada =
      normalizarTexto(
        chave
      );


    if(
      desejados.indexOf(
        normalizada
      ) >= 0
    ){

      const valor =
        objeto[chave];


      if(
        valor !== undefined &&
        valor !== null &&
        String(valor).trim() !== ""
      ){

        return String(
          valor
        ).trim();

      }

    }

  }


  return "";

}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizarTexto(
  texto
){

  if(
    texto === null ||
    texto === undefined
  ){

    return "";

  }


  return String(
    texto
  )
  .toLowerCase()
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .trim();

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagem(
  texto,
  tipo
){

  const div =
    document.getElementById(
      "mensagem"
    );


  div.textContent =
    texto;


  div.className =
    "mensagem " +
    tipo;

}


function mostrarErro(
  texto
){

  mostrarMensagem(
    "❌ " + texto,
    "erro"
  );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(
  valor
){

  if(
    valor === null ||
    valor === undefined
  ){

    return "";

  }


  return String(
    valor
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   ENTER PARA PESQUISAR
========================================================= */

document
  .getElementById(
    "campoPesquisa"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        pesquisar();

      }

    }
  );


/* =========================================================
   VOLTAR
========================================================= */

function voltar(){

  window.location.href =
    URL_INDEX;

}

</script>

</body>

</html>
