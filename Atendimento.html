<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Atendimento</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  padding:20px;

  font-family:
    Arial,
    sans-serif;

  background:#eef3f8;

  color:#333;

}

.container{

  max-width:900px;

  margin:auto;

  background:white;

  padding:25px;

  border-radius:15px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.15);

}

.topo{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:25px;

  gap:15px;

}

.topo h2{

  margin:0;

  color:#0d47a1;

}

.voltar{

  background:#546e7a;

  color:white;

  border:none;

  padding:12px 20px;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

  font-size:14px;

}

.voltar:hover{

  background:#37474f;

}

h1{

  color:#0d47a1;

  text-align:center;

  margin-bottom:25px;

}

.pesquisa{

  display:flex;

  gap:10px;

  margin-bottom:25px;

}

input{

  height:44px;

  padding:8px 12px;

  border-radius:8px;

  border:1px solid #ccc;

  font-size:15px;

}

#pesquisa{

  flex:1;

}

button{

  min-height:44px;

  padding:0 20px;

  border:none;

  border-radius:8px;

  cursor:pointer;

  font-size:15px;

  font-weight:bold;

  color:white;

  background:#1976d2;

}

button:hover{

  opacity:.88;

}

.btnNovo{

  background:#00897b;

  margin-bottom:20px;

}

.card{

  background:#f8f9fa;

  border-left:5px solid #1976d2;

  padding:15px;

  margin-bottom:15px;

  border-radius:10px;

  line-height:1.5;

}

.id{

  font-weight:bold;

  color:#555;

}

.titulo{

  font-weight:bold;

  color:#0d47a1;

  margin-bottom:4px;

}

.modal{

  display:none;

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  background:rgba(0,0,0,.4);

  align-items:center;

  justify-content:center;

  padding:20px;

}

.modal.show{

  display:flex;

}

.caixa{

  background:white;

  width:min(400px,100%);

  padding:25px;

  border-radius:15px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.2);

}

.caixa h2{

  margin-top:0;

  color:#0d47a1;

}

.caixa label{

  display:block;

  font-weight:bold;

  margin:
    12px 0 5px;

}

textarea{

  width:100%;

  height:90px;

  padding:10px;

  border-radius:8px;

  border:1px solid #ccc;

  resize:none;

  font-family:Arial;

  font-size:14px;

}

.acoes{

  display:flex;

  gap:10px;

  margin-top:15px;

}

.btnSalvar{

  background:#1976d2;

}

.btnCancelar{

  background:#c62828;

}

#resultado{

  margin-top:20px;

}

.info{

  padding:15px;

  background:#f1f5f9;

  border-radius:8px;

  color:#64748b;

}

.erro{

  padding:15px;

  background:#ffebee;

  color:#c62828;

  border-radius:8px;

  font-weight:bold;

}

.sucesso{

  padding:15px;

  background:#e8f5e9;

  color:#2e7d32;

  border-radius:8px;

  font-weight:bold;

}

@media(max-width:600px){

  body{

    padding:10px;

  }

  .container{

    padding:18px;

  }

  .topo{

    align-items:flex-start;

  }

  .pesquisa{

    flex-direction:column;

  }

  .pesquisa button{

    width:100%;

  }

  .acoes{

    flex-direction:column;

  }

  .acoes button{

    width:100%;

  }

}

</style>

</head>

<body>


<div class="container">


  <div class="topo">

    <h2>
      📖 Atendimento
    </h2>

    <button
      class="voltar"
      onclick="voltar()">

      ← Voltar

    </button>

  </div>


  <h1>
    Base de Conhecimento
  </h1>


  <button
    class="btnNovo"
    onclick="abrirCadastro()">

    ➕ Novo Atendimento

  </button>


  <div class="pesquisa">

    <input
      id="pesquisa"
      placeholder="Digite uma palavra para pesquisar problema ou solução"
      onkeydown="if(event.key==='Enter') pesquisar()"
    >

    <button onclick="pesquisar()">

      🔍 Pesquisar

    </button>

  </div>


  <div id="resultado">

    <div class="info">

      Digite uma palavra para pesquisar.

    </div>

  </div>


</div>



<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modal"
  class="modal"
  onclick="fecharModalFora(event)"
>

  <div
    class="caixa"
    onclick="event.stopPropagation()"
  >

    <h2>
      Novo Atendimento
    </h2>


    <label for="problema">
      Problema
    </label>

    <textarea
      id="problema"
      placeholder="Descreva o problema..."
    ></textarea>


    <label for="solucao">
      Solução
    </label>

    <textarea
      id="solucao"
      placeholder="Descreva a solução..."
    ></textarea>


    <div class="acoes">

      <button
        class="btnSalvar"
        onclick="salvar()">

        💾 Salvar

      </button>


      <button
        class="btnCancelar"
        onclick="fecharCadastro()">

        Cancelar

      </button>

    </div>

  </div>

</div>



<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


/* =====================================================
   FUNÇÃO GENÉRICA DA API
===================================================== */

async function apiRequest(
  action,
  params={}
){

  const url =
    new URL(URL_API);


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(function(chave){

      let valor =
        params[chave];


      if(
        valor !== undefined &&
        valor !== null
      ){

        url.searchParams.set(
          chave,
          typeof valor === "object"
            ? JSON.stringify(valor)
            : valor
        );

      }

    });


  let resposta;


  try{

    resposta =
      await fetch(
        url.toString(),
        {
          method:"GET",
          redirect:"follow",
          cache:"no-store"
        }
      );

  }
  catch(e){

    throw new Error(
      "Não foi possível conectar ao Google Apps Script."
    );

  }


  if(!resposta.ok){

    throw new Error(
      "Erro HTTP " +
      resposta.status
    );

  }


  const texto =
    await resposta.text();


  console.log(
    "Resposta da API:",
    texto
  );


  let dados;


  try{

    dados =
      JSON.parse(texto);

  }
  catch(e){

    throw new Error(
      "O servidor não retornou JSON válido."
    );

  }


  if(
    dados &&
    dados.sucesso === false
  ){

    throw new Error(
      dados.erro ||
      dados.mensagem ||
      "Erro retornado pelo servidor."
    );

  }


  return dados;

}


/* =====================================================
   NORMALIZAR LISTA
===================================================== */

function obterLista(
  resposta
){

  /*
     O Apps Script pode retornar:

     1. diretamente:
        [ {...}, {...} ]

     2. dentro de dados:
        {
          sucesso:true,
          dados:[...]
        }

     3. dentro de lista:
        {
          sucesso:true,
          lista:[...]
        }

     4. dentro de resultado:
        {
          sucesso:true,
          resultado:[...]
        }
  */


  if(
    Array.isArray(resposta)
  ){

    return resposta;

  }


  if(
    resposta &&
    Array.isArray(resposta.dados)
  ){

    return resposta.dados;

  }


  if(
    resposta &&
    Array.isArray(resposta.lista)
  ){

    return resposta.lista;

  }


  if(
    resposta &&
    Array.isArray(resposta.resultado)
  ){

    return resposta.resultado;

  }


  if(
    resposta &&
    Array.isArray(resposta.atendimentos)
  ){

    return resposta.atendimentos;

  }


  return [];

}


/* =====================================================
   PESQUISA
===================================================== */

async function pesquisar(){

  const palavra =
    document
      .getElementById("pesquisa")
      .value
      .trim();


  const resultado =
    document.getElementById(
      "resultado"
    );


  if(!palavra){

    resultado.innerHTML =
      `
      <div class="info">
        Digite uma palavra para pesquisar.
      </div>
      `;

    return;

  }


  resultado.innerHTML =
    `
    <div class="info">
      🔎 Pesquisando...
    </div>
    `;


  try{

    const resposta =
      await apiRequest(
        "pesquisarAtendimento",
        {
          palavra:
            palavra
        }
      );


    console.log(
      "Resposta pesquisa:",
      resposta
    );


    const lista =
      obterLista(resposta);


    mostrarResultado(
      lista
    );

  }
  catch(e){

    console.error(e);


    resultado.innerHTML =
      `
      <div class="erro">
        Erro: ${escapeHtml(
          e.message
        )}
      </div>
      `;

  }

}


/* =====================================================
   MOSTRAR RESULTADOS
===================================================== */

function mostrarResultado(
  lista
){

  const div =
    document.getElementById(
      "resultado"
    );


  if(
    !Array.isArray(lista) ||
    lista.length === 0
  ){

    div.innerHTML =
      `
      <div class="info">
        Nenhum atendimento encontrado.
      </div>
      `;

    return;

  }


  let html = "";


  lista.forEach(
    function(item){

      html += `

        <div class="card">

          <div class="id">
            ID: ${escapeHtml(
              item.id ?? ""
            )}
          </div>

          <br>

          <div class="titulo">
            Problema:
          </div>

          <div>
            ${escapeHtml(
              item.problema ?? ""
            ).replace(
              /\n/g,
              "<br>"
            )}
          </div>

          <br>

          <div class="titulo">
            Solução:
          </div>

          <div>
            ${escapeHtml(
              item.solucao ?? ""
            ).replace(
              /\n/g,
              "<br>"
            )}
          </div>

        </div>

      `;

    }
  );


  div.innerHTML =
    html;

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(
  valor
){

  return String(
    valor
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   NOVO ATENDIMENTO
===================================================== */

function abrirCadastro(){

  document
    .getElementById("modal")
    .classList.add("show");


  document
    .getElementById("problema")
    .focus();

}


function fecharCadastro(){

  document
    .getElementById("modal")
    .classList.remove("show");

}


function fecharModalFora(
  event
){

  if(
    event.target.id ===
    "modal"
  ){

    fecharCadastro();

  }

}


/* =====================================================
   SALVAR
===================================================== */

async function salvar(){

  const problema =
    document
      .getElementById("problema")
      .value
      .trim();


  const solucao =
    document
      .getElementById("solucao")
      .value
      .trim();


  if(
    !problema ||
    !solucao
  ){

    alert(
      "Informe problema e solução."
    );

    return;

  }


  try{

    const resposta =
      await apiRequest(
        "incluirAtendimento",
        {
          problema:
            problema,

          solucao:
            solucao
        }
      );


    console.log(
      "Resposta salvar:",
      resposta
    );


    alert(
      resposta.mensagem ||
      "Atendimento salvo com sucesso."
    );


    document
      .getElementById("problema")
      .value = "";


    document
      .getElementById("solucao")
      .value = "";


    fecharCadastro();


    const palavra =
      document
        .getElementById("pesquisa")
        .value
        .trim();


    if(palavra){

      pesquisar();

    }

  }
  catch(e){

    alert(
      "Erro: " +
      e.message
    );

  }

}


/* =====================================================
   VOLTAR PARA O GITHUB PAGES
===================================================== */

function voltar(){

  window.location.href =
    "index.html";

}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      fecharCadastro();

    }

  }
);

</script>


</body>

</html>
