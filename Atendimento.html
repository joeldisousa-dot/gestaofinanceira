<style>

/* =====================================================
   RESET
===================================================== */

}

/* =====================================================

===================================================== */

/* =====================================================

/* =====================================================

===================================================== */

.caixa-pesquisa{

}


.pesquisa{

#pesquisa{

.modal{

  z-index:5000;

  padding:20px;

}


.modal.show{

}


.caixa{

      500px

    calc(100vh - 40px);

  border-radius:18px;

@keyframes modalEntrada{

    transform:

  }

  to{

    transform:

}

}

.caixa label{

.btn{

  border-radius:9px;

  font-size:13px;

.btnSalvar{

    linear-gradient(

/* =====================================================

===================================================== */

.loading{

  position:fixed;

  justify-content:center;

}


.loading.show{

}


.loading-box{

  min-width:210px;

    0 20px 60px

}


.spinner{

  margin:

    4px solid #e2e8f0;

  border-radius:50%;

}

/* =====================================================

===================================================== */

.toast{

  position:fixed;

.footer{

===================================================== */

</style>

</head>


<body>


<!-- =====================================================
     CONTAINER
===================================================== -->

<div class="container">


  <!-- ===================================================
       TOPO
  ==================================================== -->

  <div class="topo">

    <div class="topo-titulo">

      <div class="topo-icone">
        📖
      </div>

      <div>

        <h2>
          Atendimento
        </h2>

        </div>

    </div>

      class="voltar"

  <!-- ===================================================

    <div class="titulo-principal">

      <h1>

      </h1>

      <p>

      </p>

    </div>


    <!-- =================================================
         NOVO ATENDIMENTO
    ================================================== -->

    <button
      class="btnNovo"
      onclick="abrirCadastro()"
    >

      ➕ Novo Atendimento

    </button>


    <!-- =================================================

    ================================================== -->

    <div class="caixa-pesquisa">

        <input
          id="pesquisa"
          autocomplete="off"
          placeholder="Digite uma palavra ou expressão exata..."
          onkeydown="

        >

      <div class="info">

  ==================================================== -->

<!-- =====================================================

<div
  id="modal"
  class="modal"
  onclick="fecharModalFora(event)"
>


  <div
    class="caixa"
    onclick="event.stopPropagation()"
  >


    <div class="modal-header">

      <h2>

        class="btnFechar"

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbw-Fry_UM89-p0FjPEoDNdfdTSNdz56sYzUA8VJIpD9_862l5dPSNmkWOGLXyZiqnRn/exec";


/* =====================================================
   API
===================================================== */

async function apiRequest(
  action,
  params={}
){

  const url =
    new URL(URL_API);


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(function(chave){

      const valor =
        params[chave];


      if(
        valor !== undefined &&
        valor !== null
      ){

        url.searchParams.set(

          chave,

          typeof valor === "object"
            ? JSON.stringify(valor)
            : String(valor)

        );

      }

    });


  let resposta;


  try{

    resposta =
      await fetch(
        url.toString(),
        {
          method:"GET",
          redirect:"follow",
          cache:"no-store"
        }
      );

  }
  catch(e){

    throw new Error(
      "Não foi possível conectar ao Google Apps Script."
    );

  }


  if(!resposta.ok){

    throw new Error(
      "Erro HTTP " +
      resposta.status
    );

  }


  const texto =
    await resposta.text();


  console.log(
    "Resposta da API:",
    texto
  );


  let dados;


  try{

    dados =
      JSON.parse(texto);

  }
  catch(e){

    throw new Error(
      "O servidor não retornou JSON válido."
    );

  }


  if(
    dados &&
    (
      dados.sucesso === false ||
      dados.success === false ||
      dados.erro
    )
  ){

    throw new Error(

      dados.erro ||
      dados.mensagem ||
      dados.message ||
      "Erro retornado pelo servidor."

    );

  }


  return dados;

}


/* =====================================================
   OBTER LISTA
===================================================== */

function obterLista(
  resposta
){

  if(
    Array.isArray(resposta)
  ){

    return resposta;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.dados
    )
  ){

    return resposta.dados;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.lista
    )
  ){

    return resposta.lista;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.resultado
    )
  ){

    return resposta.resultado;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.atendimentos
    )
  ){

    return resposta.atendimentos;

  }


  return [];

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizarTexto(
  texto
){

  return String(texto)

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()

    .trim();

}


/* =====================================================
   ESCAPAR REGEX
===================================================== */

function escaparRegex(
  texto
){

  return String(texto)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

}


/* =====================================================
   VERIFICAR EXPRESSÃO EXATA
===================================================== */

function palavraExata(
  texto,
  termo
){

  if(
    !texto ||
    !termo
  ){

    return false;

  }


  const textoNormalizado =
    normalizarTexto(
      texto
    );


  const termoNormalizado =
    normalizarTexto(
      termo
    );


  if(!termoNormalizado){

    return false;

  }


  /*
   * Para uma expressão como:
   *
   * FGTS Digital
   *
   * procura a expressão completa,
   * respeitando os limites das palavras.
   */


  const regex =
    new RegExp(

      "(^|[^a-z0-9])" +

      escaparRegex(
        termoNormalizado
      ) +

      "(?=$|[^a-z0-9])",

      "i"

    );


  return regex.test(
    textoNormalizado
  );

}


/* =====================================================
   DESTACAR TERMO
===================================================== */

function destacarTexto(
  texto,
  termo
){

  const textoOriginal =
    String(
      texto ?? ""
    );


  if(!termo){

    return escapeHtml(
      textoOriginal
    )
    .replace(
      /\n/g,
      "<br>"
    );

  }


  const termoNormalizado =
    normalizarTexto(
      termo
    );


  if(!termoNormalizado){

    return escapeHtml(
      textoOriginal
    )
    .replace(
      /\n/g,
      "<br>"
    );

  }


  /*
   * Primeiro escapa o texto.
   */

  const textoSeguro =
    escapeHtml(
      textoOriginal
    );


  /*
   * Escapa o termo para Regex.
   */

  const termoEscapado =
    escaparRegex(
      escapeHtml(
        termo
      )
    );


  /*
   * Destaca o termo ignorando
   * maiúsculas/minúsculas.
   *
   * Observação:
   * o destaque considera a forma
   * digitada pelo usuário.
   */

  let resultado =
    textoSeguro.replace(
      new RegExp(
        termoEscapado,
        "gi"
      ),
      function(match){

        return (
          '<span class="highlight">' +
          match +
          '</span>'
        );

      }
    );


  return resultado
    .replace(
      /\n/g,
      "<br>"
    );

}


/* =====================================================
   PESQUISAR
===================================================== */

async function pesquisar(){

  const campo =
    document.getElementById(
      "pesquisa"
    );


  const palavra =
    campo.value.trim();


  const resultado =
    document.getElementById(
      "resultado"
    );


  const statusTexto =
    document.getElementById(
      "statusTexto"
    );


  const contador =
    document.getElementById(
      "contador"
    );


  /*
   * Limpa contador.
   */

  contador.classList.remove(
    "show"
  );


  if(!palavra){

    statusTexto.textContent =
      "Digite uma palavra ou expressão para pesquisar.";


    resultado.innerHTML = `
      <div class="info">
        🔎 Digite uma palavra ou expressão
        para pesquisar.
      </div>
    `;

    return;

  }


  statusTexto.innerHTML =
    "🔎 Pesquisando por <strong>" +
    escapeHtml(palavra) +
    "</strong>...";


  resultado.innerHTML = `
    <div class="info">
      🔄 Pesquisando na base de conhecimento...
    </div>
  `;


  mostrarLoading(
    true,
    "Pesquisando..."
  );


  try{

    /*
     * Consulta a API.
     */

    const resposta =
      await apiRequest(
        "pesquisarAtendimento",
        {
          palavra:
            palavra
        }
      );


    console.log(
      "Resposta pesquisa:",
      resposta
    );


    /*
     * Obtém lista retornada.
     */

    let lista =
      obterLista(
        resposta
      );


    /*
     * =================================================
     * FILTRO EXATO NO FRONTEND
     * =================================================
     *
     * Mesmo que o Apps Script retorne
     * resultados aproximados, o frontend
     * faz uma segunda validação.
     */


    const termo =
      normalizarTexto(
        palavra
      );


    lista =
      lista.filter(
        function(item){

          const problema =
            item.problema ??
            item.Problema ??
            "";


          const solucao =
            item.solucao ??
            item.Solucao ??
            "";


          return (

            palavraExata(
              problema,
              termo
            )

            ||

            palavraExata(
              solucao,
              termo
            )

          );

        }
      );


    /*
     * Mostra resultados.
     */

    mostrarResultado(
      lista,
      palavra
    );


    /*
     * Atualiza contador.
     */

    if(
      lista.length > 0
    ){

      contador.textContent =
        lista.length +
        (
          lista.length === 1
            ? " resultado"
            : " resultados"
        );


      contador.classList.add(
        "show"
      );


      statusTexto.innerHTML =
        "Resultados para <strong>" +
        escapeHtml(
          palavra
        ) +
        "</strong>";

    }
    else{

      statusTexto.innerHTML =
        "Nenhum resultado para <strong>" +
        escapeHtml(
          palavra
        ) +
        "</strong>";

    }

  }
  catch(e){

    console.error(
      "Erro pesquisa:",
      e
    );


    statusTexto.textContent =
      "Não foi possível realizar a pesquisa.";


    resultado.innerHTML = `
      <div class="erro">
        ❌ Erro ao pesquisar:
        ${escapeHtml(e.message)}
      </div>
    `;

  }
  finally{

    mostrarLoading(
      false
    );

  }

}


/* =====================================================
   MOSTRAR RESULTADO
===================================================== */

function mostrarResultado(
  lista,
  termo
){

  const div =
    document.getElementById(
      "resultado"
    );


  if(
    !Array.isArray(lista) ||
    lista.length === 0
  ){

    div.innerHTML = `

      <div class="info">

        <div style="font-size:28px;margin-bottom:8px;">
          🔍
        </div>

        <strong>
          Nenhum atendimento encontrado.
        </strong>

        <div style="margin-top:6px;font-size:13px;">
          Tente pesquisar outra palavra ou expressão.
        </div>

      </div>

    `;

    return;

  }


  let html = "";


  lista.forEach(
    function(item){

      const id =
        item.id ??
        item.ID ??
        item.Id ??
        "";


      const problema =
        item.problema ??
        item.Problema ??
        "";


      const solucao =
        item.solucao ??
        item.Solucao ??
        "";


      html += `

        <div class="card">

          <div class="id">

            ID:
            ${escapeHtml(id)}

          </div>


          <div class="titulo">

            Problema

          </div>


          <div class="texto">

            ${destacarTexto(
              problema,
              termo
            )}

          </div>


          <div class="titulo">

            Solução

          </div>


          <div class="texto">

            ${destacarTexto(
              solucao,
              termo
            )}

          </div>

        </div>

      `;

    }
  );


  div.innerHTML =
    html;

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(
  valor
){

  return String(
    valor
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   NOVO ATENDIMENTO
===================================================== */

function abrirCadastro(){

  document
    .getElementById(
      "modal"
    )
    .classList.add(
      "show"
    );


  setTimeout(
    function(){

      document
        .getElementById(
          "problema"
        )
        .focus();

    },
    100
  );

}


function fecharCadastro(){

  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "show"
    );

}


function fecharModalFora(
  event
){

  if(
    event.target.id ===
    "modal"
  ){

    fecharCadastro();

  }

}


/* =====================================================
   SALVAR
===================================================== */

async function salvar(){

  const problema =
    document
      .getElementById(
        "problema"
      )
      .value
      .trim();


  const solucao =
    document
      .getElementById(
        "solucao"
      )
      .value
      .trim();


  if(
    !problema ||
    !solucao
  ){

    mostrarToast(
      "Informe o problema e a solução.",
      "error"
    );

    return;

  }


  mostrarLoading(
    true,
    "Salvando atendimento..."
  );


  try{

    const resposta =
      await apiRequest(
        "incluirAtendimento",
        {
          problema:
            problema,

          solucao:
            solucao
        }
      );


    console.log(
      "Resposta salvar:",
      resposta
    );


    mostrarToast(
      resposta.mensagem ||
      resposta.message ||
      "Atendimento salvo com sucesso.",
      "success"
    );


    document
      .getElementById(
        "problema"
      )
      .value = "";


    document
      .getElementById(
        "solucao"
      )
      .value = "";


    fecharCadastro();


    /*
     * Se houver uma pesquisa ativa,
     * atualiza automaticamente.
     */

    const palavra =
      document
        .getElementById(
          "pesquisa"
        )
        .value
        .trim();


    if(palavra){

      await pesquisar();

    }

  }
  catch(e){

    console.error(
      "Erro salvar:",
      e
    );


    mostrarToast(
      "Erro: " +
      e.message,
      "error"
    );

  }
  finally{

    mostrarLoading(
      false
    );

  }

}


/* =====================================================
   LOADING
===================================================== */

function mostrarLoading(
  mostrar,
  texto="Processando..."
){

  const loading =
    document.getElementById(
      "loading"
    );


  const textoElemento =
    document.getElementById(
      "loadingTexto"
    );


  if(mostrar){

    textoElemento.textContent =
      texto;


    loading.classList.add(
      "show"
    );

  }
  else{

    loading.classList.remove(
      "show"
    );

  }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function mostrarToast(
  mensagem,
  tipo="success"
){

  const toast =
    document.getElementById(
      "toast"
    );


  clearTimeout(
    toastTimer
  );


  toast.textContent =
    mensagem;


  toast.className =
    "toast show " +
    tipo;


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      4500
    );

}


/* =====================================================
   VOLTAR
===================================================== */

function voltar(){

  window.location.href =
    "index.html";

}


/* =====================================================
   ESC
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      fecharCadastro();

    }

  }
);


/* =====================================================
   CTRL + K
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      event.key.toLowerCase() === "k"
    ){

      event.preventDefault();

      document
        .getElementById(
          "pesquisa"
        )
        .focus();

    }

  }
);

</script>
