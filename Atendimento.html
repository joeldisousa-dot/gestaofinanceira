<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Atendimento - Controle Financeiro</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#e8eef5,#ffffff);
  color:#333;
}

.container{
  max-width:1100px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

/* =====================================================
   TOPO
===================================================== */

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.topo h1{
  margin:0;
  color:#0d47a1;
  font-size:28px;
}

.btn-voltar{
  border:none;
  padding:12px 24px;
  border-radius:10px;
  background:linear-gradient(135deg,#455a64,#78909c);
  color:#fff;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.btn-voltar:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

/* =====================================================
   PESQUISA
===================================================== */

.pesquisa{
  background:#f5f7fa;
  border:1px solid #e0e6ed;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}

.pesquisa h2{
  margin:0 0 15px 0;
  color:#1976d2;
  font-size:19px;
}

.linha-pesquisa{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
}

input{
  width:100%;
  height:46px;
  padding:0 14px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#1976d2;
  box-shadow:0 0 0 3px rgba(25,118,210,.12);
}

.btn-pesquisar{
  height:46px;
  padding:0 25px;
  border:none;
  border-radius:9px;
  background:linear-gradient(135deg,#1976d2,#2196f3);
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.btn-pesquisar:hover{
  filter:brightness(1.08);
  transform:translateY(-2px);
}

.btn-pesquisar:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

/* =====================================================
   MENSAGENS
===================================================== */

.mensagem{
  display:none;
  margin:15px 0;
  padding:13px;
  border-radius:8px;
}

.mensagem.info{
  display:block;
  background:#e3f2fd;
  color:#1565c0;
}

.mensagem.erro{
  display:block;
  background:#ffebee;
  color:#c62828;
  border-left:5px solid #c62828;
  font-weight:bold;
}

.mensagem.sucesso{
  display:block;
  background:#e8f5e9;
  color:#2e7d32;
}

/* =====================================================
   RESULTADO
===================================================== */

.resultado{
  margin-top:20px;
}

.tabela-container{
  width:100%;
  overflow-x:auto;
  border:1px solid #dfe5eb;
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th{
  background:linear-gradient(135deg,#0d47a1,#1976d2);
  color:white;
  padding:14px 12px;
  text-align:left;
  font-size:14px;
}

td{
  padding:13px 12px;
  border-bottom:1px solid #e5e7eb;
  vertical-align:top;
  font-size:14px;
}

tr:nth-child(even){
  background:#f8f9fc;
}

tr:hover{
  background:#eef5ff;
}

.col-id{
  width:100px;
  text-align:center;
  font-weight:bold;
  color:#0d47a1;
}

.col-problema{
  width:40%;
}

.col-solucao{
  width:50%;
}

.nenhum{
  text-align:center;
  padding:35px;
  color:#777;
  background:#fafafa;
  border-radius:10px;
}

.carregando{
  text-align:center;
  padding:30px;
  color:#777;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px){

  body{
    padding:10px;
  }

  .container{
    padding:15px;
    border-radius:12px;
  }

  .topo{
    flex-direction:column;
    align-items:stretch;
  }

  .topo h1{
    font-size:23px;
  }

  .btn-voltar{
    width:100%;
  }

  .linha-pesquisa{
    grid-template-columns:1fr;
  }

  .btn-pesquisar{
    width:100%;
  }

  table{
    min-width:600px;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- =================================================
       TOPO
  ================================================== -->

  <div class="topo">

    <h1>
      🔎 Atendimento
    </h1>

    <button
      class="btn-voltar"
      onclick="voltar()">

      ⬅ Voltar

    </button>

  </div>


  <!-- =================================================
       PESQUISA
  ================================================== -->

  <div class="pesquisa">

    <h2>
      Pesquisar atendimento
    </h2>

    <div class="linha-pesquisa">

      <input
        id="campoPesquisa"
        type="text"
        placeholder="Digite o problema ou palavra-chave..."
        autocomplete="off">

      <button
        id="btnPesquisar"
        class="btn-pesquisar"
        onclick="pesquisar()">

        🔎 Pesquisar

      </button>

    </div>

  </div>


  <!-- =================================================
       MENSAGEM
  ================================================== -->

  <div
    id="mensagem"
    class="mensagem">
  </div>


  <!-- =================================================
       RESULTADO
  ================================================== -->

  <div
    id="resultado"
    class="resultado">

    <div class="nenhum">

      Digite um problema ou palavra-chave
      para pesquisar na base de Atendimento.

    </div>

  </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO DA API
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbw-Fry_UM89-p0FjPEoDNdfdTSNdz56sYzUA8VJIpD9_862l5dPSNmkWOGLXyZiqnRn/exec";


const URL_INDEX =
"https://joeldisousa-dot.github.io/gestaofinanceira/";


/* =====================================================
   CONTROLE JSONP
===================================================== */

let contadorJSONP = 0;


/* =====================================================
   CHAMAR API
===================================================== */

function chamarAPI(acao,parametros){

  return new Promise(function(resolve,reject){

    const callback =
      "callbackAtendimento_" +
      Date.now() +
      "_" +
      (++contadorJSONP);


    const script =
      document.createElement("script");


    const dados =
      Object.assign({},parametros || {});


    dados.action =
      acao;

    dados.callback =
      callback;


    const query =
      Object.keys(dados)
        .map(function(chave){

          return (
            encodeURIComponent(chave) +
            "=" +
            encodeURIComponent(
              dados[chave] === undefined ||
              dados[chave] === null
                ? ""
                : dados[chave]
            )
          );

        })
        .join("&");


    const url =
      URL_API + "?" + query;


    let finalizado =
      false;


    const timeout =
      setTimeout(function(){

        if(finalizado){
          return;
        }

        finalizado =
          true;

        cleanup();

        reject(
          new Error(
            "Tempo limite excedido ao consultar a API."
          )
        );

      },30000);


    window[callback] =
      function(resposta){

        if(finalizado){
          return;
        }

        finalizado =
          true;

        clearTimeout(timeout);

        cleanup();

        resolve(resposta);

      };


    script.onerror =
      function(){

        if(finalizado){
          return;
        }

        finalizado =
          true;

        clearTimeout(timeout);

        cleanup();

        reject(
          new Error(
            "Não foi possível conectar ao Google Apps Script."
          )
        );

      };


    script.src =
      url;


    document.body.appendChild(
      script
    );


    function cleanup(){

      delete window[callback];

      if(script.parentNode){

        script.parentNode.removeChild(
          script
        );

      }

    }

  });

}


/* =====================================================
   PESQUISAR
===================================================== */

async function pesquisar(){

  const campo =
    document.getElementById(
      "campoPesquisa"
    );


  const botao =
    document.getElementById(
      "btnPesquisar"
    );


  const resultado =
    document.getElementById(
      "resultado"
    );


  const texto =
    String(
      campo.value || ""
    ).trim();


  if(!texto){

    mostrarErro(
      "Digite o problema ou uma palavra-chave."
    );

    campo.focus();

    return;

  }


  botao.disabled =
    true;


  mostrarMensagem(
    "Pesquisando na aba Atendimento...",
    "info"
  );


  resultado.innerHTML =
    `
    <div class="carregando">

      🔎 Pesquisando...

    </div>
    `;


  try{

    const resposta =
      await chamarAPI(
        "pesquisarAtendimento",
        {
          texto:texto
        }
      );


    console.log(
      "Resposta da API Atendimento:",
      resposta
    );


    if(!resposta){

      throw new Error(
        "A API não retornou resposta."
      );

    }


    if(
      resposta.sucesso === false
    ){

      throw new Error(
        resposta.erro ||
        resposta.mensagem ||
        "Erro retornado pelo servidor."
      );

    }


    const lista =
      obterListaResposta(
        resposta
      );


    console.log(
      "Lista de Atendimento:",
      lista
    );


    if(
      lista.length === 0
    ){

      resultado.innerHTML =
        `
        <div class="nenhum">

          Nenhum atendimento encontrado
          para:

          <strong>
            ${escaparHTML(texto)}
          </strong>

        </div>
        `;


      mostrarMensagem(
        "Nenhum registro encontrado.",
        "info"
      );


      return;

    }


    montarTabela(
      lista
    );


    mostrarMensagem(
      lista.length +
      (
        lista.length === 1
          ? " registro encontrado."
          : " registros encontrados."
      ),
      "sucesso"
    );

  }
  catch(e){

    console.error(
      "Erro ao pesquisar Atendimento:",
      e
    );


    resultado.innerHTML =
      `
      <div class="mensagem erro"
           style="display:block">

        ❌ Erro ao pesquisar:

        <br>

        ${escaparHTML(e.message)}

      </div>
      `;


    mostrarErro(
      e.message
    );

  }
  finally{

    botao.disabled =
      false;

  }

}


/* =====================================================
   NORMALIZAR RESPOSTA
===================================================== */

function obterListaResposta(
  resposta
){

  if(
    Array.isArray(resposta)
  ){

    return resposta;

  }


  if(
    resposta &&
    Array.isArray(resposta.lista)
  ){

    return resposta.lista;

  }


  if(
    resposta &&
    Array.isArray(resposta.dados)
  ){

    return resposta.dados;

  }


  if(
    resposta &&
    Array.isArray(resposta.resultado)
  ){

    return resposta.resultado;

  }


  /*
     Algumas versões da API podem retornar:
     
     {
       sucesso:true,
       registro:{...}
     }
  */

  if(
    resposta &&
    resposta.registro &&
    typeof resposta.registro === "object"
  ){

    return [
      resposta.registro
    ];

  }


  /*
     Caso retorne um único registro.
  */

  if(
    resposta &&
    typeof resposta === "object" &&
    (
      obterCampo(
        resposta,
        "id"
      ) ||
      obterCampo(
        resposta,
        "problema"
      ) ||
      obterCampo(
        resposta,
        "solucao"
      )
    )
  ){

    return [
      resposta
    ];

  }


  return [];

}


/* =====================================================
   MONTAR TABELA
===================================================== */

function montarTabela(
  lista
){

  const resultado =
    document.getElementById(
      "resultado"
    );


  let html = `

    <div class="tabela-container">

      <table>

        <thead>

          <tr>

            <th class="col-id">
              ID
            </th>

            <th class="col-problema">
              Problema
            </th>

            <th class="col-solucao">
              Solução
            </th>

          </tr>

        </thead>

        <tbody>

  `;


  lista.forEach(
    function(item){

      const id =
        obterCampo(
          item,
          "id"
        );


      const problema =
        obterCampo(
          item,
          "problema"
        );


      const solucao =
        obterCampo(
          item,
          "solucao"
        );


      html += `

        <tr>

          <td class="col-id">

            ${escaparHTML(
              id || "-"
            )}

          </td>

          <td class="col-problema">

            ${formatarTexto(
              problema
            )}

          </td>

          <td class="col-solucao">

            ${formatarTexto(
              solucao
            )}

          </td>

        </tr>

      `;

    }
  );


  html += `

        </tbody>

      </table>

    </div>

  `;


  resultado.innerHTML =
    html;

}


/* =====================================================
   OBTER CAMPO
===================================================== */

function obterCampo(
  objeto,
  campoProcurado
){

  if(
    !objeto ||
    typeof objeto !== "object"
  ){

    return "";

  }


  /*
     Primeiro tenta o nome exato.
  */

  if(
    objeto[campoProcurado] !== undefined &&
    objeto[campoProcurado] !== null
  ){

    return String(
      objeto[campoProcurado]
    ).trim();

  }


  /*
     Depois compara ignorando:
     - maiúsculas/minúsculas
     - acentos
     - espaços
     - _
     - -
  */

  const procurado =
    normalizarNomeCampo(
      campoProcurado
    );


  const chaves =
    Object.keys(
      objeto
    );


  for(
    let i=0;
    i<chaves.length;
    i++
  ){

    const chave =
      chaves[i];


    if(
      normalizarNomeCampo(
        chave
      ) === procurado
    ){

      const valor =
        objeto[chave];


      if(
        valor !== undefined &&
        valor !== null
      ){

        return String(
          valor
        ).trim();

      }

    }

  }


  return "";

}


/* =====================================================
   NORMALIZAR NOME DE CAMPO
===================================================== */

function normalizarNomeCampo(
  texto
){

  return String(
    texto || ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .toLowerCase()
  .replace(
    /[\s_\-]/g,
    ""
  );

}


/* =====================================================
   FORMATAR TEXTO
===================================================== */

function formatarTexto(
  texto
){

  if(
    texto === null ||
    texto === undefined ||
    String(texto).trim() === ""
  ){

    return "-";

  }


  return escaparHTML(
    texto
  )
  .replace(
    /\r?\n/g,
    "<br>"
  );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
  valor
){

  if(
    valor === null ||
    valor === undefined
  ){

    return "";

  }


  return String(valor)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   NORMALIZAR TEXTO DE PESQUISA
===================================================== */

function normalizarTexto(
  texto
){

  return String(
    texto || ""
  )
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  )
  .toLowerCase()
  .trim();

}


/* =====================================================
   MENSAGENS
===================================================== */

function mostrarMensagem(
  texto,
  tipo
){

  const div =
    document.getElementById(
      "mensagem"
    );


  div.textContent =
    texto;


  div.className =
    "mensagem " +
    tipo;

}


function mostrarErro(
  texto
){

  mostrarMensagem(
    "❌ " + texto,
    "erro"
  );

}


/* =====================================================
   ENTER
===================================================== */

document
  .getElementById(
    "campoPesquisa"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        pesquisar();

      }

    }
  );


/* =====================================================
   VOLTAR
===================================================== */

function voltar(){

  window.location.href =
    URL_INDEX;

}

</script>

</body>

</html>
