/* =====================================================
CONFIGURAÇÃO
===================================================== */

const URL_API =
"https://script.google.com/macros/s/AKfycbwlkjtWnOcvglZS2Ft6ydraSh4-JbTXH6C7irb6O5hYPvxYxqN0tYWQs2Ybi6mVWThN/exec";

const URL_INDEX =
"https://joeldisousa-dot.github.io/gestaofinanceira/";

let contadorJSONP = 0;

/* =====================================================
CHAMAR API
===================================================== */

function chamarAPI(
acao,
parametros
){

return new Promise(
function(resolve,reject){

  const callback =
    "callbackAtendimento_" +
    Date.now() +
    "_" +
    (++contadorJSONP);


  const script =
    document.createElement(
      "script"
    );


  /*
   * Cria uma cópia dos parâmetros.
   */

  const dados =
    Object.assign(
      {},
      parametros || {}
    );


  /*
   * Ação da API.
   */

  dados.action =
    acao;


  /*
   * Callback JSONP.
   */

  dados.callback =
    callback;


  /*
   * Monta query string.
   */

  const query =
    Object.keys(dados)
      .map(
        function(chave){

          return (
            encodeURIComponent(
              chave
            ) +
            "=" +
            encodeURIComponent(
              dados[chave] === undefined ||
              dados[chave] === null
                ? ""
                : dados[chave]
            )
          );

        }
      )
      .join("&");


  const url =
    URL_API +
    "?" +
    query;


  let finalizado =
    false;


  const timeout =
    setTimeout(
      function(){

        if(finalizado){
          return;
        }


        finalizado =
          true;


        cleanup();


        reject(
          new Error(
            "Tempo limite excedido ao consultar a API."
          )
        );

      },
      30000
    );


  /*
   * Callback recebido do Apps Script.
   */

  window[callback] =
    function(resposta){

      if(finalizado){
        return;
      }


      finalizado =
        true;


      clearTimeout(
        timeout
      );


      cleanup();


      resolve(
        resposta
      );

    };


  /*
   * Erro de conexão.
   */

  script.onerror =
    function(){

      if(finalizado){
        return;
      }


      finalizado =
        true;


      clearTimeout(
        timeout
      );


      cleanup();


      reject(
        new Error(
          "Não foi possível conectar ao Google Apps Script."
        )
      );

    };


  script.src =
    url;


  document.body.appendChild(
    script
  );


  function cleanup(){

    try{

      delete window[callback];

    }
    catch(e){}


    if(
      script.parentNode
    ){

      script.parentNode.removeChild(
        script
      );

    }

  }

}

);

}

/* =====================================================
PESQUISAR
===================================================== */

async function pesquisar(){

const campo =
document.getElementById(
"campoPesquisa"
);

const botao =
document.getElementById(
"btnPesquisar"
);

const resultado =
document.getElementById(
"resultado"
);

/*

Pega exatamente o texto digitado.
*/
const termo =
String(
campo.value || ""
).trim();

/*

Não permite pesquisa vazia.
*/
if(!termo){

mostrarErro(
  "Digite o problema ou uma palavra-chave."
);


resultado.innerHTML =
  `
  <div class="nenhum">

    Digite uma palavra-chave
    para realizar a pesquisa.

  </div>
  `;


campo.focus();


return;

}

botao.disabled =
true;

mostrarMensagem(
'Pesquisando por "' +
termo +
'"...',
"info"
);

resultado.innerHTML =
`
<div class="carregando">

  🔎 Pesquisando por:

  <strong>
    ${escaparHTML(termo)}
  </strong>

</div>
`;

try{

/*
 * =================================================
 * CORREÇÃO PRINCIPAL
 * =================================================
 *
 * Antes estava:
 *
 * texto:texto
 *
 * Agora está:
 *
 * termo:termo
 *
 * que corresponde ao Código.gs.
 */

const resposta =
  await chamarAPI(
    "pesquisarAtendimento",
    {
      termo: termo
    }
  );


console.log(
  "Termo enviado:",
  termo
);


console.log(
  "Resposta da API:",
  resposta
);


if(!resposta){

  throw new Error(
    "A API não retornou resposta."
  );

}


if(
  resposta.sucesso === false
){

  throw new Error(
    resposta.erro ||
    resposta.mensagem ||
    "Erro retornado pelo servidor."
  );

}


/*
 * Obtém somente a lista retornada
 * pela API.
 */

const lista =
  obterListaResposta(
    resposta
  );


console.log(
  "Registros encontrados:",
  lista.length
);


/*
 * =================================================
 * NENHUM RESULTADO
 * =================================================
 */

if(
  lista.length === 0
){

  resultado.innerHTML =
    `
    <div class="nenhum">

      Nenhum atendimento encontrado
      para:

      <strong>
        ${escaparHTML(termo)}
      </strong>

    </div>
    `;


  mostrarMensagem(
    'Nenhum registro encontrado para "' +
    termo +
    '".',
    "info"
  );


  return;

}


/*
 * =================================================
 * MOSTRAR RESULTADOS
 * =================================================
 */

montarTabela(
  lista
);


mostrarMensagem(
  lista.length +
  (
    lista.length === 1
      ? " registro encontrado."
      : " registros encontrados."
  ),
  "sucesso"
);

}
catch(erro){

console.error(
  "Erro ao pesquisar Atendimento:",
  erro
);


resultado.innerHTML =
  `
  <div
    class="mensagem erro"
    style="display:block">

    ❌ Erro ao pesquisar:

    <br><br>

    ${escaparHTML(
      erro.message ||
      String(erro)
    )}

  </div>
  `;


mostrarErro(
  erro.message ||
  String(erro)
);

}
finally{

botao.disabled =
  false;

}

}

/* =====================================================
OBTER LISTA DA RESPOSTA
===================================================== */

function obterListaResposta(
resposta
){

/*

API retornou diretamente um array.
*/
if(
Array.isArray(
resposta
)
){

return resposta;

}

/*

Formato padrão:
{
sucesso:true,
lista:[...]
}
*/
if(
resposta &&
Array.isArray(
resposta.lista
)
){

return resposta.lista;

}

/*

Compatibilidade.
*/
if(
resposta &&
Array.isArray(
resposta.dados
)
){

return resposta.dados;

}

if(
resposta &&
Array.isArray(
resposta.resultado
)
){

return resposta.resultado;

}

/*

Um único registro.
*/
if(
resposta &&
resposta.registro &&
typeof resposta.registro ===
"object"
){

return [
  resposta.registro
];

}

return [];

}

/* =====================================================
MONTAR TABELA
===================================================== */

function montarTabela(
lista
){

const resultado =
document.getElementById(
"resultado"
);

let html = `

<div class="tabela-container">

  <table>

    <thead>

      <tr>

        <th class="col-id">
          ID
        </th>

        <th class="col-problema">
          Problema
        </th>

        <th class="col-solucao">
          Solução
        </th>

      </tr>

    </thead>

    <tbody>

`;

lista.forEach(
function(item){

  /*
   * Compatibilidade com diferentes
   * nomes de coluna.
   */

  const id =
    obterCampo(
      item,
      [
        "id",
        "codigo",
        "numero"
      ]
    );


  const problema =
    obterCampo(
      item,
      [
        "problema",
        "descricao",
        "assunto",
        "pergunta",
        "duvida",
        "questao"
      ]
    );


  const solucao =
    obterCampo(
      item,
      [
        "solucao",
        "solução",
        "resposta",
        "orientacao",
        "orientação"
      ]
    );


  /*
   * Caso a planilha tenha outras
   * colunas e não possua exatamente
   * Problema/Solução, tenta exibir
   * o conteúdo completo.
   */

  let problemaFinal =
    problema;


  let solucaoFinal =
    solucao;


  if(
    !problemaFinal &&
    item.dados
  ){

    problemaFinal =
      item.dados
        .filter(
          function(valor){
            return String(
              valor || ""
            ).trim() !== "";
          }
        )
        .join(" | ");

  }


  html += `

    <tr>

      <td class="col-id">

        ${escaparHTML(
          id || "-"
        )}

      </td>

      <td class="col-problema">

        ${formatarTexto(
          problemaFinal
        )}

      </td>

      <td class="col-solucao">

        ${formatarTexto(
          solucaoFinal
        )}

      </td>

    </tr>

  `;

}

);

html += `

    </tbody>

  </table>

</div>

`;

resultado.innerHTML =
html;

}

/* =====================================================
OBTER CAMPO
===================================================== */

function obterCampo(
objeto,
campos
){

if(
!objeto ||
typeof objeto !== "object"
){

return "";

}

if(
!Array.isArray(campos)
){

campos =
  [campos];

}

/*

Primeiro procura diretamente.
*/
for(
let i = 0;
i < campos.length;
i++
){

const campo =
  campos[i];


if(
  objeto[campo] !== undefined &&
  objeto[campo] !== null
){

  const valor =
    String(
      objeto[campo]
    ).trim();


  if(valor){

    return valor;

  }

}

}

/*

Depois procura ignorando
acentos, espaços e diferenças
de maiúsculas/minúsculas.
*/
const chaves =
Object.keys(
objeto
);

for(
let i = 0;
i < campos.length;
i++
){

const procurado =
  normalizarNomeCampo(
    campos[i]
  );

for(
  let j = 0;
  j < chaves.length;
  j++
){

  const chave =
    chaves[j];

  if(
    normalizarNomeCampo(
      chave
    ) === procurado
  ){

    const valor =
      objeto[chave];

    if(
      valor !== undefined &&
      valor !== null
    ){

      const texto =
        String(
          valor
        ).trim();

      if(texto){

        return texto;

      }

    }

  }

}

}

return "";

}

/* =====================================================
NORMALIZAR NOME DE CAMPO
===================================================== */

function normalizarNomeCampo(
texto
){

return String(
texto || ""
)
.normalize("NFD")
.replace(
/[\u0300-\u036f]/g,
""
)
.toLowerCase()
.replace(
/[^a-z0-9]/g,
""
);

}

/* =====================================================
FORMATAR TEXTO
===================================================== */

function formatarTexto(
texto
){

if(
texto === null ||
texto === undefined ||
String(texto).trim() === ""
){

return "-";

}

return escaparHTML(
texto
).replace(
/\r?\n/g,
"<br>"
);

}

/* =====================================================
ESCAPAR HTML
===================================================== */

function escaparHTML(
valor
){

if(
valor === null ||
valor === undefined
){

return "";

}

return String(
valor
)

.replace(
  /&/g,
  "&amp;"
)

.replace(
  /</g,
  "&lt;"
)

.replace(
  />/g,
  "&gt;"
)

.replace(
  /"/g,
  "&quot;"
)

.replace(
  /'/g,
  "&#039;"
);

}

/* =====================================================
MENSAGEM
===================================================== */

function mostrarMensagem(
texto,
tipo
){

const div =
document.getElementById(
"mensagem"
);

div.textContent =
texto;

div.className =
"mensagem " +
tipo;

}

function mostrarErro(
texto
){

mostrarMensagem(
"❌ " +
texto,
"erro"
);

}

/* =====================================================
ENTER
===================================================== */

document
.getElementById(
"campoPesquisa"
)
.addEventListener(
"keydown",
function(event){

  if(
    event.key === "Enter"
  ){

    event.preventDefault();

    pesquisar();

  }

}

);

/* =====================================================
VOLTAR
===================================================== */

function voltar(){

window.location.href =
URL_INDEX;

}
