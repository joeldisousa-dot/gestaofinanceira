<script>

/* =====================================================
   CONFIGURAÇÃO DA API
   ===================================================== */

const URL_API =
  "https://script.google.com/macros/s/AKfycbxyXfBbooxSug3QbCvbpOl1MFJpqP5AhJIqLMB166p2opvvZBUX0UfIviuObQ6_nEvc/exec";


/* =====================================================
   ELEMENTOS
   ===================================================== */

const campoPesquisa =
  document.getElementById(

  );

const btnPesquisar =

const btnLimpar =

const btnVoltar =

const painelInclusao =

const btnSalvarAtendimento =

    "btnSalvarAtendimento"
  );

const areaResultado =
  document.getElementById(
    "areaResultado"
  );

const contador =
  document.getElementById(

  );

const status =
  document.getElementById(
    "status"
  );


/* =====================================================
   VOLTAR
   ===================================================== */

function voltar() {

  if (
    window.history.length > 1
  ) {

    window.history.back();

    return;

  }

  window.location.href =
    "index.html";

}


/* =====================================================
   ABRIR FORMULÁRIO
   ===================================================== */

function abrirInclusao() {

  painelInclusao.style.display =
    "block";

  painelInclusao.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  document
    .getElementById("problema")
    .focus();

}


/* =====================================================
   FECHAR FORMULÁRIO
   ===================================================== */

function fecharInclusao() {

  painelInclusao.style.display =
    "none";

  formAtendimento.reset();

}


/* =====================================================
   STATUS
   ===================================================== */

function mostrarStatus(
  mensagem,
  tipo
) {

  status.textContent =
    mensagem;

  status.className =
    "status " +
    (tipo || "info");

}


function ocultarStatus() {

  status.textContent =
    "";

  status.className =
    "status";

}


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escaparHTML(
  valor
) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return "";

  }

  return String(valor)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   JSONP
   ===================================================== */

let contadorJSONP = 0;


function chamarAPI(
  acao,
  parametros
) {

  parametros =
    parametros || {};

  return new Promise(
    function(resolve, reject) {

      contadorJSONP++;


      const nomeCallback =
        "__controleFinanceiroCallback_" +
        Date.now() +
        "_" +
        contadorJSONP;


      const script =
        document.createElement(
          "script"
        );


      let finalizado =
        false;


      /* -----------------------------------------------
         TIMEOUT
         ----------------------------------------------- */

      const timeout =
        setTimeout(
          function() {

            if (finalizado) {
              return;
            }

            finalizado =
              true;


            delete window[
              nomeCallback
            ];


            if (
              script.parentNode
            ) {

              script.parentNode
                .removeChild(
                  script
                );

            }


            reject(
              new Error(
                "Tempo limite excedido ao consultar a API."
              )
            );

          },
          30000
        );


      /* -----------------------------------------------
         CALLBACK
         ----------------------------------------------- */

      window[
        nomeCallback
      ] =
        function(resposta) {

          if (finalizado) {
            return;
          }


          finalizado =
            true;


          clearTimeout(
            timeout
          );


          delete window[
            nomeCallback
          ];


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }


          resolve(
            resposta
          );

        };


      /* -----------------------------------------------
         CONSULTA
         ----------------------------------------------- */

      const consulta =
        Object.assign(
          {},
          parametros
        );


      consulta.action =
        acao;


      consulta.callback =
        nomeCallback;


      const query =
        Object.keys(
          consulta
        )

          .map(
            function(chave) {

              return (
                encodeURIComponent(
                  chave
                ) +
                "=" +
                encodeURIComponent(
                  consulta[chave]
                )
              );

            }
          )

          .join("&");


      script.src =
        URL_API +
        "?" +
        query;


      script.async =
        true;


      /* -----------------------------------------------
         ERRO
         ----------------------------------------------- */

      script.onerror =
        function() {

          if (finalizado) {
            return;
          }


          finalizado =
            true;


          clearTimeout(
            timeout
          );


          delete window[
            nomeCallback
          ];


          if (
            script.parentNode
          ) {

            script.parentNode
              .removeChild(
                script
              );

          }


          reject(
            new Error(
              "Não foi possível conectar à API."
            )
          );

        };


      document
        .head
        .appendChild(
          script
        );

    }
  );

}


/* =====================================================
   SALVAR ATENDIMENTO
   ===================================================== */

async function salvarAtendimento(
  evento
) {

  evento.preventDefault();


  const problema =
    document
      .getElementById(
        "problema"
      )
      .value
      .trim();


  const solucao =
    document
      .getElementById(
        "solucao"
      )
      .value
      .trim();


  /* -----------------------------------------------
     VALIDAÇÃO
     ----------------------------------------------- */

  if (!problema) {

    mostrarStatus(
      "Informe o problema.",
      "info"
    );


    document
      .getElementById(
        "problema"
      )
      .focus();


    return;

  }


  if (!solucao) {

    mostrarStatus(
      "Informe a solução.",
      "info"
    );


    document
      .getElementById(
        "solucao"
      )
      .focus();


    return;

  }


  /* -----------------------------------------------
     BLOQUEAR BOTÃO
     ----------------------------------------------- */

  btnSalvarAtendimento.disabled =
    true;


  btnSalvarAtendimento.textContent =
    "Salvando...";


  mostrarStatus(
    "Salvando atendimento...",
    "info"
  );


  try {

    /*
     * O ID NÃO é enviado.
     *
     * O Apps Script deve gerar
     * o próximo ID automaticamente.
     */

    const resposta =
      await chamarAPI(
        "incluirAtendimento",
        {
          problema:
            problema,

          solucao:
            solucao
        }
      );


    console.log(
      "Resposta incluirAtendimento:",
      resposta
    );


    if (!resposta) {

      throw new Error(
        "A API não retornou uma resposta."
      );

    }


    if (
      resposta.sucesso === false
    ) {

      throw new Error(
        resposta.mensagem ||
        "Não foi possível incluir o atendimento."
      );

    }


    mostrarStatus(
      resposta.mensagem ||
      "Atendimento incluído com sucesso!",
      "sucesso"
    );


    /*
     * Limpa o formulário.
     */

    formAtendimento.reset();


    /*
     * Fecha o formulário
     * depois de 1,5 segundo.
     */

    setTimeout(
      function() {

        fecharInclusao();

      },
      1500
    );


    /*
     * Se existir pesquisa ativa,
     * atualiza automaticamente.
     */

    const termo =
      campoPesquisa
        .value
        .trim();


    if (termo) {

      setTimeout(
        function() {

          pesquisar();

        },
        500
      );

    }


  } catch (erro) {

    console.error(
      "Erro ao incluir atendimento:",
      erro
    );


    mostrarStatus(
      erro.message ||
      "Não foi possível incluir o atendimento.",
      "erro"
    );

  } finally {

    btnSalvarAtendimento.disabled =
      false;


    btnSalvarAtendimento.textContent =
      "Salvar Atendimento";

  }

}


/* =====================================================
   PESQUISAR
   ===================================================== */

async function pesquisar() {

  const termo =
    campoPesquisa
      .value
      .trim();


  if (!termo) {

    mostrarStatus(
      "Digite um termo para pesquisar.",
      "info"
    );


    campoPesquisa.focus();


    return;

  }


  mostrarStatus(
    "Pesquisando...",
    "info"
  );


  areaResultado.innerHTML =

    '<div class="carregando">' +

      '<div class="spinner"></div>' +

      '<div>Consultando atendimento...</div>' +

    '</div>';


  contador.textContent =
    "Consultando...";


  try {

    const resposta =
      await chamarAPI(
        "pesquisarAtendimento",
        {
          termo:
            termo
        }
      );


    console.log(
      "Resposta da API:",
      resposta
    );


    if (!resposta) {

      throw new Error(
        "A API não retornou uma resposta."
      );

    }


    if (
      resposta.sucesso === false
    ) {

      throw new Error(
        resposta.mensagem ||
        "Erro retornado pela API."
      );

    }


    const dados =
      Array.isArray(
        resposta.dados
      )

        ? resposta.dados

        : (
            Array.isArray(
              resposta.lista
            )

              ? resposta.lista

              : []
          );


    renderizarResultados(
      dados
    );


    mostrarStatus(
      dados.length +
      (
        dados.length === 1
          ? " registro encontrado."
          : " registros encontrados."
      ),
      "sucesso"
    );


  } catch (erro) {

    console.error(
      "Erro ao pesquisar atendimento:",
      erro
    );


    areaResultado.innerHTML =

      '<div class="vazio">' +

        '<strong>Erro na pesquisa</strong>' +

        escaparHTML(
          erro.message ||
          String(erro)
        ) +

      '</div>';


    contador.textContent =
      "Erro";


    mostrarStatus(
      erro.message ||
      "Não foi possível realizar a pesquisa.",
      "erro"
    );

  }

}


/* =====================================================
   RENDERIZAR RESULTADOS
   ===================================================== */

function renderizarResultados(
  dados
) {

  if (
    !Array.isArray(dados) ||
    dados.length === 0
  ) {

    areaResultado.innerHTML =

      '<div class="vazio">' +

        '<strong>Nenhum registro encontrado</strong>' +

        'Nenhum atendimento corresponde ao termo pesquisado.' +

      '</div>';


    contador.textContent =
      "0 registros";


    return;

  }


  contador.textContent =
    dados.length +
    (
      dados.length === 1
        ? " registro"
        : " registros"
    );


  /*
   * Como a tabela possui somente:
   *
   * ID
   * Problema
   * Solução
   *
   * Primeiro tentamos manter
   * exatamente essa ordem.
   */

  const colunasPadrao = [
    "ID",
    "Problema",
    "Solução"
  ];


  /*
   * Descobrir as colunas reais
   * retornadas pela API.
   */

  const colunas =
    [];


  colunasPadrao.forEach(
    function(campo) {

      const existe =
        dados.some(
          function(registro) {

            return (
              registro &&
              Object.prototype.hasOwnProperty.call(
                registro,
                campo
              )
            );

          }
        );


      if (existe) {

        colunas.push(
          campo
        );

      }

    }
  );


  /*
   * Caso o Apps Script retorne
   * nomes diferentes, adiciona
   * os campos encontrados.
   */

  dados.forEach(
    function(registro) {

      if (
        !registro ||
        typeof registro !== "object"
      ) {

        return;

      }


      Object.keys(
        registro
      ).forEach(
        function(campo) {

          if (
            colunas.indexOf(campo) === -1
          ) {

            colunas.push(
              campo
            );

          }

        }
      );

    }
  );


  if (
    colunas.length === 0
  ) {

    areaResultado.innerHTML =

      '<div class="vazio">' +

        '<strong>Dados inválidos</strong>' +

        'A API retornou registros sem campos.' +

      '</div>';


    return;

  }


  /*
   * Cabeçalho da tabela.
   */

  let html =

    '<div class="tabela-container">' +

      '<table>' +

        '<thead>' +

          '<tr>';


  colunas.forEach(
    function(campo) {

      html +=

        "<th>" +

        escaparHTML(
          campo
        ) +

        "</th>";

    }
  );


  html +=

          "</tr>" +

        "</thead>" +

        "<tbody>";


  /*
   * Registros.
   */

  dados.forEach(
    function(registro) {

      html +=
        "<tr>";


      colunas.forEach(
        function(campo) {

          let valor =
            registro[campo];


          /*
           * Caso o backend retorne
           * campo em minúsculo.
           */

          if (
            valor === undefined
          ) {

            const campoMinusculo =
              campo.toLowerCase();


            const chaveEncontrada =
              Object.keys(
                registro
              ).find(
                function(chave) {

                  return (
                    chave.toLowerCase() ===
                    campoMinusculo
                  );

                }
              );


            if (
              chaveEncontrada
            ) {

              valor =
                registro[
                  chaveEncontrada
                ];

            }

          }


          html +=

            "<td>" +

            escaparHTML(
              valor
            ) +

            "</td>";

        }
      );


      html +=
        "</tr>";

    }
  );


  html +=

        "</tbody>" +

      "</table>" +

    "</div>";


  areaResultado.innerHTML =
    html;

}
