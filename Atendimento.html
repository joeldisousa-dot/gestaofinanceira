<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Atendimento</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  padding:20px;

  font-family:
    Arial,
    sans-serif;

  background:#eef3f8;

  color:#333;

}

.container{

  max-width:900px;

  margin:auto;

  background:white;

  padding:25px;

  border-radius:15px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.15);

}

.topo{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:20px;

}

.topo h2{

  margin:0;

}

.voltar{

  background:#546e7a;

  color:white;

  border:none;

  padding:12px 22px;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

}

.voltar:hover{

  background:#37474f;

}

h1{

  color:#0d47a1;

  text-align:center;

}

.pesquisa{

  display:flex;

  gap:10px;

  margin-bottom:25px;

}

input{

  height:42px;

  padding:8px;

  border-radius:8px;

  border:1px solid #ccc;

  font-size:16px;

}

#pesquisa{

  flex:1;

}

button{

  height:45px;

  padding:0 20px;

  border:none;

  border-radius:8px;

  cursor:pointer;

  font-size:15px;

  font-weight:bold;

  color:white;

  background:#1976d2;

}

button:hover{

  opacity:.85;

}

.btnNovo{

  background:#00897b;

  margin-bottom:20px;

}

.card{

  background:#f8f9fa;

  border-left:5px solid #1976d2;

  padding:15px;

  margin-bottom:15px;

  border-radius:10px;

}

.id{

  font-weight:bold;

  color:#555;

}

.titulo{

  font-weight:bold;

  color:#0d47a1;

}

.modal{

  display:none;

  position:fixed;

  top:0;

  left:0;

  width:100%;

  height:100%;

  background:rgba(0,0,0,.4);

  align-items:center;

  justify-content:center;

}

.modal.show{

  display:flex;

}

.caixa{

  background:white;

  width:min(400px,90%);

  padding:25px;

  border-radius:15px;

}

textarea{

  width:100%;

  height:90px;

  padding:10px;

  border-radius:8px;

  border:1px solid #ccc;

  resize:none;

  font-family:Arial;

}

.acoes{

  display:flex;

  gap:10px;

  margin-top:15px;

}

.btnSalvar{

  background:#1976d2;

}

.btnCancelar{

  background:#c62828;

}

#resultado{

  margin-top:20px;

}

.mensagem{

  font-weight:bold;

  margin:15px 0;

}

.erro{

  color:#c62828;

}

.sucesso{

  color:#2e7d32;

}

@media(max-width:600px){

  .pesquisa{

    flex-direction:column;

  }

  .acoes{

    flex-direction:column;

  }

}

</style>

</head>

<body>

<div class="container">

<div class="topo">

<h2>
📊 Atendimento
</h2>

<button
  class="voltar"
  onclick="voltar()"
>
⬅ Voltar
</button>

</div>

<h1>
📖 Atendimento
</h1>

<button
  class="btnNovo"
  onclick="abrirCadastro()"
>
➕ Novo Atendimento
</button>

<div class="pesquisa">

<input
  id="pesquisa"
  placeholder="Digite uma palavra para pesquisar Problema ou Solução"
>

<button onclick="pesquisar()">
🔍 Pesquisar
</button>

</div>

<div id="mensagem"></div>

<div id="resultado">

<p>
Digite uma palavra para pesquisar.
</p>

</div>

</div>


<!-- MODAL -->

<div
  id="modal"
  class="modal"
>

<div class="caixa">

<h2>
Novo Atendimento
</h2>

<label>
Problema
</label>

<textarea id="problema"></textarea>

<br><br>

<label>
Solução
</label>

<textarea id="solucao"></textarea>

<div class="acoes">

<button
  class="btnSalvar"
  onclick="salvar()"
>
💾 Salvar
</button>

<button
  class="btnCancelar"
  onclick="fecharCadastro()"
>
Cancelar
</button>

</div>

</div>

</div>


<script>

/* =========================================================
   API
========================================================= */

const URL_API =
  "https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
  action,
  params={}
){

  const url =
    new URL(URL_API);


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(function(chave){

      const valor =
        params[chave];


      if(
        valor !== undefined &&
        valor !== null
      ){

        url.searchParams.set(
          chave,
          typeof valor === "object"
            ? JSON.stringify(valor)
            : valor
        );

      }

    });


  const resposta =
    await fetch(
      url.toString(),
      {
        method:"GET",
        redirect:"follow",
        cache:"no-store"
      }
    );


  if(!resposta.ok){

    throw new Error(
      "Erro HTTP " +
      resposta.status
    );

  }


  const texto =
    await resposta.text();


  let dados;


  try{

    dados =
      JSON.parse(texto);

  }
  catch(e){

    console.error(texto);

    throw new Error(
      "Resposta inválida da API."
    );

  }


  if(
    dados &&
    dados.sucesso === false
  ){

    throw new Error(
      dados.erro ||
      dados.mensagem ||
      "Erro na API."
    );

  }


  return dados;

}


/* =========================================================
   VOLTAR
========================================================= */

function voltar(){

  window.location.href =
    "./index.html";

}


/* =========================================================
   PESQUISAR
========================================================= */

async function pesquisar(){

  const palavra =
    document
      .getElementById(
        "pesquisa"
      )
      .value
      .trim();


  if(!palavra){

    document
      .getElementById(
        "resultado"
      )
      .innerHTML =
        "<p>Digite uma palavra para pesquisar.</p>";

    return;

  }


  mostrarMensagem(
    "Pesquisando...",
    ""
  );


  try{

    const lista =
      await apiRequest(
        "pesquisarAtendimento",
        {
          palavra:
            palavra
        }
      );


    mostrarResultado(
      lista
    );


    limparMensagem();

  }
  catch(e){

    mostrarMensagem(
      "Erro: " +
      e.message,
      "erro"
    );

  }

}


/* =========================================================
   MOSTRAR RESULTADO
========================================================= */

function mostrarResultado(lista){

  const div =
    document.getElementById(
      "resultado"
    );


  if(
    !lista ||
    lista.length === 0
  ){

    div.innerHTML =
      "<p>Nenhum atendimento encontrado.</p>";

    return;

  }


  let html =
    "";


  lista.forEach(function(item){

    html += `

      <div class="card">

        <div class="id">
          ID: ${escapar(item.id)}
        </div>

        <br>

        <div class="titulo">
          Problema:
        </div>

        <div>
          ${escapar(item.problema)}
        </div>

        <br>

        <div class="titulo">
          Solução:
        </div>

        <div>
          ${escapar(item.solucao)}
        </div>

      </div>

    `;

  });


  div.innerHTML =
    html;

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapar(valor){

  return String(
    valor ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  )
  .replace(
    /\n/g,
    "<br>"
  );

}


/* =========================================================
   CADASTRO
========================================================= */

function abrirCadastro(){

  document
    .getElementById(
      "modal"
    )
    .classList.add(
      "show"
    );

}


function fecharCadastro(){

  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "show"
    );

}


async function salvar(){

  const problema =
    document
      .getElementById(
        "problema"
      )
      .value
      .trim();


  const solucao =
    document
      .getElementById(
        "solucao"
      )
      .value
      .trim();


  if(
    !problema ||
    !solucao
  ){

    alert(
      "Informe problema e solução."
    );

    return;

  }


  try{

    const resposta =
      await apiRequest(
        "incluirAtendimento",
        {
          problema:
            problema,

          solucao:
            solucao
        }
      );


    alert(
      resposta.mensagem ||
      "Atendimento salvo."
    );


    fecharCadastro();


    document
      .getElementById(
        "problema"
      )
      .value =
      "";


    document
      .getElementById(
        "solucao"
      )
      .value =
      "";


    document
      .getElementById(
        "pesquisa"
      )
      .value =
      problema;


    pesquisar();

  }
  catch(e){

    alert(
      "Erro: " +
      e.message
    );

  }

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagem(
  texto,
  classe
){

  document
    .getElementById(
      "mensagem"
    )
    .innerHTML =

      "<div class='mensagem " +
      classe +
      "'>" +
      texto +
      "</div>";

}


function limparMensagem(){

  document
    .getElementById(
      "mensagem"
    )
    .innerHTML =
      "";

}

</script>

</body>

</html>
