<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Pesquisa de Campos</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f5f5f5;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
    }

    .pesquisa {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .pesquisa input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    .pesquisa button {
      padding: 10px 20px;
      border: none;
      background: #1976d2;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .pesquisa button:hover {
      background: #125ca8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #eee;
    }

    .mensagem {
      margin-top: 15px;
      color: #666;
    }

    .destaque {
      background: #fff3cd;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Pesquisa de Campos</h2>

  <div class="pesquisa">

    <input
      type="text"
      id="campoPesquisa"
      placeholder="Digite tabela ou campo..."
      onkeydown="if(event.key === 'Enter') pesquisar()"
    >

    <button onclick="pesquisar()">
      Pesquisar
    </button>

  </div>

  <div id="mensagem" class="mensagem">
    Digite uma palavra para pesquisar.
  </div>

  <table id="resultado" style="display:none;">

    <thead>
      <tr>
        <th>Tabela</th>
        <th>Campo</th>
      </tr>
    </thead>

    <tbody id="resultadoBody"></tbody>

  </table>

</div>

<script>

function pesquisar() {

  const palavra =
    document.getElementById("campoPesquisa").value.trim();

  const mensagem =
    document.getElementById("mensagem");

  const tabela =
    document.getElementById("resultado");

  const tbody =
    document.getElementById("resultadoBody");


  if (!palavra) {

    mensagem.textContent =
      "Digite uma palavra para pesquisar.";

    tabela.style.display = "none";

    return;
  }


  mensagem.textContent = "Pesquisando...";

  tabela.style.display = "none";

  tbody.innerHTML = "";


  google.script.run

    .withSuccessHandler(function(resultados) {

      if (!resultados || resultados.length === 0) {

        mensagem.textContent =
          "Nenhum registro encontrado.";

        tabela.style.display = "none";

        return;
      }


      resultados.forEach(function(linha) {

        const tr = document.createElement("tr");

        const tdTabela =
          document.createElement("td");

        const tdCampo =
          document.createElement("td");


        tdTabela.textContent =
          linha.tabela;

        tdCampo.textContent =
          linha.campo;


        tr.appendChild(tdTabela);

        tr.appendChild(tdCampo);

        tbody.appendChild(tr);

      });


      mensagem.textContent =
        resultados.length +
        " registro(s) encontrado(s).";


      tabela.style.display = "table";

    })

    .withFailureHandler(function(erro) {

      mensagem.textContent =
        "Erro ao realizar a pesquisa: " +
        erro.message;

    })

    .pesquisarTabelaCampo(palavra);

}

</script>

</body>
</html>
