<script>

/* =====================================================
   CONFIGURAÇÃO DA API
   ===================================================== */

const URL_API =
  "https://script.google.com/macros/s/AKfycbxyXfBbooxSug3QbCvbpOl1MFJpqP5AhJIqLMB166p2opvvZBUX0UfIviuObQ6_nEvc/exec";


/* =====================================================
   ELEMENTOS
   ===================================================== */

const campoPesquisa =
  document.getElementById("campoPesquisa");

const btnPesquisar =
  document.getElementById("btnPesquisar");

const btnLimpar =
  document.getElementById("btnLimpar");

const btnVoltar =
  document.getElementById("btnVoltar");

const btnNovoAtendimento =
  document.getElementById("btnNovoAtendimento");

const btnCancelarInclusao =
  document.getElementById("btnCancelarInclusao");

const formAtendimento =
  document.getElementById("formAtendimento");

const painelInclusao =
  document.getElementById("painelInclusao");

const btnSalvarAtendimento =
  document.getElementById("btnSalvarAtendimento");

const areaResultado =
  document.getElementById("areaResultado");

const contador =
  document.getElementById("contador");

const status =
  document.getElementById("status");


/* =====================================================
   BOTÃO VOLTAR
   ===================================================== */

function voltar() {

  if (window.history.length > 1) {

    window.history.back();

    return;

  }

  window.location.href =
    "index.html";

}


/* =====================================================
   ABRIR INCLUSÃO
   ===================================================== */

function abrirInclusao() {

  painelInclusao.style.display =
    "block";

  painelInclusao.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  document
    .getElementById("nome")
    .focus();

}


/* =====================================================
   FECHAR INCLUSÃO
   ===================================================== */

function fecharInclusao() {

  painelInclusao.style.display =
    "none";

  formAtendimento.reset();

}


/* =====================================================
   STATUS
   ===================================================== */

function mostrarStatus(
  mensagem,
  tipo
) {

  status.textContent =
    mensagem;

  status.className =
    "status " +
    (tipo || "info");

}


function ocultarStatus() {

  status.textContent =
    "";

  status.className =
    "status";

}


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escaparHTML(valor) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return "";

  }

  return String(valor)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =====================================================
   JSONP
   ===================================================== */

let contadorJSONP = 0;


function chamarAPI(
  acao,
  parametros
) {

  parametros =
    parametros || {};

  return new Promise(
    function(resolve, reject) {

      contadorJSONP++;

      const nomeCallback =
        "__controleFinanceiroCallback_" +
        Date.now() +
        "_" +
        contadorJSONP;

      const script =
        document.createElement("script");

      let finalizado =
        false;


      const timeout =
        setTimeout(
          function() {

            if (finalizado) {
              return;
            }

            finalizado =
              true;

            delete window[
              nomeCallback
            ];

            if (script.parentNode) {

              script.parentNode
                .removeChild(script);

            }

            reject(
              new Error(
                "Tempo limite excedido ao consultar a API."
              )
            );

          },
          30000
        );


      window[
        nomeCallback
      ] =
        function(resposta) {

          if (finalizado) {
            return;
          }

          finalizado =
            true;

          clearTimeout(timeout);

          delete window[
            nomeCallback
          ];

          if (script.parentNode) {

            script.parentNode
              .removeChild(script);

          }

          resolve(resposta);

        };


      const consulta =
        Object.assign(
          {},
          parametros
        );

      consulta.action =
        acao;

      consulta.callback =
        nomeCallback;


      const query =
        Object.keys(consulta)

          .map(
            function(chave) {

              return (
                encodeURIComponent(chave) +
                "=" +
                encodeURIComponent(
                  consulta[chave]
                )
              );

            }
          )

          .join("&");


      script.src =
        URL_API +
        "?" +
        query;

      script.async =
        true;


      script.onerror =
        function() {

          if (finalizado) {
            return;
          }

          finalizado =
            true;

          clearTimeout(timeout);

          delete window[
            nomeCallback
          ];

          if (script.parentNode) {

            script.parentNode
              .removeChild(script);

          }

          reject(
            new Error(
              "Não foi possível conectar à API."
            )
          );

        };


      document.head.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   SALVAR ATENDIMENTO
   ===================================================== */

async function salvarAtendimento(
  evento
) {

  evento.preventDefault();


  const nome =
    document
      .getElementById("nome")
      .value
      .trim();

  const cpf =
    document
      .getElementById("cpf")
      .value
      .trim();

  const telefone =
    document
      .getElementById("telefone")
      .value
      .trim();

  const tipo =
    document
      .getElementById("tipo")
      .value
      .trim();

  const assunto =
    document
      .getElementById("assunto")
      .value
      .trim();

  const descricao =
    document
      .getElementById("descricao")
      .value
      .trim();

  const responsavel =
    document
      .getElementById("responsavel")
      .value
      .trim();

  const statusAtendimento =
    document
      .getElementById("statusAtendimento")
      .value
      .trim();


  /* ===================================================
     VALIDAÇÃO
     =================================================== */

  if (!nome) {

    mostrarStatus(
      "Informe o nome.",
      "info"
    );

    document
      .getElementById("nome")
      .focus();

    return;

  }


  if (!assunto) {

    mostrarStatus(
      "Informe o assunto do atendimento.",
      "info"
    );

    document
      .getElementById("assunto")
      .focus();

    return;

  }


  if (!descricao) {

    mostrarStatus(
      "Informe a descrição do atendimento.",
      "info"
    );

    document
      .getElementById("descricao")
      .focus();

    return;

  }


  /* ===================================================
     BLOQUEAR BOTÃO
     =================================================== */

  btnSalvarAtendimento.disabled =
    true;

  btnSalvarAtendimento.textContent =
    "Salvando...";


  mostrarStatus(
    "Salvando atendimento...",
    "info"
  );


  try {

    const resposta =
      await chamarAPI(
        "incluirAtendimento",
        {
          nome:
            nome,

          cpf:
            cpf,

          telefone:
            telefone,

          tipo:
            tipo,

          assunto:
            assunto,

          descricao:
            descricao,

          responsavel:
            responsavel,

          status:
            statusAtendimento
        }
      );


    console.log(
      "Resposta incluirAtendimento:",
      resposta
    );


    if (!resposta) {

      throw new Error(
        "A API não retornou uma resposta."
      );

    }


    if (
      resposta.sucesso === false
    ) {

      throw new Error(
        resposta.mensagem ||
        "Não foi possível incluir o atendimento."
      );

    }


    mostrarStatus(
      resposta.mensagem ||
      "Atendimento incluído com sucesso!",
      "sucesso"
    );


    formAtendimento.reset();


    document
      .getElementById("statusAtendimento")
      .value =
      "Aberto";


    /*
     * Fecha o formulário após
     * alguns segundos.
     */

    setTimeout(
      function() {

        fecharInclusao();

      },
      1800
    );


    /*
     * Se havia uma pesquisa,
     * atualiza automaticamente.
     */

    const termo =
      campoPesquisa
        .value
        .trim();


    if (termo) {

      setTimeout(
        function() {

          pesquisar();

        },
        500
      );

    }


  } catch (erro) {

    console.error(
      "Erro ao incluir atendimento:",
      erro
    );


    mostrarStatus(
      erro.message ||
      "Não foi possível incluir o atendimento.",
      "erro"
    );

  } finally {

    btnSalvarAtendimento.disabled =
      false;

    btnSalvarAtendimento.textContent =
      "Salvar Atendimento";

  }

}


/* =====================================================
   PESQUISAR
   ===================================================== */

async function pesquisar() {

  const termo =
    campoPesquisa
      .value
      .trim();


  if (!termo) {

    mostrarStatus(
      "Digite um termo para pesquisar.",
      "info"
    );

    campoPesquisa.focus();

    return;

  }


  mostrarStatus(
    "Pesquisando...",
    "info"
  );


  areaResultado.innerHTML =

    '<div class="carregando">' +

      '<div class="spinner"></div>' +

      '<div>Consultando atendimento...</div>' +

    '</div>';


  contador.textContent =
    "Consultando...";


  try {

    const resposta =
      await chamarAPI(
        "pesquisarAtendimento",
        {
          termo:
            termo
        }
      );


    console.log(
      "Resposta da API:",
      resposta
    );


    if (!resposta) {

      throw new Error(
        "A API não retornou uma resposta."
      );

    }


    if (
      resposta.sucesso === false
    ) {

      throw new Error(
        resposta.mensagem ||
        "Erro retornado pela API."
      );

    }


    const dados =
      Array.isArray(
        resposta.dados
      )

        ? resposta.dados

        : (
            Array.isArray(
              resposta.lista
            )
              ? resposta.lista
              : []
          );


    renderizarResultados(
      dados
    );


    mostrarStatus(
      dados.length +
      (
        dados.length === 1
          ? " registro encontrado."
          : " registros encontrados."
      ),
      "sucesso"
    );


  } catch (erro) {

    console.error(
      "Erro ao pesquisar atendimento:",
      erro
    );


    areaResultado.innerHTML =

      '<div class="vazio">' +

        '<strong>Erro na pesquisa</strong>' +

        escaparHTML(
          erro.message ||
          String(erro)
        ) +

      '</div>';


    contador.textContent =
      "Erro";


    mostrarStatus(
      erro.message ||
      "Não foi possível realizar a pesquisa.",
      "erro"
    );

  }

}


/* =====================================================
   RENDERIZAR RESULTADOS
   ===================================================== */

function renderizarResultados(
  dados
) {

  if (
    !Array.isArray(dados) ||
    dados.length === 0
  ) {

    areaResultado.innerHTML =

      '<div class="vazio">' +

        '<strong>Nenhum registro encontrado</strong>' +

        'Nenhum atendimento corresponde ao termo pesquisado.' +

      '</div>';


    contador.textContent =
      "0 registros";

    return;

  }


  contador.textContent =
    dados.length +
    (
      dados.length === 1
        ? " registro"
        : " registros"
    );


  const colunas = [];


  dados.forEach(
    function(registro) {

      if (
        !registro ||
        typeof registro !== "object"
      ) {

        return;

      }


      Object.keys(
        registro
      ).forEach(
        function(campo) {

          if (
            colunas.indexOf(campo) === -1
          ) {

            colunas.push(campo);

          }

        }
      );

    }
  );


  if (
    colunas.length === 0
  ) {

    areaResultado.innerHTML =

      '<div class="vazio">' +

        '<strong>Dados inválidos</strong>' +

        'A API retornou registros sem campos.' +

      '</div>';

    return;

  }


  let html =

    '<div class="tabela-container">' +

      '<table>' +

        '<thead>' +

          '<tr>';


  colunas.forEach(
    function(campo) {

      html +=
        "<th>" +
        escaparHTML(campo) +
        "</th>";

    }
  );


  html +=

          "</tr>" +

        "</thead>" +

        "<tbody>";


  dados.forEach(
    function(registro) {

      html +=
        "<tr>";


      colunas.forEach(
        function(campo) {

          const valor =
            registro[campo];


          html +=
            "<td>" +
            escaparHTML(
              valor
            ) +
            "</td>";

        }
      );


      html +=
        "</tr>";

    }
  );


  html +=

        "</tbody>" +

      "</table>" +

    "</div>";


  areaResultado.innerHTML =
    html;

}


/* =====================================================
   LIMPAR
   ===================================================== */

function limparPesquisa() {

  campoPesquisa.value =
    "";

  areaResultado.innerHTML =

    '<div class="vazio">' +

  ocultarStatus();

}
