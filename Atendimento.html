<!DOCTYPE html>

<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Atendimento - Controle Financeiro</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:"Segoe UI",Arial,sans-serif;
  background:linear-gradient(135deg,#e8eef5,#ffffff);
  color:#333;
}

.container{
  max-width:1100px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

/* =====================================================
   TOPO
===================================================== */

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.topo h1{
  margin:0;
  color:#0d47a1;
  font-size:28px;
}

.btn-voltar{
  border:none;
  padding:12px 24px;
  border-radius:10px;
  background:linear-gradient(135deg,#455a64,#78909c);
  color:#fff;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.btn-voltar:hover{
  transform:translateY(-2px);
  filter:brightness(1.08);
}

/* =====================================================
   PESQUISA
===================================================== */

.pesquisa{
  background:#f5f7fa;
  border:1px solid #e0e6ed;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}

.pesquisa h2{
  margin:0 0 15px 0;
  color:#1976d2;
  font-size:19px;
}

.linha-pesquisa{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
}

input{
  width:100%;
  height:46px;
  padding:0 14px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#1976d2;
  box-shadow:0 0 0 3px rgba(25,118,210,.12);
}

.btn-pesquisar{
  height:46px;
  padding:0 25px;
  border:none;
  border-radius:9px;
  background:linear-gradient(135deg,#1976d2,#2196f3);
  color:#fff;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.btn-pesquisar:hover{
  filter:brightness(1.08);
  transform:translateY(-2px);
}

.btn-pesquisar:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

/* =====================================================
   MENSAGENS
===================================================== */

.mensagem{
  display:none;
  margin:15px 0;
  padding:13px;
  border-radius:8px;
}

.mensagem.info{
  display:block;
  background:#e3f2fd;
  color:#1565c0;
}

.mensagem.erro{
  display:block;
  background:#ffebee;
  color:#c62828;
  border-left:5px solid #c62828;
  font-weight:bold;
}

.mensagem.sucesso{
  display:block;
  background:#e8f5e9;
  color:#2e7d32;
}

/* =====================================================
   RESULTADO
===================================================== */

.resultado{
  margin-top:20px;
}

.card{
  border:1px solid #e1e5ea;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}

.card-titulo{
  background:linear-gradient(135deg,#0d47a1,#1976d2);
  color:#fff;
  padding:15px 18px;
  font-size:18px;
  font-weight:bold;
}

.dados{
  display:grid;
  grid-template-columns:repeat(2,1fr);
}

.campo{
  padding:14px 18px;
  border-bottom:1px solid #eee;
}

.campo:nth-child(odd){
  border-right:1px solid #eee;
}

.rotulo{
  display:block;
  color:#777;
  font-size:12px;
  margin-bottom:4px;
}

.valor{
  font-weight:bold;
  font-size:15px;
  color:#263238;
}

.endereco{
  grid-column:1 / -1;
}

/* =====================================================
   TABELA
===================================================== */

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th{
  background:#1976d2;
  color:white;
  padding:10px;
  text-align:left;
}

td{
  padding:10px;
  border-bottom:1px solid #ddd;
}

tr:nth-child(even){
  background:#f8f9fc;
}

.nenhum{
  text-align:center;
  padding:30px;
  color:#777;
}

/* =====================================================
   LOADING
===================================================== */

.carregando{
  text-align:center;
  padding:30px;
  color:#777;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px){

  body{
    padding:10px;
  }

  .container{
    padding:15px;
    border-radius:12px;
  }

  .topo{
    flex-direction:column;
    align-items:stretch;
  }

  .topo h1{
    font-size:23px;
  }

  .btn-voltar{
    width:100%;
  }

  .linha-pesquisa{
    grid-template-columns:1fr;
  }

  .btn-pesquisar{
    width:100%;
  }

  .dados{
    grid-template-columns:1fr;
  }

  .campo:nth-child(odd){
    border-right:none;
  }

  .endereco{
    grid-column:auto;
  }

}

</style>

</head>

<body>

<div class="container">

  <!-- =================================================
       TOPO
  ================================================== -->

  <div class="topo">


<h1>
  🔎 Atendimento
</h1>

<button
  class="btn-voltar"
  onclick="voltar()">

  ⬅ Voltar

</button>


  </div>

  <!-- =================================================
       PESQUISA
  ================================================== -->

  <div class="pesquisa">


<h2>
  Pesquisar cliente
</h2>

<div class="linha-pesquisa">

  <input
    id="campoPesquisa"
    type="text"
    placeholder="Digite o nome ou sobrenome..."
    autocomplete="off">

  <button
    id="btnPesquisar"
    class="btn-pesquisar"
    onclick="pesquisar()">

    🔎 Pesquisar

  </button>

</div>


  </div>

  <!-- =================================================
       MENSAGEM
  ================================================== -->

  <div
    id="mensagem"
    class="mensagem">
  </div>

  <!-- =================================================
       RESULTADO
  ================================================== -->

  <div
    id="resultado"
    class="resultado">


<div class="nenhum">

  Digite um nome ou sobrenome para realizar a pesquisa.

</div>


  </div>

</div>

<script>

/* =========================================================
   CONFIGURAÇÃO DA API
========================================================= */

const URL_API =
"https://script.google.com/macros/s/AKfycbw-Fry_UM89-p0FjPEoDNdfdTSNdz56sYzUA8VJIpD9_862l5dPSNmkWOGLXyZiqnRn/exec";


/* =========================================================
   URL DO GITHUB
========================================================= */

const URL_INDEX =
"https://joeldisousa-dot.github.io/gestaofinanceira/";


/* =========================================================
   CONTROLE JSONP
========================================================= */

let contadorJSONP = 0;


/* =========================================================
   CHAMAR API
========================================================= */

function chamarAPI(acao, parametros){

  return new Promise(function(resolve,reject){

    const callback =
      "callbackAtendimento_" +
      Date.now() +
      "_" +
      (++contadorJSONP);


    const script =
      document.createElement("script");


    const dados =
      Object.assign({}, parametros || {});


    dados.action =
      acao;

    dados.callback =
      callback;


    const query =
      Object.keys(dados)
        .map(function(chave){

          return (
            encodeURIComponent(chave) +
            "=" +
            encodeURIComponent(
              dados[chave] === undefined ||
              dados[chave] === null
                ? ""
                : dados[chave]
            )
          );

        })
        .join("&");


    const url =
      URL_API +
      "?" +
      query;


    let finalizado =
      false;


    const timeout =
      setTimeout(function(){

        if(finalizado){
          return;
        }

        finalizado =
          true;

        cleanup();

        reject(
          new Error(
            "Tempo limite excedido ao consultar a API."
          )
        );

      },30000);


    window[callback] =
      function(resposta){

        if(finalizado){
          return;
        }

        finalizado =
          true;

        clearTimeout(timeout);

        cleanup();

        resolve(resposta);

      };


    script.onerror =
      function(){

        if(finalizado){
          return;
        }

        finalizado =
          true;

        clearTimeout(timeout);

        cleanup();

        reject(
          new Error(
            "Não foi possível conectar ao Google Apps Script."
          )
        );

      };


    script.src =
      url;


    document.body.appendChild(
      script
    );


    function cleanup(){

      delete window[callback];

      if(script.parentNode){

        script.parentNode.removeChild(
          script
        );

      }

    }

  });

}


/* =========================================================
   PESQUISA
========================================================= */

async function pesquisar(){

  const campo =
    document.getElementById(
      "campoPesquisa"
    );


  const botao =
    document.getElementById(
      "btnPesquisar"
    );


  const resultado =
    document.getElementById(
      "resultado"
    );


  const texto =
    String(
      campo.value || ""
    ).trim();


  if(!texto){

    mostrarErro(
      "Digite o nome ou sobrenome para pesquisar."
    );

    campo.focus();

    return;

  }


  botao.disabled =
    true;


  mostrarMensagem(
    "Pesquisando...",
    "info"
  );


  resultado.innerHTML =
    `<div class="carregando">
       🔎 Pesquisando informações...
     </div>`;


  try{

    /*
       Ação utilizada pelo servidor:
       pesquisarAtendimento
    */

    const resposta =
      await chamarAPI(
        "pesquisarAtendimento",
        {
          texto:texto
        }
      );


    console.log(
      "Resposta Atendimento:",
      resposta
    );


    if(
      !resposta
    ){

      throw new Error(
        "A API não retornou resposta."
      );

    }


    if(
      resposta.sucesso === false
    ){

      throw new Error(
        resposta.erro ||
        resposta.mensagem ||
        "Erro retornado pelo servidor."
      );

    }


    const lista =
      obterListaResposta(
        resposta
      );


    if(
      lista.length === 0
    ){

      resultado.innerHTML =
        `<div class="nenhum">
           Nenhum cliente encontrado para:
           <strong>${escaparHTML(texto)}</strong>
         </div>`;

      mostrarMensagem(
        "Nenhum registro encontrado.",
        "info"
      );

      return;

    }


    montarResultado(
      lista
    );


    mostrarMensagem(
      lista.length +
      (
        lista.length === 1
          ? " registro encontrado."
          : " registros encontrados."
      ),
      "sucesso"
    );


  }
  catch(e){

    console.error(
      "Erro ao pesquisar:",
      e
    );


    resultado.innerHTML =
      `<div class="erro">
         ❌ Erro ao pesquisar:<br>
         ${escaparHTML(e.message)}
       </div>`;


    mostrarErro(
      e.message
    );

  }
  finally{

    botao.disabled =
      false;

  }

}


/* =========================================================
   NORMALIZAR RESPOSTA
========================================================= */

function obterListaResposta(
  resposta
){

  if(
    Array.isArray(resposta)
  ){

    return resposta;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.lista
    )
  ){

    return resposta.lista;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.dados
    )
  ){

    return resposta.dados;

  }


  if(
    resposta &&
    Array.isArray(
      resposta.resultado
    )
  ){

    return resposta.resultado;

  }


  /*
     Caso a API retorne um único objeto.
  */

  if(
    resposta &&
    typeof resposta === "object" &&
    (
      resposta.nome ||
      resposta.endereco ||
      resposta.cpf
    )
  ){

    return [resposta];

  }


  return [];

}


/* =========================================================
   MONTAR RESULTADO
========================================================= */

function montarResultado(
  lista
){

  const resultado =
    document.getElementById(
      "resultado"
    );


  let html =
    "";


  lista.forEach(
    function(item,index){

      const nome =
        primeiroValor(
          item,
          [
            "nome",
            "Nome",
            "NOME"
          ]
        );


      const cpf =
        primeiroValor(
          item,
          [
            "cpf",
            "CPF",
            "Cpf"
          ]
        );


      const endereco =
        primeiroValor(
          item,
          [
            "endereco",
            "Endereco",
            "ENDERECO",
            "endereço",
            "Endereço"
          ]
        );


      const numero =
        primeiroValor(
          item,
          [
            "numero",
            "Número",
            "numeroEndereco",
            "num"
          ]
        );


      const bairro =
        primeiroValor(
          item,
          [
            "bairro",
            "Bairro"
          ]
        );


      const cidade =
        primeiroValor(
          item,
          [
            "cidade",
            "Cidade",
            "municipio",
            "Município"
          ]
        );


      const estado =
        primeiroValor(
          item,
          [
            "estado",
            "Estado",
            "uf",
            "UF"
          ]
        );


      const cep =
        primeiroValor(
          item,
          [
            "cep",
            "CEP"
          ]
        );


      const telefone =
        primeiroValor(
          item,
          [
            "telefone",
            "Telefone",
            "celular",
            "Celular"
          ]
        );


      const complemento =
        primeiroValor(
          item,
          [
            "complemento",
            "Complemento"
          ]
        );


      html += `

        <div class="card"
             style="margin-bottom:20px">

          <div class="card-titulo">

            👤 ${escaparHTML(
              nome || "Cliente"
            )}

          </div>


          <div class="dados">


            <div class="campo">

              <span class="rotulo">
                Nome
              </span>

              <span class="valor">
                ${escaparHTML(
                  nome || "-"
                )}
              </span>

            </div>


            <div class="campo">

              <span class="rotulo">
                CPF
              </span>

              <span class="valor">
                ${escaparHTML(
                  cpf || "-"
                )}
              </span>

            </div>


            <div class="campo endereco">

              <span class="rotulo">
                Endereço
              </span>

              <span class="valor">

                ${escaparHTML(
                  endereco || "-"
                )}

                ${
                  numero
                    ? ", " +
                      escaparHTML(numero)
                    : ""
                }

                ${
                  complemento
                    ? " - " +
                      escaparHTML(complemento)
                    : ""
                }

              </span>

            </div>


            <div class="campo">

              <span class="rotulo">
                Bairro
              </span>

              <span class="valor">
                ${escaparHTML(
                  bairro || "-"
                )}
              </span>

            </div>


            <div class="campo">

              <span class="rotulo">
                CEP
              </span>

              <span class="valor">
                ${escaparHTML(
                  cep || "-"
                )}
              </span>

            </div>


            <div class="campo">

              <span class="rotulo">
                Cidade
              </span>

              <span class="valor">

                ${escaparHTML(
                  cidade || "-"
                )}

                ${
                  estado
                    ? " / " +
                      escaparHTML(estado)
                    : ""
                }

              </span>

            </div>


            <div class="campo">

              <span class="rotulo">
                Telefone
              </span>

              <span class="valor">
                ${escaparHTML(
                  telefone || "-"
                )}
              </span>

            </div>


          </div>

        </div>

      `;

    }
  );


  resultado.innerHTML =
    html;

}


/* =========================================================
   PRIMEIRO VALOR
========================================================= */

function primeiroValor(
  objeto,
  campos
){

  for(
    let i=0;
    i<campos.length;
    i++
  ){

    const campo =
      campos[i];


    if(
      objeto &&
      objeto[campo] !== undefined &&
      objeto[campo] !== null &&
      String(
        objeto[campo]
      ).trim() !== ""
    ){

      return String(
        objeto[campo]
      ).trim();

    }

  }


  return "";

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagem(
  texto,
  tipo
){

  const div =
    document.getElementById(
      "mensagem"
    );


  div.textContent =
    texto;


  div.className =
    "mensagem " +
    tipo;

}


function mostrarErro(
  texto
){

  mostrarMensagem(
    "❌ " + texto,
    "erro"
  );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(
  valor
){

  if(
    valor === null ||
    valor === undefined
  ){

    return "";

  }


  return String(valor)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   ENTER PARA PESQUISAR
========================================================= */

document
  .getElementById(
    "campoPesquisa"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        pesquisar();

      }

    }
  );


/* =========================================================
   VOLTAR
========================================================= */

function voltar(){

  window.location.href =
    URL_INDEX;

}

</script>

</body>

</html>
