<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gráficos Financeiros</title>

<script src="https://www.gstatic.com/charts/loader.js"></script>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}


/* =========================================================
   BODY
========================================================= */

body{

  margin:0;

  padding:20px;

  font-family:
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #e8eef5,
      #ffffff
    );

  color:#1e293b;

}


/* =========================================================
   CONTAINER
========================================================= */

.container{

  width:
    min(
      1200px,
      calc(100% - 10px)
    );

  margin:auto;

  background:#ffffff;

  padding:25px;

  border-radius:18px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.12);

}


/* =========================================================
   TOPO
========================================================= */

.topo{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:25px;

}


.topo h1{

  margin:0;

  font-size:28px;

  color:#0d47a1;

}


/* =========================================================
   BOTÃO VOLTAR
========================================================= */

.btn-voltar{

  background:
    linear-gradient(
      135deg,
      #455a64,
      #78909c
    );

  color:white;

  border:none;

  padding:
    12px 22px;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

  font-size:15px;

  box-shadow:
    0 4px 10px rgba(0,0,0,.18);

  transition:.2s;

}


.btn-voltar:hover{

  transform:
    translateY(-2px);

  filter:
    brightness(1.08);

}


/* =========================================================
   FILTROS
========================================================= */

.filtros{

  display:grid;

  grid-template-columns:
    repeat(
      4,
      minmax(150px,1fr)
    );

  gap:18px;

  margin-top:20px;

  padding:20px;

  background:#f8fafc;

  border:
    1px solid #e2e8f0;

  border-radius:14px;

}


/* =========================================================
   FILTRO
========================================================= */

.filtro{

  display:flex;

  flex-direction:column;

  gap:7px;

}


.filtro label{

  font-weight:bold;

  font-size:13px;

  color:#334155;

}


/* =========================================================
   SELECT
========================================================= */

select{

  width:100%;

  height:44px;

  padding:
    0 12px;

  border:
    1px solid #cbd5e1;

  border-radius:9px;

  background:white;

  color:#1e293b;

  font-size:14px;

  outline:none;

}


select:focus{

  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);

}


/* =========================================================
   BOTÃO ATUALIZAR
========================================================= */

.btn-atualizar{

  height:44px;

  background:
    linear-gradient(
      135deg,
      #1976d2,
      #2196f3
    );

  color:white;

  border:none;

  padding:
    0 20px;

  border-radius:9px;

  cursor:pointer;

  font-weight:bold;

  font-size:14px;

  box-shadow:
    0 4px 10px
    rgba(25,118,210,.20);

  transition:.2s;

}


.btn-atualizar:hover{

  transform:
    translateY(-2px);

  filter:
    brightness(1.08);

}


.btn-atualizar:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;

}


/* =========================================================
   MENSAGEM
========================================================= */

.mensagem{

  margin-top:18px;

  padding:13px 15px;

  border-radius:9px;

  display:none;

  font-size:14px;

}


.mensagem.info{

  display:block;

  background:#eff6ff;

  color:#1d4ed8;

  border-left:
    5px solid #2563eb;

}


.mensagem.erro{

  display:block;

  background:#fee2e2;

  color:#991b1b;

  border-left:
    5px solid #dc2626;

  font-weight:bold;

}


.mensagem.sucesso{

  display:block;

  background:#ecfdf5;

  color:#166534;

  border-left:
    5px solid #16a34a;

}


/* =========================================================
   ÁREA DOS GRÁFICOS
========================================================= */

.secao-grafico{

  margin-top:30px;

  padding:18px;

  background:#ffffff;

  border:
    1px solid #e2e8f0;

  border-radius:14px;

}


.secao-grafico h2{

  margin:
    0 0 10px 0;

  color:#0d47a1;

  font-size:19px;

}


.secao-grafico h3{

  margin:
    0 0 10px 0;

  color:#334155;

  font-size:16px;

}


/* =========================================================
   GRÁFICOS
========================================================= */

#grafico{

  width:100%;

  height:500px;

  margin-top:10px;

}


#graficoLinha{

  width:100%;

  height:450px;

  margin-top:10px;

}


/* =========================================================
   INFORMAÇÃO DA CATEGORIA
========================================================= */

.info-grafico{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  margin-bottom:5px;

  padding:
    10px 12px;

  background:#f8fafc;

  border-radius:8px;

  font-size:13px;

  color:#475569;

}


.info-grafico strong{

  color:#0f172a;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

  display:flex;

  align-items:center;

  justify-content:center;

  min-height:120px;

  color:#64748b;

  font-style:italic;

}


/* =========================================================
   RODAPÉ
========================================================= */

.rodape{

  text-align:center;

  margin-top:25px;

  color:#777;

  font-size:12px;

}


/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:900px){

  .filtros{

    grid-template-columns:
      1fr 1fr;

  }

}


@media(max-width:600px){

  body{

    padding:10px;

  }


  .container{

    width:100%;

    padding:15px;

    border-radius:12px;

  }


  .topo{

    flex-direction:column;

    align-items:stretch;

  }


  .topo h1{

    font-size:23px;

  }


  .btn-voltar{

    width:100%;

  }


  .filtros{

    grid-template-columns:1fr;

    padding:15px;

  }


  #grafico{

    height:400px;

  }


  #graficoLinha{

    height:380px;

  }


  .info-grafico{

    flex-direction:column;

    align-items:flex-start;

  }

}


/* =========================================================
   IMPRESSÃO
========================================================= */

@media print{

  @page{

    size:A4 portrait;

    margin:10mm;

  }


  body{

    background:white;

    padding:0;

  }


  .container{

    width:100%;

    max-width:none;

    box-shadow:none;

    padding:5px;

  }


  .btn-voltar,
  .btn-atualizar,
  .filtros,
  .mensagem{

    display:none !important;

  }


  .secao-grafico{

    border:none;

    padding:0;

  }

}

</style>

</head>

<script>


/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const URL_API =
  "https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


const URL_INDEX =
  "https://joeldisousa-dot.github.io/gestaofinanceira/";


/* =========================================================
   GOOGLE CHARTS
========================================================= */

google.charts.load(
  "current",
  {
    packages:[
      "corechart"
    ]
  }
);


google.charts.setOnLoadCallback(
  iniciar
);


/* =========================================================
   CONTROLE JSONP
========================================================= */

let contadorJSONP = 0;


/* =========================================================
   API JSONP
========================================================= */

function apiRequest(
  action,
  params = {}
){

  return new Promise(
    function(resolve,reject){

      const callback =
        "callbackGraficos_" +
        Date.now() +
        "_" +
        (++contadorJSONP);


      const script =
        document.createElement(
          "script"
        );


      const dados = {
        ...params,
        action:action,
        callback:callback
      };


      const query =
        Object.keys(dados)
          .map(
            function(chave){

              return (
                encodeURIComponent(chave) +
                "=" +
                encodeURIComponent(
                  dados[chave] === undefined ||
                  dados[chave] === null
                    ? ""
                    : dados[chave]
                )
              );

            }
          )
          .join("&");


      const url =
        URL_API +
        "?" +
        query;


      let finalizado = false;


      const timeout =
        setTimeout(
          function(){

            if(finalizado){
              return;
            }


            finalizado = true;

            limpar();


            reject(
              new Error(
                "Tempo limite excedido ao consultar a API."
              )
            );

          },
          30000
        );


      window[callback] =
        function(resposta){

          if(finalizado){
            return;
          }


          finalizado = true;


          clearTimeout(
            timeout
          );


          limpar();


          console.log(
            "API:",
            action,
            resposta
          );


          if(
            resposta &&
            resposta.sucesso === false
          ){

            reject(
              new Error(
                resposta.erro ||
                resposta.mensagem ||
                "Erro retornado pelo servidor."
              )
            );

            return;

          }


          /*
           * Normaliza os formatos:
           *
           * {sucesso:true,dados:[]}
           *
           * {sucesso:true,resultado:[]}
           *
           * {sucesso:true,lista:[]}
           *
           * [...]
           */

          if(
            resposta &&
            Object.prototype.hasOwnProperty.call(
              resposta,
              "dados"
            )
          ){

            resolve(
              resposta.dados
            );

            return;

          }


          if(
            resposta &&
            Object.prototype.hasOwnProperty.call(
              resposta,
              "resultado"
            )
          ){

            resolve(
              resposta.resultado
            );

            return;

          }


          if(
            resposta &&
            Object.prototype.hasOwnProperty.call(
              resposta,
              "lista"
            )
          ){

            resolve(
              resposta.lista
            );

            return;

          }


          resolve(
            resposta
          );

        };


      script.onerror =
        function(){

          if(finalizado){
            return;
          }


          finalizado = true;


          clearTimeout(
            timeout
          );


          limpar();


          reject(
            new Error(
              "Não foi possível conectar à API do Google Apps Script."
            )
          );

        };


      script.src =
        url;


      document.body.appendChild(
        script
      );


      function limpar(){

        delete window[callback];


        if(
          script.parentNode
        ){

          script.parentNode.removeChild(
            script
          );

        }

      }

    }
  );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function iniciar(){

  try{

    mostrarMensagem(
      "Carregando informações...",
      "info"
    );


    await carregarAnos();


    await carregarTipos();


    await carregarGrafico();


    limparMensagem();

  }
  catch(e){

    console.error(
      "Erro na inicialização:",
      e
    );


    mostrarErro(
      e.message
    );

  }

}


/* =========================================================
   CARREGAR ANOS
========================================================= */

async function carregarAnos(){

  const combo =
    document.getElementById(
      "selecionaAno"
    );


  combo.innerHTML =
    "<option value=''>Carregando...</option>";


  const anos =
    await apiRequest(
      "listarAnos"
    );


  console.log(
    "Anos recebidos:",
    anos
  );


  if(
    !Array.isArray(anos) ||
    anos.length === 0
  ){

    combo.innerHTML =
      "<option value=''>Sem dados</option>";


    throw new Error(
      "Nenhum ano foi encontrado."
    );

  }


  combo.innerHTML =
    "";


  anos.forEach(
    function(ano){

      const opcao =
        document.createElement(
          "option"
        );


      opcao.value =
        ano;


      opcao.textContent =
        ano;


      combo.appendChild(
        opcao
      );

    }
  );


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const anoURL =
    parametros.get(
      "ano"
    );


  if(
    anoURL &&
    Array.from(
      combo.options
    ).some(
      function(option){

        return (
          String(option.value) ===
          String(anoURL)
        );

      }
    )
  ){

    combo.value =
      anoURL;

  }
  else{

    /*
     * Seleciona o maior ano disponível.
     */

    const anosNumericos =
      anos
        .map(
          function(a){
            return Number(a);
          }
        )
        .filter(
          function(a){
            return !isNaN(a);
          }
        );


    if(
      anosNumericos.length
    ){

      combo.value =
        Math.max(
          ...anosNumericos
        );

    }
    else{

      combo.value =
        anos[anos.length - 1];

    }

  }


  document.getElementById(
    "infoAno"
  ).textContent =
    combo.value || "-";

}


/* =========================================================
   CARREGAR CATEGORIAS
========================================================= */

async function carregarTipos(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const combo =
    document.getElementById(
      "categoriaSelecionada"
    );


  if(!ano){

    combo.innerHTML =
      "<option value=''>Selecione o ano</option>";

    return;

  }


  combo.innerHTML =
    "<option value=''>Carregando...</option>";


  console.log(
    "Buscando categorias:",
    {
      ano:ano,
      tipo:tipo
    }
  );


  const lista =
    await apiRequest(
      "listarTiposFinanceiros",
      {
        ano:ano,
        tipo:tipo
      }
    );


  console.log(
    "Categorias recebidas:",
    lista
  );


  if(
    !Array.isArray(lista) ||
    lista.length === 0
  ){

    combo.innerHTML =
      "<option value=''>Sem categorias</option>";


    document.getElementById(
      "graficoLinha"
    ).innerHTML =
      "Nenhuma categoria encontrada.";


    document.getElementById(
      "infoCategoria"
    ).textContent =
      "-";


    return;

  }


  combo.innerHTML =
    "";


  lista.forEach(
    function(item){

      const opcao =
        document.createElement(
          "option"
        );


      /*
       * Caso a API retorne objetos:
       *
       * {descricao:"Aluguel"}
       *
       * também aceitamos.
       */

      let valor =
        item;


      if(
        item &&
        typeof item === "object"
      ){

        valor =
          item.descricao ||
          item.categoria ||
          item.nome ||
          item.valor ||
          "";

      }


      valor =
        String(
          valor
        ).trim();


      if(!valor){
        return;
      }


      opcao.value =
        valor;


      opcao.textContent =
        valor;


      combo.appendChild(
        opcao
      );

    }
  );


  if(
    combo.options.length === 0
  ){

    combo.innerHTML =
      "<option value=''>Sem categorias</option>";

    return;

  }


  /*
   * Primeira categoria.
   */

  combo.selectedIndex =
    0;


  atualizarInformacoes();


  await carregarLinhaTempo();

}


/* =========================================================
   CARREGAR GRÁFICO PRINCIPAL
========================================================= */

async function carregarGrafico(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  if(!ano){

    return;

  }


  const elemento =
    document.getElementById(
      "grafico"
    );


  elemento.innerHTML =
    "<div class='loading'>Carregando gráfico...</div>";


  try{

    const dados =
      await apiRequest(
        "dadosGraficos",
        {
          ano:ano
        }
      );


    console.log(
      "Dados gráficos:",
      dados
    );


    desenharGrafico(
      normalizarDadosGrafico(
        dados
      )
    );

  }
  catch(e){

    elemento.innerHTML =
      "<div class='loading'>Não foi possível gerar o gráfico.</div>";


    throw new Error(
      "Erro ao carregar gráfico: " +
      e.message
    );

  }

}


/* =========================================================
   NORMALIZAR GRÁFICO PRINCIPAL
========================================================= */

function normalizarDadosGrafico(
  dados
){

  /*
   * Se vier:
   *
   * {receber:[], pagar:[]}
   */

  if(
    dados &&
    typeof dados === "object" &&
    !Array.isArray(dados)
  ){

    if(
      dados.dados &&
      typeof dados.dados === "object" &&
      !Array.isArray(dados.dados)
    ){

      dados =
        dados.dados;

    }


    if(
      dados.resultado &&
      typeof dados.resultado === "object" &&
      !Array.isArray(dados.resultado)
    ){

      dados =
        dados.resultado;

    }

  }


  if(!dados){

    return {
      receber:[],
      pagar:[]
    };

  }


  return {

    receber:
      Array.isArray(
        dados.receber
      )
        ? dados.receber
        : [],

    pagar:
      Array.isArray(
        dados.pagar
      )
        ? dados.pagar
        : []

  };

}


/* =========================================================
   DESENHAR GRÁFICO PRINCIPAL
========================================================= */

function desenharGrafico(
  dados
){

  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Receitas"
  );


  tabela.addColumn(
    "number",
    "Despesas"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas = [];


  for(
    let i = 0;
    i < 12;
    i++
  ){

    linhas.push(
      [

        meses[i],

        converterValorGrafico(
          dados.receber[i]
        ),

        converterValorGrafico(
          dados.pagar[i]
        )

      ]
    );

  }


  tabela.addRows(
    linhas
  );


  const elemento =
    document.getElementById(
      "grafico"
    );


  const grafico =
    new google.visualization.ColumnChart(
      elemento
    );


  grafico.draw(
    tabela,
    {

      title:
        "Receitas x Despesas por Mês",

      legend:{
        position:"top"
      },

      colors:[
        "#2e7d32",
        "#c62828"
      ],

      animation:{
        startup:true,
        duration:800,
        easing:"out"
      },

      chartArea:{
        left:90,
        top:60,
        width:"80%",
        height:"70%"
      },

      vAxis:{
        title:"Valor (R$)",

        format:
          "R$ #,##0.00"
      },

      hAxis:{
        title:"Mês"
      },

      tooltip:{
        text:"value"
      },

      backgroundColor:
        "transparent"

    }
  );

}


/* =========================================================
   CARREGAR LINHA DO TEMPO
========================================================= */

async function carregarLinhaTempo(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  atualizarInformacoes();


  if(
    !ano ||
    !tipo ||
    !categoria ||
    categoria === "Sem categorias"
  ){

    document.getElementById(
      "graficoLinha"
    ).innerHTML =
      "Selecione uma categoria.";

    return;

  }


  const elemento =
    document.getElementById(
      "graficoLinha"
    );


  elemento.innerHTML =
    "<div class='loading'>Carregando evolução...</div>";


  try{

    console.log(
      "Solicitando dadosLinhaTempo:",
      {
        ano:ano,
        tipo:tipo,
        categoria:categoria
      }
    );


    const dados =
      await apiRequest(
        "dadosLinhaTempo",
        {

          ano:ano,

          tipo:tipo,

          categoria:categoria

        }
      );


    console.log(
      "Dados linha do tempo:",
      dados
    );


    desenharLinha(
      normalizarLinha(
        dados
      )
    );

  }
  catch(e){

    elemento.innerHTML =
      "<div class='loading'>Não foi possível carregar a evolução.</div>";


    throw new Error(
      "Erro ao carregar evolução: " +
      e.message
    );

  }

}


/* =========================================================
   NORMALIZAR LINHA
========================================================= */

function normalizarLinha(
  dados
){

  if(
    dados &&
    typeof dados === "object" &&
    !Array.isArray(dados)
  ){

    if(
      Array.isArray(
        dados.dados
      )
    ){

      return dados.dados;

    }


    if(
      Array.isArray(
        dados.resultado
      )
    ){

      return dados.resultado;

    }


    if(
      Array.isArray(
        dados.lista
      )
    ){

      return dados.lista;

    }

  }


  return Array.isArray(
    dados
  )
    ? dados
    : [];

}


/* =========================================================
   DESENHAR LINHA
========================================================= */

function desenharLinha(
  dados
){

  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Valor"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas = [];


  for(
    let i = 0;
    i < 12;
    i++
  ){

    let valor =
      dados[i];


    /*
     * Aceita:
     *
     * 100
     *
     * {valor:100}
     *
     * {total:100}
     *
     * {value:100}
     */

    if(
      valor &&
      typeof valor === "object"
    ){

      valor =
        valor.valor ??
        valor.total ??
        valor.value ??
        0;

    }


    valor =
      converterValorGrafico(
        valor
      );


    linhas.push(
      [
        meses[i],
        valor
      ]
    );

  }


  tabela.addRows(
    linhas
  );


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  const cor =
    tipo ===
    "Contas a Receber"

      ? "#00897b"

      : "#e53935";


  const elemento =
    document.getElementById(
      "graficoLinha"
    );


  const grafico =
    new google.visualization.LineChart(
      elemento
    );


  grafico.draw(
    tabela,
    {

      title:
        categoria +
        " - Evolução Mensal",

      curveType:
        "function",

      legend:
        "none",

      colors:[
        cor
      ],

      pointSize:
        6,

      lineWidth:
        4,

      animation:{
        startup:true,
        duration:900,
        easing:"out"
      },

      chartArea:{
        left:90,
        top:60,
        width:"80%",
        height:"70%"
      },

      vAxis:{
        title:"Valor (R$)",

        format:
          "R$ #,##0.00"
      },

      hAxis:{
        title:"Mês"
      },

      backgroundColor:
        "transparent"

    }
  );

}


/* =========================================================
   CONVERTER VALOR
========================================================= */

function converterValorGrafico(
  valor
){

  if(
    valor === null ||
    valor === undefined ||
    valor === ""
  ){

    return 0;

  }


  if(
    typeof valor === "number"
  ){

    return isFinite(valor)
      ? valor
      : 0;

  }


  /*
   * Objetos.
   */

  if(
    typeof valor === "object"
  ){

    valor =
      valor.valor ??
      valor.total ??
      valor.value ??
      0;

  }


  let texto =
    String(valor)
      .trim();


  if(!texto){

    return 0;

  }


  /*
   * Remove R$.
   */

  texto =
    texto.replace(
      /R\$/gi,
      ""
    )
    .replace(
      /\s/g,
      ""
    );


  /*
   * Formato brasileiro:
   *
   * 1.234,56
   */

  if(
    texto.indexOf(",") >= 0
  ){

    texto =
      texto
        .replace(
          /\./g,
          ""
        )
        .replace(
          ",",
          "."
        );

  }


  const numero =
    Number(texto);


  return isFinite(numero)
    ? numero
    : 0;

}

========================================================= */

async function carregarTudo(){

  const botao =
    document.getElementById(
      "btnAtualizar"
    );


  try{

    botao.disabled =
      true;


    mostrarMensagem(
      "Atualizando gráficos...",
      "info"
    );


    atualizarInformacoes();


    await carregarTipos();


    await carregarGrafico();


    await carregarLinhaTempo();


    mostrarMensagem(
      "Gráficos atualizados com sucesso.",
      "sucesso"
    );


    setTimeout(
      limparMensagem,
      1800
    );

  }
  catch(e){

    console.error(
      "Erro ao atualizar:",
      e
    );


    mostrarErro(
      e.message
    );

  }
  finally{

    botao.disabled =
      false;

  }

}

}


/* =========================================================
   REDIMENSIONAR GRÁFICOS
========================================================= */

let resizeTimer;


window.addEventListener(
  "resize",
  function(){

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        async function(){

          const ano =
            document.getElementById(
              "selecionaAno"
            ).value;


          if(!ano){
            return;
          }


          try{

            await carregarGrafico();


            const categoria =
              document.getElementById(
                "categoriaSelecionada"
              ).value;


            if(categoria){

              await carregarLinhaTempo();

            }

          }
          catch(e){

            console.error(
              "Erro ao redimensionar:",
              e
            );

          }

        },
        400
      );

  }
);
