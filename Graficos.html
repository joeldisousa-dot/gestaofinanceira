<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const URL_API =
"https://script.google.com/macros/s/AKfycbw-Fry_UM89-p0FjPEoDNdfdTSNdz56sYzUA8VJIpD9_862l5dPSNmkWOGLXyZiqnRn/exec";


const URL_INDEX =
"https://joeldisousa-dot.github.io/gestaofinanceira/";


/* =========================================================
   CONTROLE JSONP
========================================================= */

let contadorJSONP = 0;


/* =========================================================
   GOOGLE CHARTS
========================================================= */

google.charts.load(
  "current",
  {
    packages:["corechart"]
  }
);


google.charts.setOnLoadCallback(
  iniciar
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function iniciar(){

  try{

    mostrarMensagem(
      "Conectando ao sistema...",
      "info"
    );

    await carregarAnos();

    await carregarTipos();

    await carregarGrafico();

    limparMensagem();

  }
  catch(e){

    console.error(
      "Erro na inicialização:",
      e
    );

    mostrarErro(
      e.message
    );

  }

}


/* =========================================================
   CHAMADA API - JSONP
========================================================= */

function chamarAPI(
  acao,
  parametros={}
){

  return new Promise(
    function(resolve,reject){

      const callback =
        "callbackGrafico_" +
        Date.now() +
        "_" +
        (++contadorJSONP);


      const script =
        document.createElement(
          "script"
        );


      const dados =
        Object.assign(
          {},
          parametros
        );


      dados.action =
        acao;


      dados.callback =
        callback;


      const query =
        Object.keys(dados)
          .map(
            function(chave){

              return (
                encodeURIComponent(chave) +
                "=" +
                encodeURIComponent(
                  dados[chave] === undefined ||
                  dados[chave] === null
                    ? ""
                    : dados[chave]
                )
              );

            }
          )
          .join("&");


      const url =
        URL_API +
        "?" +
        query;


      let finalizado =
        false;


      const timeout =
        setTimeout(
          function(){

            if(finalizado){
              return;
            }


            finalizado =
              true;


            cleanup();


            reject(
              new Error(
                "Tempo limite excedido ao consultar a API."
              )
            );

          },
          30000
        );


      window[callback] =
        function(resposta){

          if(finalizado){
            return;
          }


          finalizado =
            true;


          clearTimeout(
            timeout
          );


          cleanup();


          resolve(
            resposta
          );

        };


      script.onerror =
        function(){

          if(finalizado){
            return;
          }


          finalizado =
            true;


          clearTimeout(
            timeout
          );


          cleanup();


          reject(
            new Error(
              "Não foi possível conectar à API do Google Apps Script."
            )
          );

        };


      script.src =
        url;


      document.body.appendChild(
        script
      );


      function cleanup(){

        delete window[callback];


        if(script.parentNode){

          script.parentNode.removeChild(
            script
          );

        }

      }

    }
  );

}


/* =========================================================
   NORMALIZAR RESPOSTA DA API
========================================================= */

function normalizarResposta(
  resposta
){

  if(
    resposta === null ||
    resposta === undefined
  ){

    return null;

  }


  if(
    resposta.sucesso === false
  ){

    throw new Error(
      resposta.erro ||
      resposta.mensagem ||
      "Erro retornado pelo Google Apps Script."
    );

  }


  if(
    resposta.sucesso === true &&
    Object.prototype.hasOwnProperty.call(
      resposta,
      "dados"
    )
  ){

    return resposta.dados;

  }


  if(
    resposta.sucesso === true &&
    Object.prototype.hasOwnProperty.call(
      resposta,
      "resultado"
    )
  ){

    return resposta.resultado;

  }


  if(
    resposta.sucesso === true &&
    Object.prototype.hasOwnProperty.call(
      resposta,
      "lista"
    )
  ){

    return resposta.lista;

  }


  return resposta;

}


/* =========================================================
   CARREGAR ANOS
========================================================= */

async function carregarAnos(){

  const combo =
    document.getElementById(
      "selecionaAno"
    );


  combo.innerHTML =
    "<option value=''>Carregando...</option>";


  const resposta =
    await chamarAPI(
      "listarAnos"
    );


  console.log(
    "Resposta listarAnos:",
    resposta
  );


  const dados =
    normalizarResposta(
      resposta
    );


  let anos =
    [];


  if(
    Array.isArray(dados)
  ){

    anos =
      dados;

  }
  else if(
    dados &&
    Array.isArray(dados.anos)
  ){

    anos =
      dados.anos;

  }


  anos =
    anos
      .map(
        function(ano){

          return String(
            ano
          ).trim();

        }
      )
      .filter(
        function(ano){

          return /^\d{4}$/.test(
            ano
          );

        }
      );


  anos =
    [...new Set(anos)];


  anos.sort(
    function(a,b){

      return Number(a) -
             Number(b);

    }
  );


  if(
    anos.length === 0
  ){

    combo.innerHTML =
      "<option value=''>Sem dados</option>";

    throw new Error(
      "Nenhum ano foi encontrado."
    );

  }


  combo.innerHTML =
    "";


  anos.forEach(
    function(ano){

      const opcao =
        document.createElement(
          "option"
        );


      opcao.value =
        ano;


      opcao.textContent =
        ano;


      combo.appendChild(
        opcao
      );

    }
  );


  const parametros =
    new URLSearchParams(
      window.location.search
    );


  const anoURL =
    parametros.get(
      "ano"
    );


  if(
    anoURL &&
    anos.includes(
      String(anoURL)
    )
  ){

    combo.value =
      String(anoURL);

  }
  else{

    combo.value =
      anos[anos.length - 1];

  }

}


/* =========================================================
   CARREGAR CATEGORIAS
========================================================= */

async function carregarTipos(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const combo =
    document.getElementById(
      "categoriaSelecionada"
    );


  if(!ano){

    combo.innerHTML =
      "<option value=''>Selecione o ano</option>";

    return;

  }


  combo.innerHTML =
    "<option value=''>Carregando...</option>";


  console.log(
    "Buscando categorias:",
    {
      ano:ano,
      tipo:tipo
    }
  );


  const resposta =
    await chamarAPI(
      "listarTiposFinanceiros",
      {
        ano:ano,
        tipo:tipo
      }
    );


  console.log(
    "Resposta listarTiposFinanceiros:",
    resposta
  );


  const dados =
    normalizarResposta(
      resposta
    );


  let lista =
    [];


  if(
    Array.isArray(dados)
  ){

    lista =
      dados;

  }
  else if(
    dados &&
    Array.isArray(dados.lista)
  ){

    lista =
      dados.lista;

  }
  else if(
    dados &&
    Array.isArray(dados.tipos)
  ){

    lista =
      dados.tipos;

  }


  lista =
    lista
      .map(
        function(item){

          if(
            typeof item === "object" &&
            item !== null
          ){

            return String(
              item.descricao ||
              item.nome ||
              item.tipo ||
              item.categoria ||
              ""
            ).trim();

          }


          return String(
            item
          ).trim();

        }
      )
      .filter(
        function(item){

          return item !== "";

        }
      );


  lista =
    [...new Set(lista)];


  combo.innerHTML =
    "";


  if(
    lista.length === 0
  ){

    combo.innerHTML =
      "<option value=''>Sem categorias</option>";


    document.getElementById(
      "graficoLinha"
    ).innerHTML =
      "<div class='vazio'>Nenhuma categoria encontrada para este filtro.</div>";


    return;

  }


  lista.forEach(
    function(item){

      const opcao =
        document.createElement(
          "option"
        );


      opcao.value =
        item;


      opcao.textContent =
        item;


      combo.appendChild(
        opcao
      );

    }
  );


  await carregarLinhaTempo();

}

document

/* =========================================================
   GRÁFICO PRINCIPAL
========================================================= */

async function carregarGrafico(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  if(!ano){

    return;

  }


  const resposta =
    await chamarAPI(
      "dadosGraficos",
      {
        ano:ano
      }
    );


  console.log(
    "Resposta dadosGraficos:",
    resposta
  );


  const dados =
    normalizarResposta(
      resposta
    );


  const normalizado =
    normalizarDadosGrafico(
      dados
    );


  desenharGrafico(
    normalizado
  );

}


/* =========================================================
   NORMALIZAR DADOS DO GRÁFICO
========================================================= */

function normalizarDadosGrafico(
  dados
){

  if(
    !dados
  ){

    return {
      receber:[],
      pagar:[]
    };

  }


  if(
    dados.dados &&
    typeof dados.dados === "object" &&
    !Array.isArray(dados.dados)
  ){

    dados =
      dados.dados;

  }


  if(
    dados.resultado &&
    typeof dados.resultado === "object" &&
    !Array.isArray(dados.resultado)
  ){

    dados =
      dados.resultado;

  }


  let receber =
    dados.receber ||
    dados.receitas ||
    dados.receita ||
    [];


  let pagar =
    dados.pagar ||
    dados.despesas ||
    dados.despesa ||
    [];


  function transformar(
    lista
  ){

    if(!Array.isArray(lista)){
      return [];
    }


    return lista.map(
      function(item){

        if(
          typeof item === "object" &&
          item !== null
        ){

          return Number(
            item.valor ??
            item.total ??
            item.value ??
            0
          ) || 0;

        }


        return Number(
          item
        ) || 0;

      }
    );

  }


  return {

    receber:
      transformar(
        receber
      ),

    pagar:
      transformar(
        pagar
      )

  };

}


/* =========================================================
   DESENHAR GRÁFICO PRINCIPAL
========================================================= */

function desenharGrafico(
  dados
){

  const elemento =
    document.getElementById(
      "grafico"
    );


  if(
    !dados ||
    (
      dados.receber.length === 0 &&
      dados.pagar.length === 0
    )
  ){

    elemento.innerHTML =
      "<div class='vazio'>Nenhum dado financeiro encontrado para o ano selecionado.</div>";

    return;

  }


  elemento.innerHTML =
    "";


  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Receitas"
  );


  tabela.addColumn(
    "number",
    "Despesas"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas =
    [];


  for(
    let i=0;
    i<12;
    i++
  ){

    linhas.push(
      [

        meses[i],

        Number(
          dados.receber[i]
        ) || 0,

        Number(
          dados.pagar[i]
        ) || 0

      ]
    );

  }


  tabela.addRows(
    linhas
  );


  const grafico =
    new google.visualization.ColumnChart(
      elemento
    );


  grafico.draw(
    tabela,
    {

      title:
        "Receitas x Despesas por Mês",

      legend:{
        position:"top"
      },

      colors:[
        "#2e7d32",
        "#c62828"
      ],

      animation:{
        startup:true,
        duration:800,
        easing:"out"
      },

      chartArea:{
        left:90,
        top:60,
        width:"80%",
        height:"70%"
      },

      vAxis:{
        title:"Valor (R$)",
        format:"currency"
      },

      hAxis:{
        title:"Mês"
      }

    }
  );

}


/* =========================================================
   EVOLUÇÃO DA CATEGORIA
========================================================= */

async function carregarLinhaTempo(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  const elemento =
    document.getElementById(
      "graficoLinha"
    );


  if(
    !ano ||
    !tipo ||
    !categoria ||
    categoria === "Sem categorias"
  ){

    elemento.innerHTML =
      "<div class='vazio'>Selecione uma categoria.</div>";

    return;

  }


  const resposta =
    await chamarAPI(
      "dadosLinhaTempo",
      {

        ano:ano,

        tipo:tipo,

        categoria:categoria

      }
    );


  console.log(
    "Resposta dadosLinhaTempo:",
    resposta
  );


  const dados =
    normalizarResposta(
      resposta
    );


  desenharLinha(
    normalizarLinha(
      dados
    )
  );

}


/* =========================================================
   NORMALIZAR LINHA
========================================================= */

function normalizarLinha(
  dados
){

  if(
    !dados
  ){

    return [];

  }


  if(
    dados.dados &&
    Array.isArray(
      dados.dados
    )
  ){

    return dados.dados;

  }


  if(
    dados.resultado &&
    Array.isArray(
      dados.resultado
    )
  ){

    return dados.resultado;

  }


  if(
    dados.lista &&
    Array.isArray(
      dados.lista
    )
  ){

    return dados.lista;

  }


  return Array.isArray(
    dados
  )
    ? dados
    : [];

}


/* =========================================================
   DESENHAR LINHA
========================================================= */

function desenharLinha(
  dados
){

  const elemento =
    document.getElementById(
      "graficoLinha"
    );


  if(
    !dados ||
    dados.length === 0
  ){

    elemento.innerHTML =
      "<div class='vazio'>Nenhum movimento encontrado para esta categoria.</div>";

    return;

  }


  elemento.innerHTML =
    "";


  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Valor"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas =
    [];


  for(
    let i=0;
    i<12;
    i++
  ){

    let item =
      dados[i];


    let valor =
      0;


    if(
      typeof item === "object" &&
      item !== null
    ){

      valor =
        Number(
          item.valor ??
          item.total ??
          item.value ??
          item.valorTotal ??
          0
        ) || 0;

    }
    else{

      valor =
        Number(
          item
        ) || 0;

    }


    linhas.push(
      [
        meses[i],
        valor
      ]
    );

  }


  tabela.addRows(
    linhas
  );


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  const cor =
    tipo ===
    "Contas a Receber"

      ? "#00897b"

      : "#e53935";


  const grafico =
    new google.visualization.LineChart(
      elemento
    );


  grafico.draw(
    tabela,
    {

      title:
        categoria +
        " - Evolução Mensal",

      curveType:
        "function",

      legend:
        "none",

      colors:[
        cor
      ],

      pointSize:
        6,

      lineWidth:
        4,

      animation:{
        startup:true,
        duration:900,
        easing:"out"
      },

      chartArea:{
        left:90,
        top:60,
        width:"80%",
        height:"70%"
      },

      vAxis:{
        title:"Valor (R$)",
        format:"currency"
      },

      hAxis:{
        title:"Mês"
      }

    }
  );

}


/* =========================================================
   VOLTAR
========================================================= */

function voltar(){

  window.location.href =
    URL_INDEX;

}


/* =========================================================
   MENSAGENS
========================================================= */

function mostrarMensagem(
  texto,
  tipo
){

  const div =
    document.getElementById(
      "mensagem"
    );


  div.textContent =
    texto;


  div.className =
    "mensagem " +
    tipo;

}


function limparMensagem(){

  const div =
    document.getElementById(
      "mensagem"
    );


  div.textContent =
    "";


  div.className =
    "mensagem";

}


function mostrarErro(
  texto
){

  console.error(
    "Erro:",
    texto
  );


  mostrarMensagem(
    "⚠ " + texto,
    "erro"
  );

}


/* =========================================================
   REDIMENSIONAMENTO
========================================================= */

let resizeTimer;


window.addEventListener(
  "resize",
  function(){

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        async function(){

          try{

            const ano =
              document.getElementById(
                "selecionaAno"
              ).value;


            if(ano){

              await carregarGrafico();

            }


            const categoria =
              document.getElementById(
                "categoriaSelecionada"
              ).value;


            if(categoria){

              await carregarLinhaTempo();

            }

          }
          catch(e){

            console.error(
              e
            );

          }

        },
        300
      );

  }
);

</script>
