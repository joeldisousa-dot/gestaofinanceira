.status-api{

<body>


<div class="container">


  <!-- =========================================

  <div class="topo">

    <h2>

    </h2>


    <button

      onclick="voltar()">

    </button>

  </div>


  <!-- =========================================
       FILTROS
  ========================================== -->

  <div class="filtros">


    <div class="filtro">

      <label for="selecionaAno">
        Ano
      </label>

      <select id="selecionaAno">

        <option value="">
          Carregando...
        </option>

      </select>

    </div>



    <div class="filtro">

      <label for="tipoGrafico">
        Tipo
      </label>

      <select id="tipoGrafico">

        <option value="Contas a Receber">
          Receita
        </option>

        <option value="Contas a Pagar">

        </option>

      </select>

    </div>



    <div class="filtro">

      <label for="categoriaSelecionada">
        Categoria
      </label>

      <select id="categoriaSelecionada">

        </option>

      <button
        id="btnAtualizar"

        🔄 Atualizar

  <!-- =========================================
       MENSAGEM
  ========================================== -->

       GRÁFICO PRINCIPAL
  ========================================== -->

  <div class="grafico-box">

    <h3 class="titulo-secao">

      📊 Receitas x Despesas por Mês

    </h3>

    </div>

  </div>


  <!-- =========================================
       LINHA DO TEMPO
  ========================================== -->

    <h3 class="titulo-secao">

    </h3>

    </div>

  </div>


  <div

    class="status-api">

    Verificando conexão com a API...

  </div>


  <div class="rodape">

    Controle Financeiro Pessoal

  </div>


</div>


<script>


// =====================================================
// CONFIGURAÇÃO DA API
// =====================================================

const URL_API =
  "https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


// =====================================================
// CONFIGURAÇÃO DO GITHUB
// =====================================================

// Página inicial do sistema.
// Se o seu index tiver outro nome, altere aqui.

const URL_INDEX =
  "index.html";


// =====================================================
// GOOGLE CHARTS
// =====================================================

google.charts.load(
  "current",
  {
    packages:[
      "corechart"
    ]
  }
);


google.charts.setOnLoadCallback(
  function(){

    console.log(
      "Google Charts carregado."
    );

    verificarAPI();

    carregarAnos();

  }
);


// =====================================================
// VARIÁVEIS
// =====================================================

let carregandoAnos = false;

let carregandoCategorias = false;

let carregandoGrafico = false;

let carregandoLinha = false;


// =====================================================
// JSONP
// =====================================================

/*
  O GitHub Pages e o Apps Script estão
  em domínios diferentes.

  Por isso não usamos:

  google.script.run

  e também não dependemos de CORS.

  A API do Apps Script já aceita:

  ?callback=nomeDaFuncao

  então usamos JSONP.
*/

function chamarAPI(
  parametros
){

  return new Promise(
    function(resolve, reject){

      const callbackName =
        "apiCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      let finalizado = false;


      const script =
        document.createElement(
          "script"
        );


      const timeout =
        setTimeout(
          function(){

            if(finalizado){
              return;
            }

            finalizado = true;

            limpar();

            reject(
              new Error(
                "Tempo limite excedido ao conectar com a API."
              )
            );

          },
          30000
        );


      function limpar(){

        clearTimeout(
          timeout
        );


        if(
          script &&
          script.parentNode
        ){

          script.parentNode.removeChild(
            script
          );

        }


        try{

          delete window[
            callbackName
          ];

        }
        catch(e){

          window[
            callbackName
          ] = undefined;

        }

      }


      window[
        callbackName
      ] = function(
        resposta
      ){

        if(finalizado){
          return;
        }


        finalizado = true;

        limpar();


        if(
          resposta &&
          resposta.sucesso === false
        ){

          reject(
            new Error(
              resposta.erro ||
              resposta.mensagem ||
              "A API retornou um erro."
            )
          );

          return;

        }


        resolve(
          resposta || {}
        );

      };


      script.onerror =
        function(){

          if(finalizado){
            return;
          }


          finalizado = true;

          limpar();


          reject(
            new Error(
              "Não foi possível acessar a API do Google Apps Script."
            )
          );

        };


      const query =
        new URLSearchParams();


      Object.keys(
        parametros || {}
      ).forEach(
        function(chave){

          const valor =
            parametros[chave];


          if(
            valor !== undefined &&
            valor !== null
          ){

            query.set(
              chave,
              valor
            );

          }

        }
      );


      query.set(
        "callback",
        callbackName
      );


      query.set(
        "_",
        Date.now()
      );


      script.src =
        URL_API +
        "?" +
        query.toString();


      script.async = true;


      document
        .head
        .appendChild(
          script
        );

    }
  );

}


// =====================================================
// VERIFICAR API
// =====================================================

async function verificarAPI(){

  const status =
    document.getElementById(
      "statusApi"
    );


  try{

    const resposta =
      await chamarAPI({
        action:"ping"
      });


    if(
      resposta &&
      resposta.sucesso
    ){

      status.innerHTML =
        "🟢 API conectada e funcionando.";

      status.style.color =
        "#2e7d32";

    }
    else{

      status.innerHTML =
        "🟠 API respondeu, mas retornou um status inesperado.";

    }

  }
  catch(erro){

    console.error(
      "Erro API:",
      erro
    );


    status.innerHTML =
      "🔴 Erro de conexão com a API.";

    status.style.color =
      "#c62828";

  }

}


// =====================================================
// CARREGAR ANOS
// =====================================================

async function carregarAnos(){

  if(carregandoAnos){
    return;
  }


  carregandoAnos = true;


  const combo =
    document.getElementById(
      "selecionaAno"
    );


  combo.innerHTML =
    "<option value=''>Carregando...</option>";


  try{

    const resposta =
      await chamarAPI({

        action:
          "listarAnos"

      });


    console.log(
      "Resposta listarAnos:",
      resposta
    );


    const anos =
      Array.isArray(
        resposta.anos
      )
      ?
      resposta.anos
      :
      [];


    combo.innerHTML =
      "";


    if(
      anos.length === 0
    ){

      combo.innerHTML =
        "<option value=''>Sem dados</option>";

      mostrarMensagem(
        "Nenhum ano encontrado nos lançamentos.",
        "carregando"
      );

      document.getElementById(
        "categoriaSelecionada"
      ).innerHTML =
        "<option value=''>Sem categorias</option>";

      limparGraficos();

      return;

    }


    anos.forEach(
      function(ano){

        const opcao =
          document.createElement(
            "option"
          );


        opcao.value =
          ano;


        opcao.textContent =
          ano;


        combo.appendChild(
          opcao
        );

      }
    );


    /*
      Seleciona o ano mais recente.
    */

    combo.value =
      anos[
        anos.length - 1
      ];


    await carregarTipos();

    await carregarGrafico();


  }
  catch(erro){

    console.error(
      erro
    );


    mostrarErro(
      erro
    );


    combo.innerHTML =
      "<option value=''>Erro</option>";

  }
  finally{

    carregandoAnos = false;

  }

}


// =====================================================
// CARREGAR CATEGORIAS
// =====================================================

async function carregarTipos(){

  if(carregandoCategorias){
    return;
  }


  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const combo =
    document.getElementById(
      "categoriaSelecionada"
    );


  if(
    !ano ||
    !tipo
  ){

    combo.innerHTML =
      "<option value=''>Selecione os filtros</option>";

    return;

  }


  carregandoCategorias = true;


  combo.innerHTML =
    "<option value=''>Carregando...</option>";


  try{

    const resposta =
      await chamarAPI({

        action:
          "listarTiposFinanceiros",

        ano:
          ano,

        tipo:
          tipo

      });


    console.log(
      "Resposta categorias:",
      resposta
    );


    const lista =
      Array.isArray(
        resposta.categorias
      )
      ?
      resposta.categorias
      :
      [];


    combo.innerHTML =
      "";


    if(
      lista.length === 0
    ){

      combo.innerHTML =
        "<option value=''>Sem categorias</option>";


      document.getElementById(
        "graficoLinha"
      ).innerHTML =
        "<div style='text-align:center;color:#777;padding:40px;'>Nenhuma categoria encontrada.</div>";


      return;

    }


    lista.forEach(
      function(item){

        const opcao =
          document.createElement(
            "option"
          );


        opcao.value =
          item;


        opcao.textContent =
          item;


        combo.appendChild(
          opcao
        );

      }
    );


    /*
      Seleciona a primeira categoria.
    */

    combo.value =
      lista[0];


    await carregarLinhaTempo();


  }
  catch(erro){

    console.error(
      erro
    );


    mostrarErro(
      erro
    );


    combo.innerHTML =
      "<option value=''>Erro</option>";

  }
  finally{

    carregandoCategorias = false;

  }

}


// =====================================================
// CARREGAR TUDO
// =====================================================

async function carregarTudo(){

  const botao =
    document.getElementById(
      "btnAtualizar"
    );


  botao.disabled = true;


  mostrarMensagem(
    "Atualizando gráficos...",
    "carregando"
  );


  try{

    await carregarTipos();

    await carregarGrafico();

    await carregarLinhaTempo();


    mostrarMensagem(
      "Gráficos atualizados.",
      "sucesso"
    );


    setTimeout(
      function(){

        document.getElementById(
          "mensagem"
        ).innerHTML = "";

      },
      2000
    );

  }
  catch(erro){

    mostrarErro(
      erro
    );

  }
  finally{

    botao.disabled = false;

  }

}


// =====================================================
// CARREGAR GRÁFICO PRINCIPAL
// =====================================================

async function carregarGrafico(){

  if(carregandoGrafico){
    return;
  }


  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  if(!ano){

    return;

  }


  carregandoGrafico = true;


  mostrarMensagem(
    "Carregando gráfico...",
    "carregando"
  );


  try{

    const resposta =
      await chamarAPI({

        action:
          "dadosGraficos",

        ano:
          ano

      });


    console.log(
      "Dados gráfico:",
      resposta
    );


    desenharGrafico(
      resposta.dados
    );


  }
  catch(erro){

    console.error(
      erro
    );


    mostrarErro(
      erro
    );

  }
  finally{

    carregandoGrafico = false;

  }

}


// =====================================================
// CARREGAR LINHA DO TEMPO
// =====================================================

async function carregarLinhaTempo(){

  if(carregandoLinha){
    return;
  }


  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  if(

    !ano ||
    !tipo ||
    !categoria ||
    categoria === "Sem categorias"

  ){

    return;

  }


  carregandoLinha = true;


  try{

    const resposta =
      await chamarAPI({

        action:
          "dadosLinhaTempo",

        ano:
          ano,

        tipo:
          tipo,

        categoria:
          categoria

      });


    console.log(
      "Dados linha:",
      resposta
    );


    desenharLinha(
      resposta.dados
    );


  }
  catch(erro){

    console.error(
      erro
    );


    mostrarErro(
      erro
    );

  }
  finally{

    carregandoLinha = false;

  }

}


// =====================================================
// EVENTO — TIPO
// =====================================================

document
  .getElementById(
    "tipoGrafico"
  )
  .addEventListener(
    "change",
    async function(){

      await carregarTipos();

      await carregarGrafico();

    }
  );


// =====================================================
// EVENTO — ANO
// =====================================================

document
  .getElementById(
    "selecionaAno"
  )
  .addEventListener(
    "change",
    async function(){

      await carregarTipos();

      await carregarGrafico();

    }
  );


// =====================================================
// EVENTO — CATEGORIA
// =====================================================

document
  .getElementById(
    "categoriaSelecionada"
  )
  .addEventListener(
    "change",
    function(){

      carregarLinhaTempo();

    }
  );


// =====================================================
// DESENHAR GRÁFICO PRINCIPAL
// =====================================================

function desenharGrafico(
  dados
){

  if(!dados){

    return;

  }


  const receber =
    Array.isArray(
      dados.receber
    )
    ?
    dados.receber
    :
    [];


  const pagar =
    Array.isArray(
      dados.pagar
    )
    ?
    dados.pagar
    :
    [];


  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Receitas"
  );


  tabela.addColumn(
    "number",
    "Despesas"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas = [];


  for(
    let i = 0;
    i < 12;
    i++
  ){

    linhas.push([

      meses[i],

      Number(
        receber[i]
      ) || 0,

      Number(
        pagar[i]
      ) || 0

    ]);

  }


  tabela.addRows(
    linhas
  );


  const elemento =
    document.getElementById(
      "grafico"
    );


  const grafico =
    new google.visualization.ColumnChart(
      elemento
    );


  grafico.draw(

    tabela,

    {

      title:
        "Receitas x Despesas por Mês",


      legend:{
        position:"top"
      },


      colors:[

        "#2e7d32",

        "#c62828"

      ],


      animation:{

        startup:true,

        duration:800,

        easing:"out"

      },


      chartArea:{

        left:80,

        top:60,

        width:"82%",

        height:"70%"

      },


      vAxis:{

        title:
          "Valor (R$)",

        format:
          "currency"

      },


      hAxis:{

        title:
          "Mês"

      },


      backgroundColor:
        "transparent"

    }

  );

}


// =====================================================
// DESENHAR LINHA DO TEMPO
// =====================================================

function desenharLinha(
  dados
){

  if(!Array.isArray(dados)){

    return;

  }


  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Valor"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas = [];


  for(
    let i = 0;
    i < 12;
    i++
  ){

    linhas.push([

      meses[i],

      Number(
        dados[i]
      ) || 0

    ]);

  }


  tabela.addRows(
    linhas
  );


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  const cor =

    tipo ===
    "Contas a Receber"

    ?

    "#00897b"

    :

    "#e53935";


  const grafico =
    new google.visualization.LineChart(

      document.getElementById(
        "graficoLinha"
      )

    );


  grafico.draw(

    tabela,

    {

      title:
        categoria +
        " - Evolução Mensal",


      curveType:
        "function",


      legend:
        "none",


      colors:[
        cor
      ],


      pointSize:
        6,


      lineWidth:
        4,


      animation:{

        startup:true,

        duration:900,

        easing:"out"

      },


      chartArea:{

        left:80,

        top:60,

        width:"82%",

        height:"70%"

      },


      vAxis:{

        title:
          "Valor (R$)",

        format:
          "currency"

      },


      hAxis:{

        title:
          "Mês"

      },


      backgroundColor:
        "transparent"

    }

  );

}


// =====================================================
// LIMPAR GRÁFICOS
// =====================================================

function limparGraficos(){

  document.getElementById(
    "grafico"
  ).innerHTML =
    "";


  document.getElementById(
    "graficoLinha"
  ).innerHTML =
    "";

}


// =====================================================
// MENSAGEM
// =====================================================

function mostrarMensagem(
  texto,
  classe
){

  const div =
    document.getElementById(
      "mensagem"
    );


  div.className =
    "mensagem " +
    (
      classe || ""
    );


  div.textContent =
    texto || "";

}


// =====================================================
// ERRO
// =====================================================

function mostrarErro(
  erro
){

  console.error(
    erro
  );


  let mensagem =
    "Erro desconhecido.";


  if(
    erro &&
    erro.message
  ){

    mensagem =
      erro.message;

  }
  else if(
    typeof erro === "string"
  ){

    mensagem =
      erro;

  }


  mostrarMensagem(
    "Erro: " + mensagem,
    "erro"
  );

}
