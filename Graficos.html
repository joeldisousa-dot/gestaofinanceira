<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gráficos Financeiros</title>

<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  padding:20px;

  font-family:
    Arial,
    sans-serif;

  background:#f1f5f9;

  color:#1e293b;

}

.container{

  width:
    min(
      1200px,
      calc(100% - 20px)
    );

  margin:auto;

  background:white;

  padding:25px;

  border-radius:18px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.10);

}

.topo{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:25px;

}

.topo h2{

  margin:0;

  color:#0f172a;

}

.btn-voltar{

  background:#475569;

  color:white;

  border:none;

  padding:11px 20px;

  border-radius:9px;

  cursor:pointer;

  font-weight:bold;

}

.btn-voltar:hover{

  background:#334155;

}

.filtros{

  display:grid;

  grid-template-columns:
    repeat(
      4,
      minmax(160px,1fr)
    );

  gap:18px;

  margin-top:20px;

}

.filtro{

  display:flex;

  flex-direction:column;

  gap:7px;

}

.filtro label{

  font-weight:bold;

  font-size:13px;

  color:#334155;

}

select{

  width:100%;

  height:44px;

  padding:
    0 12px;

  border:
    1px solid #cbd5e1;

  border-radius:9px;

  background:white;

  font-size:14px;

  outline:none;

}

select:focus{

  border-color:#2563eb;

  box-shadow:
    0 0 0 3px
    rgba(37,99,235,.12);

}

.btn-atualizar{

  height:44px;

  background:#2563eb;

  color:white;

  border:none;

  padding:0 20px;

  border-radius:9px;

  cursor:pointer;

  font-weight:bold;

}

.btn-atualizar:hover{

  background:#1d4ed8;

}

.mensagem{

  margin-top:18px;

  padding:12px;

  border-radius:8px;

  display:none;

}

.mensagem.erro{

  display:block;

  background:#fee2e2;

  color:#991b1b;

  font-weight:bold;

}

.mensagem.info{

  display:block;

  background:#eff6ff;

  color:#1d4ed8;

}

#grafico{

  width:100%;

  height:500px;

  margin-top:30px;

}

#graficoLinha{

  width:100%;

  height:450px;

  margin-top:20px;

}

.secao-grafico{

  margin-top:30px;

}

.secao-grafico h3{

  color:#0f172a;

}

.loading{

  color:#64748b;

  font-style:italic;

}

@media(max-width:800px){

  .filtros{

    grid-template-columns:1fr 1fr;

  }

}

@media(max-width:500px){

  body{

    padding:10px;

  }

  .container{

    padding:18px;

  }

  .topo{

    flex-direction:column;

    align-items:stretch;

  }

  .btn-voltar{

    width:100%;

  }

  .filtros{

    grid-template-columns:1fr;

  }

  #grafico{

    height:400px;

  }

  #graficoLinha{

    height:380px;

  }

}

</style>

</head>


<body>


<div class="container">


  <div class="topo">

    <h2>
      📊 Gráficos Financeiros
    </h2>

    <button
      class="btn-voltar"
      onclick="voltar()"
    >
      ⬅ Voltar
    </button>

  </div>


  <div class="filtros">


    <div class="filtro">

      <label for="selecionaAno">
        Ano
      </label>

      <select id="selecionaAno">

        <option value="">
          Carregando...
        </option>

      </select>

    </div>


    <div class="filtro">

      <label for="tipoGrafico">
        Tipo
      </label>

      <select id="tipoGrafico">

        <option value="Contas a Receber">
          Receita
        </option>

        <option value="Contas a Pagar">
          Despesa
        </option>

      </select>

    </div>


    <div class="filtro">

      <label for="categoriaSelecionada">
        Categoria
      </label>

      <select id="categoriaSelecionada">

        <option value="">
          Carregando...
        </option>

      </select>

    </div>


    <div class="filtro">

      <label>
        &nbsp;
      </label>

      <button
        class="btn-atualizar"
        onclick="carregarTudo()"
      >
        🔄 Atualizar
      </button>

    </div>


  </div>


  <div
    id="mensagem"
    class="mensagem"
  ></div>


  <div id="grafico"></div>


  <div class="secao-grafico">

    <h3>
      📈 Evolução da Categoria
    </h3>

    <div id="graficoLinha"></div>

  </div>


</div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const URL_API =
  "https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


const URL_INDEX =
  "https://joeldisousa-dot.github.io/gestaofinanceira/";


/* =========================================================
   GOOGLE CHARTS
========================================================= */

google.charts.load(
  "current",
  {
    packages:[
      "corechart"
    ]
  }
);


google.charts.setOnLoadCallback(
  iniciar
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

async function iniciar(){

  try{

    mostrarMensagem(
      "Carregando informações...",
      "info"
    );


    await carregarAnos();


    await carregarTipos();


    await carregarGrafico();


    limparMensagem();

  }
  catch(e){

    mostrarErro(
      e.message
    );

  }

}


/* =========================================================
   API
========================================================= */

async function apiRequest(
  action,
  params={}
){

  const url =
    new URL(
      URL_API
    );


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(function(chave){

      const valor =
        params[chave];


      if(
        valor !== undefined &&
        valor !== null
      ){

        url.searchParams.set(
          chave,
          typeof valor === "object"
            ? JSON.stringify(valor)
            : valor
        );

      }

    });


  let resposta;


  try{

    resposta =
      await fetch(
        url.toString(),
        {
          method:"GET",
          redirect:"follow",
          cache:"no-store"
        }
      );

  }
  catch(e){

    throw new Error(
      "Não foi possível conectar ao Google Apps Script."
    );

  }


  if(!resposta.ok){

    throw new Error(
      "Erro HTTP " +
      resposta.status
    );

  }


  const texto =
    await resposta.text();


  let dados;


  try{

    dados =
      JSON.parse(texto);

  }
  catch(e){

    console.error(
      "Resposta do servidor:",
      texto
    );

    throw new Error(
      "O servidor não retornou JSON válido."
    );

  }


  /*
     Algumas funções do Apps Script podem retornar:

     [2024,2025]

     ou:

     {
       sucesso:true,
       dados:[2024,2025]
     }

     ou:

     {
       sucesso:true,
       resultado:[2024,2025]
     }

     Esta função normaliza todos esses formatos.
  */


  if(
    dados &&
    dados.sucesso === false
  ){

    throw new Error(
      dados.erro ||
      dados.mensagem ||
      "Erro retornado pelo servidor."
    );

  }


  if(
    dados &&
    Array.isArray(dados.dados)
  ){

    return dados.dados;

  }


  if(
    dados &&
    Array.isArray(dados.resultado)
  ){

    return dados.resultado;

  }


  if(
    dados &&
    Array.isArray(dados.lista)
  ){

    return dados.lista;

  }


  if(
    dados &&
    Object.prototype.hasOwnProperty.call(
      dados,
      "dados"
    )
  ){

    return dados.dados;

  }


  return dados;

}


/* =========================================================
   CARREGAR ANOS
========================================================= */

async function carregarAnos(){

  const combo =
    document.getElementById(
      "selecionaAno"
    );


  combo.innerHTML =
    "<option value=''>Carregando...</option>";


  try{

    const anos =
      await apiRequest(
        "listarAnos"
      );


    console.log(
      "Anos recebidos:",
      anos
    );


    combo.innerHTML =
      "";


    if(
      !Array.isArray(anos) ||
      anos.length === 0
    ){

      combo.innerHTML =
        "<option value=''>Sem dados</option>";

      throw new Error(
        "Nenhum ano foi encontrado."
      );

    }


    anos.forEach(
      function(ano){

        const opcao =
          document.createElement(
            "option"
          );


        opcao.value =
          ano;


        opcao.textContent =
          ano;


        combo.appendChild(
          opcao
        );

      }
    );


    /*
       Se o index enviou ?ano=2026,
       usamos esse ano.

       Caso contrário,
       usamos o último ano.
    */

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const anoURL =
      parametros.get(
        "ano"
      );


    if(
      anoURL &&
      Array.from(
        combo.options
      ).some(
        option =>
          String(option.value) ===
          String(anoURL)
      )
    ){

      combo.value =
        anoURL;

    }
    else{

      combo.value =
        anos[anos.length - 1];

    }

  }
  catch(e){

    combo.innerHTML =
      "<option value=''>Erro</option>";

    throw e;

  }

}


/* =========================================================
   CARREGAR CATEGORIAS
========================================================= */

async function carregarTipos(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const combo =
    document.getElementById(
      "categoriaSelecionada"
    );


  if(!ano){

    combo.innerHTML =
      "<option value=''>Selecione o ano</option>";

    return;

  }


  combo.innerHTML =
    "<option value=''>Carregando...</option>";


  try{

    console.log(
      "Buscando categorias:",
      ano,
      tipo
    );


    const lista =
      await apiRequest(
        "listarTiposFinanceiros",
        {
          ano:
            ano,

          tipo:
            tipo
        }
      );


    console.log(
      "Categorias recebidas:",
      lista
    );


    combo.innerHTML =
      "";


    if(
      !Array.isArray(lista) ||
      lista.length === 0
    ){

      combo.innerHTML =
        "<option value=''>Sem categorias</option>";

      document.getElementById(
        "graficoLinha"
      ).innerHTML =
        "";

      return;

    }


    lista.forEach(
      function(item){

        const opcao =
          document.createElement(
            "option"
          );


        opcao.value =
          item;


        opcao.textContent =
          item;


        combo.appendChild(
          opcao
        );

      }
    );


    await carregarLinhaTempo();

  }
  catch(e){

    combo.innerHTML =
      "<option value=''>Erro ao carregar</option>";

    throw e;

  }

}


/* =========================================================
   ALTERAÇÃO DO ANO
========================================================= */

document
  .getElementById(
    "selecionaAno"
  )
  .addEventListener(
    "change",
    async function(){

      try{

        mostrarMensagem(
          "Carregando categorias...",
          "info"
        );

        await carregarTipos();

        await carregarGrafico();

        limparMensagem();

      }
      catch(e){

        mostrarErro(
          e.message
        );

      }

    }
  );


/* =========================================================
   ALTERAÇÃO DO TIPO
========================================================= */

document
  .getElementById(
    "tipoGrafico"
  )
  .addEventListener(
    "change",
    async function(){

      try{

        mostrarMensagem(
          "Carregando categorias...",
          "info"
        );

        await carregarTipos();

        await carregarGrafico();

        limparMensagem();

      }
      catch(e){

        mostrarErro(
          e.message
        );

      }

    }
  );


/* =========================================================
   ALTERAÇÃO DA CATEGORIA
========================================================= */

document
  .getElementById(
    "categoriaSelecionada"
  )
  .addEventListener(
    "change",
    async function(){

      try{

        await carregarLinhaTempo();

      }
      catch(e){

        mostrarErro(
          e.message
        );

      }

    }
  );


/* =========================================================
   ATUALIZAR TUDO
========================================================= */

async function carregarTudo(){

  try{

    mostrarMensagem(
      "Atualizando gráficos...",
      "info"
    );


    await carregarTipos();


    await carregarGrafico();


    limparMensagem();

  }
  catch(e){

    mostrarErro(
      e.message
    );

  }

}


/* =========================================================
   GRÁFICO PRINCIPAL
========================================================= */

async function carregarGrafico(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  if(!ano){

    return;

  }


  try{

    const dados =
      await apiRequest(
        "dadosGraficos",
        {
          ano:
            ano
        }
      );


    console.log(
      "Dados do gráfico:",
      dados
    );


    desenharGrafico(
      normalizarDadosGrafico(
        dados
      )
    );

  }
  catch(e){

    throw new Error(
      "Erro ao carregar gráfico: " +
      e.message
    );

  }

}


/* =========================================================
   NORMALIZAR DADOS DO GRÁFICO
========================================================= */

function normalizarDadosGrafico(
  dados
){

  if(
    dados &&
    !Array.isArray(dados)
  ){

    if(
      dados.dados &&
      typeof dados.dados === "object"
    ){

      dados =
        dados.dados;

    }

    if(
      dados.resultado &&
      typeof dados.resultado === "object"
    ){

      dados =
        dados.resultado;

    }

  }


  if(!dados){

    return {
      receber:[],
      pagar:[]
    };

  }


  return {

    receber:
      Array.isArray(
        dados.receber
      )
        ? dados.receber
        : [],

    pagar:
      Array.isArray(
        dados.pagar
      )
        ? dados.pagar
        : []

  };

}


/* =========================================================
   DESENHAR GRÁFICO PRINCIPAL
========================================================= */

function desenharGrafico(
  dados
){

  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Receitas"
  );


  tabela.addColumn(
    "number",
    "Despesas"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas = [];


  for(
    let i = 0;
    i < 12;
    i++
  ){

    linhas.push(
      [

        meses[i],

        Number(
          dados.receber[i]
        ) || 0,

        Number(
          dados.pagar[i]
        ) || 0

      ]
    );

  }


  tabela.addRows(
    linhas
  );


  const grafico =
    new google.visualization.ColumnChart(
      document.getElementById(
        "grafico"
      )
    );


  grafico.draw(
    tabela,
    {

      title:
        "Receitas x Despesas por Mês",

      legend:{
        position:"top"
      },

      colors:[
        "#2e7d32",
        "#c62828"
      ],

      animation:{
        startup:true,
        duration:800,
        easing:"out"
      },

      chartArea:{
        left:90,
        top:60,
        width:"80%",
        height:"70%"
      },

      vAxis:{
        title:"Valor (R$)",
        format:"currency"
      },

      hAxis:{
        title:"Mês"
      }

    }
  );

}


/* =========================================================
   LINHA DA CATEGORIA
========================================================= */

async function carregarLinhaTempo(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  if(
    !ano ||
    !tipo ||
    !categoria ||
    categoria === "Sem categorias"
  ){

    return;

  }


  try{

    const dados =
      await apiRequest(
        "dadosLinhaTempo",
        {

          ano:
            ano,

          tipo:
            tipo,

          categoria:
            categoria

        }
      );


    console.log(
      "Dados linha:",
      dados
    );


    desenharLinha(
      normalizarLinha(
        dados
      )
    );

  }
  catch(e){

    throw new Error(
      "Erro ao carregar evolução: " +
      e.message
    );

  }

}


/* =========================================================
   NORMALIZAR LINHA
========================================================= */

function normalizarLinha(
  dados
){

  if(
    dados &&
    !Array.isArray(dados)
  ){

    if(
      Array.isArray(
        dados.dados
      )
    ){

      return dados.dados;

    }

    if(
      Array.isArray(
        dados.resultado
      )
    ){

      return dados.resultado;

    }

  }


  return Array.isArray(
    dados
  )
    ? dados
    : [];

}


/* =========================================================
   DESENHAR LINHA
========================================================= */

function desenharLinha(
  dados
){

  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Valor"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas = [];


  for(
    let i = 0;
    i < 12;
    i++
  ){

    let valor =
      Number(
        dados[i]
      ) || 0;


    /*
       Caso o servidor retorne
       objetos, também aceitamos:
       {valor:100}
       {total:100}
    */

    if(
      typeof dados[i] === "object" &&
      dados[i] !== null
    ){

      valor =
        Number(
          dados[i].valor ??
          dados[i].total ??
          0
        ) || 0;

    }


    linhas.push(
      [
        meses[i],
        valor
      ]
    );

  }


  tabela.addRows(
    linhas
  );


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  const cor =
    tipo ===
    "Contas a Receber"

      ? "#00897b"

      : "#e53935";


  const grafico =
    new google.visualization.LineChart(
      document.getElementById(
        "graficoLinha"
      )
    );


  grafico.draw(
    tabela,
    {

      title:
        categoria +
        " - Evolução Mensal",

      curveType:
        "function",

      legend:
        "none",

      colors:[
        cor
      ],

      pointSize:
        6,

      lineWidth:
        4,

      animation:{
        startup:true,
        duration:900,
        easing:"out"
      },

      chartArea:{
        left:90,
        top:60,
        width:"80%",
        height:"70%"
      },

      vAxis:{
        title:"Valor (R$)",
        format:"currency"
      },

      hAxis:{
        title:"Mês"
      }

    }
  );

}


/* =========================================================
   VOLTAR PARA GITHUB
========================================================= */

function voltar(){

  window.location.href =
    URL_INDEX;

}


/* =========================================================
   MENSAGENS
========================================================= */

function mostrarMensagem(
  texto,
  tipo
){

  const div =
    document.getElementById(
      "mensagem"
    );


  div.textContent =
    texto;


  div.className =
    "mensagem " +
    tipo;

}


function limparMensagem(){

  const div =
    document.getElementById(
      "mensagem"
    );


  div.textContent =
    "";


  div.className =
    "mensagem";

}


function mostrarErro(
  texto
){

  console.error(
    texto
  );


  mostrarMensagem(
    "Erro: " +
    texto,
    "erro"
  );

}


/* =========================================================
   REDIMENSIONAR
========================================================= */

let resizeTimer;


window.addEventListener(
  "resize",
  function(){

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function(){

          const ano =
            document.getElementById(
              "selecionaAno"
            ).value;


          if(ano){

            carregarGrafico()
              .catch(console.error);

          }


          const categoria =
            document.getElementById(
              "categoriaSelecionada"
            ).value;


          if(categoria){

            carregarLinhaTempo()
              .catch(console.error);

          }

        },
        300
      );

  }
);

</script>

</body>

</html>
