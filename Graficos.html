<title>Gráficos Financeiros</title> <script src="https://www.gstatic.com/charts/loader.js"></script> <style> *{ box-sizing:border-box; } body{ margin:0; padding:20px; font-family:"Segoe UI",Arial,sans-serif; background:linear-gradient(135deg,#e8eef5,#ffffff); color:#1e293b; } .container{ width:min(1200px,calc(100% - 10px)); margin:auto; background:#fff; padding:25px; border-radius:18px; box-shadow:0 8px 25px rgba(0,0,0,.12); } .topo{ display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:25px; } .topo h1{ margin:0; font-size:28px; color:#0d47a1; } .btn-voltar, .btn-atualizar{ border:none; color:#fff; border-radius:10px; cursor:pointer; font-weight:bold; transition:.2s; } .btn-voltar{ background:linear-gradient(135deg,#455a64,#78909c); padding:12px 22px; font-size:15px; } .btn-atualizar{ width:100%; height:44px; background:linear-gradient(135deg,#1976d2,#2196f3); font-size:14px; } .btn-voltar:hover, .btn-atualizar:hover{ transform:translateY(-2px); filter:brightness(1.08); } .btn-atualizar:disabled{ opacity:.6; cursor:not-allowed; transform:none; } .filtros{ display:grid; grid-template-columns:repeat(4,minmax(150px,1fr)); gap:18px; margin-top:20px; padding:20px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:14px; } .filtro{ display:flex; flex-direction:column; gap:7px; } .filtro label{ font-weight:bold; font-size:13px; color:#334155; } select{ width:100%; height:44px; padding:0 12px; border:1px solid #cbd5e1; border-radius:9px; background:#fff; color:#1e293b; font-size:14px; outline:none; } select:focus{ border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); } .mensagem{ margin-top:18px; padding:13px 15px; border-radius:9px; display:none; font-size:14px; } .mensagem.info{ display:block; background:#eff6ff; color:#1d4ed8; border-left:5px solid #2563eb; } .mensagem.erro{ display:block; background:#fee2e2; color:#991b1b; border-left:5px solid #dc2626; font-weight:bold; } .mensagem.sucesso{ display:block; background:#ecfdf5; color:#166534; border-left:5px solid #16a34a; } .secao-grafico{ margin-top:30px; padding:18px; background:#fff; border:1px solid #e2e8f0; border-radius:14px; } .secao-grafico h2{ margin:0 0 10px 0; color:#0d47a1; font-size:19px; } #grafico{ width:100%; height:500px; } #graficoLinha{ width:100%; height:450px; } .loading{ display:flex; align-items:center; justify-content:center; min-height:120px; color:#64748b; font-style:italic; } .info-grafico{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:5px; padding:10px 12px; background:#f8fafc; border-radius:8px; font-size:13px; color:#475569; } .info-grafico strong{ color:#0f172a; } .rodape{ text-align:center; margin-top:25px; color:#777; font-size:12px; } @media(max-width:900px){ .filtros{ grid-template-columns:1fr 1fr; } } @media(max-width:600px){ body{ padding:10px; } .container{ width:100%; padding:15px; } .topo{ flex-direction:column; align-items:stretch; } .topo h1{ font-size:23px; } .btn-voltar{ width:100%; } .filtros{ grid-template-columns:1fr; padding:15px; } #grafico{ height:400px; } #graficoLinha{ height:380px; } .info-grafico{ flex-direction:column; align-items:flex-start; } } @media print{ @page{ size:A4 portrait; margin:10mm; } body{ background:#fff; padding:0; } .container{ width:100%; max-width:none; box-shadow:none; padding:5px; } .btn-voltar, .btn-atualizar, .filtros, .mensagem{ display:none!important; } .secao-grafico{ border:none; padding:0; } } </style> </head> <body> <div class="container"> <div class="topo">

</div> </div> <script> /* ========================================================= CONFIGURAÇÃO ========================================================= */ const URL_API = "https://script.google.com/macros/s/AKfycbxyXfBbooxSug3QbCvbpOl1MFJpqP5AhJIqLMB166p2opvvZBUX0UfIviuObQ6_nEvc/exec"; const URL_INDEX = "https://joeldisousa-dot.github.io/gestaofinanceira/"; /* ========================================================= VARIÁVEIS DE CONTROLE ========================================================= */ let contadorJSONP = 0; let carregando = false; let anoAtual = ""; let tipoAtual = "Contas a Receber"; let categoriaAtual = ""; /* ========================================================= GOOGLE CHARTS ========================================================= */ google.charts.load( "current", { packages:["corechart"] } ); google.charts.setOnLoadCallback( iniciar ); /* ========================================================= API JSONP ========================================================= */ function apiRequest( action, params={} ){ return new Promise( function(resolve,reject){ const callback = "callbackGraficos_" + Date.now() + "_" + (++contadorJSONP); const script = document.createElement("script"); const dados = { ...params, action:action, callback:callback }; const query = Object.keys(dados) .map(function(chave){ let valor = dados[chave]; if( valor === undefined || valor === null ){ valor = ""; } return ( encodeURIComponent(chave) + "=" + encodeURIComponent(valor) ); }) .join("&"); const url = URL_API + "?" + query; let finalizado = false; const timeout = setTimeout( function(){ if(finalizado){ return; } finalizado = true; limpar(); reject( new Error( "A API demorou mais de 30 segundos para responder." ) ); }, 30000 ); window[callback] = function(resposta){ if(finalizado){ return; } finalizado = true; clearTimeout(timeout); limpar(); console.log( "Resposta API:", action, resposta ); if(!resposta){ reject( new Error( "A API retornou uma resposta vazia." ) ); return; } if( resposta.sucesso === false ){ reject( new Error( resposta.erro || resposta.mensagem || "Erro retornado pela API." ) ); return; } /* * Aceita os seguintes formatos: * * {lista:[]} * {dados:[]} * {resultado:[]} * {anos:[]} * {categorias:[]} * [] */ if( Array.isArray( resposta.lista ) ){ resolve( resposta.lista ); return; } if( Array.isArray( resposta.dados ) ){ resolve( resposta.dados ); return; } if( Array.isArray( resposta.resultado ) ){ resolve( resposta.resultado ); return; } if( Array.isArray( resposta.anos ) ){ resolve( resposta.anos ); return; } if( Array.isArray( resposta.categorias ) ){ resolve( resposta.categorias ); return; } resolve(resposta); }; script.onerror = function(){ if(finalizado){ return; } finalizado = true; clearTimeout(timeout); limpar(); reject( new Error( "Não foi possível conectar à API do Google Apps Script." ) ); }; script.src = url; document.body.appendChild( script ); function limpar(){ delete window[callback]; if( script.parentNode ){ script.parentNode.removeChild( script ); } } } ); } /* ========================================================= INICIAR ========================================================= */ async function iniciar(){ try{ mostrarMensagem( "Carregando informações...", "info" ); await carregarAnos(); atualizarInformacoes(); await carregarCategorias(); await carregarGrafico(); limparMensagem(); } catch(e){ console.error( "Erro ao iniciar:", e ); mostrarErro( e.message ); } } /* ========================================================= CARREGAR ANOS ========================================================= */ async function carregarAnos(){ const combo = document.getElementById( "selecionaAno" ); combo.innerHTML = "<option value=''>Carregando...</option>"; const resultado = await apiRequest( "listarAnos" ); console.log( "Resultado listarAnos:", resultado ); const anos = normalizarAnos( resultado ); if( anos.length === 0 ){ combo.innerHTML = "<option value=''>Sem dados</option>"; throw new Error( "Nenhum ano foi encontrado na API." ); } combo.innerHTML = ""; anos.forEach( function(ano){ const option = document.createElement( "option" ); option.value = ano; option.textContent = ano; combo.appendChild( option ); } ); const parametros = new URLSearchParams( window.location.search ); const anoURL = parametros.get("ano"); if( anoURL && anos.includes( String(anoURL) ) ){ combo.value = String(anoURL); } else{ combo.value = anos[anos.length - 1]; } anoAtual = combo.value; document.getElementById( "infoAno" ).textContent = anoAtual; } /* ========================================================= NORMALIZAR ANOS ========================================================= */ function normalizarAnos( dados ){ let lista = []; if( Array.isArray(dados) ){ lista = dados; } else if( dados && typeof dados === "object" ){ lista = dados.anos || dados.lista || dados.dados || dados.resultado || []; } const anos = []; lista.forEach( function(item){ let valor = item; if( item && typeof item === "object" ){ valor = item.ano || item.Ano || item.competencia || item.Competência || item.valor || ""; } valor = String( valor ).trim(); /* * Aceita: * * 2026 * 2026-01 * 01/2026 */ let ano = ""; if( /^\d{4}$/.test(valor) ){ ano = valor; } else if( /^\d{4}-\d{2}$/.test(valor) ){ ano = valor.substring(0,4); } else if( /^\d{2}\/\d{4}$/.test(valor) ){ ano = valor.substring(3,7); } if( /^\d{4}$/.test(ano) && !anos.includes(ano) ){ anos.push(ano); } } ); anos.sort( function(a,b){ return Number(a) - Number(b); } ); return anos; } /* ========================================================= CARREGAR CATEGORIAS ========================================================= */ async function carregarCategorias(){ const ano = document.getElementById( "selecionaAno" ).value; const tipo = document.getElementById( "tipoGrafico" ).value; const combo = document.getElementById( "categoriaSelecionada" ); categoriaAtual = ""; if(!ano){ combo.innerHTML = "<option value=''>Selecione o ano</option>"; return; } combo.innerHTML = "<option value=''>Carregando...</option>"; const resultado = await apiRequest( "listarTiposFinanceiros", { ano:ano, tipo:tipo } ); console.log( "Categorias recebidas:", resultado ); const categorias = normalizarCategorias( resultado ); if( categorias.length === 0 ){ combo.innerHTML = "<option value=''>Sem categorias</option>"; document.getElementById( "graficoLinha" ).innerHTML = "Nenhuma categoria encontrada para o período."; atualizarInformacoes(); return; } combo.innerHTML = ""; categorias.forEach( function(categoria){ const option = document.createElement( "option" ); option.value = categoria; option.textContent = categoria; combo.appendChild( option ); } ); combo.selectedIndex = 0; categoriaAtual = combo.value; atualizarInformacoes(); await carregarLinhaTempo(); } /* ========================================================= NORMALIZAR CATEGORIAS ========================================================= */ function normalizarCategorias( dados ){ let lista = []; if( Array.isArray(dados) ){ lista = dados; } else if( dados && typeof dados === "object" ){ lista = dados.categorias || dados.lista || dados.dados || dados.resultado || []; } const categorias = []; lista.forEach( function(item){ let valor = item; if( item && typeof item === "object" ){ valor = item.categoria || item.Categoria || item.descricao || item.Descricao || item.nome || item.Nome || item.valor || ""; } valor = String( valor ).trim(); if( valor && !categorias.includes(valor) ){ categorias.push( valor ); } } ); categorias.sort( function(a,b){ return a.localeCompare( b, "pt-BR", { sensitivity:"base" } ); } ); return categorias; } /* ========================================================= CARREGAR GRÁFICO PRINCIPAL ========================================================= */ async function carregarGrafico(){ const ano = document.getElementById( "selecionaAno" ).value; if(!ano){ return; } const elemento = document.getElementById( "grafico" ); elemento.innerHTML = "<div class='loading'>Carregando gráfico...</div>"; const dados = await apiRequest( "dadosGraficos", { ano:ano } ); console.log( "Dados do gráfico:", dados ); desenharGrafico( normalizarDadosGrafico( dados ) ); } /* ========================================================= NORMALIZAR GRÁFICO ========================================================= */ function normalizarDadosGrafico( dados ){ if( dados && typeof dados === "object" && !Array.isArray(dados) ){ if( dados.dados && typeof dados.dados === "object" && !Array.isArray(dados.dados) ){ dados = dados.dados; } if( dados.resultado && typeof dados.resultado === "object" && !Array.isArray(dados.resultado) ){ dados = dados.resultado; } } if( !dados || typeof dados !== "object" ){ return { receber:[], pagar:[] }; } return { receber: Array.isArray(dados.receber) ? dados.receber : [], pagar: Array.isArray(dados.pagar) ? dados.pagar : [] }; } /* ========================================================= DESENHAR GRÁFICO PRINCIPAL ========================================================= */ function desenharGrafico( dados ){ const tabela = new google.visualization.DataTable(); tabela.addColumn( "string", "Mês" ); tabela.addColumn( "number", "Receitas" ); tabela.addColumn( "number", "Despesas" ); const meses = [ "Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez" ]; const linhas = []; for( let i=0; i<12; i++ ){ linhas.push([ meses[i], converterValorGrafico( dados.receber[i] ), converterValorGrafico( dados.pagar[i] ) ]); } tabela.addRows( linhas ); const grafico = new google.visualization.ColumnChart( document.getElementById( "grafico" ) ); grafico.draw( tabela, { title: "Receitas x Despesas por Mês", legend:{ position:"top" }, colors:[ "#2e7d32", "#c62828" ], animation:{ startup:true, duration:700, easing:"out" }, chartArea:{ left:90, top:60, width:"80%", height:"70%" }, vAxis:{ title:"Valor (R$)", format:"R$ #,##0.00" }, hAxis:{ title:"Mês" }, tooltip:{ text:"value" }, backgroundColor: "transparent" } ); } /* ========================================================= LINHA DO TEMPO ========================================================= */ async function carregarLinhaTempo(){ const ano = document.getElementById( "selecionaAno" ).value; const tipo = document.getElementById( "tipoGrafico" ).value; const categoria = document.getElementById( "categoriaSelecionada" ).value; atualizarInformacoes(); if( !ano || !tipo || !categoria || categoria === "Sem categorias" ){ document.getElementById( "graficoLinha" ).innerHTML = "Selecione uma categoria."; return; } const elemento = document.getElementById( "graficoLinha" ); elemento.innerHTML = "<div class='loading'>Carregando evolução...</div>"; const dados = await apiRequest( "dadosLinhaTempo", { ano:ano, tipo:tipo, categoria:categoria } ); console.log( "Linha do tempo:", dados ); desenharLinha( normalizarLinha( dados ) ); } /* ========================================================= NORMALIZAR LINHA ========================================================= */ function normalizarLinha( dados ){ if( Array.isArray(dados) ){ return dados; } if( dados && typeof dados === "object" ){ if( Array.isArray(dados.dados) ){ return dados.dados; } if( Array.isArray(dados.resultado) ){ return dados.resultado; } if( Array.isArray(dados.lista) ){ return dados.lista; } } return []; } /* ========================================================= DESENHAR LINHA ========================================================= */ function desenharLinha( dados ){ const tabela = new google.visualization.DataTable(); tabela.addColumn( "string", "Mês" ); tabela.addColumn( "number", "Valor" ); const meses = [ "Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez" ]; const linhas = []; for( let i=0; i<12; i++ ){ let valor = dados[i]; if( valor && typeof valor === "object" ){ valor = valor.valor ?? valor.total ?? valor.value ?? 0; } linhas.push([ meses[i], converterValorGrafico(valor) ]); } tabela.addRows( linhas ); const tipo = document.getElementById( "tipoGrafico" ).value; const categoria = document.getElementById( "categoriaSelecionada" ).value; const cor = tipo === "Contas a Receber" ? "#00897b" : "#e53935"; const grafico = new google.visualization.LineChart( document.getElementById( "graficoLinha" ) ); grafico.draw( tabela, { title: categoria + " - Evolução Mensal", curveType: "function", legend: "none", colors:[ cor ], pointSize:6, lineWidth:4, animation:{ startup:true, duration:700, easing:"out" }, chartArea:{ left:90, top:60, width:"80%", height:"70%" }, vAxis:{ title:"Valor (R$)", format:"R$ #,##0.00" }, hAxis:{ title:"Mês" }, backgroundColor: "transparent" } ); } /* ========================================================= CONVERTER VALOR ========================================================= */ function converterValorGrafico( valor ){ if( valor === null || valor === undefined || valor === "" ){ return 0; } if( typeof valor === "number" ){ return isFinite(valor) ? valor : 0; } if( typeof valor === "object" ){ valor = valor.valor ?? valor.total ?? valor.value ?? 0; } let texto = String(valor) .trim() .replace(/R\$/gi,"") .replace(/\s/g,""); if( texto.indexOf(",") >= 0 ){ texto = texto .replace(/\./g,"") .replace(",", "."); } const numero = Number(texto); return isFinite(numero) ? numero : 0; } /* ========================================================= ATUALIZAR INFORMAÇÕES ========================================================= */ function atualizarInformacoes(){ const ano = document.getElementById( "selecionaAno" ).value; const tipo = document.getElementById( "tipoGrafico" ).value; const categoria = document.getElementById( "categoriaSelecionada" ).value; document.getElementById( "infoAno" ).textContent = ano || "-"; document.getElementById( "infoTipo" ).textContent = tipo === "Contas a Receber" ? "Receita" : "Despesa"; document.getElementById( "infoCategoria" ).textContent = categoria || "-"; } /* ========================================================= EVENTO ANO ========================================================= */ document .getElementById("selecionaAno") .addEventListener( "change", async function(){ if(carregando){ return; } try{ carregando = true; mostrarMensagem( "Atualizando informações...", "info" ); anoAtual = this.value; atualizarInformacoes(); await carregarCategorias(); await carregarGrafico(); limparMensagem(); } catch(e){ console.error(e); mostrarErro( e.message ); } finally{ carregando = false; } } ); /* ========================================================= EVENTO TIPO ========================================================= */ document .getElementById("tipoGrafico") .addEventListener( "change", async function(){ if(carregando){ return; } try{ carregando = true; mostrarMensagem( "Carregando categorias...", "info" ); tipoAtual = this.value; atualizarInformacoes(); await carregarCategorias(); await carregarGrafico(); limparMensagem(); } catch(e){ console.error(e); mostrarErro( e.message ); } finally{ carregando = false; } } ); /* ========================================================= EVENTO CATEGORIA ========================================================= */ document .getElementById("categoriaSelecionada") .addEventListener( "change", async function(){ if(carregando){ return; } try{ carregando = true; categoriaAtual = this.value; atualizarInformacoes(); mostrarMensagem( "Atualizando evolução...", "info" ); await carregarLinhaTempo(); limparMensagem(); } catch(e){ console.error(e); mostrarErro( e.message ); } finally{ carregando = false; } } ); /* ========================================================= BOTÃO ATUALIZAR ========================================================= */ document .getElementById("btnAtualizar") .addEventListener( "click", carregarTudo ); async function carregarTudo(){ if(carregando){ return; } const botao = document.getElementById( "btnAtualizar" ); try{ carregando = true; botao.disabled = true; mostrarMensagem( "Atualizando gráficos...", "info" ); await carregarAnos(); await carregarCategorias(); await carregarGrafico(); await carregarLinhaTempo(); mostrarMensagem( "Gráficos atualizados com sucesso.", "sucesso" ); setTimeout( limparMensagem, 1800 ); } catch(e){ console.error( "Erro ao atualizar:", e ); mostrarErro( e.message ); } finally{ carregando = false; botao.disabled = false; } } /* ========================================================= VOLTAR ========================================================= */ function voltar(){ window.location.href = URL_INDEX; } /* ========================================================= MENSAGENS ========================================================= */ function mostrarMensagem( texto, tipo ){ const div = document.getElementById( "mensagem" ); div.textContent = texto; div.className = "mensagem " + tipo; } function limparMensagem(){ const div = document.getElementById( "mensagem" ); div.textContent = ""; div.className = "mensagem"; } function mostrarErro( texto ){ console.error( texto ); mostrarMensagem( "⚠ " + texto, "erro" ); } /* ========================================================= REDIMENSIONAR ========================================================= */ let resizeTimer = null; window.addEventListener( "resize", function(){ clearTimeout( resizeTimer ); resizeTimer = setTimeout( function(){ const ano = document.getElementById( "selecionaAno" ).value; const categoria = document.getElementById( "categoriaSelecionada" ).value; if(!ano){ return; } try{ carregarGrafico(); if(categoria){ carregarLinhaTempo(); } } catch(e){ console.error(e); } }, 500 ); } ); </script> </body> </html>
