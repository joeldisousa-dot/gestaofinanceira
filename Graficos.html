<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Gráficos Financeiros</title>

<script src="https://www.gstatic.com/charts/loader.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{

  font-family:
    Arial,
    sans-serif;

  background:#f1f5f9;

  margin:0;

  padding:20px;

}

.container{

  max-width:1200px;

  margin:auto;

  background:white;

  padding:25px;

  border-radius:15px;

  box-shadow:
    0 5px 20px #ccc;

}

.topo{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

}

.topo h2{

  margin:0;

}

button{

  background:#1976d2;

  color:white;

  border:none;

  padding:12px 22px;

  border-radius:10px;

  cursor:pointer;

  font-weight:bold;

}

button:hover{

  background:#0d47a1;

}

.filtros{

  display:flex;

  gap:20px;

  flex-wrap:wrap;

  margin-top:25px;

}

.filtro{

  display:flex;

  flex-direction:column;

}

label{

  font-weight:bold;

  margin-bottom:5px;

}

select{

  padding:10px;

  min-width:200px;

  border-radius:8px;

  border:1px solid #ccc;

}

#grafico{

  width:100%;

  height:500px;

  margin-top:30px;

}

#graficoLinha{

  width:100%;

  height:450px;

  margin-top:30px;

}

.erro{

  color:#c62828;

  font-weight:bold;

}

@media(max-width:600px){

  body{

    padding:10px;

  }

  .container{

    padding:15px;

  }

  .topo{

    align-items:flex-start;

  }

  .filtro,
  select{

    width:100%;

  }

  .grafico{

    height:350px;

  }

}

</style>

</head>

<body>

<div class="container">

<div class="topo">

<h2>
📊 Gráficos Financeiros
</h2>

<button onclick="voltar()">
⬅ Voltar
</button>

</div>


<div class="filtros">

<div class="filtro">

<label>
Ano
</label>

<select id="selecionaAno">

<option>
Carregando...
</option>

</select>

</div>


<div class="filtro">

<label>
Tipo
</label>

<select id="tipoGrafico">

<option value="Contas a Receber">
Receita
</option>

<option value="Contas a Pagar">
Despesa
</option>

</select>

</div>


<div class="filtro">

<label>
Categoria
</label>

<select id="categoriaSelecionada">

<option>
Carregando...
</option>

</select>

</div>


<div class="filtro">

<button onclick="carregarTudo()">
🔄 Atualizar
</button>

</div>

</div>


<div id="mensagem"></div>

<div id="grafico"></div>


<h3>
📈 Evolução da Categoria
</h3>

<div id="graficoLinha"></div>

</div>


<script>

/* =========================================================
   API
========================================================= */

const URL_API =
  "https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
  action,
  params={}
){

  const url =
    new URL(URL_API);


  url.searchParams.set(
    "action",
    action
  );


  Object.keys(params)
    .forEach(function(chave){

      const valor =
        params[chave];


      if(
        valor !== undefined &&
        valor !== null
      ){

        url.searchParams.set(
          chave,
          valor
        );

      }

    });


  const resposta =
    await fetch(
      url.toString(),
      {
        method:"GET",
        redirect:"follow",
        cache:"no-store"
      }
    );


  if(!resposta.ok){

    throw new Error(
      "Erro HTTP " +
      resposta.status
    );

  }


  const texto =
    await resposta.text();


  let dados;


  try{

    dados =
      JSON.parse(texto);

  }
  catch(e){

    console.error(texto);

    throw new Error(
      "Resposta inválida da API."
    );

  }


  if(
    dados &&
    dados.sucesso === false
  ){

    throw new Error(
      dados.erro ||
      dados.mensagem ||
      "Erro na API."
    );

  }


  return dados;

}


/* =========================================================
   GOOGLE CHARTS
========================================================= */

google.charts.load(
  "current",
  {
    packages:["corechart"]
  }
);


google.charts.setOnLoadCallback(
  iniciar
);


/* =========================================================
   INICIAR
========================================================= */

function iniciar(){

  carregarAnos();

}


/* =========================================================
   VOLTAR
========================================================= */

function voltar(){

  window.location.href =
    "index.html";

}


/* =========================================================
   ANOS
========================================================= */

async function carregarAnos(){

  try{

    const anos =
      await apiRequest(
        "listarAnos"
      );


    const combo =
      document.getElementById(
        "selecionaAno"
      );


    combo.innerHTML =
      "";


    if(
      !anos ||
      anos.length === 0
    ){

      combo.innerHTML =
        "<option>Sem dados</option>";

      return;

    }


    anos.forEach(function(ano){

      const opcao =
        document.createElement(
          "option"
        );

      opcao.value =
        ano;

      opcao.textContent =
        ano;

      combo.appendChild(
        opcao
      );

    });


    /* =====================================================
       SE O INDEX ENVIOU ?ano=2026
    ===================================================== */

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const anoURL =
      parametros.get(
        "ano"
      );


    if(
      anoURL &&
      anos.includes(anoURL)
    ){

      combo.value =
        anoURL;

    }
    else{

      combo.value =
        anos[anos.length - 1];

    }


    await carregarTipos();

    await carregarGrafico();

  }
  catch(e){

    mostrarErro(e);

  }

}


/* =========================================================
   TIPO
========================================================= */

document
  .getElementById("tipoGrafico")
  .addEventListener(
    "change",
    function(){

      carregarTipos();

    }
  );


/* =========================================================
   ANO
========================================================= */

document
  .getElementById("selecionaAno")
  .addEventListener(
    "change",
    function(){

      carregarTipos();

      carregarGrafico();

    }
  );


/* =========================================================
   CATEGORIA
========================================================= */

document
  .getElementById("categoriaSelecionada")
  .addEventListener(
    "change",
    carregarLinhaTempo
  );


/* =========================================================
   CATEGORIAS
========================================================= */

async function carregarTipos(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const combo =
    document.getElementById(
      "categoriaSelecionada"
    );


  combo.innerHTML =
    "<option>Carregando...</option>";


  try{

    const lista =
      await apiRequest(
        "listarTiposFinanceiros",
        {
          ano:ano,
          tipo:tipo
        }
      );


    combo.innerHTML =
      "";


    if(
      !lista ||
      lista.length === 0
    ){

      combo.innerHTML =
        "<option>Sem categorias</option>";

      return;

    }


    lista.forEach(function(item){

      const opcao =
        document.createElement(
          "option"
        );

      opcao.value =
        item;

      opcao.textContent =
        item;

      combo.appendChild(
        opcao
      );

    });


    carregarLinhaTempo();

  }
  catch(e){

    combo.innerHTML =
      "<option>Erro</option>";

    mostrarErro(e);

  }

}


/* =========================================================
   ATUALIZAR
========================================================= */

function carregarTudo(){

  carregarTipos();

  carregarGrafico();

}


/* =========================================================
   GRÁFICO PRINCIPAL
========================================================= */

async function carregarGrafico(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  if(!ano){

    return;

  }


  document.getElementById(
    "mensagem"
  ).innerHTML =
    "Carregando gráfico...";


  try{

    const dados =
      await apiRequest(
        "dadosGraficos",
        {
          ano:ano
        }
      );


    desenharGrafico(
      dados
    );


    document.getElementById(
      "mensagem"
    ).innerHTML =
      "";

  }
  catch(e){

    mostrarErro(e);

  }

}


/* =========================================================
   LINHA
========================================================= */

async function carregarLinhaTempo(){

  const ano =
    document.getElementById(
      "selecionaAno"
    ).value;


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  if(
    !ano ||
    !tipo ||
    !categoria ||
    categoria === "Sem categorias"
  ){

    return;

  }


  try{

    const dados =
      await apiRequest(
        "dadosLinhaTempo",
        {
          ano:ano,
          tipo:tipo,
          categoria:categoria
        }
      );


    desenharLinha(
      dados
    );

  }
  catch(e){

    mostrarErro(e);

  }

}


/* =========================================================
   ERRO
========================================================= */

function mostrarErro(erro){

  console.error(
    erro
  );


  document.getElementById(
    "mensagem"
  ).innerHTML =

    "<div class='erro'>" +

    "Erro: " +

    (
      erro.message ||
      erro
    ) +

    "</div>";

}


/* =========================================================
   DESENHAR PRINCIPAL
========================================================= */

function desenharGrafico(dados){

  if(!dados){

    return;

  }


  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Receitas"
  );


  tabela.addColumn(
    "number",
    "Despesas"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas = [];


  for(
    let i=0;
    i<12;
    i++
  ){

    linhas.push([

      meses[i],

      Number(
        dados.receber?.[i] || 0
      ),

      Number(
        dados.pagar?.[i] || 0
      )

    ]);

  }


  tabela.addRows(
    linhas
  );


  const grafico =
    new google.visualization.ColumnChart(
      document.getElementById(
        "grafico"
      )
    );


  grafico.draw(

    tabela,

    {

      title:
        "Receitas x Despesas por Mês",

      legend:{
        position:"top"
      },

      colors:[
        "#2e7d32",
        "#c62828"
      ],

      animation:{
        startup:true,
        duration:800,
        easing:"out"
      },

      chartArea:{
        left:90,
        top:60,
        width:"80%",
        height:"70%"
      },

      vAxis:{
        title:"Valor (R$)",
        format:"currency"
      },

      hAxis:{
        title:"Mês"
      }

    }

  );

}


/* =========================================================
   DESENHAR LINHA
========================================================= */

function desenharLinha(dados){

  if(!dados){

    return;

  }


  const tabela =
    new google.visualization.DataTable();


  tabela.addColumn(
    "string",
    "Mês"
  );


  tabela.addColumn(
    "number",
    "Valor"
  );


  const meses = [

    "Jan",
    "Fev",
    "Mar",
    "Abr",
    "Mai",
    "Jun",
    "Jul",
    "Ago",
    "Set",
    "Out",
    "Nov",
    "Dez"

  ];


  const linhas = [];


  for(
    let i=0;
    i<12;
    i++
  ){

    linhas.push([

      meses[i],

      Number(
        dados[i] || 0
      )

    ]);

  }


  tabela.addRows(
    linhas
  );


  const tipo =
    document.getElementById(
      "tipoGrafico"
    ).value;


  const categoria =
    document.getElementById(
      "categoriaSelecionada"
    ).value;


  const cor =
    tipo === "Contas a Receber"
      ? "#00897b"
      : "#e53935";


  const grafico =
    new google.visualization.LineChart(
      document.getElementById(
        "graficoLinha"
      )
    );


  grafico.draw(

    tabela,

    {

      title:
        categoria +
        " - Evolução Mensal",

      curveType:
        "function",

      legend:
        "none",

      colors:[
        cor
      ],

      pointSize:
        6,

      lineWidth:
        4,

      animation:{
        startup:true,
        duration:900,
        easing:"out"
      },

      chartArea:{
        left:90,
        top:60,
        width:"80%",
        height:"70%"
      },

      vAxis:{
        title:"Valor (R$)",
        format:"currency"
      },

      hAxis:{
        title:"Mês"
      }

    }

  );

}


/* =========================================================
   REDIMENSIONAR
========================================================= */

window.addEventListener(
  "resize",
  function(){

    carregarGrafico();

    const categoria =
      document.getElementById(
        "categoriaSelecionada"
      ).value;

    if(categoria){

      carregarLinhaTempo();

    }

  }
);

</script>

</body>

</html>
