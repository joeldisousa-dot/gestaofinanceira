<body>


<div class="container">


<!-- ==========================
     TOPO
========================== -->

<div class="topo">

<h1>
📄 Relatório Financeiro
</h1>


<button
class="voltar"
onclick="voltar()">

⬅ Voltar

</button>

</div>


<!-- ==========================
     CABEÇALHO RELATÓRIO
========================== -->

<div class="cabecalho">

<div>

<h1>
💰 Controle Financeiro
</h1>

<p>
Relatório Financeiro Pessoal
</p>

</div>


<div class="info">

Competência:

<b id="competencia">
-
</b>


<br>


Emitido:

<span id="data">
-
</span>

</div>

</div>


<!-- ==========================
     RECEITAS
========================== -->

<h2>
📥 Receitas
</h2>


<div
id="receber"
class="carregando">

Carregando receitas...

</div>


<!-- ==========================
     DESPESAS
========================== -->

<h2>
📤 Despesas
</h2>


<div
id="pagar"
class="carregando">

Carregando despesas...

</div>


<!-- ==========================
     RESULTADO
========================== -->

<div
class="resultado-final"
id="resumoFinal">

Calculando resultado...

</div>


<br>


<div style="text-align:right">

<button
onclick="window.print()">

🖨 Imprimir / Salvar PDF

</button>

</div>


<div class="rodape">

Relatório gerado automaticamente

<br>

Controle Financeiro Pessoal

</div>


</div>


<script>


// =====================================================
// CONFIGURAÇÃO DA API
// =====================================================

const URL_API =
"https://script.google.com/macros/s/AKfycbxJzdCPkPxk2N4FhnoUflb-iWTyiLLn1XmSJDcUwkKsapI0qv-6DBpKWWBLuoHBqn8Y/exec";


// =====================================================
// URL DA PÁGINA PRINCIPAL
// =====================================================
//
// COLOQUE AQUI A URL DO SEU INDEX.HTML NO GITHUB.
//
// Exemplo:
// https://seuusuario.github.io/seu-repositorio/
//
// =====================================================

const URL_INDEX =
"https://seuusuario.github.io/seu-repositorio/";


// =====================================================
// PEGAR COMPETÊNCIA DA URL
// =====================================================
//
// Exemplos:
//
// Relatorio.html?competencia=2026-08
//
// ou
//
// Relatorio.html?competencia=08/2026
//
// =====================================================

function obterCompetencia(){

const parametros =
new URLSearchParams(
window.location.search
);


let comp =
parametros.get("competencia");


if(!comp){

const params =
new URLSearchParams(
window.location.search
);

comp =
params.get("comp");

}


if(!comp){

const agora =
new Date();

comp =
agora.getFullYear() +
"-" +
String(
agora.getMonth() + 1
).padStart(2,"0");

}


return converterCompetencia(comp);

}


// =====================================================
// CONVERTER COMPETÊNCIA
// =====================================================

function converterCompetencia(valor){

if(!valor){

return "";

}


valor =
String(valor).trim();


// AAAA-MM

if(
/^\d{4}-\d{2}$/.test(valor)
){

return valor;

}


// MM/AAAA

if(
/^\d{2}\/\d{4}$/.test(valor)
){

const partes =
valor.split("/");

return partes[1] +
"-" +
partes[0];

}


// AAAA-MM-DD

if(
/^\d{4}-\d{2}-\d{2}/.test(valor)
){

return valor.substring(
0,
7
);

}


return valor;

}


// =====================================================
// COMPETÊNCIA
// =====================================================

const competencia =
obterCompetencia();


document.getElementById(
"competencia"
).textContent =
formatarCompetencia(
competencia
);


// =====================================================
// DATA DE EMISSÃO
// =====================================================

document.getElementById(
"data"
).textContent =
new Date().toLocaleString(
"pt-BR"
);


// =====================================================
// INICIALIZAÇÃO
// =====================================================

window.addEventListener(
"load",
function(){

carregarRelatorio();

}
);


// =====================================================
// JSONP
// =====================================================
//
// O GitHub Pages não pode chamar diretamente
// google.script.run.
// Por isso utilizamos a API publicada do Apps Script.
//
// =====================================================

let contadorJSONP = 0;


function chamarAPI(
acao,
parametros
){

return new Promise(
function(resolve,reject){

const callback =
"callbackFinanceiro_" +
Date.now() +
"_" +
(++contadorJSONP);


const script =
document.createElement(
"script"
);


const dados =
parametros || {};


dados.action =
acao;

dados.callback =
callback;


const query =
Object.keys(dados)
.map(
function(chave){

return (
encodeURIComponent(chave) +
"=" +
encodeURIComponent(
dados[chave] === undefined
?
""
:
dados[chave]
)
);

}
)
.join("&");


const url =
URL_API +
"?" +
query;


let finalizado = false;


const timeout =
setTimeout(
function(){

if(finalizado){

return;

}


finalizado = true;

cleanup();

reject(
new Error(
"Tempo limite excedido ao consultar a API."
)
);

},
30000
);


window[callback] =
function(resposta){

if(finalizado){

return;

}


finalizado = true;

clearTimeout(timeout);

cleanup();

resolve(
resposta
);

};


script.onerror =
function(){

if(finalizado){

return;

}


finalizado = true;

clearTimeout(timeout);

cleanup();

reject(
new Error(
"Não foi possível conectar à API do Google Apps Script."
)
);

};


script.src =
url;


document.body.appendChild(
script
);


function cleanup(){

delete window[callback];

if(script.parentNode){

script.parentNode.removeChild(
script
);

}

}

});

}


// =====================================================
// CARREGAR RELATÓRIO
// =====================================================

async function carregarRelatorio(){

const receber =
document.getElementById(
"receber"
);


const pagar =
document.getElementById(
"pagar"
);


const resumo =
document.getElementById(
"resumoFinal"
);


try{


if(!competencia){

throw new Error(
"Competência não informada."
);

}


const resposta =
await chamarAPI(
"listarLancamentos",
{
competencia:
competencia
}
);


console.log(
"Resposta da API:",
resposta
);


if(
!resposta ||
resposta.sucesso !== true
){

throw new Error(
resposta &&
(
resposta.erro ||
resposta.mensagem
)
?
(
resposta.erro ||
resposta.mensagem
)
:
"Erro desconhecido ao carregar lançamentos."
);

}


const lista =
Array.isArray(
resposta.lista
)
?
resposta.lista
:
[];


processarRelatorio(
lista
);


}
catch(erro){

console.error(
"Erro:",
erro
);


receber.innerHTML =
`<div class="erro">
Erro ao carregar receitas:<br>
${escaparHTML(erro.message)}
</div>`;


pagar.innerHTML =
`<div class="erro">
Não foi possível carregar as despesas.
</div>`;


resumo.innerHTML =
"Não foi possível gerar o relatório.";

}

}


// =====================================================
// PROCESSAR RELATÓRIO
// =====================================================

function processarRelatorio(
lista
){

const receitas = [];

const despesas = [];

let totalReceitas = 0;

let totalDespesas = 0;

let totalRepasse = 0;


lista.forEach(
function(item){

const descricao =
String(
item.descricao || ""
)
.trim();


const descricaoNormalizada =
normalizarTexto(
descricao
);


const baixado =
normalizarTexto(
item.baixado
) === "sim";


const valor =
Number(
item.valor || 0
) || 0;


// -----------------------------------------------
// RECEITAS
// -----------------------------------------------

if(
textoIgual(
item.tipo,
"Contas a Receber"
)
){

receitas.push(item);

totalReceitas +=
valor;

}


// -----------------------------------------------
// DESPESAS
// -----------------------------------------------

else if(
textoIgual(
item.tipo,
"Contas a Pagar"
)
){

if(

descricaoNormalizada ===
"repasse aluguel"

&&

baixado

){

totalRepasse +=
valor;

}
else{

despesas.push(item);

totalDespesas +=
valor;

}

}

});


// =================================================
// REPASSE
// =================================================
//
// Mantém a mesma regra do seu sistema:
// o "Repasse aluguel" baixado é abatido das
// receitas e também das despesas.
//
// =================================================

totalReceitas -=
totalRepasse;


totalDespesas -=
totalRepasse;


// =================================================
// MONTAR TABELAS
// =================================================

montarTabela(
"receber",
receitas,
"receita",
totalReceitas
);


montarTabela(
"pagar",
despesas,
"despesa",
totalDespesas
);


// =================================================
// RESULTADO
// =================================================

const saldo =
totalReceitas -
totalDespesas;


const classe =
saldo >= 0
?
""
:
"";


document.getElementById(
"resumoFinal"
).innerHTML =

"Resultado da competência: " +
formatar(saldo);


}


// =====================================================
// MONTAR TABELA
// =====================================================

function montarTabela(
id,
lista,
tipo,
totalPersonalizado
){

const elemento =
document.getElementById(
id
);


if(
!lista ||
lista.length === 0
){

elemento.innerHTML =
"Nenhum lançamento encontrado.";

return;

}


let total =
Number(
totalPersonalizado || 0
);


let html = `

<div style="overflow-x:auto">

<table>

<thead>

<tr>

<th>
Descrição
</th>

<th>
Valor
</th>

<th>
Vencimento
</th>

<th>
Status
</th>

</tr>

</thead>

<tbody>

`;


lista.forEach(
function(item){

const baixado =
normalizarTexto(
item.baixado
) === "sim";


html += `

<tr>

<td>
${escaparHTML(
item.descricao
)}
</td>


<td class="valor">
${formatar(
item.valor
)}
</td>


<td>
${formatarData(
item.vencimento
)}
</td>


<td>

${
baixado

?

"<span class='pago'>✔ Pago</span>"

:

"<span class='pendente'>⏳ Pendente</span>"

}

</td>

</tr>

`;

});


html += `

</tbody>

</table>

</div>

`;


if(
tipo === "receita"
){

html += `

<div class="total-receita">

Total de Receitas:

<span style="
font-size:12px;
font-weight:normal;
">

(Já abatendo o Repasse aluguel)

</span>

<br>

${formatar(total)}

</div>

`;

}


if(
tipo === "despesa"
){

html += `

<div class="total-despesa">

Total de Despesas:

<span style="
font-size:12px;
font-weight:normal;
">

(Já abatendo o Repasse aluguel)

</span>

<br>

${formatar(total)}

</div>

`;

}


elemento.innerHTML =
html;

}


// =====================================================
// NORMALIZAR TEXTO
// =====================================================

function normalizarTexto(
texto
){

if(
texto === null ||
texto === undefined
){

return "";

}


return String(texto)

.toLowerCase()

.normalize("NFD")

.replace(
/[\u0300-\u036f]/g,
""
)

.trim();

}


// =====================================================
// COMPARAR TEXTO
// =====================================================

function textoIgual(
a,
b
){

return (
normalizarTexto(a) ===
normalizarTexto(b)
);

}


// =====================================================
// FORMATAR COMPETÊNCIA
// =====================================================

function formatarCompetencia(
comp
){

if(
!comp ||
!/^\d{4}-\d{2}$/.test(comp)
){

return comp || "-";

}


const partes =
comp.split("-");


return (
partes[1] +
"/" +
partes[0]
);

}


// =====================================================
// FORMATAR MOEDA
// =====================================================

function formatar(
valor
){

return Number(
valor || 0
).toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


// =====================================================
// FORMATAR DATA
// =====================================================

function formatarData(
data
){

if(!data){

return "";

}


const texto =
String(data).trim();


// dd/mm/aaaa

if(
/^\d{2}\/\d{2}\/\d{4}$/.test(
texto
)
){

return texto;

}


// yyyy-mm-dd

if(
/^\d{4}-\d{2}-\d{2}$/.test(
texto
)
){

const partes =
texto.split("-");


return (
partes[2] +
"/" +
partes[1] +
"/" +
partes[0]
);

}


// Outros formatos

const objeto =
new Date(data);


if(
!isNaN(
objeto.getTime()
)
){

return objeto.toLocaleDateString(
"pt-BR"
);

}


return texto;

}


// =====================================================
// ESCAPAR HTML
// =====================================================
//
// Evita que uma descrição cadastrada na planilha
// seja interpretada como HTML.
//
// =====================================================

function escaparHTML(
valor
){

if(
valor === null ||
valor === undefined
){

return "";

}


return String(valor)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


// =====================================================
// VOLTAR
// =====================================================

function voltar(){

// Volta para o GitHub, não para o Apps Script.

window.location.href =
URL_INDEX;

}


</script>


</body>
