
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17365d">
  <title>Relatório Financeiro</title>

  <style>
    :root {
      --azul: #17365d;
      --azul2: #24558b;
      --fundo: #f3f6fa;
      --borda: #dce3ec;
      --texto: #1e293b;
      --muted: #64748b;
      --verde: #16803c;
      --vermelho: #b42318;
      --branco: #fff;
      --destaque: #e0ecff;
      --destaque-hover: #cbdcf7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fundo);
      color: var(--texto);
      font: 15px/1.5 Arial, Helvetica, sans-serif;
    }

    header {
      background: linear-gradient(120deg, var(--azul), var(--azul2));
      color: white;
      padding: 25px 18px;
    }

    .container {
      width: min(1180px, calc(100% - 28px));
      margin: auto;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: clamp(22px, 3vw, 30px);
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    main {
      padding: 22px 0 40px;
    }

    .painel {
      background: white;
      border: 1px solid var(--borda);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(23,54,93,.08);
    }

    .filtros {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) auto auto;
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select, button {
      font: inherit;
      min-height: 43px;
      border-radius: 9px;
    }

    select {
      width: 100%;
      border: 1px solid #cbd5e1;
      padding: 9px 11px;
      background: white;
      color: var(--texto);
    }

    button {
      border: 0;
      padding: 10px 17px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .primario {
      color: white;
      background: var(--azul);
    }

    .primario:hover {
      background: var(--azul2);
    }

    .secundario {
      color: var(--azul);
      background: #e8eef6;
    }

    .status {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 9px;
      background: #eff6ff;
      color: #1d4e89;
      overflow-wrap: anywhere;
    }

    .status.erro {
      background: #fef2f2;
      color: var(--vermelho);
    }

    .status.ok {
      background: #f0fdf4;
      color: var(--verde);
    }

    .resumo {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .indicador {
      background: white;
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 15px;
    }

    .indicador .nome {
      color: var(--muted);
      font-size: 13px;
    }

    .indicador .valor {
      margin-top: 5px;
      font-weight: bold;
      font-size: clamp(18px, 2.5vw, 25px);
      overflow-wrap: anywhere;
    }

    .positivo {
      color: var(--verde);
    }

    .negativo {
      color: var(--vermelho);
    }

    .tabela-wrap {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid #e5eaf1;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f8fafc;
      color: #334155;
      font-size: 13px;
      white-space: nowrap;
    }

    td {
      overflow-wrap: anywhere;
    }

    /* DESTAQUE DAS COLUNAS TIPO E BAIXADO */
    th.coluna-destaque {
      background: var(--azul);
      color: white;
      font-weight: bold;
      border-bottom: 3px solid #0f2744;
    }

    td.coluna-destaque {
      background: var(--destaque);
      color: var(--azul);
      font-weight: bold;
    }

    /* Centraliza os valores da coluna Baixado */
    th.coluna-baixado,
    td.coluna-baixado {
      text-align: center;
      min-width: 95px;
    }

    /* Diferencia visualmente Sim e Não */
    td.coluna-baixado.valor-sim {
      color: #166534;
      background: #dcfce7;
    }

    td.coluna-baixado.valor-nao {
      color: #991b1b;
      background: #fee2e2;
    }

    tbody tr:hover td {
      background-color: #f1f5f9;
    }

    tbody tr:hover td.coluna-destaque {
      background-color: var(--destaque-hover);
    }

    tbody tr:hover td.coluna-baixado.valor-sim {
      background: #bbf7d0;
    }

    tbody tr:hover td.coluna-baixado.valor-nao {
      background: #fecaca;
    }

    .vazio {
      text-align: center;
      padding: 28px 12px;
      color: var(--muted);
    }

    .rodape {
      color: var(--muted);
      font-size: 12px;
      margin-top: 12px;
    }

    .oculto {
      display: none !important;
    }

    @media (max-width: 680px) {
      .filtros {
        grid-template-columns: 1fr;
      }

      .resumo {
        grid-template-columns: 1fr;
      }

      .painel {
        padding: 14px;
      }
    }
  </style>
</head>

<body>
<header>
  <div class="container">
    <h1>Relatório Financeiro</h1>
    <p>Consulte os lançamentos por competência.</p>
  </div>
</header>

<main class="container">

  <section class="painel">
    <div class="filtros">
      <div>
        <label for="competencia">Competência</label>
        <select id="competencia"></select>
      </div>

      <button id="btnConsultar" class="primario" type="button">
        Consultar relatório
      </button>

      <button id="btnAtualizar" class="secundario" type="button">
        Atualizar
      </button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">
      Preparando consulta...
    </div>

    <div class="rodape">
      A competência é enviada à API no formato AAAA-MM.
    </div>
  </section>

  <section id="resumo" class="resumo oculto">
    <div class="indicador">
      <div class="nome">Quantidade de lançamentos</div>
      <div id="totalRegistros" class="valor">0</div>
    </div>

    <div class="indicador">
      <div class="nome">Total de receitas</div>
      <div id="totalReceitas" class="valor positivo">R$ 0,00</div>
    </div>

    <div class="indicador">
      <div class="nome">Total de despesas</div>
      <div id="totalDespesas" class="valor negativo">R$ 0,00</div>
    </div>
  </section>

  <section class="painel">
    <h2 style="font-size:19px;margin:0 0 14px">
      Lançamentos da competência
    </h2>

    <div id="areaTabela" class="tabela-wrap">
      <div class="vazio">Carregando relatório...</div>
    </div>
  </section>

</main>

<script>
(() => {
  'use strict';

  const API_URL =
    'https://script.google.com/macros/s/AKfycbxyXfBbooxSug3QbCvbpOl1MFJpqP5AhJIqLMB166p2opvvZBUX0UfIviuObQ6_nEvc/exec';

  const seletor = document.getElementById('competencia');
  const status = document.getElementById('status');
  const areaTabela = document.getElementById('areaTabela');
  const resumo = document.getElementById('resumo');
  const btnConsultar = document.getElementById('btnConsultar');
  const btnAtualizar = document.getElementById('btnAtualizar');

  const moeda = new Intl.NumberFormat('pt-BR', {
    style: 'currency',
    currency: 'BRL'
  });

  function competenciaValida(valor) {
    return /^\d{4}-(0[1-9]|1[0-2])$/.test(String(valor || ''));
  }

  function formatarCompetencia(valor) {
    if (!competenciaValida(valor)) return valor;

    const partes = valor.split('-');
    return partes[1] + '/' + partes[0];
  }

  function competenciaDoMesAtual() {
    const agora = new Date();

    return agora.getFullYear() + '-' +
      String(agora.getMonth() + 1).padStart(2, '0');
  }

  function montarCompetencias() {
    const parametros = new URLSearchParams(location.search);

    const informada = parametros.get('competencia') ||
                      parametros.get('mes');

    const inicial = competenciaValida(informada)
      ? informada
      : competenciaDoMesAtual();

    const partes = inicial.split('-').map(Number);
    const dataBase = new Date(partes[0], partes[1] - 1, 1);

    seletor.replaceChildren();

    for (let i = 0; i < 60; i++) {
      const data = new Date(
        dataBase.getFullYear(),
        dataBase.getMonth() - i,
        1
      );

      const valor = data.getFullYear() + '-' +
        String(data.getMonth() + 1).padStart(2, '0');

      const opcao = document.createElement('option');
      opcao.value = valor;
      opcao.textContent = formatarCompetencia(valor);
      seletor.appendChild(opcao);
    }

    seletor.value = inicial;
    return inicial;
  }

  function mostrarStatus(mensagem, tipo = '') {
    status.textContent = mensagem;
    status.className = 'status' + (tipo ? ' ' + tipo : '');
  }

  function bloquearInterface(bloquear) {
    btnConsultar.disabled = bloquear;
    btnAtualizar.disabled = bloquear;
    seletor.disabled = bloquear;

    btnConsultar.textContent = bloquear
      ? 'Consultando...'
      : 'Consultar relatório';
  }

  function montarUrlApi(competencia, callback) {
    const url = new URL(API_URL);

    url.searchParams.set('action', 'listarLancamentos');
    url.searchParams.set('competencia', competencia);
    url.searchParams.set('callback', callback);
    url.searchParams.set('_cache', Date.now());

    return url.toString();
  }

  function consultarApi(competencia) {
    return new Promise((resolve, reject) => {
      const callback = '__relatorio_' + Date.now() + '_' +
        Math.random().toString(36).slice(2);

      const script = document.createElement('script');
      let concluido = false;

      const temporizador = setTimeout(() => {
        finalizar(new Error(
          'Tempo esgotado ao consultar a API. Verifique a publicação do Apps Script e a URL do Web App.'
        ));
      }, 25000);

      function limpar() {
        clearTimeout(temporizador);
        script.remove();

        try {
          delete window[callback];
        } catch (e) {
          window[callback] = undefined;
        }
      }

      function finalizar(erro, dados) {
        if (concluido) return;

        concluido = true;
        limpar();

        if (erro) reject(erro);
        else resolve(dados);
      }

      window[callback] = dados => finalizar(null, dados);

      script.onerror = () => finalizar(new Error(
        'Não foi possível acessar a API. Confirme a URL do Apps Script e se o Web App está publicado para acesso pela web.'
      ));

      script.src = montarUrlApi(competencia, callback);

      console.log('URL enviada para a API:', script.src);

      document.body.appendChild(script);
    });
  }

  function extrairLista(resposta) {
    console.log('Resposta bruta da API:', resposta);

    if (Array.isArray(resposta)) return resposta;

    if (!resposta || typeof resposta !== 'object') {
      throw new Error('A API retornou uma resposta vazia ou inválida.');
    }

    if (resposta.sucesso === false) {
      throw new Error(
        resposta.mensagem ||
        resposta.erro ||
        'O Apps Script informou que não foi possível consultar os dados.'
      );
    }

    const propriedades = [
      'lista',
      'lancamentos',
      'dados',
      'registros',
      'resultado'
    ];

    for (const propriedade of propriedades) {
      if (Array.isArray(resposta[propriedade])) {
        return resposta[propriedade];
      }
    }

    if (resposta.sucesso === true) return [];

    throw new Error(
      'A API respondeu, mas não retornou uma lista reconhecida. Confira o formato do JSON do Apps Script.'
    );
  }

  function normalizarNome(nome) {
    return String(nome)
      .replace(/([a-z])([A-Z])/g, '$1 $2')
      .replace(/[_-]+/g, ' ')
      .replace(/^./, letra => letra.toUpperCase());
  }

  function normalizarChave(chave) {
    return String(chave)
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]/g, '');
  }

  // Remove QR Code e campos relacionados ao PIX da tabela.
  function ehCampoQRCode(chave) {
    const nome = normalizarChave(chave);

    return nome.includes('qrcode') ||
           nome.includes('codigopix') ||
           nome.includes('pixcopiaecola');
  }

  function formatarCelula(valor) {
    if (valor === null || valor === undefined || valor === '') {
      return '—';
    }

    if (typeof valor === 'object') {
      return JSON.stringify(valor);
    }

    if (typeof valor === 'boolean') {
      return valor ? 'Sim' : 'Não';
    }

    return String(valor);
  }

  function localizarCampo(objeto, nomes) {
    const chaves = Object.keys(objeto || {});
    const procurados = nomes.map(normalizarChave);

    const chave = chaves.find(k =>
      procurados.includes(normalizarChave(k))
    );

    return chave === undefined ? undefined : objeto[chave];
  }

  function converterNumero(valor) {
    if (typeof valor === 'number') {
      return Number.isFinite(valor) ? valor : 0;
    }

    if (valor === null || valor === undefined || valor === '') {
      return 0;
    }

    let texto = String(valor).trim().replace(/[R$\s]/g, '');

    if (texto.includes(',')) {
      texto = texto.replace(/\./g, '').replace(',', '.');
    }

    const numero = Number(texto);
    return Number.isFinite(numero) ? numero : 0;
  }

  function atualizarResumo(lista) {
    let receitas = 0;
    let despesas = 0;

    lista.forEach(item => {
      if (!item || typeof item !== 'object') return;

      const valor = converterNumero(localizarCampo(item, [
        'valor',
        'valorLancamento',
        'valorTotal'
      ]));

      const tipo = String(localizarCampo(item, [
        'tipo',
        'natureza',
        'classificacao',
        'categoria'
      ]) || '').toLowerCase();

      if (tipo.includes('despesa') ||
          tipo.includes('saída') ||
          tipo.includes('saida')) {
        despesas += Math.abs(valor);
      } else if (tipo.includes('receita') ||
                 tipo.includes('entrada')) {
        receitas += Math.abs(valor);
      } else if (valor < 0) {
        despesas += Math.abs(valor);
      } else {
        receitas += valor;
      }
    });

    document.getElementById('totalRegistros').textContent =
      String(lista.length);

    document.getElementById('totalReceitas').textContent =
      moeda.format(receitas);

    document.getElementById('totalDespesas').textContent =
      moeda.format(despesas);

    resumo.classList.remove('oculto');
  }

  function renderizarTabela(lista) {
    areaTabela.replaceChildren();

    if (lista.length === 0) {
      const vazio = document.createElement('div');
      vazio.className = 'vazio';
      vazio.textContent =
        'A consulta foi concluída, mas a API não encontrou lançamentos para ' +
        formatarCompetencia(seletor.value) + '.';

      areaTabela.appendChild(vazio);
      return;
    }

    const objetos = lista.map(item => {
      if (item && typeof item === 'object' && !Array.isArray(item)) {
        return item;
      }

      return { lancamento: item };
    });

    // Monta as colunas sem exibir os campos de QR Code e PIX.
    const colunas = [];

    objetos.forEach(objeto => {
      Object.keys(objeto).forEach(chave => {
        if (!ehCampoQRCode(chave) && !colunas.includes(chave)) {
          colunas.push(chave);
        }
      });
    });

    const tabela = document.createElement('table');
    const thead = document.createElement('thead');
    const cabecalho = document.createElement('tr');

    colunas.forEach(coluna => {
      const th = document.createElement('th');
      const nome = normalizarChave(coluna);

      th.textContent = normalizarNome(coluna);

      if (nome === 'tipo' || nome === 'baixado') {
        th.classList.add('coluna-destaque');
      }

      if (nome === 'baixado') {
        th.classList.add('coluna-baixado');
      }

      cabecalho.appendChild(th);
    });

    thead.appendChild(cabecalho);
    tabela.appendChild(thead);

    const tbody = document.createElement('tbody');

    objetos.forEach(objeto => {
      const tr = document.createElement('tr');

      colunas.forEach(coluna => {
        const td = document.createElement('td');
        const nome = normalizarChave(coluna);
        const valor = objeto[coluna];

        td.textContent = formatarCelula(valor);

        // Destaca a coluna Tipo.
        if (nome === 'tipo') {
          td.classList.add('coluna-destaque');
        }

        // Destaca e centraliza a coluna Baixado.
        if (nome === 'baixado') {
          td.classList.add(
            'coluna-destaque',
            'coluna-baixado'
          );

          const texto = String(valor ?? '')
            .trim()
            .toLowerCase();

          if (
            valor === true ||
            ['sim', 'true', '1', 'baixado', 'pago', 'yes']
              .includes(texto)
          ) {
            td.classList.add('valor-sim');
          } else if (
            valor === false ||
            ['não', 'nao', 'false', '0', 'pendente', 'no']
              .includes(texto)
          ) {
            td.classList.add('valor-nao');
          }
        }

        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    tabela.appendChild(tbody);
    areaTabela.appendChild(tabela);
  }

  async function carregarRelatorio() {
    const competencia = seletor.value;

    if (!competenciaValida(competencia)) {
      mostrarStatus(
        'Competência inválida. Selecione um mês válido.',
        'erro'
      );
      return;
    }

    bloquearInterface(true);
    resumo.classList.add('oculto');

    mostrarStatus(
      'Consultando a API para ' +
      formatarCompetencia(competencia) + '...'
    );

    try {
      const resposta = await consultarApi(competencia);
      const lista = extrairLista(resposta);

      renderizarTabela(lista);
      atualizarResumo(lista);

      if (lista.length) {
        mostrarStatus(
          'Relatório carregado: ' + lista.length +
          ' lançamento(s) em ' + formatarCompetencia(competencia) + '.',
          'ok'
        );
      } else {
        mostrarStatus(
          'A API respondeu corretamente, mas não retornou lançamentos para ' +
          formatarCompetencia(competencia) + '.',
          'ok'
        );
      }

      const pagina = new URL(window.location.href);
      pagina.searchParams.set('competencia', competencia);

      window.history.replaceState({}, '', pagina);

    } catch (erro) {
      console.error('Erro ao carregar relatório:', erro);

      areaTabela.replaceChildren();

      const aviso = document.createElement('div');
      aviso.className = 'vazio';
      aviso.textContent =
        'Não foi possível carregar os lançamentos. Leia a mensagem de erro acima.';

      areaTabela.appendChild(aviso);

      mostrarStatus(
        erro && erro.message
          ? erro.message
          : 'Erro desconhecido ao consultar a API.',
        'erro'
      );
    } finally {
      bloquearInterface(false);
    }
  }

  btnConsultar.addEventListener('click', carregarRelatorio);
  btnAtualizar.addEventListener('click', carregarRelatorio);

  seletor.addEventListener('change', () => {
    const pagina = new URL(window.location.href);
    pagina.searchParams.set('competencia', seletor.value);

    window.history.replaceState({}, '', pagina);
  });

  montarCompetencias();
  carregarRelatorio();
})();
</script>
</body>
</html>
